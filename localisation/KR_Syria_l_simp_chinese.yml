 syr_hawran_secured:0 "掌控豪兰"
 syr_hawran_secured_desc:0 "豪兰是德鲁兹教徒的地盘，也是叙利亚最重要的地区之一。作为叙利亚的农业中心和贝鲁特港的出口站，完全可以说，谁控制了豪兰，谁就控制了大马士革和全叙利亚。"
