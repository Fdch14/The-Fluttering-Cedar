 SYR_defend_syrian_national_interests_desc:0 "我们确实应该避免冲突，可是全球局势不是我们怎么想就怎么变得，大国间的争斗肯定会不可避免的影响到我们。我们必须选边站，以免落得孤立无援的结局，并尽全力捍卫我们所珍视的一切。"
 SYR_domestic_arms_production_desc:0 "虽然我们现在还需依赖其他国家淘汰下来的设备，但是未来我们便能实现自给自足并完善我们的国防能力，随着兵工厂被改造完毕，我们现在已经能够实现武器及弹药的自给自足了。"
