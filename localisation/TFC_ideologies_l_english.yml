 GFX_Palestine_notices_GUI_tooltip:0 "Notes:\nThis country content was released in version §7Blade Glimmer§!. Welcome to play\n§LTo play, follow the same method as Israel: after defeating the Jerusalem government, a Palestinian uprising will trigger after a short time—select the transition option in the event. The country's path guide has been added to the game!"
