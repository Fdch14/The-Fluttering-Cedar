 arab_legionism_subtype:0 "Arab Legionism"
 arab_legionism_subtype_desc:0 "§YArab Legionism§!\n\nArab Legionism can be considered a symbiotic offshoot of Islamic Legionism. While confronting Western cultural invasion, Islamic Legionists adopted European far-right organizational models while preserving an Islamic core, whereas Arab Legionists embrace greater openness, secularism, and a more unscrupulous approach, leaning into nationalism and comprehensive social transformation.\n\nArab Legionists maintain an ambiguous stance toward Sharia law, instead drawing inspiration from Sorelian syndicalists and national syndicalists to cultivate an aggressive cultural ethos across society. Arab Legionist factions often operate with relative weakness, functioning primarily as radical wings within other Arab nationalist movements, yet this does not diminish their unwavering dedication to the national cause."
 islamic_legionism_subtype:0 "Islamic Legionism"
 islamic_legionism_subtype_desc:0 "§YIslamic Legionism§!\n\nIslamic Legionism emerged as a variant of Islamism in response to military and cultural assaults from the Western world. Unlike traditional conservatism-oriented Islamism rooted in families and rural communities, Islamic Legionism adopts Westernized organizational structures and mobilization methods, relying heavily on party politics and militia forces. It mimics the organizational patterns of far-right political groups, enforces Sharia and the Quran as operational doctrines, while incorporating ethnonationalism and conspiracy theories about Jewish capital.\n\nSharia teaches Muslims kindness and fraternity, yet Islamic Legionists disdain these tenets—Allah is supreme, but all means are justified against ethnic and sectarian enemies. Deception, assassination, terrorist attacks—this is the life of a Mujahid."
 tot_islamism_subtype:0 "Islamism"
 tot_islamism_subtype_desc:0 "§YIslamism§!\n\nIslamism is a multifaceted theological ideology. In Islamist states, constitutions, socioeconomic systems, judiciary, and culture are structured to align with Islamic beliefs and doctrines. Islamism shares common ground with socialism, such as rejecting liberalism and extravagance, supporting social justice and equitable wealth distribution, and opposing exploitation. The Quran even states that 'each person shall have only what they have earned'—a clear challenge to bourgeois morality.\n\nImplementation varies significantly based on religious institutions or ruling parties, rarely forming absolute theocracies. Instead, it manifests through republican systems, militarism, nationalism, or occasionally as democratic movements when supported by Muslim populations. No absolute principles exist beyond the Quran and Hadith, with selective interpretations enabling Islamism to span an ideological spectrum from moderate to extreme, conservative to radical."
 canaanist_subtype:0 "Canaanism"
 canaanist_subtype_desc:0 "§YCanaanism§!\n\nCanaanism, also known as Semitism, Semitic nationalism, or Zafonism (a parody of Zionism), is an ideological movement rooted in the belief that the peoples of the Levant and the broader Semitic world—Jews, Arabs, Phoenicians, Arameans, and other ancient peoples—are not distinct groups but heirs to a single buried civilization: Canaan. Canaanism seeks to revive this identity as a living modern political project, breaking free from European colonial frameworks while also shedding the divisive nationalisms imposed by the Ottoman Empire and Western powers.\n\nWhere Zionism appeals to Jewish identity and Arab nationalism to Islamic or linguistic unity, Canaanism proposes a third path: the rebirth of a regional civilizational identity rooted in the ancient Near Eastern land, myths, and bloodlines. It is a secular, supra-tribal ideal committed to uniting the Semitic peoples not based on religion or race but on shared culture and historical destiny. Canaanist ambitions vary. Moderate Canaanists advocate for a republic encompassing ancient Israel, Judah, and Philistia—roughly equivalent to modern Israel-Palestine. Radical Canaanists, however, envision a vast Canaanite Republic stretching from Morocco's Atlantic coast to Mesopotamia's Twin Rivers, unifying all lands touched by Semitic languages, Phoenician trade, or imperial memory. To them, Tyre, Carthage, Babylon, and Jerusalem are not separate legacies but fragments of a forgotten empire awaiting reforging.\n\nCanaanism manifests diverse ideological strains. The left emphasizes syndicalist revival and post-colonial solidarity, shaping the Canaanite Republic as an anti-imperialist, worker-led union of Semitic peoples. The right trends toward nationalism, irredentism, and at times racialized claims—asserting divine or ancestral rights over lost territories. Yet both agree: a new, secular republic must rise from the ruins of colonialism and sectarianism, for only through statehood can the Canaanite people truly be reborn. Others see ancient myth; Canaanists see the future. From the ashes of Tyre and the salt of Carthage, a flame has been rekindled."
