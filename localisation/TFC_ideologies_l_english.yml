 tot_antoun_saadeh_thought_subtype:0 "Revolutionary Antoun Saadeh Thought"
 tot_antoun_saadeh_thought_subtype_desc:0 "§YRevolutionary Antoun Saadeh Thought§!\n\nRevolutionary Antoun Saadeh Thought was systematically expounded by Ghassan Jadid, a member of the Syrian Social Nationalist Party (SSNP). Compared to the party's orthodox Antoun Saadeh Thought, this theory significantly strengthens the socialist dimension. Ghassan Jadid's intellectual development was deeply influenced by the doctrines of his brother, Salah Jadid, a prominent figure in the Ba'ath Party.\n\nWithin Ghassan Jadid's theoretical framework, national syndicalism is argued to be inherently consistent with the SSNP's core tenets—Freedom, Responsibility, Discipline, Strength. Although his revolutionary views sparked controversy within the party, in terms of its intellectual core, Ghassan Jadid's interpretation is considered closest to Antoun Saadeh's original conception."
 thaw_antoun_saadeh_thought_subtype:0 "Thawra Antoun Saadeh Thought"
 thaw_antoun_saadeh_thought_subtype_desc:0 "§YThawra Antoun Saadeh Thought§!\n\nThawra Antoun Saadeh Thought, or 'Za'imism', is a theoretical system promoted by General Husni al-Za'im, a nominal ally and extra-legal affiliate of the Syrian Social Nationalist Party (SSNP). Although Za'im ostensibly adhered to orthodox Antoun Saadeh Thought, his actual actions significantly deviated from it.\n\nHe openly betrayed the dominance of the SSNP's four core tenets—Freedom, Responsibility, Discipline, and Strength—instead infusing his governance program with the democratic liberalism most abhorred by party members. Politically, 'Thawra Thought' practices a nominally semi-democratic, yet effectively authoritarian-controlled system, manifesting as a limited multi-party system that does not shake the foundations of his rule. Za'im's actions drew strong condemnation from the vast majority of SSNP members, who denounced him as a traitor. However, as long as his power remained unchallenged, Za'im remained indifferent—for him, any ideology was merely a tool to consolidate rule."
 revision_antoun_saadeh_thought_subtype:0 "Revisionist Antoun Saadeh Thought"
 revision_antoun_saadeh_thought_subtype_desc:0 "§YRevisionist Antoun Saadeh Thought§!\n\nRevisionist Antoun Saadeh Thought is the theoretical system adhered to by Adib Shishakli, a loyal member of the Syrian Social Nationalist Party (SSNP). During his long military-political career, Shishakli deeply recognized the fundamental problems facing Syrians: the lack of national consciousness and the deep-rooted nature of Islam. Antoun Saadeh's thought provided him with guidance, prompting him to become the staunchest supporter of Saadeh's ideas.\n\nRevisionist Thought completely discards the socialist elements of orthodox Antoun Saadeh theory, replacing them with extreme nationalism. Shishakli highly identifies with the party's four tenets—Freedom, Responsibility, Discipline, Strength. Though criticized by detractors as a 'nationalist thug', he remains indifferent to such criticism, vowing to wield Revisionist Antoun Saadeh Thought as a sword to carve out a new dawn for the Syrian nation."
 alawism_subtype:0 "Alawism"
 alawism_subtype_desc:0 "§YAlawism§!\n\nThe Alawite sect stands as a flower of innovation within Syria's modernization wave. Confronting the historical dilemmas of colonial legacy and sectarian division, progressive Alawites have chosen to embrace a secular path, blending ideals of social equality with the Alawite tradition of religious tolerance while staunchly resisting fundamentalist erosion of society. Compared to conservative religious scholars, they prefer reconstructing social cohesion through the bond of nationalism, actively promoting women's empowerment, universal education, and religious pluralism.\n\nProgressive Alawites hold a clear position of suspending Islamic Sharia law, advocating for its replacement with a modern civil legal system. Alawism is rooted in unique doctrinal claims: belief in the divine essence of Imam Ali, emphasis on a cosmic soul view involving stellar cycles, and incorporating Neoplatonic philosophy and Ismaili thought within esoteric teachings. Drawing from Greek philosophy and Enlightenment ideals, it seeks to eliminate sectarian divides through modern education. While most Islamic schools of jurisprudence do not recognize the Alawite position, their contributions to and love for Syria are undeniable."
 druzeism_subtype:0 "Druzeism"
 druzeism_subtype_desc:0 "§YDruzeism§!\n\nThe Druze are a unique faith branch that evolved from the Shi'a Ismaili sect of Islam in the Syrian region, renowned for their secretive religious practices and flexible strategies for worldly survival. The sect rejects the formal constraints of traditional Islamic Sharia, venerating Caliph al-Hakim as the ultimate manifestation of divinity. It advocates for the unity of the individual with the Absolute Spirit through the Five Cosmic Principles and the transmigration of souls. Its doctrinal core emphasizes absolute loyalty to the One God, replacing traditional practices like prayer and pilgrimage with seven ethical maxims, forming a de-ritualized belief system.\n\nOrganizationally, the Druze have constructed a binary community structure of 'Uqqal' (the Initiated/Knowledgeable) and 'Juhhal' (the Uninitiated/Ignorant). Religious rites and ethical instruction are led by the Sheikh class, who are versed in the mysteries of the 'Epistles of Wisdom' (Rasa'il al-Hikmah). They typically hold secret meetings to recite the scriptures, while ordinary adherents need only adhere to basic moral principles. This hierarchical mechanism safeguards the secrecy of the doctrine while granting high autonomy to secular life.\n\nFacing Syria's complex sectarian environment, the Druze practice a triple 'Taqiyya Principle' (religious dissimulation): concealing faith under religious persecution to preserve the community; gradually revealing truth through education to maintain tradition; and outwardly conforming in political conflicts to ensure survival. This strategy allows them to maintain an independent identity within a Sunni-dominated society while avoiding direct confrontation. The Druze exhibit a unique openness to multiculturalism compared to other religions, permitting adherents to freely participate in secular economic activities and actively embracing modern education and healthcare resources. Simultaneously, they maintain spiritual bonds through visiting sacred tombs (zawaya), integrating religious piety into daily ethics rather than legal constraints, forming a life philosophy rooted in reality yet transcending dogma."
 tot_revolutionary_nationalism_subtype:0 "Revolutionary Nationalism"
 tot_revolutionary_nationalism_subtype_desc:0 "§YRevolutionary Nationalism§!\n\nWhen the iron heels of imperialism brutally trample over that cracked, groaning land; when the last valiant warrior who stood up to shout for national dignity falls under the cold muzzle of a gun, crimson blood soaks through the entire nation's chest. Boundless fear, like thick night fog, hangs heavily over the land—but in this suffocating, profound darkness, seeds named 'revolution' have long been silently buried in every heart that hasn't extinguished its courage. Deep beneath the earth, torrents surge; the roars of revolutionaries accumulate and roll like muffled thunder, a resolute declaration of war against colonizers that will never cease!\n\nThe flame of vengeance is the deepest fuel to ignite this revolutionary nationalism. Regardless of which divine being one worships, or even if one only worships struggle itself, pouring the fire of vengeance upon the oppressors is the most noble duty in this desperate situation. A jihad critical to the nation's survival is already in the offing—only by pressing forward, by building walls with flesh and blood, by workers sweating profusely on the path to national strength, by soldiers defending with their lives that fragile, nascent light of freedom, can we prevail. All differences—left, right, or center—must vanish before the flames of national survival. When the figures of resistors gather into an unshakable mountain, colonizers will tremble beneath them, and the greed and oppression of the past will finally turn to dust. Until that day, the people who break free from their chains will make the name of freedom resound through the heavens!"
 socdem_revolutionary_nationalism_subtype:0 "Revolutionary Nationalism"
