 tot_arab_baathism_subtype:0 "Arab Ba'athism"
 tot_arab_baathism_subtype_desc:0 "§YArab Ba'athism§!\n\nArab Ba'athism is a pan-Arab ideological movement rooted in socialism, irredentism, moderate nationalism, and elements of classical liberalism. Facing regional nationalism's emphasis on state interests and Islamism's appeal to religious identity, Ba'athism proposes a developmental path characterized by secularism, socialism, and pan-Arab unification. Its ultimate goal is clear and grand: establishing a single Arab state spanning 'from the Atlantic to the Arab Gulf.'\n\nThe movement's core program consists of three essential elements: Unity (the absolute core, seeking complete political integration across existing borders), Freedom (permitting religious belief but strictly prohibiting religious interference in politics), and Socialism (emphasizing state control of the economy and social reform, opposing Western capitalism). Politically, Ba'athism relies on a strong, highly centralized vanguard party and staunchly opposes Zionism's expansion in the Middle East, viewing it as a tool of Western colonialism and imperialism.\n\nBa'athist supporters span various social strata: progressive officers, student groups, and the middle class. However, interpretations of Ba'athism vary significantly among adherents: some military figures view it merely as a political tool or a manipulable puppet, distancing themselves from the ideology itself—these are typically not considered true Ba'athists. More radical revolutionaries reinterpret the program, abandoning pan-Arabism for more localized solutions and significantly strengthening its socialist elements, often blending them with communist thought. Despite differing interpretations, all true Ba'athists adhere to a fundamental belief: the struggle to establish a free Arab nation."
 radsoc_arab_baathism_subtype:0 "Arab Ba'athism"
 radsoc_arab_baathism_subtype_desc:0 "§YArab Ba'athism§!\n\nArab Ba'athism is a pan-Arab ideological movement rooted in socialism, irredentism, moderate nationalism, and elements of classical liberalism. Facing regional nationalism's emphasis on state interests and Islamism's appeal to religious identity, Ba'athism proposes a developmental path characterized by secularism, socialism, and pan-Arab unification. Its ultimate goal is clear and grand: establishing a single Arab state spanning 'from the Atlantic to the Arab Gulf.'\n\nThe movement's core program consists of three essential elements: Unity (the absolute core, seeking complete political integration across existing borders), Freedom (permitting religious belief but strictly prohibiting religious interference in politics), and Socialism (emphasizing state control of the economy and social reform, opposing Western capitalism). Politically, Ba'athism relies on a strong, highly centralized vanguard party and staunchly opposes Zionism's expansion in the Middle East, viewing it as a tool of Western colonialism and imperialism.\n\nBa'athist supporters span various social strata: progressive officers, student groups, and the middle class. However, interpretations of Ba'athism vary significantly among adherents: some military figures view it merely as a political tool or a manipulable puppet, distancing themselves from the ideology itself—these are typically not considered true Ba'athists. More radical revolutionaries reinterpret the program, abandoning pan-Arabism for more localized solutions and significantly strengthening its socialist elements, often blending them with communist thought. Despite differing interpretations, all true Ba'athists adhere to a fundamental belief: the struggle to establish a free Arab nation."
 arab_baathism_subtype:0 "Arab Ba'athism"
