 transitional_government_subtype:0 "Caretaker Government"
 transitional_government_subtype_desc:0 "§YCaretaker Government§!\n\nAlso known as an interim government, provisional government, or temporary cabinet, it is fundamentally a temporary ad-hoc regime that exists before a more formal new government (established through democratic elections, military coups, or other means) is formed or assumes office. Common in parliamentary systems, its members are typically randomly selected members of parliament or outgoing members of parliament. Its primary responsibility is to perform limited governmental functions and maintain the daily operation of state institutions and the status quo. Caretaker governments usually form rapidly after the fall (or end of term) of the previous government, but regardless of the reason for the predecessor's fall, their inherent legitimacy is generally low. Therefore, if they are not replaced quickly, they can easily trigger domestic chaos and upheaval.\n\nSuch governments, even if non-political, often carry a relatively authoritarian hue to ensure basic stability during the transition period. Additionally, they usually lack the political will and substantive capacity to implement any meaningful major policies or legislation, as they lack the legal authorization (especially electoral mandate) to do so. In essence, until a formal government replaces the caretaker government, national governance is often in a state of 'freeze.'"
 
 GFX_Israel_notices_GUI_tooltip:0 "Notes:\nThis country content was released in version §BExodus§!. Welcome to play.\n§LTo play Israel, you must first play Jerusalem. After triggering the event where the Speaker falls into an assassination plot around early 1937, the Speaker will be impeached. Once parliament is paralyzed, the Jewish riots will trigger—choose to ignore them to play Israel. The transition to Israel has been added to the game!"
