PLS_Palestinian_Civil_War_decision_desc:0 "§GAll-Palestinian Government§! is composed of factions loyal to the Grand Mufti. The Palestinian Arab Party is the bastion of Arab nationalism and militarism, the Palestinian branch of the Muslim Brotherhood represents the Salafi current within Islamism, and the Young Officers represent the more revolutionary wing of Arab nationalism with totalist leanings.\n§BRepublican Defence Forces§! are composed of Arab democratic parties and the clerical-landlord bloc in the Jerusalem Mutassarifate. The Independence Party emphasizes preserving Arab and Islamic traditions, while the Reform Party promises liberalizing reforms and pro-labor policies.\n§RRevolutionary Armed Forces§! is the socialist army, supported by the Third International. The communist faction advocates for radical social revolution in Palestine, while the syndicalist faction is more willing to compromise with tradition.\nCurrent overall strength of the factions:\n\n\n§GAll-Palestinian Government§!: [?PLS.PLS_All_Palestinian_Government_unrest|R] £GFX_going_to_combat \n\n§BRepublican Defence Forces§!: [?PLS.PLS_Republican_Defence_Forces_unrest|R] £GFX_going_to_combat \n\n§RRevolutionary Armed Forces§!: [?PLS.PLS_Revolutionary_Armed_Forces_unrest|R] £GFX_going_to_combat"
