PLS_Join_the_Third_International: "Join the Third International"
Palestine.1.t: "Turkistan Liberation Organization Arrives"
Palestine.1.d: "The children of Turkistan, the Islamic warriors persevering in the heart of Central Asia, are demonstrating the power of faith through their actions. They are better known as the Basmachi movement. When the Grand Mufti issued the noble call for jihad, summoning us to fight for the land of faith, our Turkistani brothers did not hesitate for a moment. They swiftly assembled a force of devout warriors, took up arms, and traversed mountains and rivers, heading straight for the suffering land of Palestine. With scimitars and steeds, they answer our shared struggle against the infidel occupiers. This action itself is a resounding testament: Facing formidable enemies, Muslims worldwide, regardless of region or tribe, our hearts are closely linked, and our strength is converging. For Palestine, for our sacred faith, we will fight side by side to the end. Such unity is the very foundation of our victory over the enemy; history will ultimately witness the glory of our shared struggle."
Palestine.1.a: "Salaam"
Palestine.2.t: "Greater German Volunteer Corps"
Palestine.2.d: "On the path to Palestine's independence and liberation, a volunteer armed force has arrived in our land. Its leader, Otto Skorzeny, influenced a group of like-minded supporters with his unwavering hostility towards Zionism; they are determined to eradicate that threat as a physical entity. Some consider their methods too extreme, even sparking concern and criticism within our own ranks. Yet, we firmly recognize that everyone fighting for freedom deserves respect. The Mufti, as a core figure, consistently treats these warriors equally, regardless of their background. Reports indicate his meeting with Skorzeny resonated deeply, demonstrating our pragmatism in uniting all available forces to advance Palestine towards independence. While imperfect, such an alliance is a necessary step for the nation's well-being in difficult times."
Palestine.2.a: "Here, we are all comrades-in-arms, regardless of faith or race."
Palestine.3.t: "Special Assistance"
Palestine.3.d: "Following the National Liberation Front's call for global assistance to resist the Zionist colonialists' armed invasion, aid gradually arrived. The first volunteers came from other left-wing party militias in the Middle East, bringing food and antiquated weapons. The second group came from the Third International; although the close ties between Lehi and the British Maximalists prevented direct Third International intervention in the Arab-Israeli conflict, the French Sorelian faction sent volunteers and donated weapons in the name of their party.\n\nThe third batch of volunteers hailed from Spain, Romania, and Ukraine. Well, these individuals had little connection to the left anymore. The Spanish Falange, the Romanian Iron Guard, and the Organization of Ukrainian Nationalists each dispatched volunteers, arriving in Lebanon around the same time before entering Palestine. The National Liberation Front hadn't anticipated this development but, pressed by the urgent needs of war, accepted these volunteer forces. The final group came from Russia; Black Hundreds paramilitaries and Bolshevik remnants arrived in Palestine almost simultaneously via different routes."
Palestine.3.a: "Let's hope they don't start fighting in the staff headquarters."
Palestine.4.t: "The True Test"
Palestine.4.d: "After crushing the Zionists, Palestine is not met with peace and development, but the looming specter of fratricide. Amin al-Husseini, the most prominent figure wielding the greatest power in Palestine, basks in glory, but privately, the conflicts between the three major factions he leads are intensifying, threatening his faction's collapse at any moment. The most radical faction of young officers cannot tolerate the Palestinian Arab Party's perceived compromises in the revolution. The Palestinian Arab Party looks down on the young officers' 'socialist tendencies.' The Muslim Brotherhood believes both have excessively embraced Western thought and are enemies of Islam.\n\nClergy and landlords are generally seen as supporters of democracy. These respectable individuals, possessing some education and assets, fear that allowing al-Husseini to continue his plans will destroy the hard-won peace and jeopardize everything they now possess. The democrats possess the least armed strength among all factions. However, as broad-based moderates, they are more likely to become the political 'greatest common denominator,' the 'choice when there is no choice.'\n\nAfter Israel's collapse, the socialist factions supporting Palestine became the Third International's only option. Socialists, bolstered by aid, have significantly increased their strength, gaining some capacity to resist the al-Husseini faction. Their anti-colonial, anti-capitalist slogans have attracted supporters, making them a force impossible to ignore.\n\nPalestine's fragmentation is inevitable. Factions fortify positions in major cities; the situation is explosive."
Palestine.4.a: "A new struggle begins."
Palestine.5.t: "Erasing Colonial Traces?"
Palestine.5.d: "At this point, any faction in Palestine would raise the banner of 'resisting colonialism,' but the reality is different. Palestinian politics is increasingly influenced by foreign powers. Valois and Mussolini have increased investment in the Young Officers faction, hoping to expand totalitarianism's influence within the Third International through a totalitarian revolution in the Middle East.\n\nThe Muslim Brotherhood positions itself with a more radical anti-Western stance but remains dependent on foreign aid; their ranks show an increasing number of broadly defined Central Asian faces. Beyond non-governmental nationalist organizations, many formal political parties are supporting al-Husseini, seeing it as supporting the 'anti-Jewish cause.' Germany's Pan-German League donated a batch of supplies to Palestine, causing significant controversy domestically. The public criticized the Pan-German League's actions as 'inexplicable,' to which the League offered no rebuttal.\n\nThe Entente is attempting to negotiate with Palestine's republican factions; they absolutely do not want a 'Mussolini' or 'Savinkov' to appear in the heart of the Old World. Non-totalitarian factions of the Third International have formally established a cooperative relationship with the Palestinian National Liberation Front. Every step forward for totalitarianism means a step back for social freedom and workers' democracy. Establishing a socialist government in Palestine aligned with the non-totalitarian factions of the Third International has become their top priority."
Palestine.5.a: "So where is the true national independence?"
Palestine.6.t: "Maintaining Public Order?"
Palestine.6.d: "Palestine has become a proving ground for major political factions; no order holds sway. A week ago, the National Liberation Front set up a platform in the marketplace to present socialist viewpoints to passersby. This attracted some, but more chose to steer clear of the trouble spot. Half an hour later, accompanied by a cry of 'Allahu Akbar!', a stone struck the speaker's head, killing him instantly. Other NLF members present immediately rushed to apprehend the assailant, leading to a brawl with the assailant's accomplices. Ten minutes later, the Mufti's militia arrived and took control of both groups.\n\nThe next day, the Mufti announced his ruling: the perpetrator would face execution 'when the time is appropriate.' The NLF immediately protested, arguing the Mufti was effectively shielding the criminal and demanding immediate execution to deter all 'radicals.' The Mufti's response: Rules bow to no one; meeting the NLF's demands would only escalate tensions. The NLF organized a protest march against the Mufti's perceived leniency. Members chanted in the streets: Execute the murderer! End the Mufti's power! And outside the procession, another chorus arose."
Palestine.6.a: "'Allahu Akbar!'"
Palestine.7.t: "Pacifying the Tribes?"
Palestine.7.d: "The term 'tribe' is often associated with lethargy and reaction; national modernization is usually linked to ruralization or urbanization. Yet, 'tribalization' is precisely what is happening in Palestine. Faced with the constant threat of civil war, civilians flee cities, refusing orders from any faction in the Palestinian political arena, even forming self-defense groups for protection. Political organizations, meanwhile, try to tighten control over their garrisoned areas, attacking other political forces in the media, carving out fiefdoms block by block or village by village. Clearly, this fragmentation is temporary; Palestine will inevitably be reunified under its true master. However, the impact of such profound political division may be permanent..."
Palestine.7.a: "So there must be a catfish among the sardines."
Palestine.8.t: "Battle of Haifa Street"
Palestine.8.d: "Republican Guard forces and Revolutionary Armed Forces engaged in street fighting on Haifa Street. The Revolutionary Armed Forces attempted to breach Republican Guard barricades, meeting fierce resistance. Controlling the street would boost the corresponding faction's influence among the local populace, while failure would incur heavy losses. Both sides have already committed significant forces to this street; it seems both are determined to seize control."
Palestine.8.a: "The Republican Guard repelled the Revolutionary Armed Forces' assault."
Palestine.8.b: "The Revolutionary Armed Forces breached the Republican Guard's barricades."
Palestine.9.t: "Battle for Haifa Police Station"
Palestine.9.d: "The All-Palestine Government launched a surprise attack on the Haifa Police Station controlled by the Republican Guard. Weapons within the station would provide supplies to its possessor, and controlling it would maintain authority over the neighborhood. Casualties were heavy on both sides. Defenders had already doused the station's weapon crates with gasoline, signaling a fight to the death. The attackers fared little better."
Palestine.9.a: "All-Palestine Government forces storm the police station."
Palestine.9.b: "All-Palestine Government forces retreat in disarray."
Palestine.10.t: "Battle for Haifa Government Building"
Palestine.10.d: "Government buildings hold immense symbolic value. Controlling one greatly boosts the controller's confidence and represents nominal control over the city. Hence, all factions in the civil war are willing to pay a high price to seize them. The All-Palestine Government erected simple fortifications in front of the building. The Revolutionary Armed Forces organized demolition suicide squads."
Palestine.10.a: "At great cost, the Revolutionary Armed Forces entered the government building."
Palestine.10.b: "The Revolutionary Armed Forces were completely annihilated."
Palestine.11.t: "Battle for Jaffa Port"
Palestine.11.d: "Jaffa Port is the lifeline for armed forces; foreign nations send aid to Palestine through it. Currently controlled by the Revolutionary Armed Forces, both the All-Palestine Government and the Republican Guard eye the port covetously. The three factions will clash fiercely at Jaffa Port. The victor will gain control, though whether the port remains functional after the battle is unknown."
Palestine.11.a: "The Revolutionary Armed Forces maintained control of the port."
Palestine.11.b: "The All-Palestine Government recaptured Jaffa Port."
Palestine.11.c: "The Republican Guard fought their way out of the encirclement."
Palestine.12.t: "Battle of Jaffa Street"
Palestine.12.d: "The All-Palestine Government and the Republican Guard engaged in street fighting on Jaffa Street. The Republican Guard attempted to breach All-Palestine Government barricades, meeting staunch resistance. Controlling the street would boost the corresponding faction's influence among the local populace, while failure would incur heavy losses. Both sides have already committed significant forces to this street; it seems both are determined to seize control."
Palestine.12.a: "The All-Palestine Government repelled the Republican Guard's assault."
Palestine.12.b: "The Republican Guard breached the All-Palestine Government's barricades."
Palestine.13.t: "Battle for Jaffa Government Building"
Palestine.13.d: "Government buildings hold immense symbolic value. Controlling one greatly boosts the controller's confidence and represents nominal control over the city. Hence, all factions in the civil war are willing to pay a high price to seize them. The Revolutionary Armed Forces erected simple fortifications in front of the building. The Republican Guard organized demolition suicide squads."
Palestine.13.a: "At great cost, the Republican Guard entered the government building."
Palestine.13.b: "The Republican Guard was completely annihilated."
Palestine.14.t: "Battle for Jerusalem Fortress"
Palestine.14.d: "Facilities once built to stop Jews are now used by Arabs against Arabs. The All-Palestine Government controls the Jerusalem Fortress. Both the Republican Guard and the Revolutionary Armed Forces desire control of this fortress as their stronghold. Constructed with the latest technology, the fortress is impervious to Palestine's current level of demolition expertise. Attackers can only resort to human wave assaults to breach it."
Palestine.14.a: "Rivers of blood, the All-Palestine Government maintains control."
Palestine.14.b: "Suicide squad members opened a path for the Revolutionary Armed Forces with their lives."
Palestine.14.c: "All-Palestine Government forces surrendered; the Republican Guard took over the fortress."
Palestine.15.t: "Battle of Jerusalem Street"
Palestine.15.d: "The All-Palestine Government and the Revolutionary Armed Forces engaged in street fighting on Jaffa Street. The Revolutionary Armed Forces attempted to breach All-Palestine Government barricades, meeting staunch resistance. Controlling the street would boost the corresponding faction's influence among the local populace, while failure would incur heavy losses. Both sides have already committed significant forces to this street; it seems both are determined to seize control."
Palestine.15.a: "The All-Palestine Government repelled the Revolutionary Armed Forces' assault."
Palestine.15.b: "The Revolutionary Armed Forces breached the All-Palestine Government's barricades."
Palestine.16.t: "Battle for Jerusalem Police Station"
Palestine.16.d: "The Republican Guard launched a surprise attack on the Jerusalem Police Station controlled by the All-Palestine Government. Weapons within the station would provide supplies to its possessor, and controlling it would maintain authority over the neighborhood. Casualties were heavy on both sides. Defenders had already doused the station's weapon crates with gasoline, signaling a fight to the death. The attackers fared little better."
Palestine.16.a: "Republican Guard forces storm the police station."
Palestine.16.b: "Republican Guard forces retreat in disarray."
Palestine.17.t: "Battle for Jerusalem Government Building"
Palestine.17.d: "Government buildings hold immense symbolic value. Controlling one greatly boosts the controller's confidence and represents nominal control over the city. Hence, all factions in the civil war are willing to pay a high price to seize them. The All-Palestine Government erected simple fortifications in front of the building. The Revolutionary Armed Forces organized demolition suicide squads, while the Republican Guard also prepared to strike at the Jerusalem Government Building."
Palestine.17.a: "At great cost, the Revolutionary Armed Forces entered the government building."
Palestine.17.b: "The Revolutionary Armed Forces were completely annihilated."
Palestine.17.c: "The Republican Guard reaped the rewards, entering the government building with effortless ease."
Palestine.18.t: "End of Civil War"
Palestine.18.d: "The Palestinian Civil War, ignited by the three factions of the All-Palestine Government, Republican Guard, and Revolutionary Armed Forces, appears to have drawn to a close. The previous din of gunfire and artillery seems to have ceased. Armed forces in major cities have stopped fighting and withdrawn. Only sporadic gunfire echoes in the suburbs. War-torn Palestine has restored communications; crackling static and a broadcaster's voice declare to the Arab world:"
Palestine.18.a: "'Everything is proceeding as planned...'"
Palestine.19.t: "Your Name"
Palestine.19.d: "Ukraine holds no cultural or religious significance for Arabs. The Crimean Tatars are old subjects of the Ottomans; should Arabs protect their co-religionists? That might be the only meaning. Al-Husseini's plan was to install a puppet government, hunt Jews, make the European breadbasket provide wheat and steel to Arabia, and then attack Poland – the nest of the Jews, the origin of the invading Jewish scum. As al-Husseini pondered this, while the Arab army marched through Western Ukraine, a local militia requested to join the Arab forces to assist in the invasion of Poland. Al-Husseini had heard of Eastern Europe's complex ethnic makeup and the constant inter-ethnic clashes, but such submission to foreigners was rare.\n\nAl-Husseini agreed to meet the militia leader to discuss cooperation. The young man entered the Arab army headquarters, dressed in ill-fitting Arab garb. Upon seeing Amin al-Husseini, he immediately burst into tears, rushed forward, knelt on one knee, and clumsily said in Arabic: 'I implore you to become my teacher.' Al-Husseini stared blankly at this short, thin young man, weathered by sun and frost. Silence filled the room until, as if fate demanded it, al-Husseini uttered tonelessly in Ukrainian, 'I accept.'"
Palestine.19.a: "'Stepan Bandera'"
Palestine.20.d: "Millennium"
Palestine.20.t: "Al-Husseini had a nightmare. He dreamed Edward and Pétain led Entente soldiers to conquer Palestine, annihilating the Palestinian Arab Party, slaughtering all resistance fighters, demolishing mosques, and Stern building the Third Jewish Temple. He dreamed Syrians weeping, wounded, dying under Jewish attacks; Egyptians kneeling at the feet of Jews in submission; Iraqis fleeing their homeland in fear. He dreamed Palestinians confined, enslaved, segregated, massacred; generation after generation of new fighters rising only to be struck down, Palestine gasping its last breath. He dreamed Jews controlling nations through factories and banks, deceiving people with newspapers and radio.\n\nAl-Husseini awoke from the night with a gasp:"
Palestine.20.a: "This will never come true."
Palestine.21.t: "Croatian Muslim Insurgent Army"
Palestine.21.d: "With the aim of 'disrupting the German colonial order and liberating compatriots under Habsburg rule,' the Croatian Ustaše organized a volunteer army primarily composed of Bosnian Muslims. Neither in size nor armament could this force be called a regular army, yet it demonstrated the Bosnian Muslims' resolve to fight. We greatly admire the bravery of these Muslims."
Palestine.21.a: "Allah sees your efforts."
Palestine.22.t: "Operation Yellow"
Palestine.22.d: "'As you can see, per your request, we've standardized Jewish management measures. They now wear unified yellow Stars of David to distinguish them from Arabs.' The labor camp guard eagerly explained the implementation of 'Operation Yellow' to the Mufti. The noise of steam engines and hammers forced all conversation to be shouted. 'Because Palestinian enterprises no longer want these Jewish workers, and Jewish properties have all been confiscated, they must work here if they don't want to die immediately. We call this place a labor camp. They produce basic necessities to exchange for essential supplies.'\n\nDozens of Jews worked in this German-built factory partially destroyed by war. The smell of oil and sweat mingled, perhaps only marginally better than the stench of death.\n\n'Will anyone buy it?' the Mufti asked the guard over the roaring machinery. 'Will these goods also bear the Star of David when sold? Palestinians won't like these impure goods.'\n\n'We can lower prices. We don't pay them wages; keeping them alive is enough, so costs can be pushed very low. All kinds of goods are in short supply now.' The guard's words carried a hint of sycophancy.\n\n'Interesting. Ah, can you make the belt run faster?' The Mufti stood among several Jews, watching the drive shaft. 'I'm not a Jewish rabbi; they don't need prayer time.'"
Palestine.22.a: "'Yes, Grand Mufti.'"
Palestine.23.t: "Non-Zionists"
Palestine.23.d: "Jews are not monolithic, nor universally supportive of Zionism. Multiple communities exist with distinct histories and cultures. First are the Mizrahi and Sephardi Jews, indigenous Jewish communities of the Middle East and North Africa whose history traces back to biblical times. These, to some extent 'native,' Jews harbor no hostility towards Arabs and have no interest in Zionist rhetoric. They even face discrimination and exclusion from Zionists for not being 'Zionist enough.' They are largely Arabized; we need not focus further on this group.\n\nThen there are the strictly traditional Haredi, or ultra-Orthodox Jews. Primarily originating from 18th-19th century Eastern European Jewish communities, they advocate for closed religious communities focused on Torah study. The Haredi vehemently oppose Zionism, believing only the Messiah can restore Jewish sovereignty. During the Arab-Israeli War, Haredi Jews even formed an organization called 'City Guard,' attempting political action to thwart Stern's atrocities. These Orthodox Jews are precisely whom our government can win over; publicizing their actions will severely undermine Zionist legitimacy and improve our image among other Jewish groups."
Palestine.23.a: "Zionists, go back and listen to your rabbis!"
Palestine.24.t: "Operation Grey"
Palestine.24.d: "Younis al-Bahri had prepared for this day for a long time. For Palestine, building an intercontinental radio station using the 'remains' of the Mutasarrifate posed a significant challenge. Bahri sat in the studio, staring at the script before him. As a traveler, he had journeyed far; as a politician, he had witnessed countless social upheavals, but he had never felt such excitement as today – he was broadcasting events happening in a nation he helped build.\n\nThe broadcast began. 'And We will surely test you with something of fear and hunger and a loss of wealth and lives and fruits, but give good tidings to the patient, Who, when disaster strikes them, say, "Indeed we belong to Allah, and indeed to Him we will return." Upon them are blessings from their Lord and mercy.'\n\n'This is the first broadcast of Palestine Free Radio. Just months ago, Palestine's courageous Muslims thwarted the Zionist invaders' rampant ambitions with bravery and perseverance – though the efforts of Christians were also crucial to victory. In the following segments, I will expose the crimes against humanity committed by Zionists during the war, refute Zionist and supporter slander against Palestinians' righteous resistance, and present authentic evidence of their conspiracies discovered in the ancient Jewish Quarter.'\n\n'This program will air at the same time each week. Future episodes will cover Palestine's post-war recovery, developments across the Arab world, and further disclosures of Jewish plots.'\n\n'Arabs, shout our slogan!'"
Palestine.24.a: "Allahu Akbar!"
Palestine.24.b: "Long live the revolution!"
Palestine.25.t: "'Aliyah Movement'"
Palestine.25.d: "'Aliyah,' meaning ascent, refers to the Jewish immigration movement to Israel. Its immediate cause was the rise of Zionism; its root cause was rampant European antisemitism. The First Aliyah began in 1881 after the assassination of Russian Tsar Alexander II. The Tsarist government encouraged the belief Jews were responsible, enacting systematic discriminatory policies and condoning, even inciting, violence against Jews. The First Aliyah lasted a long time. Amidst the Russian revolutionary turmoil, the Tsarist government insisted Jewish elements were at play, escalating discrimination and leading to atrocities like the Kishinev pogrom.\n\nWar halted free movement. After the World War, the Second Aliyah began. Revolution in Russia, uprising in Germany, and war-weariness in France rekindled European hatred and Jewish fear. With the establishment of the Mutasarrifate allowing Jewish immigration, tens of thousands sought ways to reach their 'Promised Land.' The Third Aliyah also stemmed from revolution. The British and French revolutions not only forced local bourgeoisie to flee but also cast Europe again under the shadow of the 'Jewish conspiracy.' Jewish bourgeoisie had to leave their homelands; with America isolationist, Palestine became their sole destination."
Palestine.25.a: "I know you're pitiful, but what's that to me?"
Palestine.26.t: "Endless War"
Palestine.26.d: "News from Poland shocked Europe. Assisted by local antisemitic groups, Arabs launched a major raid on several Jewish settlements, resulting in over 700 deaths. All Arabs involved perished; survivors described 'extremely brutal methods.' The Palestinian government claimed responsibility via radio, releasing records of these settlements' aid to Israel.\n\nHasan Salama declared on air: Israel is the Jewish nation-state. As long as Jews exist in the world, their Zionist conspiracy will not cease, nor will the state of war between Arabs and the Jewish people. Arabs will organize more such actions. Jewish 'butchers' shall not sleep soundly; they shall tremble under the Arab shadow."
Palestine.26.a: "When was the operation planned?"
Palestine.27.t: "Terror by Daylight"
Palestine.27.d: "After the Arab army conquered Warsaw, how Arabs would treat Jews on Polish soil became a global focus. Now the answer is clear. First came widespread anti-Jewish violence. Then, the Arab army executed a group of Jewish bourgeoisie. Subsequently, facilities modeled after Palestine's so-called 'labor camps' appeared across Poland. Now, all Polish Jews are confined to segregated zones behind walls, denied freedom.\n\nThe international community unanimously condemns the Arab army's crimes against humanity, demanding immediate improvement of Jewish conditions and closure of the camps. Younis al-Bahri declared, 'The Arab-Israeli war never ended; this is part of its continuation,' 'Jews are the common enemy of Arabs and Europeans,' 'The Arab government is open to other European nations,' and 'hopes to fight alongside them to destroy liberalism and Jewish capitalism.' Current signs indicate the Arab army is helping volunteer forces establish rule in their homelands."
Palestine.27.a: "Now Jews can ascend no more."
Palestine.28.t: "Capital and Jewishness"
Palestine.28.d: "Jews always try to recall the early history of Zionism combined with socialism and propagandize Arab backwardness to win Third International support; now even Marx's descendants advocate colonizing Palestine. Today we must examine Marx, this socialist pioneer, and his attitude towards Jewishness.\n\n'What is the worldly religion of the Jew? Huckstering. What is his worldly God? Money. Money is the jealous god of Israel, in face of which no other god may exist. Money degrades all the gods of man – and turns them into commodities. The bill of exchange is the real god of the Jew. His god is only an illusory bill of exchange. The chimerical nationality of the Jew is the nationality of the merchant, of the man of money in general.' This is what Marx expressed in his writings. And also: 'The capitalist knows that all commodities, however shabby they may look, or however badly they may smell, are in faith and in truth money, inwardly circumcised Jews, and what is more, a wonderful means whereby out of money to make more money.'\n\nFurthermore: 'Christ drove the Jewish money-changers out of the temple, and the money-changers of our age, who stand on the side of tyranny, happen also to be Jews – this is perhaps merely a historical coincidence.' In Marx's writings, Jewishness is consistently intertwined with capital; one could even say for Marx, Jewishness and capital were inherently one."
Palestine.28.a: "The social emancipation of the Jew is the emancipation of society from Judaism."
Palestine.29.t: "Operation Red"
Palestine.29.d: "The Zionist forces indeed tried their best but could not withstand the Arabs' boundless fury. Most Jewish notables fled Palestine on ships from either the Third International or the Entente. Arab soldiers stood at the harbor shouting 'Allahu Akbar!' towards the Mediterranean. Yet some Jews remained – either die-hard colonists or disillusioned idealists awaiting their fate.\n\nThe Arab army would give them their desired end: Furious Mujahideen hunted down remnants of Jewish forces, raided Jewish quarters to capture political and business leaders. Amin al-Husseini announced that, when appropriate, executions of these 'Jewish Satans' would be held before the Al-Aqsa Mosque. Al-Husseini could do it, and he did. After two months of manhunts, Amin al-Husseini announced via radio that Arabs had completely eradicated Zionist remnants in Arab lands.\n\nThe execution ceremony took place the same day. Leaders of Mapai – the Israel Workers' Party, Ahimeir – the notorious butcher, and others were brought before Al-Aqsa. Judging by their condition, they had suffered brutal abuse or beatings; some were likely dead before execution. Al-Husseini ordered soldiers to behead the criminals, piled the corpses together, and personally lit the pyre, the bodies crackling. Everyone before the mosque chanted: Allahu Akbar!"
Palestine.29.a: "Amidst this blood and fire."
Palestine.30.t: "The Zionist Dilemma"
Palestine.30.d: "The Zionist contradiction lies here: They absolutely cannot claim to be a religious movement, because the Messiah has not come; Zionist actions contradict doctrine, and more fundamentalist Haredi Jews oppose Israel's founding. They absolutely cannot claim to be a nationalist movement; Zionist colonialism has provoked Arab anger; Arab Jews won't support them; these immigrant Jews would ruin their reputation and bring misfortune. The only option for immigrant Jews is to renounce their Jewish identity and join Palestine as ordinary immigrants – marking the bankruptcy of the Zionist movement."
Palestine.30.a: "Indeed so."
Palestine.31.t: "Attack from the SSNP"
Palestine.31.d: "Here was a Zionist company commander, boasting about taking Jerusalem today and Mecca tomorrow. But he never expected – his rabbi's candelabra! – a Syrian Social Nationalist Party (SSNP) shell 'thumped' down, pinpoint accurate, blowing the white cap right off the Israeli 014th Infantry Company commander's head, tearing him limb from limb like the Holy Roman Empire.\n\nThe Syrian Social Nationalist Party is a nationalist party active in the Levant, advocating a Greater Syria encompassing the Fertile Crescent. They hold deep sympathy for the Palestinian plight, sent troops to assist the anti-Israeli war, and their members joined the Palestinian Provisional Liberation Committee in a personal capacity."
Palestine.31.a: "Greater Syria? A fascinating concept."
Palestine.32.t: "Educational Dilemma"
Palestine.32.d: "Some say before the Quran, Arabs had no decent books. True then, and sadly, still true today. Western education remains a rarity circulated among the wealthy. For most Palestinians, the Quran is the only book they've seen.\n\nThis is the problem facing our educational reform. If we continue our current, already radical reform – allowing some vetted clergy to teach books other than the Quran – we still lack sufficient manpower to rapidly universalize basic education. We cannot pull intellectuals from government to become teachers. So if we truly must rapidly promote basic education, we must release intellectuals from other factions in the civil war, even opposing clergy."
Palestine.32.a: "Maintain the current plan; slow is acceptable."
Palestine.32.b: "I'm not afraid of them; we have guns! Let them out!"
Palestine.33.t: "French Advisors Protest"
Palestine.33.d: "Regarding the Palestinian government's compromise with religious conservatives, French advisors lodged a stern protest. They argued Islam is synonymous with conservatism and backwardness; the government should uphold socialist positions on major social issues, heed their advice, and threatened that if Palestine continues to compromise, France will not stand by as the revolution 'crumbles.'"
Palestine.33.a: "What about you? Send us money and people?"
Palestine.34.t: "An Ordinary Day"
Palestine.34.d: "Sidqi organized his work report, preparing to brief the Third International advisor at the meeting. Well, the Palestinian government had again compromised with conservatives on social issues, despite warnings and threats from the advisor. This meeting was precisely about that – to explain the current difficulties to the French advisor, hoping for understanding and more aid. He entered the conference room; everyone else was seated. The advisor glared coldly; other officials kept their heads down.\n\nThe atmosphere was tense.\n\n'I know recent events anger you, but you must understand my difficulties, for example...' Sidqi sat there speaking, completely oblivious to the advisor's changing expression, until interrupted by a roar. Then several French soldiers entered and restrained everyone. Sidqi offered no resistance. Fate had decreed it.\n\nThe next day's Palestinian news headline read:"
Palestine.34.a: "Sidqi suffers sudden severe illness; Palestine establishes Provisional Power Committee."
Palestine.35.t: "Permanent Provisional State"
Palestine.35.d: "No one cared what happened to Sidqi. Newspapers published fabricated updates on his 'medical progress' sporadically for the first two weeks, then stopped when no one asked. Palestinian order was impeccable; France's advanced social governance experience was a revolutionary shock to the Middle Eastern backwater. Arabs had submitted, even become docile. A more open, liberal social atmosphere made Palestinians indulge in entertainment, blind to resistance. French industrial facilities and supplies improved Palestinian living standards, rendering them incapable of resistance.\n\nAfter seven hundred years, France once again rules Jerusalem. The Palestinian model might be an exportable product; such policies could be implemented in Algiers and Indochina, where people struggle under capitalist oppression. We, as their former masters, have a duty to liberate them. Socialist enlightenment and capitalist colonization are entirely different. Such enlightenment, perhaps, is the mission God bestowed upon France."
Palestine.35.a: "Saladin, weep!"
Palestine.36.t: "Islamic Socialism"
Palestine.36.d: "Throughout the Arab-Israeli War and Palestinian Civil War, we constantly spoke of revolution, constantly made promises. Now the revolution has succeeded; it's time to deliver. The problem we face now is how to promote socialism to Palestinians. In previous propaganda, we only spoke of national independence and pro-labor policies, deliberately avoiding socialist fundamentals to prevent Palestinian hostility due to fear of atheism.\n\nAdopting Islamic socialist principles is now essential. The question is the degree of compromise. We could vaguely claim policies are inspired by Islam, that the Quran implies socialism; or we could bring jurists into the government to defend us – they'd certainly find a way."
Palestine.36.a: "We can withstand the pressure, right?"
Palestine.36.b: "Hope there's no trouble."
Palestine.37.t: "Hashemite Supporters Launch Rebellion"
Palestine.37.d: "The alliance between the Clergy-Landlord bloc and the Republican Guard was unstable. They merely saw democracy as less frightening than militarism; they also feared democracy would undermine Palestine's economic base and destroy Arab culture. When the Hashemite family in Transjordan proposed a joint rebellion to overthrow the Republican Guard regime, they immediately agreed. The Republican Guard, weakened by war, could not resist and surrendered. As twenty years prior, the Palestinian people raised the four-color flag of Pan-Arabism, welcoming the Hashemites."
Palestine.37.a: "The Hashemites hold glory!"
Palestine.38.t: "Skorzeny Leaves Palestine"
Palestine.38.d: "After we held our first democratic elections and gradually purged extremist influences from the government, the European far-right volunteer forces began contemplating leaving Palestine. When Otto Skorzeny sent his letter to the Palestinian government, their departure was only a matter of time. In the letter, Skorzeny lambasted Palestine's new democratic government as an 'insult to the martyrs of the liberation war' and 'submission to the global Jewish order.' He declared he 'could no longer bear living in an increasingly decadent country.'"
Palestine.38.a: "Fine, let him go."
Palestine.39.t: "Skorzeny Leaves Palestine"
Palestine.39.d: "After the socialist government successfully won over the majority of society and thwarted the Islamists' plots, the European far-right volunteers immediately expressed dissatisfaction and began planning their departure from Palestine. Otto Skorzeny addressed the Palestinian Military Committee, stating Palestine had 'gone down a wrong path,' surrendered to the 'filthy French liberal trend,' converted to the 'fallacies of the bald Tatar Jew,' and he could not fathom 'why a nation that militarily defeated Jews now kneels culturally before them.' He declared he could not endure it, would immediately lead the volunteers away, and vowed, 'If we meet again on the battlefield, I will kill you all.'"
Palestine.39.a: "Fine, at least we don't have to hang these reactionaries, our former comrades."
Palestine.40.t: "The Grand Mufti's Speech"
Palestine.40.d: "The most dangerous moment for Arabs and Islam has arrived! Zionists and their supporters worldwide are sending soldiers and bullets to the land of Palestine! They aim to exterminate Arabs, exterminate Islam! Jewish hatred for Muslims began with the Prophet. They called the Prophet a liar, tarnished his glory, shamed him. Just as they insulted and betrayed the Prophet then, they now insult and betray all Muslims!\n\nOur cause is just. Abu Huraira said: The Day of Judgment will come when Muslims eradicate the Jews. Every tree hiding a Jew will cry out, 'A Jew hides behind me, Muslim, come kill him!' I declare: One hundred Palestinian pounds for killing a Jew! One hundred Palestinian pounds for killing a collaborator! Ten thousand Palestinian pounds for killing Stern! One drop of blood shed in resistance surpasses ten prayers; the martyred shall meet the Prophet in Paradise."
Palestine.40.a: "Take up arms!"
Palestine.41.t: "Young Officers Coup"
Palestine.41.d: "The civil war has ended, and the All-Palestine Government is at its weakest moment. Hasan Salama, unable to tolerate the Mufti's ambiguous stance toward the Muslim Brotherhood, launches an armed rebellion with the Young Officers organization aided by foreign volunteers to save the Arab nation. Hasan al-Banna flees in panic, and the collaboration between the Mufti and the Muslim Brotherhood collapses completely. For now, the Young Officers Association maintains a respectful attitude toward the Mufti."
Palestine.41.a: "Better to be a wolf for one day than a sheep for a hundred years."
Palestine.42.t: "Revolutionaries Take Power"
Palestine.42.d: "As the Young Officers' policies drift leftward, their shift toward a more revolutionary faction becomes inevitable. Today, Hasan Salama announces his resignation as 'Leader' to meet the demands of practical struggle, succeeded by Yunus al-Bahri. In a public address, al-Bahri vows to uphold the founding principles of the Young Officers and dedicate himself fully to the struggle against imperialism and Jewish capitalism."
Palestine.42.a: "Hail the Leader!"
Palestine.43.t: "Militarist Faction Maintains Control"
Palestine.43.d: "The thrill of power has not dulled the Young Officers. The militarist faction consolidates its rule. Hasan Salama declares he has purged Palestine of liberal filth, proclaiming the Young Officers will lead Arabs from Bahrain to Marrakesh toward revival, vowing to make imperialists tremble and force Jews to face the consequences of their crimes."
Palestine.43.a: "At your command!"
Palestine.44.t: "Triumph of Arab Nationalism"
Palestine.44.d: "The alliance between Amin al-Husseini and Hasan al-Banna collapses as expected. Escalating disputes over Islamism versus nationalism spark clashes between their militias. Today, the leadership question is settled: Hasan al-Banna announces the Muslim Brotherhood's Palestine branch will operate under the Arab Party. After conquering Egypt, the Brotherhood will fully submit to the Arab Party. Al-Banna retains his government post and pledges to bolster Brotherhood networks in newly conquered regions to stabilize Arab Party rule."
Palestine.44.a: "The beast of power"
Palestine.45.t: "Triumph of Islamism"
Palestine.45.d: "The Amin al-Husseini-Hasan al-Banna alliance fractures predictably amid intensifying Islamist-nationalist disputes and militia skirmishes. Leadership is decided: Amin al-Husseini dissolves the Palestine Arab Party, transfers command of the Holy War Army to al-Banna, and joins the General Guidance Bureau. He pledges to leverage his religious and nationalist influence to facilitate Islamic revival."
Palestine.45.a: "Allahu Akbar!"
Palestine.46.t: "Palestine's First Democratic Election"
Palestine.46.d: "Palestine's inaugural democratic election commences. Parties have campaigned vigorously to win control of the government. The Youth Association, aligned with the Mufti during the civil war despite its pre-war democratic stance in Jerusalem's Mutasarrifate era, still claims democratic credentials. The Independent Party, a moderate conservative bastion, advocates gradual reform and upholding Arab-Islamic traditions. The Reform Party, led by radical democrats from the Jerusalem Assembly, pushes aggressive labor policies and secularization."
Palestine.46.a: "Impossible! The Youth Association won?!"
Palestine.46.b: "Independent Party wins!"
Palestine.46.c: "Reform Party wins!"
Palestine.47.t: "The Young Husseini"
Palestine.47.d: "Muhammad Abdullah al-Rahman, son of an Egyptian merchant and a Husseini mother, was sent to Jerusalem after her death. Despite his youth, he shows remarkable courage. During the war, he tried to join the fight against Zionists. After being denied, he sneaked toward the front lines. Though stopped, his defiance became a symbol of Palestinian resistance. While Amin al-Husseini's hardline stance enjoys broad support, dissent grows. Muhammad, the war's young hero, publicly condemns al-Husseini's 'Zionist-like brutality,' arguing it fuels Jewish resistance and sabotages peace. He demands restoring Jewish rights and promoting Arab-Jewish reconciliation. As dissent swells, al-Husseini summons Muhammad. A gun and Quran lie on his desk. Muhammad plans to denounce the tyrant, but under the Mufti's imposing gaze, his words fail him. Al-Husseini stares down at him: 'Peace is a luxury, boy. Zionists dream of Jerusalem; imperialists invade at will. The olive branch is not for our era. We grasp the gun in one hand, the Quran in the other.' He lifts both. 'Abandon illusions.'"
Palestine.47.a: "‘Kill them before they kill you’—a Jewish saying, no less."
Palestine.48.t: "Violent Fanaticism"
Palestine.48.d: "Iraq's regime collapse unleashed chaos, worsened by the Palestinian nationalist government's arrival. Hundreds of anti-Jewish pogroms erupt. Arabic reports claim Jews formed militias fearing Palestinians, then spread rumors of 'Iraqi Zionist support,' triggering Muslim 'spontaneous' violence. Even the Palestinian government avoids praising massacres, yet reports mention 'limbs clogging riverbeds' and 'stench for kilometers.' Predictably, 'Arab Jews' will soon exist only in history books."
Palestine.48.a: "History teaches that humans learn nothing from history."
Palestine.49.t: "Red Stains"
Palestine.49.d: "Deluded Tatars live in false comfort, forgetting their ancestors' blood debt. Seven centuries ago, Mongol hordes sacked Baghdad. Now the Caliphate is reborn. Sinners must pay. Tatars! You slaughtered our men, women, elders, children—murdered Islam's Caliph! Plundered Arab wealth, defiled our culture. Your tents, homes, palaces, pastures will turn to desert. Blood of your livestock shall water the soil. Warriors of the Caliph will slaughter you all, as you once did..."
Palestine.49.a: "Without bloodshed, there is no remission of sin!"
Palestine.50.t: "Staying the Course"
Palestine.50.d: "Islamist-constitutionalist strife plagues the Hashemite Kingdom. Clerics radicalized by colonialism clash irreconcilably with Western-inspired bureaucrats—a feud ending only in annihilation. Facing extremist pressure, the Hashemites and civil government hold firm, crushing remnants of the Holy War Army and Muslim Brotherhood. Al-Husseini remains Mufti but loses all influence."
Palestine.50.a: "Embrace freedom"
Palestine.51.t: "Victory in War"
Palestine.51.d: "The last Israeli-flagged ship departs Palestine. Arabs triumph in this existential war. Jubilation sweeps Palestine. Though war exhausted their wealth, families sell belongings to feast for days beside craters and trenches. All ideologies and faiths unite—eating, drinking coffee, singing, dancing, praising Allah, honoring martyrs. Al-Husseini proposes post-war governance to the Provisional Liberation Committee, receiving only 'Respect the people's will.' Silence hints at greater conspiracies. Palestine's future remains dark."
Palestine.51.a: "But we live today."
Palestine.52.t: "Slogan?"
Palestine.52.d: "We oppose Jewish-German-Turkish cultural-military colonialism. But under what banner? Amin al-Husseini champions Arab nationalism, framing Zionism as a failed Jewish plot to destroy Arabs to unite sects. Hasan al-Banna insists on an Islamic lens, labeling Jews and imperialists 'Satanic destroyers of Islam' to mobilize global Muslims against Allah's enemies."
Palestine.52.a: "Long live Pan-Arab solidarity!"
Palestine.52.b: "Allah will aid us against all foes!"
Palestine.53.t: "Polity?"
Palestine.53.d: "What form should the state take? As an educated Arab nationalist, Amin al-Husseini advocates an elite-led supreme authority respecting Islamic norms. Hasan al-Banna deems structure irrelevant, demanding total Islamization of economy, military, and society."
Palestine.53.a: "Western-style systems are superior."
Palestine.53.b: "We are Muslims!"
Palestine.54.t: "Islam?"
Palestine.54.d: "What role for Islam? Jerusalem's Grand Mufti Amin al-Husseini is mislabeled a fundamentalist. In truth, pre-war he secretly contacted the Comintern for anti-colonial revolt while courting European far-right parties. He accepts Islam's societal leadership but prioritizes nationalism. Hasan al-Banna, a staunch Islamist, believes Islam encompasses all aspects of society, rejecting external learning. The state must build structures around Sharia."
Palestine.54.a: "Europe's experience merits trial."
Palestine.54.b: "Our mission: guide humanity to pure Islamic principles."
Palestine.55.t: "Holy Land for All"
Palestine.55.d: "Contrary to Zionist propaganda, Palestine is no backward Muslim monolith. Its sanctity stems from diversity. All faiths claim Jerusalem, sparking unavoidable conflict. Under the millet system, four quarters emerged: Muslim (northeast, with Al-Aqsa and Dome of the Rock), Christian (northwest, with Church of Holy Sepulchre), Armenian (southwest), and Jewish (southeast, Sephardic pre-Zionism). Pre-WWI isolation prevailed until Jewish immigrants claimed sovereignty over all Jerusalem, threatening other sects. Christians and Armenians sided with Muslims in the war."
Palestine.55.a: "Understood."
Palestine.56.t: "Recalling the Past"
Palestine.56.d: "Amin al-Husseini never imagined becoming who he is. 'Hajj'—his title from Mecca pilgrimage—seems fated. From Ottoman artilleryman to Arab Kingdom officer, protest leader against the Balfour Declaration to Mutasarrifate-appointed Mufti, his fate swayed with history. He recalls manipulating Syrian militias against the Mutasarrifate while pledging to rein in religious fighters to Germans and Turks—who knew yet tolerated him. During the war, his networks made him Palestine's de facto leader: summoning European volunteers, Brotherhood militias. Without him, no victory. Dawn glints off the mosque's golden dome. Al-Husseini feels the blood and sweat of millions in his hands."
Palestine.56.a: "What cannot I achieve?"
Palestine.57.t: "Return of Sovereignty"
Palestine.57.d: "Why invest in Palestine? No oil, iron, or grain. France spent three armies' worth of resources propping up this wasteland. A thousand men guard Suez, but we must withdraw—Palestine is stable. No more 'Islamic socialism.' I can't stay; I've forgotten the taste of ham, Bordeaux wine."
Palestine.57.a: "Headline: West German Chancellor miraculously recovers, resumes office."
Palestine.58.t: "Parliamentary Election"
Palestine.58.d: "As tensions ease, parliamentary divisions grow. It's time to implement constitutional governance through an internal election for the next four-year ruling party."
Palestine.58.a: "Social Democrat faction wins."
Palestine.58.b: "Progressive faction wins."
Palestine.58.c: "Liberal faction wins."
Palestine.58.e: "Conservative faction retains majority."
Palestine.59.t: "Golden Age"
Palestine.59.d: "Islam was never closed-minded as colonizers claim. The Caliphate epitomized tolerance. Early caliphs revered knowledge—founding the House of Wisdom, gathering scholars of all faiths to translate Eastern and Western texts. Golden Age breakthroughs: Algebra by al-Khwarizmi, Indian numerals; astronomy by Omar Khayyam; Ibn Sina's Canon of Medicine; al-Razi on contagion; Persian qanats; al-Jazari’s automata; One Thousand and One Nights; mosque geometry and calligraphy. Then came the polytheist Tatars..."
Palestine.59.a: "Islam will rise again!"
Palestine.60.t: "Unify with Palestine?"
Palestine.60.d: "The Palestinian government shares our goals and ideology. They propose unification. Accept?"
Palestine.60.a: "Agree"
Palestine.60.b: "Refuse"
Palestine.61.t: "Rise of the True Caliphate"
Palestine.61.d: "From rebellion to conquering Palestine, reclaiming Greater Syria to seizing the Holy Mosques—time passes silently. Now Faisal I rules Arabia. After eight centuries of humiliation, the Caliphate is reborn. Crowds pack the Grand Mosque square: scholars, generals, Hashemites inner circle; loyal Arab chiefs with banners outer ring; global Muslims beyond. At dawn, Faisal I leads prayers. Quran recitations follow. Barefoot on imperial flags, he ascends the pulpit in white wool. Jerusalem's Grand Mufti delivers the coronation sermon, praising Allah, blessing the Prophet's lineage, declaring the Caliphate restored against Western colonialism. After recitations, Mecca's Sharif and Umma Council pledge allegiance, then Hashemites, chiefs, generals, finally the masses. Faisal I accepts, vowing to uphold Allah's law and honor the Prophet's legacy. Escorted by clerics and kin, he circles the Kaaba. Muezzins proclaim the Caliph—heralding a new era."
Palestine.61.a: "Long live the Caliph!"
Palestine.62.t: "Emergence from Darkness"
Palestine.62.d: "First, more 'treason' arrests. Then politicians assaulted. Militias beating protesters. Now the Youth Association rules Palestine. Democracy is dead. Darkness reigns. Everyone knows what lurks within—violence, fanaticism. It was always there: in baton cracks, prayer calls, 'enemy' bloodstains. The times didn't create it; they summoned it."
Palestine.62.a: "Something shattered. Long ago."
Palestine.63.t: "Keep It Halal"
Palestine.63.d: "The Muslim Brotherhood demands Sharia-compliant education, healthcare, and art. Music—vital for expression, history, propaganda—must obey Islamic law: no praise for leaders, no obscenity. Hadiths warn instrument users become 'monkeys and pigs,' yet others permit instruments. Hanafis allow frame drums at weddings; Malikis tolerate drums but ban strings; Shafi'is permit only frame drums; Hanbalis forbid all instruments except religious recitation. Nasheed—acapella hymns praising Allah, citing Islamic history—remains universally halal."
Palestine.63.a: "Halal"
Palestine.64.t: "Youth Association's Rising Tyranny"
Palestine.64.d: "The Youth Association's loyalty to the Mufti is known, but recent actions stun. Qusay announces a 'special force' to root out spies and saboteurs amid Zionist-imperialist threats. On the streets, it's no new force—just reorganized Husseini militias and Holy War Army remnants. Democrats protest this assault on democracy; others flee, fearing a coup."
Palestine.64.a: "Protest! Let dictators see the people's fury!"
Palestine.64.b: "I hear al-Husseini's sneer."
Palestine.65.t: "Patience"
Palestine.65.d: "Success demands generations, not months or years. Politics requires persistence. Past governments abandoned transformative policies fearing opposition or chasing votes. Education is paramount—it defines identity, purpose, and destiny. Palestine's 15% literacy is unacceptable. We need educated workers, farmers, soldiers. This requires teachers and systems to train them. We must dismantle the old education and build a revolutionary compulsory system. Hardship is inevitable, but our resolve today eases our children's burdens tomorrow."
Palestine.65.a: "A long road ahead."
Palestine.66.t: "Question of Path"
Palestine.66.d: "Which socialist road? Rely on the masses—still largely ignorant—or the vanguard? Embrace Islamic tradition or impose socialist culture? Palestine lacks politicized labor movements; syndicalism faces resistance. Will communism fare better? Conservatives will fight atheism. The schism must end."
Palestine.66.a: "Syndicalist faction prevails."
Palestine.66.b: "Communist faction prevails."
Palestine.67.t: "Islamists Seize Power"
Palestine.67.d: "Constitutional monarchists push reforms only to hit insurmountable walls. When they confront the inevitable, they look up—into the Mufti's shadow. Of course! Al-Husseini would never settle for a figurehead role. He bides his time, then strikes. Shocking yet numbing news from Jerusalem: bloody coup in Hashemite Kingdom. Islamists purge the civil government. All recognize the Mufti and Brotherhood's hand, but Palestine officially calls it Muslim 'justice' against apostates."
Palestine.67.a: "All praise to Allah, Lord of the Worlds, the Beneficent, the Merciful."
Palestine.68.t: "True Promise"
Palestine.68.d: "Months after the civil war—do we still hold the spirit? Life reverts to the Mutasarrifate era, as if no life-or-death struggle occurred, no blood shed for the republic! The nation indulges in pleasure; party elders bask in honors or graft. People forget the turbulent world grants no lasting peace. Time erodes purpose. Too many forget why we fight."
Palestine.68.a: "Arab blood won't flow in vain."
Palestine.68.b: "Strangle the enemy at the Canal!"
Palestine.68.c: "Support Europe's revolution!"
Palestine.69.t: "Allah's Judgment"
Palestine.69.d: "After a grueling campaign, Brotherhood forces conquer northwest China. Hasan al-Banna knew of its Muslim populace. When European powers sent troops to crush China's revolution, Enver Pasha urged local Muslims not to join 'Han uprisings.' Ruling a foreign land is hard—despite shared faith, sect, language, and custom divides complicate governance. Yet al-Banna meets little resistance. A 'General Hu Saeed' offers connections to aid administration. As Brotherhood cadres arrive, al-Banna finds 'Hu Saeed' unnecessary—the people seem docile. But numbness hides truth: 'Hu Saeed' is Ma Bufang—a depraved warlord worse than Europeans. He hoards concubines, enforces terror with private militias. Al-Banna is enraged: 'He disgraces Islam!' When Ma tours villages 'hunting prey,' Brotherhood agents arrest him. Victims' families identify him at dawn. Stones rain down—shattering the tyrant."
Palestine.69.a: "Takfir"
Palestine.70.t: "Social Justice"
Palestine.70.d: "Sayyid Qutb's latest book, Social Justice in Islam, sparks fierce debate. Qutb condemns Christianity and syndicalism's 'materialism,' lambasts capitalist decadence, and declares all equal before Allah—even tax-paying non-believers. His radical economic plan demands public resources owned by the Ummah (with usufruct rights), strict zakat to limit wealth gaps, and bans worker tributes beyond zakat (e.g., to capitalists or parties). Conservatives, landlords, and clerics demand a ban; youth hail it as Islam's only path to revival."
Palestine.70.a: "Qutb speaks truth! Allah outshines Marx!"
Palestine.70.b: "Read it, but don't take it seriously."
Palestine.71.t: "Dangerous Bargain"
Palestine.71.d: "Husseini militias and Brotherhood fighters disband—but the men remain, threatening Palestine. Recent attacks surge, signaling a plot. Our government co-opted the Mufti to pacify extremists. The plan failed. We must renegotiate. The Mufti claims he severed extremist ties but demands more power to 'mediate.' Everyone knows he's exploiting the crisis. Yet the threat is real."
Palestine.71.a: "Amin won't betray me! He fought beside me in the uprising!"
Palestine.71.b: "Treason! Who does he think he is?"
Palestine.72.t: "Attacks"
Palestine.72.d: "Civil war restraint failed to heal rifts. Low-level clashes persist. Town-level security forces suffer 7 attacks this month: 28 dead, 15 attackers killed."
Palestine.72.a: "Very well."
Palestine.73.t: "Critical Step"
Palestine.73.d: "The Muslim Brotherhood seeks to unify the Islamic world under a Caliph. With Egypt's Brotherhood in power, our movement triumphs. Now we negotiate unification with them."
Palestine.73.a: "I want to play as Egypt."
Palestine.73.b: "Continue as Palestine."
Palestine.74.t: "Palestine Branch Requests Merger"
Palestine.74.d: "The Comintern has purged Palestinian nationalism. We can absorb this land—not as colonizers, but as an Eastern revolutionary outpost to 'redden' the Middle East and aid comrades across Asia."
Palestine.74.a: "Bring them in."
Palestine.74.b: "They still serve a purpose."
Palestine.75.t: "Join Palestine?"
Palestine.75.d: "The Palestinian government shares our goals and ideology. They invite us to join their faction. Accept?"
Palestine.75.a: "Agree"
Palestine.75.b: "Refuse"
PLSguides.1.t: "Palestine Play Guide"
PLSguides.1.d: "All-Palestine Government?\n\nMake the All-Palestine Government significantly stronger than the other two factions. To play Amin al-Husseini's content, follow the standard All-Palestine Government path by choosing nationalist options twice or more. Similarly, for the Muslim Brotherhood, select religious options twice or more.\n\nHashimite Family?\n\nBalance the strength of Republicans and Revolutionaries to exceed the All-Palestine Government.\n\nDemocratic and Socialist Path?\n\nMake Republicans or Revolutionaries significantly stronger than other factions. To trigger the Third International Observer takeover, enter the Syndicalist path and compromise with tradition twice.\n\nYoung Officers?\n\nMake the All-Palestine Government slightly stronger than other factions by 1 point; the Young Officers will then coup the government."
PLSguides.1.a: "Good"
PLS_guidesnum:0 "§CPalestine§! has §G4§! path guides."
PLS_stand_up_go_to_the_revolution:0 "Rise for Revolution"
PLS_stand_up_go_to_the_revolution_desc:0 "All Palestine faces fierce attacks from Zionist forces, pushing the Arab nation to the brink of survival once again. Muslim brothers, now is the critical moment to take up arms and organize resistance. We must resolutely confront these enemies. Accusations may come, but we know our duty to defend our homeland. For the survival and dignity of the Arab nation, we fight to the end."
PLS_Raise_the_black_flag:0 "Raise the Black Flag!"
PLS_Raise_the_black_flag_desc:0 "The black flag, symbolizing resistance, was raised by Muhammad and passed to Abu Muslim. Today, Palestinians raise it anew. We may be restrained or suppressed, but Palestine will never yield."
PLS_The_influence_of_the_Great_Mufti:0 "The Grand Mufti's Influence"
PLS_The_influence_of_the_Great_Mufti_desc:0 "Grand Mufti Amin al-Husseini ostensibly collaborates with the Mutasarrifate as Palestine’s Islamic religious leader, yet secretly links with radical nationalists and Islamists. Leveraging his pan-Arab influence will garner support across the Arab world."
PLS_Islam_dominates:0 "Islamic Dominance"
PLS_Islam_dominates_desc:0 "The Muslim Brotherhood, originating in Egypt, expanded globally. Founder Hassan al-Banna shared close ties with Amin al-Husseini. Deepening Brotherhood ties and offering incentives will attract their volunteers."
PLS_Introduce_young_officers:0 "Incorporate Young Officers"
PLS_Introduce_young_officers_desc:0 "The Young Officers, active in the Levant and Iraq, embrace Sorelianism and National Syndicalism. They advocate social transformation and military mobilization. Despite ambiguous Islamic stances, their advanced skills are indispensable."
PLS_The_banner_of_the_Great_Uprising:0 "Banner of the Great Uprising!"
PLS_The_banner_of_the_Great_Uprising_desc:0 "White for our deeds, black for our battles, green for our fields, red for our swords. Twenty years ago, Ibn Ali rallied Arabs under this flag against Ottoman rule. Today, we inherit its spirit."
PLS_Mobilize_the_militia:0 "Mobilize Militias"
PLS_Mobilize_the_militia_desc:0 "Confronted by harsh reality, all Palestinians—men, women, young and old—must take up arms. Zionists seek our annihilation; this is existential. We fight to defend land and survival. History will vindicate us: realism demands unity against extinction."
PLS_Underground_factory:0 "Underground Factories"
PLS_Underground_factory_desc:0 "Arab industry is weak, but resourceful artisans replicate weapons and maintain equipment. This ingenuity strengthens defense, conserves resources, and fosters self-reliance. We must empower these craftsmen to build a resilient future."
PLS_Raise_the_red_flag:0 "Raise the Red Flag!"
PLS_Raise_the_red_flag_desc:0 "The red flag symbolizes revolution and socialism. Under imperialist oppression, our people suffer profoundly. Workers must act: arm yourselves and expel occupiers from Palestine. United struggle brings liberation and dignity—history will affirm our justice."
PLS_Appeal_to_the_international_columns:0 "Call for International Brigades"
PLS_Appeal_to_the_international_columns_desc:0 "Internationalism binds socialist revolutionaries to global struggles. Facing aggression, we summon comrades to join our resistance. Only unity can expel oppressors and secure lasting peace. History will prove us right."
PLS_Anti_Zionist_stance:0 "Anti-Zionist Stance"
PLS_Anti_Zionist_stance_desc:0 "Zionism is the poison! Immigrants masquerading as Jews seize Arab lands and livelihoods. We must expose this theft globally, uniting all who value justice to reveal their colonial reality."
PLS_Anti_colonial_position:0 "Anti-Colonial Position"
PLS_Anti_colonial_position_desc:0 "Imperialism is the true enemy. Without U.S. backing, German occupation, or Ottoman complicity, Palestine would not suffer thus. Zionists are foes, but the architects sit in Berlin, Washington, and Algiers! Palestine fights for all colonized peoples."
PLS_Through_the_hardships_of_life:0 "Through Life's Hardships"
PLS_Through_the_hardships_of_life_desc:0 "Victory may seem distant, but we endure and fight. Struggle ends suffering; endurance fortifies will. This is survival: to become unyielding stones for independence and future."
PLS_Increase_military_spending:0 "Boost Military Spending"
PLS_Increase_military_spending_desc:0 "Arab military tech lags far behind the West. Bridging this gap demands relentless effort: training, modern equipment, and tactical analysis. Every drop of sweat defends our homeland—no compromise."
PLS_Direction_of_military_reform:0 "Military Reform Path"
PLS_Direction_of_military_reform_desc:0 "Commanders propose two paths: adopt Germany’s proven mobilization system, or revive medieval Arab valor and tactics. We must blend German efficiency with Arab tenacity to forge an unconquerable army."
PLS_Take_Germany_as_a_teacher:0 "Learn from Germany"
PLS_Take_Germany_as_a_teacher_desc:0 "Germany’s WWI mobilization secured victory. Palestine must replicate their model—dedicated departments, rapid deployment, unified command. This transformation is non-negotiable."
PLS_Standardize_the_command_system:0 "Standardize Command"
PLS_Standardize_the_command_system_desc:0 "Germany’s General Staff is battle-tested. Palestine’s fragmented forces require structural overhaul: adopt German chains of command and tactics. This is pragmatism, not imitation."
PLS_Defend_the_living_space_of_the_nation:0 "Defend National Living Space"
PLS_Defend_the_living_space_of_the_nation_desc:0 "Fight for Arab rivers and soil—our lifelines. Instill this truth in every soldier through daily indoctrination. Forge a steel-willed army rooted in national honor."
PLS_total_war:0 "Total War"
PLS_total_war_desc:0 "War engulfs the whole nation: farms feed troops, factories arm them, media rallies morale. Coordinate all resources—victory demands nothing less."
PLS_Surprisingly_winning:0 "Victory Through Surprise"
PLS_Surprisingly_winning_desc:0 "Outgunned and outproduced, we counter with unmatched bravery. Train fighters, issue simple arms, let heroes lead charges. Human spirit is our ultimate weapon."
PLS_Normalize_death_squads:0 "Formalize Death Squads"
PLS_Normalize_death_squads_desc:0 "Ad hoc suicide units are unreliable. Establish permanent commando teams trained for lightning strikes and decapitation. Systematize to break stalemates."
PLS_Unscrupulously:0 "By Any Means Necessary"
PLS_Unscrupulously_desc:0 "Discard morality—extinction permits no mercy. Use every weapon: gas, bombs. Annihilate resistance, regardless of gender. Win at all costs."
PLS_Traditional_troops:0 "Traditional Forces"
PLS_Traditional_troops_desc:0 "Ignore false experts! Our ancestors triumphed in Spain and against Mongols. Train by Quranic principles—Allah ensures victory. History vindicates tradition."
PLS_Respond_to_the_call_to_jihad:0 "Answer the Call to Jihad"
PLS_Respond_to_the_call_to_jihad_desc:0 "Jihad consumes heart and soul. From daily acts to holy war, it ignites passion. Inspire soldiers and civilians alike—this spiritual unity guarantees courage."
PLS_Recruit_Burakuren:0 "Recruit Tribesmen"
PLS_Recruit_Burakuren_desc:0 "Mobilize tribesmen, mercenaries, and bandits from occupied lands. Offer pay or land for loyalty. Build auxiliary units for logistics and patrols—pragmatism turns them into assets."
PLS_Plunder_the_economy:0 "Plunder Economy"
PLS_Plunder_the_economy_desc:0 "Palestine’s arid lands contrast with enemy fertility. Attack to seize wealth and resources; redistribute loot to loyalists. This fuels unity and stability."
PLS_Establishment_of_the_Military_Academy:0 "Found Military Academy"
PLS_Establishment_of_the_Military_Academy_desc:0 "A military institution is foundational for independence. Train strategists, develop domestic arms production, and end foreign reliance—key to national security."
PLS_War_Department:0 "Army Ministry"
PLS_War_Department_desc:0 "Land warfare is decisive: no occupation, no victory. Invest in troop numbers and equipment. Control territory to safeguard borders—this is strategic necessity."
PLS_Research_regular_gear:0 "Research Standard Gear"
PLS_Research_regular_gear_desc:0 "Prioritize rifles and artillery—core tools for war and industrial base. Master these before costly projects. Pragmatism in scarcity."
PLS_Armor_tests:0 "Armor Testing"
PLS_Armor_tests_desc:0 "Armor is a luxury, but delaying widens the tech gap. Invest moderately to nurture expertise—long-term realism avoids future vulnerability."
PLS_Admiralty:0 "Navy Ministry"
PLS_Admiralty_desc:0 "Vast coastlines make naval defense critical. Ottoman neglect left technology backward. We must catch up: advanced training and tech secure maritime sovereignty."
PLS_Dockyard_was_added:0 "Expand Shipyards"
PLS_Dockyard_was_added_desc:0 "Invest in shipbuilding: integrate coastal defense with auxiliary naval power. Prioritize small vessels and shore batteries—efficient, responsive, and cost-effective."
PLS_Ministry_of_the_Air_Force:0 "Air Force Ministry"
PLS_Ministry_of_the_Air_Force_desc:0 "An air force is economically daunting but essential. Start small—without it, skies belong to enemies. Realism demands this step."
PLS_Import_of_foreign_aircraft:0 "Import Foreign Aircraft"
PLS_Import_of_foreign_aircraft_desc:0 "Import planes and production lines. Reverse-engineer to narrow the gap with Europe. Cultivate domestic capability—delay ensures obsolescence."
PLS_Palestine_was_given_a_respite:0 "Palestine's Respite"
PLS_Palestine_was_given_a_respite_desc:0 "After bloodshed, Arabs prevail. Zionist forces crumble: some flee by sea, others await judgment. From river to sea, land is liberated. Palestine stands free."
PLS_Rebuild_the_political_system:0 "Rebuild Political System"
PLS_Rebuild_the_political_system_desc:0 "Civil war shattered old structures. With Jews expelled, we must restore governance. New institutions must reach every village—consolidating victory demands control."
PLS_Erase_the_traces_of_colonization:0 "Erase Colonial Traces"
PLS_Erase_the_traces_of_colonization_desc:0 "Ottoman decay and Zionist colonization scarred Palestine. Now, purge every foreign imprint—bases, influence, all erased. Only Arab heritage remains."
PLS_Pacify_the_tribes:0 "Pacify Tribes"
PLS_Pacify_the_tribes_desc:0 "Desert tribes drift in obscurity. As Palestine’s true government, awaken their identity: this land is Palestine; they are its people."
PLS_Maintain_public_order:0 "Maintain Public Order"
PLS_Maintain_public_order_desc:0 "Chaos breeds banditry. National police enforce discipline and law. Defiance meets severe punishment—order restores dignity."
PLS_Unveil_it:0 "Unveil the Struggle"
PLS_Unveil_it_desc:0 "Parties vie for dominance in rebuilding. History will reveal who leads Arabs forward as Palestine’s undisputed master."
PLS_The_Jewish_Question:0 "The Jewish Question"
PLS_The_Jewish_Question_desc:0 "Residual Jews threaten security. Policy must integrate or remove them—avoid conflict, ensure Arab primacy. Realism safeguards national stability."
PLS_Total_revenge_on_Zionism:0 "Total Revenge on Zionism"
PLS_Total_revenge_on_Zionism_desc:0 "Show no mercy. Compassion risks Arab lives. Eliminate the threat—humanity is a luxury. Annihilation secures the future."
PLS_Shelling_of_the_Wailing_Wall:0 "Shell the Wailing Wall"
PLS_Shelling_of_the_Wailing_Wall_desc:0 "Crush Zionist illusions with artillery. Erase all Jewish traces—homes, books, culture. Purify the land for Arab destiny."
PLS_Operation_Red:0 "Operation Red"
PLS_Operation_Red_desc:0 "Execute captured Jewish elites publicly. Their blood honors Mujahideen sacrifices—this spectacle fuels national resolve."
PLS_Resumption_of_land:0 "Reclaim Land"
PLS_Resumption_of_land_desc:0 "Void Jewish deeds—unapproved by our government. Evict them; transfer assets to Arabs. Wealth returns to rightful owners."
PLS_Operation_Yellow:0 "Operation Yellow"
PLS_Operation_Yellow_desc:0 "Mark remaining Jews with yellow stars. Isolate and monitor—necessary for security, not persecution."
PLS_Burning_the_books:0 "Burn the Books"
PLS_Burning_the_books_desc:0 "Destroy Zionist schools—centers of heresy. Rebuild for Arab education. Purge foreign poison; safeguard youth."
PLS_Operation_Gray:0 "Operation Gray"
PLS_Operation_Gray_desc:0 "Attack Jewish culture: media spreads conspiracies; far-right allies globalize the fight. Cultural war demands resources—prove Palestine right."
PLS_End_the_cycle_of_hatred:0 "End the Cycle of Hatred"
PLS_End_the_cycle_of_hatred_desc:0 "Violence begets violence. Reconciliation is realism: dialogue and coexistence prevent bloodshed. Peace through understanding."
PLS_Work_with_the_Haredi_people:0 "Cooperate with Haredim"
PLS_Work_with_the_Haredi_people_desc:0 "Haredim view Israel’s fall as divine judgment. Propagandize their stance to divide Jews. Pragmatism purifies the land."
PLS_Hunt_for_the_Lehi:0 "Hunt Lehi 'Freedom Fighters'"
PLS_Hunt_for_the_Lehi_desc:0 "Most Jews seek shelter, but Lehi incites violence. Crush extremists; spare innocents. Security demands precision."
PLS_Recognition_of_title_deeds:0 "Recognize Land Deeds"
PLS_Recognition_of_title_deeds_desc:0 "Acknowledge Jewish payments and economic contributions. Guarantee rights—stability reduces conflict. Harmony aids development."
PLS_End_the_Aria_Movement:0 "Halt Aliyah Movement"
PLS_End_the_Aria_Movement_desc:0 "Tolerance ends: new immigrants may include saboteurs like Stern. Restrict migration to protect peace—national security first."
PLS_Restoration_of_Judaism:0 "Restore Judaism’s Status"
PLS_Restoration_of_Judaism_desc:0 "Condemn anti-Jewish rhetoric. Promote dignity and integration—end division. Unity prevents hatred from corroding society."
PLS_A_holy_place_for_all:0 "Holy Place for All"
PLS_A_holy_place_for_all_desc:0 "Jerusalem must be open. Ensure religious freedom—prevent past persecutions. Fair treatment stabilizes society."
PLS_Break_away_from_Judass_hand:0 "Break Judas' Grip"
PLS_Break_away_from_Judass_hand_desc:0 "Palestinians defeated Jewish bourgeoisie. Arab action secures economic independence—no external control. Struggle protects national roots."
PLS_Inventory_operations:0 "Inventory Operations"
PLS_Inventory_operations_desc:0 "Audit wartime acts: punish Arab collaborators; isolate Lehi Jews. Fair scrutiny ensures postwar stability."
PLS_Only_Palestinians:0 "Only Palestinians"
PLS_Only_Palestinians_desc:0 "Jews cannot settle as Jews. Retain culture? Then leave. Cultural unity prevents fragmentation—assimilation or exclusion."
PLS_Nationalization_of_immigrants_property:0 "Nationalize Immigrant Property"
PLS_Nationalization_of_immigrants_property_desc:0 "Confiscate post-Mutasarrifate immigrants’ gold and Reichsmarks as reparations. Redistribute wealth—rebuild fairly."
PLS_Zionism_is_capitalism:0 "Zionism is Capitalism!"
PLS_Zionism_is_capitalism_desc:0 "Zionism’s backbone is Western bourgeoisie. Land grabs, colonists, arms for butchers—expose this aggression. Resist to protect resources."
PLS_End_the_delivery_of_greed:0 "End the Spread of Greed"
PLS_End_the_delivery_of_greed_desc:0 "Jewish culture breeds greed, as Marx noted. Shed this trait; become ordinary. Cultural purification prevents conflict."
PLS_Secularization_in_an_orderly_manner:0 "Orderly Secularization"
PLS_Secularization_in_an_orderly_manner_desc:0 "Secularize pragmatically: provide for Jews if they abandon identity and labor like Arabs. Prevents extremism; ensures productivity."
PLS_Between_Arabia_and_Islam:0 "Between Arabism and Islam"
PLS_Between_Arabia_and_Islam_desc:0 "Al-Husseini and al-Banna united Palestine but clash on nationalism vs. Islam. Fragile alliance fractures. One will must lead."
PLS_Deepening_anti_colonial_awareness:0 "Deepen Anti-Colonial Consciousness"
PLS_Deepening_anti_colonial_awareness_desc:0 "Al-Husseini admires Western far-right methods; al-Banna rejects Western values but accepts technology. Irreconcilable visions."
PLS_Allah_not_democracy:0 "Allah, Not Democracy"
PLS_Allah_not_democracy_desc:0 "Al-Husseini roots power in struggle; al-Banna sees authority from Allah alone."
PLS_Socialization_of_the_Islamic_faith:0 "Socialize Islamic Faith"
PLS_Socialization_of_the_Islamic_faith_desc:0 "Al-Husseini collaborates with modernists like Young Officers; al-Banna pursues total Islamization."
PLS_The_future_of_the_Alliance:0 "The Alliance’s Future"
PLS_The_future_of_the_Alliance_desc:0 "Deepening rifts doom the coalition. Palestine needs one will, one leader."
PLS_Modern_jihad:0 "Modern Jihad"
PLS_Modern_jihad_desc:0 "Al-Husseini’s victory heralds a new Arab-Islamic order—epic resurgence under his command."
PLS_integration:0 "Integration"
PLS_integration_desc:0 "The Palestinian Arab Party must dominate media, education, and culture. Forge youth loyal to Islamic wisdom and nationalism."
PLS_Centralize_local_power:0 "Centralize Local Power"
PLS_Centralize_local_power_desc:0 "Historical Muslim rulers tolerated nominal loyalty—breeding betrayal. We centralize: Jerusalem’s law reaches every inch of land."
PLS_Reform_the_mobilization_system:0 "Reform Mobilization"
PLS_Reform_the_mobilization_system_desc:0 "War exposed weaknesses. Replace militias with disciplined conscription and efficient war mobilization—foundations of security."
PLS_Hail_to_Haji:0 "Hail to Haji!"
PLS_Hail_to_Haji_desc:0 "Emulate European movements: absolute loyalty to leader and creed. Palestinians, acclaim Haji Amin al-Husseini!"
PLS_The_spirit_of_sacrifice:0 "Spirit of Sacrifice"
PLS_The_spirit_of_sacrifice_desc:0 "Islam’s fearless combat soul remains vital. Palestine’s rebirth demands its radiance anew."
PLS_Agitation_of_nationalism:0 "Agitate Nationalism"
PLS_Agitation_of_nationalism_desc:0 "Arab identity is fragile. Teach all: from Morocco to Iraq, one blood, one indivisible nation."
PLS_Struggle_Labor_Obey:0 "Struggle, Labor, Obey"
PLS_Struggle_Labor_Obey_desc:0 "Labor, struggle, obedience—pillars of Islamic spirit. Rooted in faith, not imitation."
PLS_Victory_in_Palestine:0 "Victory in Palestine"
PLS_Victory_in_Palestine_desc:0 "Hassan al-Banna’s Brotherhood takes power. He will purify Palestine by Allah’s will—a cleansed world begins here."
PLS_Expansion_of_the_Muslim_Brotherhood:0 "Expand Muslim Brotherhood"
PLS_Expansion_of_the_Muslim_Brotherhood_desc:0 "Hierarchical structure empowers Brotherhood networks across Arab lands. Each branch is a dagger to the enemy’s heart—unbreakable faith fortresses."
PLS_Islamic_Police:0 "Islamic Police"
PLS_Islamic_Police_desc:0 "Religious police enforce Sharia: ban alcohol, suppress un-Islamic gatherings. Patrols ensure compliance; violators face prescribed penalties."
PLS_Social_justice:0 "Social Justice"
PLS_Social_justice_desc:0 "True justice isn’t Marxist violence—it brings famine and war. Quran and Sunnah offer the path: build society on divine mercy, avoid heresy."
PLS_Refuting_Western_thought:0 "Refute Western Thought"
PLS_Refuting_Western_thought_desc:0 "Democracy, militarism, and socialism poisoned the Arab soul. Purge these ideologies—Islamic revival demands purity."
PLS_Correcting_the_Pan_Arab_Movement:0 "Correct Pan-Arabism"
PLS_Correcting_the_Pan_Arab_Movement_desc:0 "Pan-Arabists betray Allah for secular nationalism. Only Islam unites Arabs—reject false unity."
PLS_Stop_the_depravity_and_countercurrent:0 "Halt Depravity"
PLS_Stop_the_depravity_and_countercurrent_desc:0 "Western entertainment corrupts: taverns and films erode spirit. Eliminate decadence—youth must embrace scripture and sword."
PLS_Spiritual_mobilization:0 "Spiritual Mobilization"
PLS_Spiritual_mobilization_desc:0 "Piety without action is empty. When infidels invade, guns trump prayers. Allah favors warriors, not cowards."
PLS_Unexpected_contenders:0 "Unexpected Contenders"
PLS_Unexpected_contenders_desc:0 "Amid power struggles, clerics and monarchists coup. Hashimite prestige commands obedience. Palestine reborn under their crown—cherish this hard-won unity."
PLS_Give_the_mufti_a_place:0 "Seat for the Mufti"
PLS_Give_the_mufti_a_place_desc:0 "Grand Mufti’s wartime loyalty merits high office. Reward fuels nationalist fervor—fairness consolidates rule."
PLS_Take_advantage_of_clergy_and_landlords:0 "Leverage Clergy and Landlords"
PLS_Take_advantage_of_clergy_and_landlords_desc:0 "Clerics and landlords anchor monarchy. Their conservatism ensures stability—partner for smooth transition."
PLS_Banning_left_wing_political_parties:0 "Ban Leftist Parties"
PLS_Banning_left_wing_political_parties_desc:0 "Syndicalists and socialists threaten order. Crush them—prevent Third International subversion. Security demands ruthlessness."
PLS_Turn_on_monarchy_propaganda:0 "Launch Monarchist Propaganda"
PLS_Turn_on_monarchy_propaganda_desc:0 "Apathy blinds citizens to governance. Glorify Arab Caliphate history—instill pride in Islamic monarchical roots."
PLS_Deregulation_of_the_economy:0 "Deregulate Economy"
PLS_Deregulation_of_the_economy_desc:0 "Wartime controls hinder recovery. Free markets revive commerce and livelihoods—gain domestic and foreign trust."
PLS_The_direction_of_the_monarchy:0 "Monarchy’s Path"
PLS_The_direction_of_the_monarchy_desc:0 "Ministers debate with Sultan Faisal: religious caliphate vs. symbolic monarchy with constitutional government."
PLS_Holy_Descent:0 "Holy Descent"
PLS_Holy_Descent_desc:0 "Islamists purge Westernizing officials. They pledge to guide the Sultan by Sharia—traditionalists now dominate."
PLS_A_society_guided_by_Allah:0 "Allah-Guided Society"
PLS_A_society_guided_by_Allah_desc:0 "Man-made systems fail. Quran and Sunnah offer perfect governance. Scrap human laws—return to divine order."
PLS_Enable_Sapphira_Scholars:0 "Empower Salafi Scholars"
PLS_Enable_Sapphira_Scholars_desc:0 "Invite Cairo, Damascus, and Mecca’s scholars to govern by orthodox Islam. Make Palestine an Islamic model state."
PLS_Take_advantage_of_the_Muslim_Brotherhood:0 "Utilize Muslim Brotherhood"
PLS_Take_advantage_of_the_Muslim_Brotherhood_desc:0 "Brotherhood’s grassroots strength aids social control. Ally to build nationwide governance—order through unity."
PLS_Muslims_first:0 "Muslims First"
PLS_Muslims_first_desc:0 "History’s lessons: Assyrian revolts, Maronite threats, Zionist schemes. Tolerate no heresy—crush all dissent with iron resolve."
PLS_Looking_back_on_the_golden_years:0 "Recall Golden Age"
PLS_Looking_back_on_the_golden_years_desc:0 "Centuries ago, Muslims conquered with scripture and sword. Decline followed abandoning true Islam. Revive glory by governing via Quran—faith lights the path."
PLS_Unfinished_business:0 "Unfinished Business"
PLS_Unfinished_business_desc:0 "Democrats thwart theocracy. Pursue limited secularization: symbolic Sultan, modern education, cross-sect identity. Build a constitutional state blending tradition and progress."
PLS_Responsible_Parliament:0 "Responsible Parliament"
PLS_Responsible_Parliament_desc:0 "Avoid multiparty chaos but hear elites. Consult tribal chiefs, merchants, and clerics—retain central control while absorbing wisdom."
PLS_Reform_the_education_system:0 "Reform Education"
PLS_Reform_the_education_system_desc:0 "Overemphasis on religion stifles skills. Teach math, physics, modern history—cultivate citizens who modernize Palestine."
PLS_Marginalizing_Arab_parties:0 "Marginalize Arab Parties"
PLS_Marginalizing_Arab_parties_desc:0 "Palestinian Arab Party mixes militarists, fundamentalists, and bandits. This extremist medley endangers stability. Isolate their toxic ideology."
PLS_The_Millett_system_is_adopted:0 "Adopt Millet System"
PLS_The_Millett_system_is_adopted_desc:0 "Christians, Druze, and Muslim sects coexist. Grant cultural autonomy under central authority—loyalty secures religious rights."
PLS_Modern_Sultanate:0 "Modern Sultanate"
PLS_Modern_Sultanate_desc:0 "Reforms forge a unified monarchy: disband tribal armies, nurture national consciousness via education, boost commerce. Tax and infrastructure projects advance this vision—Palestine’s renaissance is irreversible."
PLS_Preparing_for_the_general_election:0 "Preparing for the General Election"
PLS_Preparing_for_the_general_election_desc:0 "The Palestinian people ultimately were not swayed by ambitious elements, and the republican forces persisted until the end. We have finally seized the historic opportunity to determine our national destiny. This is not a gift bestowed by any nobleman or religious order, but a right earned with the blood of all Palestinians. After shaking off external control, we will personally shape our own political future, letting the national will be the sole master of this land."
PLS_Campaigning_for_reconstruction:0 "Campaigning for Reconstruction"
PLS_Campaigning_for_reconstruction_desc:0 "Post-war reconstruction requires enormous investment. We plan to extensively solicit donations from overseas emigrants while seeking aid from the international community. Palestinian compatriots are spread all over the world, they share a blood connection with the homeland. If we can concentrate these financial and material resources, and also win the support of friendly nations, the reconstruction of roads, bridges, and houses will surely accelerate significantly, allowing the wounds of war to heal sooner."
PLS_Enlist_the_support_of_the_wealthy_family:0 "Enlist the Support of Wealthy Families"
PLS_Enlist_the_support_of_the_wealthy_family_desc:0 "Local gentry and religious leaders should also contribute to reconstruction. They possess considerable land wealth and social influence. We call on these people of insight to actively fund public works and organize people to repair their homes. Whether it's providing grain reserves or mobilizing labor, local forces need to cooperate. National revival is the shared responsibility of all citizens; no one can stand aloof."
PLS_Inspire_a_sense_of_democracy:0 "Inspire a Sense of Democracy"
PLS_Inspire_a_sense_of_democracy_desc:0 "Democracy remains an unfamiliar concept to ordinary people. We must mobilize all social organizations—from chambers of commerce to religious groups—to explain the meaning of elections to the populace. Through village-level rallies and propaganda, let every farmer understand the weight of the ballot in their hand. Civic education requires solid grassroots work; one cannot expect the public to spontaneously understand modern political systems."
PLS_End_of_mission:0 "End of Mission"
PLS_End_of_mission_desc:0 "The original plan to retain the Grand Mufti's religious leadership was too conservative. He and his followers must withdraw completely from the government system. Who can guarantee that this figure controlling religious authority will not stage another coup? The lesson of the last "Bloodless Reclamation" is still vivid. Only by severing his secular power can we prevent the recurrence of religious forces meddling in politics."
PLS_Spring_in_Palestine:0 "Spring in Palestine"
PLS_Spring_in_Palestine_desc:0 "The first democratic election in Palestinian history is about to begin. Political parties are fiercely competing in the streets and alleys. The outcome of this election will determine the direction of the nation and test the political choices of the people. Will the modernists or traditional forces ultimately prevail? The answer will soon be revealed in the ballot boxes; let's wait and see."
PLS_Youth_Congress_victory:0 "Youth Congress Victory"
PLS_Youth_Congress_victory_desc:0 "The Youth Congress, an organization cloaked in nationalism, has won the election; it is, in reality, a political tool of the Husseini faction. When extremist factions rise to power through democratic process, Palestine's future is truly worrisome. We fear the new government will implement radical policies in the name of public will, dragging the nation into new crises. This so-called democratic victory may instead doom the prospects of democracy; we can only pray for our democratic fate."
PLS_Admission_of_the_Islamic_Party:0 "Admission of the Islamic Party"
PLS_Admission_of_the_Islamic_Party_desc:0 "The Palestinian Islamic Party, a branch of the Muslim Brotherhood, has developed into a relatively moderate faction. We should integrate this force into governance. By granting it reasonable political space, we can both leverage its advantages in grassroots organization and effectively curb internal extremist ideologies. This strategy of divide and rule can prompt the overall transformation of the Muslim Brotherhood in a more stable direction."
PLS_Invite_the_Great_Mufti:0 "Invite the Grand Mufti"
PLS_Invite_the_Great_Mufti_desc:0 "The Grand Mufti is an iconic figure defending Islam; any attempt to marginalize him is a betrayal of the Arab cause. His leadership is needed not only in the religious sphere but also in secular political decision-making. This national hero who led us against the infidels rightly deserves to stand at the forefront of national governance, not to be forcibly dismissed."
PLS_Insist_on_nationalism:0 "Insist on Nationalism"
PLS_Insist_on_nationalism_desc:0 "Don't think an elected government will soften its stance! After taking power, the Youth Congress will only more resolutely defend Arab dignity. We will never blunt the blade of vengeance, nor forget the centuries of humiliation endured by the nation. Facing an old enemy, moderation is betrayal. Palestine's blade will only grow sharper until all shame is washed away."
PLS_Reorganization_of_the_militia:0 "Militia Reorganization"
PLS_Reorganization_of_the_militia_desc:0 "Though militia organizations are often seen as a threat to democracy, they are essential in the current environment. The Youth Congress must establish its own armed force to deter internal and external enemies. Facing the military threat of Zionism, this civil defense system is actually an important barrier protecting the foundations of democracy. Of course, they can also help us 'clean up' some dissenters."
PLS_Reiterate_anti_Semitic_positions:0 "Reiterate Anti-Semitic Positions"
PLS_Reiterate_anti_Semitic_positions_desc:0 "The Quran explicitly lists Jews as the eternal enemy of Muslims; this is not a subjective judgment by some Imam. In this life-or-death struggle concerning national survival, compromise means destruction. We must uphold the conviction to fight to the end, consistently implementing the fighting will bestowed by the Prophet. The revelation of Allah is our most fundamental program of struggle."
PLS_The_Independence_Party_wins:0 "Independence Party Wins"
PLS_The_Independence_Party_wins_desc:0 "The Palestinian Independence Party is primarily composed of young scholars and intellectuals. This emerging force advocates blending the core spiritual essence of Islam with Arab nationalism, forming a unique political philosophy. They insist on peaceful, gradual political struggle and oppose violent revolution. Gaining increasing support among urban teachers and lawyers, they have become a moderate voice that cannot be ignored in the political arena."
PLS_Dialogue_with_the_Sheikh:0 "Dialogue with the Sheikh"
PLS_Dialogue_with_the_Sheikh_desc:0 "To consolidate the foundation of governance, we must win the full support of Islamic scholars. We will grant prominent Sharia scholars honorary state positions and invite religious leaders into the advisory council. By providing substantial social status and participation in decision-making, we prompt the clerical class to preach to the populace the compatibility of democracy with Sharia law. Let mosques become vital centers for propagating government decrees."
PLS_The_edifying_role_of_Islam:0 "The Edifying Role of Islam"
PLS_The_edifying_role_of_Islam_desc:0 "Implementing separation of church and state is a basic principle of modern nations, which we will certainly uphold. However, this does not mean negating the cultural foundation of Islam. The educational function of mosques and the ceremonial rituals of traditional festivals must be fully preserved. If stripped entirely of religious elements, Palestine would lose its national soul. We need to safeguard the continuity of cultural heritage in the modernization process."
PLS_Responsibility_for_tradition:0 "Responsibility for Tradition"
PLS_Responsibility_for_tradition_desc:0 "The ancient proverbs of Bedouin tribes, the melodious tunes of Mawwal folk songs, and the handicraft techniques passed down through generations are all cultural treasures ingrained in the Arab blood. As the rulers of Palestine, we swear to safeguard this cultural heritage, ensuring it remains vibrant amid the tide of modernization. The national spirit will forever be the foundation of our statehood."
PLS_In_collaboration_with_Hashem:0 "Collaboration with the Hashemites"
PLS_In_collaboration_with_Hashem_desc:0 "The Hashemite family still holds deep influence in the Syrian region. Even without their crowns, their sacred aura as guardians of the faith remains. If we can secure their public support, it will greatly enhance our prestige in the Arab world. Consider collaborating on religious affairs, appointing their members as custodians of holy sites, to trade for their political endorsement."
PLS_Against_colonialism:0 "Against Colonialism"
PLS_Against_colonialism_desc:0 "Colonialism is a yoke around the necks of Muslims. Independence movements from Egypt to Iraq prove that anti-imperialist struggle requires united national resistance. We call on Muslims worldwide to unite, share experiences in struggle, and coordinate resistance actions. Only by forming a united front can we utterly shatter the colonialists' divide-and-conquer schemes. Long live the Arab soldiers!"
PLS_The_Reform_Party_wins:0 "Reform Party Wins"
PLS_The_Reform_Party_wins_desc:0 "The Palestinian Reform Party focuses on improving people's livelihoods, advocating for grassroots autonomy and a social welfare system. They promise to expand rural clinics, guarantee orphan care, and establish vocational training centers. These practical policies aimed at enhancing people's lives have gained widespread support, particularly forming strong influence among urban workers and artisans, making them a key force in parliament."
PLS_Promote_progressive_taxation:0 "Promote Progressive Taxation"
PLS_Promote_progressive_taxation_desc:0 "In Palestinian towns, the wealthy live in mansions while the poor huddle in shacks. This stark contrast must change. We plan to implement a progressive tax system based on European social democratic policies: imposing a thirty percent income tax on annual earnings exceeding five thousand pounds, while abolishing sales tax on necessities like bread, to make wealth distribution fairer."
PLS_land_reform:0 "Land Reform"
PLS_land_reform_desc:0 "Land reform is imperative, even if it offends the landlord class that supports the regime. The current phenomenon of large landowners enclosing fertile land while leaving it fallow is severe. We plan to legislate a land ceiling of two hundred dunams per household; excess land will be compulsorily purchased by the state and redistributed to landless peasants. This reform will fundamentally liberate constrained agricultural productivity; it is our duty to enable the people to live happy lives."
PLS_Liberalization_reforms:0 "Liberalization Reforms"
PLS_Liberalization_reforms_desc:0 "We advocate for limited liberalization reforms: removing price controls in the market sphere to allow private enterprise development; safeguarding citizens' legal right to assembly; legislating the sacred inviolability of private property. But all reforms must be grounded in Arab cultural traditions, never blindly copying Western value systems. Palestine will carve its own path to modernization."
PLS_Secularization_attempts:0 "Secularization Attempts"
PLS_Secularization_attempts_desc:0 "Countless intellectuals aspire to establish a modern state with separation of mosque and state. We share this vision—Muslim identity is a matter of spiritual faith, not a code of governance. Every aspect of daily life cannot forever follow the norms of the seventh century. Allah endowed humans with reason precisely so that we can use wisdom to establish social systems suited to our times; we must not remain trapped in the past."
PLS_Maintain_an_anti_Zion_stance:0 "Maintain an Anti-Zion Stance"
PLS_Maintain_an_anti_Zion_stance_desc:0 "The root of imperialist evil lies with the Jewish financial groups. Bankers in London and Paris manipulate colonial policy; Wall Street financiers support the Zionist movement. They are the real culprits plundering Arab wealth. Resisting colonialism must directly target these Jewish financial oligarchs controlling international capital. Only when all Zionists, imperialists, and colonists disappear will the world know peace and stability."
PLS_Real_commitment:0 "Real Commitment"
PLS_Real_commitment_desc:0 "Politicians always talk too much and do too little. But the core criterion for evaluating a party or politician is whether they can fulfill their promises. If politicians' promises are merely a means to an end, they will inevitably be scorned by the people. Politicians who genuinely think for the people are not judged by what they say, but by what they concretely do."
PLS_The_guidance_of_socialism:0 "The Guidance of Socialism"
PLS_The_guidance_of_socialism_desc:0 "Our working class and socialists united and fought, finally crushing the reactionary forces obstructing progress. This is not just a military victory, but a turning point. We pledge to reshape Palestine with socialist principles, returning land and the means of production to the laborers, so that workers and peasants share the fruits of national development. Reality demands we lead reforms, sweep away the old exploitative system, and build the foundation for a just society. The people will witness the dawn of a new era."
PLS_Follow_Syndicate_International:0 "Follow the Syndicalist International"
PLS_Follow_Syndicate_International_desc:0 "Palestinian industry started late; workers are not yet capable of forming large guilds. But this is not a dead end: implementing a syndicalist model can change the situation. Workers managing factories themselves will increase efficiency and also make it easier to attract support from the Syndicalist International. They favor self-reliant labor movements, opening international pathways for Palestine. We promote worker cooperation, gradually expanding organization scale, enabling domestic industry to take root."
PLS_Islamic_socialism:0 "Islamic Socialism"
PLS_Islamic_socialism_desc:0 "Some constantly propose the concept of Islamic socialism, but radical socialists attack it as backward. We should take a realistic view: Islamic culture inherently advocates fairness and justice; integrating it into policy can win popular recognition. In a predominantly Muslim society, this combination reduces resistance to reforms. We don't need to deny tradition; utilizing its strengths advances the socialist agenda, uniting the people under a common goal."
PLS_Integrate_the_education_system:0 "Integrate the Existing Education System"
PLS_Integrate_the_education_system_desc:0 "The current Islamic-based education system is far less advanced than the European model. But it is the only available resource; we should reform it pragmatically rather than abandon it. Gradually incorporate socialist content, cultivating a new generation with civic ideals: emphasizing equal labor and collective responsibility. This transition requires patience, making education serve the needs of the nation, not perpetuate conservative customs. We ensure it becomes a tool for progress."
PLS_Workers_are_self_managed:0 "Worker Self-Management"
PLS_Workers_are_self_managed_desc:0 "The core of syndicalism is worker self-management. Workers are inherently capable of organizing themselves without external commands. We emphasize workers leading workers: their frontline experience enables efficient decision-making. This principle has proven effective in Palestine; workers handling their own affairs reduces costs and boosts solidarity. Respecting worker autonomy is the cornerstone of national prosperity."
PLS_Civic_cognition:0 "Civic Cognition"
PLS_Civic_cognition_desc:0 "Political change doesn't come through force, but through the awakening of public consciousness. Once workers understand that labor creates value for themselves, not for others to exploit, they will work harder. If they know they are the masters of the nation, they will actively participate in politics. We promote education in communities to awaken the people, letting conscious action dispel ignorance. Stability born of awakening is better than ten thousand decrees."
PLS_Remembrance_of_the_martyrs:0 "Remembrance of the Martyrs"
PLS_Remembrance_of_the_martyrs_desc:0 "The sacrifice of martyrs is the spiritual pillar of the socialist revolution. We should hold frequent commemorations, internalizing their heroic deeds as revolutionary strength. Each story inspires, urging us forward during difficult times. This is not empty talk, but incorporating the lessons of bloodshed into our struggle. We remember them, transforming spirit into action, ensuring the flame of revolution never extinguishes."
PLS_Revolutionary_mobilization:0 "Revolutionary Mobilization"
PLS_Revolutionary_mobilization_desc:0 "The nation currently faces an existential crisis; this special moment demands extraordinary measures. Perhaps we need to shed sweat and blood, but it is to ensure future generations are forever free from suffering. We accept short-term pain for long-term peace. Practitioners understand: forging ahead through difficult choices is the only way to protect descendants. Let every drop of sweat water the soil of security, so future generations never weep for war."
PLS_The_figure_of_Lenin:0 "The Figure of Lenin"
PLS_The_figure_of_Lenin_desc:0 "Lenin's attempt didn't succeed in Russia, but his ideas still live in our hearts. His writings illuminated the path of industrialization and secularization, pointing the way for Palestine. We learn lessons, promoting advanced ideas in line with local realities. The wisdom in these pages teaches us to avoid past mistakes, building a scientific social system. Despite adversity, we insist on rooting modern thought to lead the nation out of ignorance."
PLS_Congress_system:0 "Congress System"
PLS_Congress_system_desc:0 "If left solely to the people's self-determination, the outcome is often the election of mullahs, sheikhs, or imams representing ignorance. Palestine lacks the soil for direct democracy; a congress system is indispensable. Representatives can make rational decisions, pooling wisdom to face challenges. We uphold this system to avoid chaos and disorder. Reality tells us: the collective will needs guidance, not unbridled freedom."
PLS_Full_centralization:0 "Full Centralization"
PLS_Full_centralization_desc:0 "Palestine's environment is harsher than Russia's, making the Vanguard system even more necessary. We cannot let the people live autonomously in ignorance; they must be restrained by institutional laws in the name of progress. The Vanguard leads in educating the masses, eliminating backward thinking. Under difficult conditions, external guidance can awaken consciousness faster. Our goal is clear: gradually raise social standards, never sacrificing order for freedom."
PLS_Downplay_religious_influences:0 "Downplay Religious Influences"
PLS_Downplay_religious_influences_desc:0 "Islam is often seen as a symbol of reaction and backwardness; we must eventually eradicate it. But change cannot be rushed: first cultivate a new ethos through social movements, gradually diluting its influence. Radical upheaval easily provokes backlash. We take practical steps, prioritizing education to transform minds. Time will prove that steadfast yet gradual reform is the most reliable."
PLS_compulsory_education:0 "Compulsory Education"
PLS_compulsory_education_desc:0 "The existing education system breeds Wahhabi and Salafi conservative forces; this fortress must be destroyed. We establish a state-controlled, secular compulsory education system: unified curriculum promoting scientific socialism, replacing religious indoctrination. The new system can cultivate modernized citizens, securing the nation's future. This is not just reform; it is a complete upheaval of thought and institutions. We vow to accomplish this goal."
PLS_Create_community:0 "Create Community"
PLS_Create_community_desc:0 "Arab and Muslim identities are illusory; the real bonds are economy, customs, culture, and language. Palestine's connection to other Arab regions stems from anti-imperialist struggle, not blood or genes. Shared experiences of oppression unite us, creating actual solidarity. We strengthen this foundation to promote unity, emphasizing liberation movements over hollow identity politics."
PLS_Arabization:0 "Promote Arabization"
PLS_Arabization_desc:0 "Arabs must understand their identity, the meaning of their labor and struggle. Knowing why they strive is key to achieving unity. We awaken self-awareness through education: every worker tilling the land or soldier fighting does so for the collective future of freedom. When awareness spreads, solidarity will naturally emerge. Let the people understand the goal, and they will unite as one, propelling the nation forward."
PLS_Proclamation_of_Palestine:0 "Proclamation of Palestine"
PLS_Proclamation_of_Palestine_desc:0 "Through arduous struggle, we have reshaped the foundations of Palestine. Socialist principles and revolutionary faith have forged a new steely will for the Palestinian Arabs. Now, the outline of the new state is clear, but some counter-currents remain unwilling to accept defeat. We must resolutely remove these final obstacles, clear the path for the new order, and ensure the fruits of the revolution are not stolen."
PLS_Dismantle_the_Muslim_Brotherhood:0 "Dismantle the Muslim Brotherhood Organization"
PLS_Dismantle_the_Muslim_Brotherhood_desc:0 "The Muslim Brotherhood lurks in the shadows like a viper; their only plot is to subvert our socialist regime, watered by the sweat and blood of workers and peasants. The fantasy of coexisting with them is an extremely dangerous illusion. The cornerstone of regime stability is to thoroughly eradicate their network, uprooting every stronghold, rendering their schemes utterly bankrupt."
PLS_Incorporate_the_Jihadist_Army:0 "Incorporate the Jihadist Army"
PLS_Incorporate_the_Jihadist_Army_desc:0 "Examining those engaged in so-called jihad, we need a clear-eyed realization: many are not fanatical religious believers. They are desperate children of Arab nationalism, forced by oppression to seek resistance. These people are not enemies; the government should actively win them over, making them reliable allies for national revival, fighting together against true internal and external oppressors."
PLS_Annexation_of_the_Mapai:0 "Annex Mapai"
PLS_Annexation_of_the_Mapai_desc:0 "The presence of Mapai in Palestine has become a symbol of disunity. On this land, the people have transcended outdated divisions of Jew or Arab; they are first and foremost Palestinians. Mapai must understand this historical tide, unconditionally submitting to our government's will, building the homeland under a new shared identity."
PLS_Banning_Jewish_military_organizations:0 "Ban Jewish Military Organizations"
PLS_Banning_Jewish_military_organizations_desc:0 "Lehi and Haganah exiles still glare from abroad; the shadow of past terror has never faded. They plot a comeback, aiming to re-enslave our liberated land. We swear by our lives not to let their poisonous schemes succeed. The wheel of history only moves forward; there shall be no reversal. Zionists who stubbornly resist deserve severe punishment."
PLS_The_heart_of_the_Arab_Revolution:0 "Heart of the Arab Revolution"
PLS_The_heart_of_the_Arab_Revolution_desc:0 "Palestine emerges amid the storm like a red star shining over the sea. But this is merely the start of a long journey. Our gaze has long surpassed our national borders, embracing the liberation ideal of the entire Arab nation. We will spread the flame of social revolution ignited here to all the lands of our Arab brethren, fundamentally changing their destiny."
PLS_Save_the_Revolution:0 "Third International Saves the Revolution"
PLS_Save_the_Revolution_desc:0 "Recent actions by the syndicalist government are deeply disappointing, especially the unprincipled concessions to conservative forces. This seriously betrays the original intent of the revolution and angers our Third International friends who came to our aid. We cannot stand idly by as Palestine slides back into the abyss of the rotten old system. To save the revolutionary spark and prevent a full restoration of Islamist conservatism, directly taking over and reorganizing the government is an urgent task."
PLS_Expand_the_advisory_authority:0 "Expand 'Advisory' Authority"
PLS_Expand_the_advisory_authority_desc:0 "Overturning the old system is only the first step of the revolution. Correcting past mistakes and recalibrating the nation's direction is our necessary responsibility. The key lies in optimizing the government structure itself, particularly by relying more heavily on the experience and guidance of French advisors. We must systematically purge the ranks of those wavering in thought and collaborating with the enemy."
PLS_French_advanced_experience:0 "French Advanced Experience"
PLS_French_advanced_experience_desc:0 "Practice has proven that over a decade of syndicalist governance experience by the French Commune is a valuable monument. Compared to Palestine's mere months of experimentation, their exploration is deeper, and the system formed is more mature. At this crucial moment for our social reforms, many proven specific policies and management models from the French Commune are essential to introduce to our country as a cornerstone for stabilizing power and enhancing efficiency."
PLS_Technological_indoctrination:0 "Technological Indoctrination"
PLS_Technological_indoctrination_desc:0 "The suffering inflicted by Palestine's backwardness is heartbreaking. Archaic ideas drag the people down like millstones, seemingly stuck outside the tide of modern times. National prosperity is inseparable from the spirit of science and civilized knowledge. We must spare no cost in propagating modern knowledge and secular ideas to all the populace, enlightening minds. Otherwise, this land will forever be repeatedly duped by theocrats like Husseini."
PLS_The_mission_of_socialist_enlightenment:0 "Socialist 'Civilizing Mission'"
PLS_The_mission_of_socialist_enlightenment_desc:0 "The phrase 'Civilizing Mission' is often used by imperialists to justify aggression and colonialism. But there is a grain of truth to it. Allowing impoverished backward regions to develop freely condemns them to eternal backwardness, trapped in ignorance and folly. Freeing the Palestinians from this vicious cycle is the mission of the French."
PLS_Total_control:0 "Total Control"
PLS_Total_control_desc:0 "Power, like a weapon, is a hazard in unreliable hands. Any relaxation of control, intentional or not, provides breathing space and gathering ground for reactionaries. Ultimately, it is the stability of the regime itself that is shaken. A seamless system of government control covering all public affairs must be established to prevent the breeding environment for malignant tumors, ensuring the revolution's health."
PLS_No_more_jihad:0 "No More 'Jihad'"
PLS_No_more_jihad_desc:0 "Jihad is the remnant of old Islamism. Instead of jihad, we hope people will cherish their own lives and invest their limited value into national development and construction. Living is more useful than dying. We must teach the Arab people to abandon the jihad mentality and embrace a more moderate spirit of devotion. The first step in doing this is to eradicate reactionary religious elements hiding in the dark corners."
PLS_Paris_took_over_in_full:0 "Paris Takes Over in Full"
PLS_Paris_took_over_in_full_desc:0 "The Palestinian government is completely incapable of functioning without France. Advisors are French, standards implemented are French, technology used is French. Why not tear off this last veil now? Declare that the French Commune advisors formally take over the Palestinian government; this will bring greater convenience to our subsequent work."
PLS_Wear_white_gloves:0 "Wear White Gloves"
PLS_Wear_white_gloves_desc:0 "The assistance of the French Commune is undoubtedly vital, but the nature of our relationship must be clearly defined. Palestine is not a dependency, nor can it ever become a capitalist appendage like Algiers or Ottawa. Our core mission here remains constant: to borrow the necessary external forces to overcome the current revolutionary difficulties, ultimately guiding Palestine to rely on its own strength and walk the healthy path of syndicalism."
PLS_Coup_by_Officers:0 "Coup by Officers"
PLS_Coup_by_Officers_desc:0 "We, the young officers, can no longer tolerate cowards stealing the fruits of the Palestinian uprising. They reap the rewards but weaken the nation. Therefore, we resolutely led the army in an armed rebellion, crushing the government troops with iron will. Victory belongs to us, for we are men of action, not empty talkers. Now, we must reshape Palestine based on totalism and militarism, forging iron discipline and state authority. History will witness that only a powerful system can guarantee national security and prosperity."
PLS_Cultural_openness_policy:0 "Cultural Openness Policy"
PLS_Cultural_openness_policy_desc:0 "Arabs should draw nourishment from the manic enthusiasm and meticulous thinking of modern Western thinkers, who conceived countless methods for saving nations and peoples. But we do not blindly follow; instead, we selectively absorb their essence to refine and transform the Arab national spirit. This spirit-forging is the cornerstone of national progress; we make it more resilient and suited to Palestine's realities. Only by improving foreign ideas can we enhance our strength to face challenges and forge a brighter future."
PLS_Reinterpreting_the_Quran:0 "Reinterpreting the Quran"
PLS_Reinterpreting_the_Quran_desc:0 "The prattle of infidels holds no value for Arab history; it is futile exertion. We have our own glorious tradition; the Quran and Sunnah have long illuminated the path for national revival and Islamic revival. This is the guide granted by Allah; we must firmly follow it, not letting foreign fallacies disturb our faith. The Arab people's path lies in the sacred texts, not the empty talk of infidels. Relying on this, we can revitalize the nation and march towards prosperity."
PLS_Cut_the_influence_of_the_Great_Mufti:0 "Cut the Influence of the Grand Mufti"
PLS_Cut_the_influence_of_the_Great_Mufti_desc:0 "We acknowledge the Grand Mufti was once a revolutionary ally, but his conservative cultural attitude increasingly hinders progress. This old-fashioned tendency binds ideological development and is detrimental to social transformation. Therefore, we must reduce his power and that of his supporters within the government, preventing old forces from dragging down the revolution. Action must be decisive; through policy adjustments, we ensure a balance of power. This protects the forward direction, freeing Palestine from immersion in outdated ideas and achieving true national awakening."
PLS_Absorption_of_Arab_parties:0 "Absorb Arab Parties"
PLS_Absorption_of_Arab_parties_desc:0 "The Grand Mufti is and always has been a hero of the Arab and Islamic worlds; he is indispensable in the past, present, and future. He represents the bond of faith and national unity and will continue to serve in government as a bridge between Palestine and the broader Arab and Islamic worlds. The hero's continued service strengthens internal cohesion to face external challenges. We forever honor his contributions; his presence is a pillar of revolutionary stability, guiding us to uphold sacred traditions while integrating modernity."
PLS_Solidarity_with_the_struggle:0 "Solidarity with the International Anti-Imperialist Struggle"
PLS_Solidarity_with_the_struggle_desc:0 "The core of our movement is an international perspective; it is not limited to breaking the chains of imperialism in Palestine alone. We must fully support the global anti-imperialist struggle. Thwarting the schemes of Zionists is a collective responsibility, as is aiding liberation movements of oppressed peoples elsewhere. Only through unity can we end external intervention and expand Arab influence. History proves that isolated actions fail; only a united front can defend justice and crush all foreign enemies' plots."
PLS_Establishment_of_the_Free_Arab_Legion:0 "Establish the Free Arab Legion"
PLS_Establishment_of_the_Free_Arab_Legion_desc:0 "Arab blood flows only for Arabs; independence and freedom are our sole goals. Therefore, we unconditionally support armed uprisings and non-violent resistance movements across the Arab region. Whether guns or pens, all serve the cause of national liberation. A unified goal unites dispersed forces, warding off the threat of division. Sacrifice in blood proves loyalty; we will make no compromise, ensuring the fire of freedom burns in every corner. This is the true Arab awakening."
PLS_Nationalist_marquee:0 "Nationalist Marquee"
PLS_Nationalist_marquee_desc:0 "The nationalist officers' group should not directly lead other organizations but function within them to coordinate and guide. This encourages proactive innovation, avoiding a rigid, stagnant structure. Stimulating vitality across groups through collaboration fosters a more enterprising national spirit. Direct control only stifles energy; coordination is the engine of progress. We adhere to this principle to ensure the government mechanism is flexible and powerful, propelling Palestine toward a dynamic future."
PLS_The_absolute_leadership_of_young_officers:0 "Absolute Leadership of Young Officers"
PLS_The_absolute_leadership_of_young_officers_desc:0 "Our officers' group seized power in Palestine entirely by its own sweat and blood; the fruits of struggle cannot be stolen by inscrutable theorists. These people try to negate our actual sacrifices with empty talk; we defend our authority with action. The achievement is a revolutionary crystallization, never to be ceded to foreign pedants. Defending power is a national responsibility, ensuring the country remains free from unnecessary interference, consolidating the fruits of victory in the people's hands."
PLS_The_guidelines_of_the_totalist_charter:0 "Guidelines of the Totalist Charter"
PLS_The_guidelines_of_the_totalist_charter_desc:0 "Totalism demands a new social architecture and cultural orientation, distinct from old systems. We should learn from and borrow the essence of the Totalist Charter to innovate the national character. This is not blind transplantation but change adapted to Palestinian soil. Innovation enhances discipline and efficiency to face modern challenges. The metamorphosis of the national character is key to strengthening the nation; we focus on this, making the national spirit more resilient and keeping pace with the times."
PLS_Maintain_the_military_and_political_system:0 "Maintain the Military-Political System"
PLS_Maintain_the_military_and_political_system_desc:0 "The military-political system centers on the military, characterized by military strongmen concurrently holding political leadership positions, exhibiting a high degree of centralization and aggressive nationalism. This architecture ensures swift decision-making and efficient execution, channeling national fervor into resolute action. Centralization strengthens control, injecting stability into turbulent times. Nationalism inspires unity against external threats, protecting national interests. We implement this system to solidify Palestine's foundations."
PLS_Revolution_at_sea:0 "Revolution at Sea"
PLS_Revolution_at_sea_desc:0 "Our revolutionary faction of young officers has full control; our will to act is resolute. We will embody the ideals of Valois and Mussolini, spreading the national revolution across the entire Arab world. This is not just a domestic uprising but a spark igniting regional change. The revolutionary spirit must spread, breaking historical shackles. United, we end external oppression; this is the unstoppable wave of the Arab awakening."
PLS_Subvert_the_system_of_power:0 "Subvert the Power System"
PLS_Subvert_the_system_of_power_desc:0 "Youth are naturally energetic, easily mobilized, and eager for change; they are the natural reserve army for revolutionary movements. We need to organize them, transforming them into a reliable force. Through training and mobilization, channel youthful potential into concrete struggle. Lack of organization leads to scattered energy; orderly integration forges our cadres. Thus, youth become the engine of national renewal, propelling Palestine towards rebirth."
PLS_Cultural_Revolution:0 "Cultural Revolution"
PLS_Cultural_Revolution_desc:0 "The media's potential is immense; we will proliferate radios and newspapers throughout Palestine. Use these mediums to broadcast programs and reports promoting the unity of Islam and the national revolution, educating the public towards ideological unity. Media proliferation expands information reach; carefully crafted content disseminates our values. This strengthens internal unity against divisive rhetoric. Media is a mobilization tool, helping to forge revolutionary consensus and serve the nation's grand strategy."
PLS_The_Youth_League_was_formed:0 "Form the Youth League"
PLS_The_Youth_League_was_formed_desc:0 "The power system intertwined with Islam has become a fundamental obstacle to policy implementation. To advance the national revolution, the mullahs and muftis must relinquish their secular power. Their meddling in governance slows reforms; they should focus solely on purely religious guidance. Action is urgent; clearing the obstacles ensures government decisions proceed unimpeded. Power returned to the people and institutions, ensuring the revolution doesn't stall due to old-style interference."
PLS_Hello_Arabs:0 "Hello! Arabs!"
PLS_Hello_Arabs_desc:0 "Futurism, revered by European totalists for its worship of speed, violence, and steel, is also what we must practice. This ideology expresses the national enterprising spirit and industrial dynamism, aligning with Palestine's revolutionary vision. Venerating these elements can invigorate the national character and drive industrial leaps. Steel symbolizes fortitude, violence confronts oppression, speed propels progress. Only Futurism can unleash the nation's vitality."
PLS_Continue_to_march:0 "Continue the Advance"
PLS_Continue_to_march_desc:0 "The militarist faction of young officers has won dominance within the alliance. The swords of the Arab nation will tangibly serve public needs: developing water sources and land, bringing vitality to farmers and workers. This is not an empty slogan but change based on concrete action. Leveraging military strength, we directly address survival issues like irrigating fields and reclaiming wasteland, enhancing people's livelihoods. This demonstrates the practical value of militarism, consolidating the independence basis of Palestine, making national revival tangible and real."
PLS_Commissar_of_the_army:0 "Army Commissars"
PLS_Commissar_of_the_army_desc:0 "Socialist Red Armies or Savinkov's forces implemented a strict system of embedded political commissars. This significantly elevates soldier quality, unlike our current militants who rely solely on zeal. Facing a lack of discipline in the ranks, we must implement a similar system to rein them in. This will strengthen training and political education, translating into effective combat power. Implementing the system ensures Palestinian forces transform from disorder, adapting to modern warfare needs, serving the cause of national liberation."
PLS_Gunfire_solo:0 "Gunfire Solo"
PLS_Gunfire_solo_desc:0 "Against enemy-entrenched areas, we plan to form special units from the most resolute fighters, sending them behind enemy lines to operate. These fighters, while not regular army, excel at using simple weapons and ordinary means to create confusion and sow panic among the enemy populace. Such chaos will demoralize the adversary, weakening their resolve to resist, creating favorable conditions for our advance on the main front. This tactic, low-cost yet effective, efficiently undermines enemy confidence, accelerating our process of gaining initiative across Palestine."
PLS_Secret_Police_Department:0 "Establish Secret Police Department"
PLS_Secret_Police_Department_desc:0 "We must clearly recognize that colonial agents never cease plotting to subvert our regime: they arm themselves with guns imported by foreign capital, and worse, poison the people's minds with foreign ideologies! Permitting such infiltration will corrode the revolution's foundations. Therefore, we must establish a strict ideological defense mechanism. This isn't just censorship; it is enabling the people to spontaneously resist fallacies through education and propaganda. Safeguarding revolutionary achievements begins by monitoring every newspaper; never let the enemy exploit 'freedom of speech' to undermine the order we built with our own hands."
PLS_Jewish_capital_conspiracy_theories:0 "Propagate Jewish Capital Conspiracy"
PLS_Jewish_capital_conspiracy_theories_desc:0 "Jews manipulate the world economy and politics through secret control of financial institutions, media, or other power structures to eliminate nation-states and replace native rule with Jewish dominance. Our victory over Israel severely dented their confidence, but the Jews remain active abroad. We cannot let our guard down; we must show no mercy to the Jews. Mercy to the enemy is cruelty to our compatriots."
PLS_Reorganization_of_the_NLF:0 "Reorganize the NLF"
PLS_Reorganization_of_the_NLF_desc:0 "Socialists call themselves the National Liberation Front, but this is an empty title; we are the true fighters representing the Arab nation. They are weak and incompetent, only skilled at empty talk, while we are rooted in popular struggle, defending the national will through action. Therefore, we will reclaim this name, giving it new life, resurrecting it from dead parties. This is not merely renaming; it is a symbol of national revival, asserting the authority and determination of our leadership to lead Palestine toward unity and independence."
PLS_Support_the_Baathists:0 "Woo the Baathists"
PLS_Support_the_Baathists_desc:0 "Baathism is an active ideology in Greater Syria; the Baath Movement draws vast numbers of intellectuals and workers to their side, threatening our regime's stability. The Arab National Liberation Front will woo the right wing of the Baathists, integrating them, thereby gaining full control over Baathist thought. Dividing them and then crushing them one by one is what we excel at."
PLS_Dialogue_with_Egypt:0 "Dialogue with Egypt"
PLS_Dialogue_with_Egypt_desc:0 "In Egypt, there exists a secret society of young officers who share our ideals; they are steadfast allies in the anti-imperialist struggle. We can help them develop strength through covert support, sharing resources and strategies. This is not just aid; it embodies the spirit of Arab unity, strengthening pan-Arab bonds. Long live unity! It will advance the liberation cause across the region, forging a solid foundation for cooperation in our common struggle against external oppression."
PLS_Unite_the_national_communists:0 "Unite National Communists"
PLS_Unite_the_national_communists_desc:0 "National Communists, as allies, hold moderate nationalist sentiments, unlike radical extremists. By wooing them, we can weaken the influence of 'moderate' socialists. The latter, with their compromising posture, always obstruct policy implementation, while National Communists can provide practical assistance. Through cooperation, we will crack down on these disruptive elements, ensuring policies are not distorted. This consolidates forces, clearing internal obstacles for Palestinian national independence."
PLS_Integrate_the_Jihadist_Army:0 "Integrate the Jihadist Army"
PLS_Integrate_the_Jihadist_Army_desc:0 "The Jihadist Army is led by the Husseini family, notorious for radical Islamism and nationalist fervor. Due to the shared goal of national independence, they must cooperate with us; otherwise, we will be forced to take coercive measures to eliminate the threat. Cooperation can avoid civil war draining resources, but we will not tolerate separatist actions. This defends the unified cause, preventing Palestine from becoming vulnerable due to internal strife, ensuring all serve the mission of Arab independence."
PLS_But_dont_forget_who_we_are:0 "But Don't Forget Who We Are"
PLS_But_dont_forget_who_we_are_desc:0 "Jews, multinational financial cliques, and imperialist armies are our eternal enemies! Other factions within the National Liberation Front may not agree with our methods of struggle, but we must adhere to the plan. Only this path is worthy of the Arab nation's spirit and sacrifice. These enemies threaten our very existence; compromise leads only to failure. We press on, guarding national dignity with an iron fist, driving Palestine toward complete liberation from the shackles of subjugation."
PLS_economic_recovery:0 "Economic Recovery"
PLS_economic_recovery_desc:0 "A healthy economy is fundamental to the nation's functioning, but war has shattered ours into pieces. Factories idle, trade interrupted, people's livelihoods in trouble. Restoring the economy becomes the Palestinian government's top priority; we must act immediately to revive industry, stabilize prices, and ensure the people's basic needs. This is not just for immediate survival but for the long-term renaissance of the nation. We will mobilize all resources to return the economy to normal."
PLS_Leveling_the_land:0 "Leveling the Land"
PLS_Leveling_the_land_desc:0 "Our fields are strewn with bullet casings, bomb craters, and fragments of bunkers; seeds have nowhere to grow. If the land issue isn't resolved, the shadow of famine will loom over the entire nation. We must clear away the scars of war and restore the vitality of arable land. The government will organize cleanup operations, provide seeds and tools, helping farmers return to cultivation. Time is of the essence; we must work together to avoid disaster and let the land bear hope once more."
PLS_Restore_infrastructure:0 "Restore Infrastructure"
PLS_Restore_infrastructure_desc:0 "Arabs and Jews destroyed wells, roads, and other infrastructure during the war. Now that the guns have fallen silent, we must repair these lifelines. The government will initiate reconstruction projects, prioritizing the restoration of wells and roads to ensure people can return to normal life. This is not just for utility, but to heal divisions and bring back social harmony. We will work hand in hand to bring livelihoods back on track as soon as possible."
PLS_Reopening_of_the_factory:0 "Reopen Factories"
PLS_Reopening_of_the_factory_desc:0 "During the war, capitalists fled, leaving numerous abandoned factories. These assets are precious national resources; we cannot let them lie fallow. We can operate them in the government's name or sell them to Arab capitalists to invigorate the economy. The government will assess the value of each factory and devise sound plans to ensure assets are utilized effectively, injecting vitality into the recovery and creating jobs."
PLS_Clean_up_the_mess:0 "Clean Up the Mess"
PLS_Clean_up_the_mess_desc:0 "The Ottomans may have once genuinely harbored ambitions for Islamic revival, intending to seriously develop Palestine, but only left behind unfinished projects that consumed resources without practical benefit. Now, we must prudently decide: continue investing to complete them, or abandon them in favor of new plans? The government will organize expert investigations, weigh the pros and cons, and make choices best aligned with national interest, avoiding past mistakes and ensuring every penny is well spent."
PLS_Economic_development_strategy:0 "Economic Development Strategy"
PLS_Economic_development_strategy_desc:0 "The ruling party will comprehensively reform the Palestinian economy according to our ideology. We plan to restructure industry, support local enterprises, and improve people's livelihood facilities. Reform is not empty talk but concrete action aimed at healing the wounds of war and building a sustainable future. We will listen to the people's voice, make scientific decisions, ensure a smooth economic transition, and lay a solid foundation for the nation."
PLS_Will_wins:0 "Will Wins"
PLS_Will_wins_desc:0 "Faith, ideology, blood, and sweat—these are the true sources of power for national revival. We cannot rely on empty promises; we must build every factory and cultivate every field with the zeal and devotion of Palestine's children to fortify the path to rebirth. The hum of every factory is proof of faith; every drop of sweat waters the nation's future. From Jerusalem's streets to rural soil, let us unite to turn dreams into reality. This will be a long struggle, but only by persevering can we usher in a truly prosperous era. Revival does not belong to a few but is the shared mission of all the people; let zeal lead us forward."
PLS_Introduction_of_the_corporation_system:0 "Corporatist State System"
PLS_Introduction_of_the_corporation_system_desc:0 "National unity is the prerequisite for national revival. We will implement a corporatist system in Palestine, intimately linking it with the Arab nation's reality. Specifically, we will establish collaborative bodies for industries and labor, promoting mutual support among classes and eliminating social chaos. From workshops to farms, every collective maintains order through shared decision-making. This ensures productivity and avoids needless internal conflict. Our goal is to make the corporatist system a sturdy bridge connecting the strengths of different strata. No discord will hinder us; the people united, one heart, only then is revival not an illusion."
PLS_Militarization_of_the_economy:0 "Militarize the Economy"
PLS_Militarization_of_the_economy_desc:0 "War could break out again at any time. Palestine's economy must orient around heavy industry. At present, our people can barely be armed, while potential enemies are capable—this poses a deadly threat! Therefore, we must prioritize developing steel plants and military industry, ensuring everyone can defend their homeland in war. Delay means danger; every resource must be poured into arms production and infrastructure. Starting today, factories become our frontlines; with an iron will, they support the nation's spine. This is not a choice but a necessity for survival."
PLS_Develop_a_five_year_plan:0 "Develop a Five-Year Plan"
PLS_Develop_a_five_year_plan_desc:0 "We will formulate a detailed economic plan, clearly defining key investments in defense and critical industrial projects over the next five years, increasing financial support, striving to narrow the technological gap with foreign nations within a short period. Specifically, we will establish special funds to prioritize supporting oil refineries and arms production lines, avoiding failures caused by dispersed funding. Every factory's progress is strictly monitored from planning to production start, ensuring high-efficiency completion. The goal is not idealistic talk but tangible, measurable progress. Time is pressing; plan execution must be precise, ensuring that in five years, Palestine lags no longer in key domains."
PLS_Pooling_national_resources:0 "Pool National Resources"
PLS_Pooling_national_resources_desc:0 "Resource nationalization is a necessary decision. If capitalists arbitrarily hoard grain and minerals, our people might starve or die in war for lack of guns and bullets. Therefore, the state will take control of all key resources, establishing a unified reserve system guaranteeing uninterrupted wartime supply. Every grain of wheat, every piece of ore is allocated by the central government, eliminating selfish profiteering. This is not suppressing freedom but ensuring survival. Resources must serve all the people, not become the wealth source for a few. Only by tight control can we avoid famine and collapse."
PLS_Industrial_leap_forward:0 "Industrial Leap Forward"
PLS_Industrial_leap_forward_desc:0 "Whether reforming the economic system or formulating plans, our sole goal is to accelerate the enhancement of Palestine's industrial strength, laying a solid foundation for military expansion and economic development. From defense to civilian industries, we must focus on expanding production capacity, making industrial strength drive overall revival. Every reform must serve this core: increase steel output, strengthen technical training. The aim is not fleeting success but lasting self-sufficiency. Let us act immediately, transforming theory into practice; industrial progress is the only path to revival."
PLS_Socialist_transformation:0 "Socialist Transformation"
PLS_Socialist_transformation_desc:0 "The core of a socialist economy is eliminating or transforming the bourgeoisie, abolishing private ownership, and implementing state or collective ownership instead, while reducing blind competition risk through economic planning. In Palestine, we will nationalize factories and mines, establish a robust planning system, reducing unemployment and turbulence. The economy is no longer manipulated by capitalists but driven jointly by the masses. This not only alleviates economic crises but also ensures social equity. The transition, though difficult, is the necessary path to lasting stability. Systemic change is not fantasy but a practical need."
PLS_The_communist_model:0 "Communist Model"
PLS_The_communist_model_desc:0 "Communism advocates establishing a public ownership economy through proletarian revolution, employing a central planning system where the state uniformly regulates production, distribution, and consumption, enhancing efficiency while prioritizing the elimination of exploitation and social inequality. In Palestine's practice, we will let collective decision-making dominate the economy, ensuring every labor result is fairly distributed. The state regulates production quotas, eliminating waste and corruption. This is not just an economic method but a moral awakening: eliminating class divides, granting all laborers equal dignity. The essence of revolution lies in practice; we are committed to it."
PLS_The_syndicalist_model:0 "Syndicalist Model"
PLS_The_syndicalist_model_desc:0 "Syndicalism emphasizes worker-controlled means of production through unions or workers' collectives, managing the economy through industrial self-governance and union federations, opposing state centralism and promoting grassroots democracy. In Palestine, we will encourage workers to form federations, letting every factory autonomously decide production plans, reducing bureaucratic intervention. The economy is driven from the bottom up, not top-down control, enhancing fairness and flexibility. Industrial solidarity is key; resources are coordinated through unions, ensuring management serves workers. System design seeks not perfection but feasibility."
PLS_Nationalization_of_land:0 "Nationalization of Land"
PLS_Nationalization_of_land_desc:0 "We will legislate or coerce the transfer of private land to collective public ownership, immediately eradicating the landlord class. Land will be uniformly planned, managed, and distributed by the central government. Action cannot wait; delay perpetuates exploitation. Every plot will be reassigned based on national needs, prioritized for food production and military construction. Eliminating the landlord class is not revenge but just reconstruction. Henceforth, land serves the collective, not privileged minorities. Ensure transparency during implementation to avoid power abuse. Reform is the foundation of national survival."
PLS_Socialization_of_the_land:0 "Socialization of the Land"
PLS_Socialization_of_the_land_desc:0 "Land ownership will be vested in collectives or communities, with individuals retaining only usage rights. This design ensures fairness, preventing individual monopolization and resource inequality. Every village or urban community will form management groups responsible for land allocation and supervision. Usage rights are granted to diligent workers to encourage productivity. This is not dispossession but a progressive arrangement: communities share resources, reducing internal conflict. From desert to oasis, let land become a bond of unity. The system is practical and efficient, ensuring lasting stability."
PLS_Promoshin_Ben_Kuperatifs:0 "Promote Cooperatives"
PLS_Promoshin_Ben_Kuperatifs_desc:0 "We will implement land reform, ensuring that those who till the land own it ('land to the tiller'), then encourage peasants to voluntarily join forces to establish cooperatives, supporting technology sharing and moving towards common prosperity. Specific steps are: first distribute land to landless peasants, then provide tools and training to promote collective production. Cooperatives exchange experiences, cooperate and help each other, reducing the rich-poor gap. This not only increases yields but also strengthens community bonds. Each step is voluntary, not compulsory. The goal of reform is balanced development, enabling every farmer to enjoy a dignified future. Common prosperity depends on action, not words."
PLS_Reducing_the_urban_rural_gap:0 "Reduce the Urban-Rural Gap"
PLS_Reducing_the_urban_rural_gap_desc:0 "The gap in living standards between Jerusalem's citizens and the desert tribesmen is vast. If we cannot bridge this chasm, our government can never call itself the people's government. Therefore, we must immediately implement fair distribution policies, improve facilities in remote areas, ensuring all Palestinians have access to basic resources. From water sources to education, every investment must specifically target reducing the gap. This is not charity but the government's responsibility. Survey public opinion, listen to tribal needs, implement practical aid. Only by eliminating injustice can true national integration be achieved."
PLS_Economy_under_Sharia:0 "Economy under Sharia"
PLS_Economy_under_Sharia_desc:0 "The Islamic economic system is comprehensive, defining the core of modern economic elements such as labor, lending, and taxation. Muslims seeking to improve their economy need only study the Quran. This sacred text not only covers all fundamental rules but also guides us in establishing systems for fair trade and equitable distribution. By practicing its principles, we will eliminate speculation and ensure every laborer receives their due share. This helps solidify social trust, prevents external interference in the economic system, and ultimately enhances the nation's overall strength and the people's welfare. We believe this ancient and wise system will lead us to prosperity."
PLS_Crack_down_on_hoarding:0 "Crack Down on Hoarding"
PLS_Crack_down_on_hoarding_desc:0 "Unlike the Red Bandits, we do not advocate eliminating capitalists, but we absolutely forbid them from resisting us. If any capitalist, learning from their foreign counterparts, hoards goods to amass wealth during famine, they will face severe sanctions with stones and whips. We emphasize that capitalists must submit to regulation to avoid greed. For instance, we will strengthen law enforcement, establish oversight bodies, and swiftly punish any exploitative violations. This approach stabilizes social order and incentivizes them to focus on legal operations, promoting economic growth. Remember, resistance means destruction."
PLS_Zakat_promotes_equality:0 "Zakat Promotes Equality"
PLS_Zakat_promotes_equality_desc:0 "Zakat is Islam's means of purifying wealth, obligating the rich to donate assets to the poor to achieve wealth redistribution, safeguard the needs of vulnerable groups, eliminate social exploitation, encourage resource sharing, and foster a sense of community. It promotes equality and unity from economic to spiritual levels. We will implement this mechanism, requiring every wealthy person to pay Zakat regularly, thereby alleviating the wealth gap. This not only eases the survival pressure on the underprivileged but also strengthens social cohesion. Through community oversight, we will ensure donations are fair and transparent, preventing fraud and ensuring wealth flows benefit all, creating a just and stable environment."
PLS_Zero_interest_rate:0 "Zero Interest Rate"
PLS_Zero_interest_rate_desc:0 "Islam prohibits interest-based systems, replacing loans with profit-sharing and leasing arrangements to prevent Jewish bankers from manipulating society. This method encourages shared risk and reward, avoiding financial speculation. For example, we will promote partnership models where lenders become shareholders, not creditors. This stimulates enterprise vitality and reduces debt crises. Consequently, the economic system becomes healthier, and wealth is no longer controlled by a few. We will strictly enforce this ban, ensuring every transaction is based on real value, not idle capital, keeping the nation free from financial turmoil."
PLS_The_social_obligation_of_the_mosque:0 "Social Obligation of the Mosque"
PLS_The_social_obligation_of_the_mosque_desc:0 "Mosques provide religious education, welfare assistance, and cultural exchange. By expanding their role in daily life, we deepen control at the grassroots level. Specifically, we will transform mosques into community centers, adding daily training and life support services. This not only consolidates public faith but also monitors social dynamics, preventing the spread of heretical ideas. For instance, holding regular gatherings and educational activities makes people more reliant on the system. We firmly believe this strategy strengthens our governance foundation, ensuring orderly social order and national stability."
PLS_Standardize_factory_discipline:0 "Standardize Factory Discipline"
PLS_Standardize_factory_discipline_desc:0 "Wealthy individuals disrespecting Allah play with rules and laws, forcing workers into overtime; this practice must cease. Labor deserves wages, overtime is forbidden, and prayer times must be observed. We will enact labor laws, severely punish offending factory owners, and set up patrols to monitor working hours. Protecting worker rights is paramount, such as setting minimum wages and rest periods to safeguard their livelihoods from exploitation. By combining religion and law, we cultivate workers' sense of dignity, reduce social discontent, and promote stable economic operation. Non-compliance will face harsh penalties."
PLS_Imitate_the_Western_world:0 "Imitate the Western World"
PLS_Imitate_the_Western_world_desc:0 "While liberal economies bring consequences like Black Mondays, they represent a mature path overall. We imitate the West to establish a market economy system with Arab characteristics. The focus is on introducing Western management experience while integrating local elements, avoiding blind application. For example, developing SMEs and private trade while maintaining government regulation. This sparks innovation, improves efficiency, and retains state control. We believe this balanced approach is more robust than old models, quickly restoring economic vitality and positioning Palestine ahead in regional competition."
PLS_Maintain_market_order:0 "Maintain Market Order"
PLS_Maintain_market_order_desc:0 "Suitable laws are prerequisites for a healthy society; socialists cannot arbitrarily pressure for welfare benefits, nor can capitalists endlessly oppress workers. We need to balance both sides, enact clear regulations protecting worker rights while limiting union power. Through negotiation mechanisms, we ensure capitalists provide reasonable benefits and workers do not abuse their demands. This creates a fair environment, boosts production efficiency, and reduces social conflict. We pledge that the legal framework will be strictly enforced to prevent extremism, laying a solid foundation for national construction."
PLS_Envoys_sent_to_various_countries:0 "Envoys Sent to Various Countries"
PLS_Envoys_sent_to_various_countries_desc:0 "We strive to establish diplomatic relations with more countries, conveying friendly messages to expand mutually beneficial markets. For instance, dispatching missions to negotiate with neighbors and distant partners, promoting trade agreements. This helps import scarce materials, export local products, and increase national revenue. We emphasize long-term cooperation over short-term gains, building a network of trust to make Palestine a regional hub. This process requires patience but strengthens economic resilience, ensuring security and prosperity for a win-win outcome."
PLS_Work_with_landlords:0 "Work with Landlords"
PLS_Work_with_landlords_desc:0 "Cooperating with landlords to encourage planting distinctive Arab cash crops for export can earn foreign exchange faster for importing advanced industrial equipment, while making them more supportive of the regime. We will provide seeds and technical support, focusing on crops like cotton and olives. Foreign exchange earnings will invest in mechanized agriculture and industrial upgrades, increasing yields. This stimulates the economy and consolidates landlord support, stabilizing the social structure. We promise fair profit-sharing, avoiding exploitation, ensuring this cooperation progresses sustainably."
PLS_Encourage_investment:0 "Encourage Investment"
PLS_Encourage_investment_desc:0 "Providing reasonable policies and sharing political power with the bourgeoisie can increase local investors' interest in building factories, the first step to economic prosperity. For example, we open parliamentary seats to the business community, ease investment approvals, and lower barriers. This encourages them to build factories, expand production, create jobs, and generate tax revenue. Sharing power ensures their rights are protected, driving innovation and growth. We believe this strategy will attract significant capital inflows, forming a virtuous economic cycle."
PLS_Utilize_location_advantages:0 "Utilize Location Advantages"
PLS_Utilize_location_advantages_desc:0 "Palestine's proximity to the Suez Canal, coupled with promises of lower taxes and preferential policies for foreign enterprises, may attract increased investment. We will establish special economic zones offering tariff reductions and land conveniences, such as upgraded port facilities. This can bring in foreign enterprises to build factories, create jobs, and facilitate technology transfer. We will strictly screen projects to maximize benefits while maintaining national sovereignty, turning geographical advantages into economic momentum driving overall development."
PLS_Future_proof:0 "Future Proof"
PLS_Future_proof_desc:0 "Palestine is awakening with vitality; we, the Arab people, will personally decide our future destiny. This is no longer an empty slogan but the beginning of practical control over national affairs. We reject external interference, relying on internal unity to drive revival. Arab hands will reshape the homeland, proving their strength and dispelling the shame of past dependence. A new era has arrived; we must seize the moment, ensuring every decision stems from local will, not foreign imposition. This conviction is igniting sparks nationwide, inspiring laborers and soldiers to strive together, building a truly independent nation."
PLS_Creation_of_the_PTO:0 "Creation of the Palestine Treaty Organization"
PLS_Creation_of_the_PTO_desc:0 "In the past, Palestine naively placed hopes on Ottomans, British, even Germans. Result? Deceit prevailed, dignity trampled! Foreign rulers never brought justice, only taught us humiliation. The lesson is profound: Arab affairs must be decided by Arabs. We cannot repeat past mistakes; we must sever all external dependencies and cultivate a spirit of self-reliance. History shows every entrustment turned to betrayal. From now on, we root ourselves in the land, writing an epic of independence with blood and sweat. The first step of national awakening is recognizing the truth, achieving self-strength through action."
PLS_Cooperation_with_Egypt:0 "Cooperation with Egypt"
PLS_Cooperation_with_Egypt_desc:0 "Egypt has always been the strongest pillar of the Arab nation; their contributions in the anti-Ottoman war were outstanding, and today they should continue leading the Arab world. Egypt's example inspires us, proving unity can counter external pressure. We support Egypt's guidance, based not only on tradition but also on its military strength and economic foundation. Arabs need close cooperation to jointly resist divisive forces and defend national interests. Egypt's role is unshakable; it will lead us to integrate resources and advance towards revival. May the Arab banner fly unwaveringly under Cairo's leadership."
PLS_Claim_the_Islamic_State_of_Arabia:0 "Claim the Islamic State of Arabia"
PLS_Claim_the_Islamic_State_of_Arabia_desc:0 "The enemy only understands death! Grab rifles, clutch sacred scriptures; the Arab century roars forth. The trumpet of struggle sounds; we will defend faith and territory with weapons. This is not just resistance but the dawn of a revival mission. The enemy's arrogance must be extinguished; action declares rebirth. Arab youth will charge ahead; every victory is Allah's grace. The new era brooks no slack; we vow to end oppressors and restore historical glory. Taking up arms now is the start of reshaping the national soul."
PLS_jihad:0 "Jihad!"
PLS_jihad_desc:0 "Arab enemies sneer at us domestically and abroad; this provocation must be answered! Let them taste the fury of artillery; Allahu Akbar! Behind the provocation lie colonial tricks; we must counter firmly. Firepower will wash away humiliation, proving Arab strength cannot be belittled. Mockery at home and abroad stems from fear; united, we crush conspiracies with force. Remember, every shell is a retort of dignity, showing the world our fearless resolve. Guided by Allah, victory belongs to the faithful warriors."
PLS_The_ultimate_solution:0 "The Ultimate Solution"
PLS_The_ultimate_solution_desc:0 "Wherever Jews are found, they should be eliminated without hesitation. This aligns with Allah's will, historical law, and our faith's foundation. The Grand Mufti's teachings are engraved in our hearts; the Jewish threat is the root of division. We must eradicate this hidden danger, safeguarding national purity. Action demonstrates loyalty; every strike answers history. External doubts are meaningless; we fulfill our sacred duty, consolidating the Islamic order. Arab lands tolerate no traitors; eliminating enemies purifies the homeland."
PLS_Allah_alone:0 "Allah Alone"
PLS_Allah_alone_desc:0 "The world is fallen and filthy, indulging in excess, forgetting reverence and sanctity. Eradicating corruption brooks no delay! Act now to establish Allah's universal dominion. Moral decay erodes the soul; we raise the sword of revival, severing the shackles of desire. Society must return to its roots; Allah's law reigns supreme. Time is pressing; we call for a purity movement, awakening public conscience. Not empty talk, but concrete practice, expelling Western toxins. From family to nation, reshape the moral system; Allah's will shall dominate the future."
PLS_Start_with_Arabia:0 "Start with Arabia"
PLS_Start_with_Arabia_desc:0 "We inherit the mantle of the Caliphate; we must correct deviations of later generations and rebuild a unified Arab Islamic state. The mission is solemn, aiming to restore the glory of the golden age. The imperial legacy is our cornerstone; integrating fragmented territories is urgent. Action mends historical rifts; faith unites diverse peoples. Muslim brothers are no longer divided; united under a single banner. We will start from Palestine, expanding influence, proving revival is more than a slogan. The spirit of the Caliphate never fades, guiding us forward."
PLS_And_then_there_are_all_Muslims:0 "And Then All Muslims"
PLS_And_then_there_are_all_Muslims_desc:0 "From Central Asia to the Far East, Southeast Asia to the New World, the Islamic reconquest continues until all Muslims unite under one banner. The journey is endless; the goal is to bring all believers back under the same flag. We observe developments afar, support brothers' struggles, and ensure the unification process. Resistance is strong, but with Allah's aid, every step is a cornerstone of revival. The Arab core leads this movement, integrating resources, pushing the expedition. The Muslim world will eventually unite, restoring its former influence."
PLS_Hashem_holds_the_glory:0 "Hashem Holds the Glory"
PLS_Hashem_holds_the_glory_desc:0 "The Sultan of Syria will once more mount his warhorse, conquer Greater Syrian territories, and proclaim the rebirth of the Sultanate of Syria. Historical responsibility weighs on our shoulders; we reclaim our ancestors' legacy. Every inch of land symbolizes glory, expelling foreign occupiers. Warriors stand ready; bloodshed will verify national strength. Syrian territory must be unified; this is an indispensable part of revival. We will act swiftly, consolidating the new regime and establishing Arab authority. Victory is in sight!"
PLS_Claim_Greater_Syria:0 "Claim Greater Syria"
PLS_Claim_Greater_Syria_desc:0 "According to the Great Arab Revolt plan, Syria and Iraq belonged to the Hashemite Sultan; now we must reclaim them from enemies. Historical justice will prevail; action is urgent. Enemy occupation is illegal; we mobilize military and civilian forces for a full-scale offensive. The Hashemite family's right to rule is inalienable; the battlefield proves resolve. The revival process admits no compromise; every victory brings us closer. In Arab unity, we pioneer reclaiming lost lands, writing a new chapter."
PLS_The_crown_of_the_Hejaz:0 "The Crown of the Hejaz"
PLS_The_crown_of_the_Hejaz_desc:0 "The two Holy Cities in the Hejaz region are crucial; capturing them will significantly boost Hashemite authority. This was part of the Great Arab Revolt blueprint; we must achieve it. The Holy Cities symbolize the religious core; control will consolidate Islamic orthodoxy. Strategically prioritize the campaign, integrating resources to accelerate action. Hashemite leadership enjoys Allah's protection; every advance is a victory of faith. The Holy Cities' radiance spreads across the region, calling Arabs to unite. The mission is sacred and urgent!"
PLS_Pan_Arab_cooperation:0 "Pan-Arab Cooperation"
PLS_Pan_Arab_cooperation_desc:0 "We have no intention of annexing distant Arab territories, but brothers there share Arab blood and faith, deserving economic and military aid. Support their struggles, safeguarding global Muslim interests. We won't interfere internally but provide weapons and funds to fight common enemies. In reciprocal cooperation, the Arab spirit spreads far. This strengthens bonds without losing our own foundation. Aid is a duty, helping brothers stand up and defend the Islamic community."
PLS_The_legacy_of_the_Great_Uprising:0 "Legacy of the Great Uprising"
PLS_The_legacy_of_the_Great_Uprising_desc:0 "Arab national unity cannot rely on state mergers but must form an international alliance. Deepen cooperation through economic reciprocity and military coordination, not unification. The alliance promotes resource sharing to counter external threats. Member states retain autonomy, jointly formulating anti-colonial strategies. Collaborative mechanisms are built, like trade agreements and joint defense. The goal is clear: enhance collective strength, not erase differences. United we are stronger; free we stand firm."
PLS_Arab_national_revival:0 "Arab National Revival"
PLS_Arab_national_revival_desc:0 "The key to boosting nationalism is educating Arabs about their identity, understanding that everyone from Marrakesh to Bahrain shares a destiny bound to the anti-colonial, anti-imperialist struggle. Awakening consciousness is paramount; we disseminate historical truths proving imperialism is the common enemy. Action links nations, awakening each person to their warrior identity. Propaganda and education spread widely, from schools to mosques, conveying the message: united we win, divided we fall. Only when all are awakened can Arab revival be within reach."
PLS_End_the_colonial_order:0 "End the Colonial Order"
PLS_End_the_colonial_order_desc:0 "Only by destroying the global colonial order can Arabs be truly free. This requires cooperation with the Third International to jointly defeat the Imperial Pact and Entente powers. Cooperation doesn't mean surrender but a strategic alliance. The Third International provides resource channels; we contribute fighting power. The common goal: end the oppressive system, liberate trapped nations. External forces are cunning, but under a united offensive, they will crumble. The path to Arab freedom is never lonely."
PLS_Arab_National_Revolution:0 "Arab National Revolution"
PLS_Arab_National_Revolution_desc:0 "Our movement rejects socialist internationalism and Jewish capitalism. Young officers lead the national revolution, aiming to become the Arab Mussolini! Independence is the essence; never leaning towards illusory ideals. The revolution is based on local will, training elite troops, and cultivating iron-willed leaders. Opposing international clamor, we focus on internal Arab reform. History proves the national path correct; in action, we will reshape the order, proving our greatness."
PLS_The_New_Order_in_the_Middle_East:0 "The New Order in the Middle East"
PLS_The_New_Order_in_the_Middle_East_desc:0 "The ancient Arab Empire ruled the world, dictating the fate of East and West. Today's revival signifies re-establishing control over the Middle East region. Starting in Palestine, expanding to surrounding territories. The imperial legacy is a beacon; we revive commerce and military, dispelling the colonial shadow. Every conquest is glory's return; Arabs will again dominate their destiny. History turns; we lead the new era. Action spares no effort!"
PLS_Reborn_in_blood_and_fire:0 "Reborn in Blood and Fire"
PLS_Reborn_in_blood_and_fire_desc:0 "Arabs have demonstrated strength; future victory is certain! The journey doesn't cease; imperialists sneer overseas, Jews cling to their side; only by eradicating them can we attain eternal freedom. We vow to end the threat; every battle purifies the land. Jewish conspiracies run deep, but the Arab fist is harder. Action shows fearlessness, expanding from home soil to global resistance. Freedom is not just a dream but a reality bought with blood. With Allah's blessing, victory will come!"
PLS_GATHERING_STORM_DESC:0 "If the Arab Revolt awakened the national spirit of Palestinian Arabs, then the thousands of Arabs who came to Jerusalem to contribute to Palestine's independence gave Palestine a second life. Arrogant Jews sought to eliminate the Arabs living on this land, and we will drive them out with bayonets. Better a lion for a day than a sheep for a hundred years; better to die standing than live kneeling!"