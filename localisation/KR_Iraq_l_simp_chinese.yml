 IRQ_Arab_League:0 "阿拉伯国家联盟"
 IRQ_Arab_League_desc:0 "阿拉伯人民因语言的统一而能够在他们居住的帝国里形成独立的群体。然而，有些人认为这种关系还远远不够，阿拉伯世界的命运是重新统一，就像在伟大的哈里发时代那样。他们相信，以这种建立一个统的阿拉伯的方式，整个次大陆将最终迎来真正的复兴，并且夺回它在全球政治上的地位。\n\n为了实现这统一，他们建立了一个超国家的组织（§Y阿拉伯国家联盟§!），并被赋予了重要的权力。然而，如果要实现一个泛阿拉伯国家的梦想，我们需要说服其他阿拉伯国家参与这一倡议，并放弃部分主权。"
