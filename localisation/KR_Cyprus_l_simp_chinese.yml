 CYP_Fevzi_Cakmak_hog_ade:0 "费夫齐·恰克马克"
 CYP_Ismet_Inonu_for_ade:0 "伊斯梅特·伊诺努"
 CYP_Mahmut_Esat_Bozkurt_eco_ade:0 "马赫穆特·埃萨特·博兹库尔特"
 CYP_Recep_Peker_sec_ade:0 "雷杰普·佩克"
 CYP_GATHERING_STORM_DESC: "正在开发中"
 CYP_Cyprus_revolt:0 "维拉耶之治"
 CYP_Cyprus_revolt_desc:0 "塞浦路斯，又或者可以将其称为希腊群岛维拉耶，奥斯曼帝国在地中海的掌上明珠，来自意大利半岛、巴尔干的船只基本都会选择在这里停靠补充必要的物资，帝国监管大叙利亚地区的海上哨站。塞浦路斯岛各处都有奥斯曼的军事基地以供不时之需。\n\n自19世纪以来，岛上的希腊分裂主义团体逐渐势大，虽然他们的反抗都被帝国宪兵打压了下去，但仍有不少反抗分子潜藏在暗处，每一名希腊族人都有可能的叛军的一员。世界大战激起了塞浦路斯希腊族人更大规模的反抗，他们看到了独立的曙光，在暗中与协约国势力勾结妄图推翻奥斯曼帝国在此地的统治，希腊人差点就登上了塞浦路斯岛，辛亏凯末尔帕夏的好友费夫齐·恰克马克及时出手镇压了希腊族的叛乱，赶走了希腊人的部队，仅有一小部分向塞浦路斯的希腊人城市转进不知去向。\n\n这群希腊人似乎不明白死亡为何物，他们拿着老旧的步枪，躲在了塞浦路斯岛的各个角落，希腊人通过各种渠道向他们在塞浦路斯岛的同胞提供物资，就连第三国际的赤色分子也加入了其中。自1921年以来各种反抗事件层出不穷，爆炸袭击、大罢工、大规模暴动，塞浦路斯岛笼罩在了一片阴霾之中，我们只能团结在恰克马克帕夏的身边，向所有叛乱分子进行最后决战。"
 CYP_Famagusta_tt: "§M法马古斯塔§!\n§W--------------\n§!行政当局：\n§L土耳其人§! - §L[?CYP_villaye_influence_famagusta|%0]§!\n§R社会主义者§! - §R[?CYP_socialist_influence_famagusta|%0]§!\n§B希腊人§! - §B[?CYP_greek_influence_famagusta|%0]§!\n"
 CYP_Famagusta_TITLE: "§W法马古斯塔是位于塞浦路斯东岸法马古斯塔湾的海港城市，始建于公元前3世纪，曾是塞浦路斯最大的海港城市。该城分新旧两区，新城瓦罗沙因战争成为废墟，旧城保留着威尼斯城墙、圣尼古拉斯天主教堂改建的拉拉·穆斯塔法清真寺等历史遗迹。作为地中海吃水最深的天然港口，其航运功能逐渐被利马索尔港取代。现以金色沙滩、奥赛罗城堡和萨拉米斯古城遗址为主要旅游资源。§!"
 CYP_Kyrenia_tt: "§M凯里尼亚§!\n§W--------------\n§!行政当局：\n§L土耳其人§! - §L[?CYP_villaye_influence_kyrenia|%0]§!\n§R社会主义者§! - §R[?CYP_socialist_influence_kyrenia|%0]§!\n§B希腊人§! - §B[?CYP_greek_influence_kyrenia|%0]§!\n"
 CYP_Kyrenia_TITLE: "§W凯里尼亚位于塞浦路斯凯里尼亚山北麓，面向地中海，与土耳其大陆隔海相望，相距约60公里。该城始建于公元前10世纪，现为凯里尼亚行政区的行政中心，人口约1万。作为尼科西亚的附属港口，凯里尼亚兼具游艇港、渔港、冬季休养地及地方性市场功能。城市建筑小巧玲珑，环境幽静，北坡覆盖松林与橄榄树林。§!"
 CYP_Larnaca_tt: "§M拉纳卡§!\n§W--------------\n§!行政当局：\n§L土耳其人§! - §L[?CYP_villaye_influence_larnaca|%0]§!\n§R社会主义者§! - §R[?CYP_socialist_influence_larnaca|%0]§!\n§B希腊人§! - §B[?CYP_greek_influence_larnaca|%0]§!\n"
 CYP_Larnaca_TITLE: "§W塞浦路斯东南部拉纳卡湾沿岸的港市，拉纳卡区的行政中心，全国第二大港与最大油港。又名拉纳克斯，古称克提昂。人口4.8万。曾一度是腓尼基人在塞浦路斯岛的重要据点，后在希腊人同波斯人的战争中遭破坏。奥斯曼帝国占领后，逐渐发展成为重要的城市和海港，伊斯兰文化得到传播。但后又为法马古斯塔所代替。§!"
 CYP_Limassol_tt: "§M利马索尔§!\n§W--------------\n§!行政当局：\n§L土耳其人§! - §L[?CYP_villaye_influence_limassol|%0]§!\n§R社会主义者§! - §R[?CYP_socialist_influence_limassol|%0]§!\n§B希腊人§! - §B[?CYP_greek_influence_limassol|%0]§!\n"
 CYP_Limassol_TITLE: "§W又名“莱梅索斯”。塞浦路斯南岸城市。傍阿克罗蒂里湾。利马索尔区的行政中心。人口10.7万。为全国第二大城与重要工业中心，有砖瓦、纽扣、卷烟等工厂与铬、石棉加工厂，葡萄酒酿造著名。近年成为全国第一大港，正在建立浮船坞、石棉水泥管厂与滨海游览区。市区以西为奥斯曼军事基地阿克罗蒂里。§!"
 CYP_Nicosia_tt: "§M尼科西亚§!\n§W--------------\n§!行政当局：\n§L土耳其人§! - §L[?CYP_villaye_influence_nicosia|%0]§!\n§R社会主义者§! - §R[?CYP_socialist_influence_nicosia|%0]§!\n§B希腊人§! - §B[?CYP_greek_influence_nicosia|%0]§!\n"
 CYP_Nicosia_TITLE: "§W尼科西亚是塞浦路斯政治、经济和文化的中心。尼科西亚的经济以农业、制造业和旅游业为主。主要的农产品有橄榄、水果、蔬菜、杏仁等。制造业主要有机床、纺织品、塑料和食品等。由于塞浦路斯提供税收优惠，部分跨国公司将总部设在尼科西亚。旅游业发达。无铁路，但公路交通发达，以放射形通向各地。是地中海东部重要的国际航空港。§!"
 CYP_Paphos_tt: "§M帕福斯§!\n§W--------------\n§!行政当局：\n§L土耳其人§! - §L[?CYP_villaye_influence_paphos|%0]§!\n§R社会主义者§! - §R[?CYP_socialist_influence_paphos|%0]§!\n§B希腊人§! - §B[?CYP_greek_influence_paphos|%0]§!\n"
 CYP_Paphos_TITLE: "§W帕福斯是塞浦路斯的一个海滨城市，位于塞浦路斯岛西南部，距首都尼科西亚约100公里。这座历史悠久的城市自从新石器时代就有人在此居住，它曾经是塞浦路斯国家的首都。帕福斯是指克提马和新帕福斯。它一直被作为敬奉爱神的圣地，城市中建有著名的阿芙罗狄特神庙，并且保留有大量残存的别墅、宫殿、剧院、要塞和墓地，在建筑学和历史学上都具有特殊的价值。§!"