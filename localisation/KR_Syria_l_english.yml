SYR_Send_Yasin_Al_Hashimi_desc:0 ""
SYR_Start_rebuilding:0 "Begin Reconstruction"
SYR_Start_rebuilding_desc:0 "We have witnessed the withdrawal of Ottoman troops, leaving behind ruins and paralysis. Now we must shoulder the task of clearing the chaos: abandoned factories must be restarted as the foundation of Syria's revival. By systematically repairing damaged infrastructure, we will ignite the passion of national workers and make the roar of machinery resound once more. This is not just for the economy; it is a promise to the Syrian people—every turning gear represents the rebirth of the nation. We cannot tolerate wasting any resources. Restarted factories will bring employment and dignity, paving the path to prosperity for our heroic laborers."
SYR_Protect_the_banking_sector:0 "Protect the Banking Sector"
SYR_Protect_the_banking_sector_desc:0 "The collapse of the credit system would be a disaster, toppling the entire economy like dominoes. Farmers unable to access deposits or repay loans will only worsen social order. We must resolutely fortify the banking defenses to prevent them from being overwhelmed by the debt storm. This isn't empty idealism but realistic action: establishing emergency reserves and regulatory measures will accumulate essential funds for the future. Credit stability is the bedrock of the economy; protecting it ensures Syria preserves its strength during crises. Otherwise, the nation's revival plan will vanish into thin air. We refuse to sit idly by while disaster spreads."
SYR_Find_a_market:0 "Seek Markets"
SYR_Find_a_market_desc:0 "The collapse of the Ottoman Empire severed old trade chains, but we are not isolated. Russia and the Entente are extending help, eager to purchase Syria's agricultural products and oil to alleviate their own hardships. This isn't mere trade but the foundation of new friendships. By strengthening cooperation, we can stabilize the domestic market while opening overseas channels. Each contract represents mutual trust and win-win: oil exports will bring wealth to farmers, while agricultural sales secure rural livelihoods. We cherish this opportunity, symbolizing Syria's rise on the international stage. Joining hands with new friends will open a new economic chapter."
SYR_Product_diversification:0 "Product Diversification"
SYR_Product_diversification_desc:0 "The volatility of international markets is merciless like a tsunami; reliance on a single crop is a fatal weakness. We must promote product diversification—not just a strategy, but a matter of survival. Developing multiple industries like oil refining, handicrafts, and light manufacturing will solidify the national economic foundation. Through diversification, fluctuations in international grain prices will no longer dictate our fate; farmers and businesses can stand firm. It is a shield against external risks, ensuring Syria remains resilient in competition. We believe this structural shift will bring security to all, preventing the national economy from collapsing like a fragile house of cards."
SYR_Formulate_a_policy:0 "Formulate Policy"
SYR_Formulate_a_policy_desc:0 "Syria's political system dictates our unique path: the reconstruction plan must be tailored. Liberals advocate radical change, conservatives prefer traditional paths, and through democratic mechanisms, we select the optimal combination. This isn't a one-size-fits-all approach but a practical consideration: the plan must match national resources, avoiding empty theorizing. Decisions will be based on grassroots feedback, ensuring the voices of workers and farmers are heard. Each choice is an investment in Syria's future; our polity allows us to learn from others while retaining our core identity. We emphasize pragmatic action to ensure the plan takes root."
SYR_Liberal_plan:0 "Liberal Plan"
SYR_Liberal_plan_desc:0 "The blueprint submitted by liberals emphasizes a Westernized path: opening domestic markets and inviting Western capital. Their view is realistic—foreign investment brings technology and funds, accelerating Syria's reconstruction. We examine this plan: it offers potential for short-term recovery but requires balancing risks. Opening markets doesn't mean surrender; rather, it injects vitality into enterprises. Through negotiation, we will ensure foreign capital serves the public interest, not plunder. The liberals' proposal focuses on global opportunities; we acknowledge its value while guarding against over-dependence. The core is mutual benefit, not blind imitation."
SYR_State_regulation:0 "Economy Reconstruction Under State Regulation"
SYR_State_regulation_desc:0 "The conservatives' economic proposal is rooted in domestic soil: dismantling monopolies, prioritizing nationalization, and vigorously supporting national enterprises. This plan aligns more closely with Syria's reality—scarce resources yet immense potential. By state control of key industries like energy and education, we prevent foreign control of vital sectors. Dismantling large enterprises will invigorate competition, preventing the state from becoming corporate puppets. Supporting national enterprises isn't a slogan but action: providing incentives for small and medium workshops to grow. We endorse this down-to-earth approach, ensuring reconstruction stays true to people's needs and safeguards national sovereignty."
SYR_Open_free_market:0 "Open Free Market"
SYR_Open_free_market_desc:0 "Our strategy is resolute market openness: throwing open doors to the Western world. This isn't fantasy but a necessary means for economic reconstruction. Openness isn't uncontrolled; it will attract capital and technology, accelerating factory operations and trade recovery. We emphasize this aims to revitalize Syria: foreign capital inflow can fill the void left by the Ottomans, creating opportunities for farmers and workers. Negotiations will set rules to ensure profits flow back domestically. Openness is the catalyst for revival; we reject isolationism. It will help Syria stand firm in the global chain and usher in a true era of prosperity."
SYR_Protect_national_enterprises:0 "Protect National Enterprises"
SYR_Protect_national_enterprises_desc:0 "Complete capitulation to the West is a dangerous game: it lets foreign capital control key industries, placing the nation's fate in others' hands. We cannot tolerate this. National enterprises must be prioritized—through loans, tax breaks, and policy support, we activate local workshops. They are the backbone: farmers control grain production, workers man the steel mills. Support is an act of self-defense, preventing Syria from becoming a vassal. We pledge that self-reliance is the core of reconstruction; national enterprises are the guardians of the economic foundation."
SYR_Foreign_capital_was_introduced:0 "Introduce Foreign Capital"
SYR_Foreign_capital_was_introduced_desc:0 "Building national enterprises from scratch requires immense time and capital—unrealistic. Western capital offers a shortcut: they bring ready-made technology, low-cost and efficient. We choose this path to conserve resources—imported machinery and funds immediately boost factory efficiency, avoiding futile trial and error. It is a key unlocking Syria's industrial potential: farmers benefit from tool innovation, workers gain stable production. Introduction isn't surrender but wise utilization; we skip the long accumulation phase, directly converting capital into national wealth and ensuring rapid economic recovery."
SYR_Encourage_economic_investment:0 "Encourage Economic Investment"
SYR_Encourage_economic_investment_desc:0 "Syria holds rich untapped resources—oil and farmland—but national funds are insufficient for independent development. We decide to invite Western companies to invest jointly: co-development transforms potential into reality. Foreign capital injection can launch mining and industrial projects, sharing risks and rewards. Farmers and workers gain employment; cooperation is a two-way street, we lead the development process ensuring Syrian interests come first. This isn't dependence but leveraging strength: letting external capital fuel national revival, ushering in a new era of shared prosperity."
SYR_Deepen_trade_cooperation:0 "Deepen Trade Cooperation"
SYR_Deepen_trade_cooperation_desc:0 "Friendship with the Western world is a strategic asset; we cherish this bond. By deepening trade cooperation, mutual concessions aren't betrayal but calculated win-win. Yielding some benefits secures technology sharing and market access, solidifying Syria's economic foundation. Cooperation is a bridge connecting resources and needs: oil exports bring industrial equipment, agricultural trade boosts rural income. We emphasize flexibility—concessions are for long-term national strength. This act showcases Syrian wisdom; friendship symbolizes loyalty and serves as a booster for revival."
SYR_Limit_large_enterprises:0 "Limit Large Enterprises"
SYR_Limit_large_enterprises_desc:0 "Monopolies by large enterprises are a cancer; they devour the nation's soul, turning Syria into a private empire. We must dismantle them, breaking oligarchic rule. This balances competition and liberates market vitality: medium enterprises strengthen finances through taxes, we levy moderate taxes to fund public works. The measures will unleash the potential of small workshops—farmers get fair prices, workers benefit from diverse employment. Dismantling isn't punishment but justice; through action, we ensure the economy serves the people, not plutocrats."
SYR_Develop_national_industry:0 "Expand Nationalization"
SYR_Develop_national_industry_desc:0 "Key industries like mining, education, and healthcare are national lifelines; private control endangers sovereignty. We decisively implement nationalization: mining output belongs to all, education nurtures the next generation, healthcare safeguards well-being. This isn't idealism but practical protection: nationalization prevents resource outflow, ensuring proceeds fund social reconstruction. Farmers gain stable mining jobs, workers enjoy free healthcare. The measures strengthen the national foundation—every national acquisition symbolizes Syrian unity. These industries guarantee economic security; we refuse to let them fall into foreign hands."
SYR_Full_recovery:0 "Full Recovery"
SYR_Full_recovery_desc:0 "The chaos left by the Ottoman Empire has finally ended: stalled projects are completed, factories restart from stagnation. We witness this victory—production lines roar to life, abandoned facilities transform into production fortresses. Syrian workers and farmers join forces to clear the ruins, reviving every rusted machine. This isn't just repair but a symbol of national pride: project completion represents the power of self-reliance. Through effort, the national economic foundation is solidified; we celebrate this milestone, heralding the dawn of a new era."
SYR_Interest_free_loans:0 "Interest-Free Loans"
SYR_Interest_free_loans_desc:0 "To incentivize youth, we offer interest-free startup loans: supporting daring souls to create national enterprises. Loans flow burden-free to agricultural innovation or small-scale manufacturing, injecting new blood into Syria. Farmers' sons can experiment with mechanized farming, workers' children start workshop production. This is an investment in the future: every loan is a seed of national revival. We encourage youthful risk-taking. The measure not only alleviates unemployment but strengthens economic diversity; through action, we cultivate a cohort of domestic entrepreneurs."
SYR_Quality_comes_first:0 "Quality First"
SYR_Quality_comes_first_desc:0 "Syria cannot replicate industrial giants' scale—an unrealistic fantasy. We pivot to quality priority: producing select high-end goods to capture solid niche markets. Like handicrafts or specific agricultural products, winning consumers with quality, not flooding quantity. This strategy lets farmers focus on premium crops, workers refine processing; it avoids the fragility of bulk commodities. We emphasize realism—exceptional quality is Syria's weapon. Rooted in specialized fields, the economy will grow steadily. Niche markets become secure bastions."
SYR_Develop_industry:0 "Develop Industry"
SYR_Develop_industry_desc:0 "Industrialization isn't just new factories; it demands upgraded equipment and tools. We focus investment on existing industries: procuring or self-producing efficient machinery to boost output per unit. Farmers benefit from automated tools, workers use new machine tools for precision. Investment ensures Syria keeps pace with global innovation; efficiency gains make products more competitive. This isn't blind expansion but value accumulation—through equipment renewal, industry maintains vitality, creating sustained economic returns."
SYR_Developing_oil_refining_technology:0 "Develop Oil Refining Technology"
SYR_Developing_oil_refining_technology_desc:0 "Existing refining technology is backward, wasting oilfield potential. The state will intervene: providing funds and resources to enhance refining processes. Through R&D or imports, transform crude oil into more high-value products. Farmers near oilfields benefit from jobs, workers master new equipment. This is results-driven, not empty talk: technological upgrades bring extra income, solidifying national wealth. Our goal is clear—each improvement boosts output, injecting new momentum into Syria's oil industry."
SYR_Agricultural_mechanization:0 "Agricultural Mechanization"
SYR_Agricultural_mechanization_desc:0 "Mechanization is the cornerstone of agricultural revolution: it multiplies yield, stabilizing the rural economy. We promote modern tools like tractors—farmers no longer rely on manual labor, harvests surge. This improves quality of life for all: ample food reserves, stable prices averting famine. Farmers gain security, urban workers benefit from abundant supply. Mechanization isn't just efficiency; it's security: through doubled agricultural output, national food stockpiles become strategic assets, making Syria unassailable in turbulent times."
SYR_Syrian_army:0 "Syrian Army"
SYR_Syrian_army_desc:0 "We soberly recognize: the modern training of officers clashes fatally with the backward quality of soldiers. Orders are distorted or lost in transmission—not the soldiers' fault, but a systemic flaw. Comprehensive reform is imperative: simplify command hierarchy, establish standardized communication manuals, and set up literacy-tactics classes for the rank and file. Without a disciplined army, Syria's independence is a sandcastle. History will prove: only by reforming the army now can we resist powerful enemies in the future."
SYR_Defend_the_Motherland:0 "Defend the Motherland"
SYR_Defend_the_Motherland_desc:0 "Turtling behind borders won't save oppressed Arab brethren. Enemies won't stop at frontiers; waiting for them to breach our gates will doom Syria to repeat history. We must strike proactively when threats emerge, using swift offensives to keep the fire beyond our doorstep. We reject the historical cycle of passive defense; only by controlling the battlefield initiative can we defend our land and uphold justice."
SYR_Defense_Industry:0 "Defense Industry"
SYR_Defense_Industry_desc:0 "To protect our land in war, armories must never run dry. This demands factory lines roar day and night, machines turning for bullets and barrels. We will integrate national resources, prioritizing military production: let oil fields drive tanks, textile mills produce uniforms, steel plants forge artillery. Without ample equipment, the bravest warrior is mere flesh and blood. Industrial strength is the foundation of national survival; we will not send our army bare-handed into battle."
SYR_Special_operations:0 "Special Operations"
SYR_Special_operations_desc:0 "On battlefields of desert and mountains, conventional warfare's limits are stark. Thus, we establish the Special Operations Command—it will select promising warriors, instilling skills in infiltration, demolition, and rear sabotage. This force seeks not size, but scalpel-like precision: disguising to destroy enemy supply depots, planting timed bombs in command posts, creating maximum chaos at minimal cost. We soberly recognize: when the frontline stalls, these shadow operatives become the key to turning the tide. They are not romantic adventurers but silent blades defending the motherland with pragmatic means."
SYR_Desert_infantry:0 "Desert Infantry"
SYR_Desert_infantry_desc:0 "Desert heat and sand once halted imperial armies, but not the belief in liberating our brethren. We will train special forces: learning to navigate waterless zones, conceal in sandstorms, traverse death zones with camel teams. Every team behind enemy lines is a spark igniting the prairie. When warriors move like wind across the sands, the enslaved lands hear freedom's call."
SYR_Mountain_training:0 "Mountain Training"
SYR_Mountain_training_desc:0 "From Antioch to Golan, mountains wind like the motherland's spine. We will adapt locally: building hidden forts in passes, deploying observation posts on cliffs, turning steep slopes into deadly traps. Troops must master mountain warfare—rock-climbing assaults, snow camouflage, gorge ambushes. Make the enemy pay in blood for every step. These rugged mountains are Syria's most loyal guards; we need only learn to fight alongside them."
SYR_Cavalry_modernization:0 "Cavalry Modernization"
SYR_Cavalry_modernization_desc:0 "Bedouin equestrian genes flow in our blood, but cavalry's future lies not on dunes but under treads. We will restructure traditional cavalry, infusing their mobility into mechanized forces—scouts drive armored vehicles, cavalry commanders lead tank clusters. Speed remains the winning rule, but warhorses now have steel hearts. Let ancestral horsemanship be reborn on modern battlefields; this is the most practical inheritance of the Prophet's legacy."
SYR_Develop_armored_forces:0 "Develop Armored Forces"
SYR_Develop_armored_forces_desc:0 "Oil is the blood giving life to steel. We will prioritize oilfield and refinery operations, ensuring every drop of crude converts to power for armored forces. Tanks have proven battlefield game-changers—they shatter enemy lines with high-explosive shells, needing no cumbersome artillery. Let mechanized forces sweep like desert storms: treads crush trenches, engine roars replace warhorse neighs. The black gold surging beneath this land is our confidence in defending freedom. When tank clusters charge on crude oil power, enemies will experience the unstoppable force of industry combined with will."
SYR_Assault_tactics:0 "Assault Tactics"
SYR_Assault_tactics_desc:0 "The lesson of trench warfare is etched in bone: stagnation is death. We must empower the army to tear battlefields apart. Attaching motorized supply convoys and streamlining command ensures every corps can assault at full speed anytime. Mobility isn't just tactics; it's strategy: forcing enemies into exhaustion, exposing weaknesses through movement. Static defense belongs to the past; Syria's army races only towards victory."
SYR_Develop_electronic_intelligence_systems:0 "Develop Electronic Intelligence Systems"
SYR_Develop_electronic_intelligence_systems_desc:0 "The last war proved: lagging intelligence means soldiers die in vain. We will weave a frontline communication net, deploy field telephones, train codebreakers. When artillery observers calibrate trajectories in real-time, when assault teams synchronize to split enemies, the victory scale tips towards us. This isn't just a tech upgrade; it's responsibility for soldiers' lives—clear orders and precise intelligence are the highest morality in reducing casualties."
SYR_Lightning_fast:0 "Lightning Fast"
SYR_Lightning_fast_desc:0 "Preemption isn't a choice but an iron law of survival. We will disrupt enemy deployments with lightning offensives, fragmenting and annihilating their main force before it gathers. Time is the cruelest ally—if foes mobilize at leisure, numerical superiority will crush us. Thus, speed must become war instinct: reconnaissance units stab like daggers, main forces follow like hammers. Ending the battle before the enemy catches its breath—this is Syria's philosophy of victory."
SYR_Military_Academy:0 "Military Academy"
SYR_Military_Academy_desc:0 "Veterans' experience is gold, but warfare needs fresh blood. We will establish a military academy in Damascus: decorated generals impart practical wisdom, young staff develop new tactics. Classrooms are sand table exercises; graduation means frontline command. Only by fusing battlefield intuition with modern theory can the officer corps shoulder future wars. This respects tradition while embracing change."
SYR_Protect_the_Red_Sea:0 "Protect the Red Sea"
SYR_Protect_the_Red_Sea_desc:0 "Red Sea waves carry the nation's destiny. After reclaiming the coast, trade routes will activate the economy like veins: expand ports for cargo, build new shipyards to repair warships, erect lighthouses to guide merchant vessels. Fisheries provide protein for tables; shipping lanes inject gold into treasuries. This is no longer an Ottoman tributary but Syria's gateway to the Southern Seas, where defense and prosperity converge."
SYR_Build_the_Red_Sea_Fleet:0 "Build the Red Sea Fleet"
SYR_Build_the_Red_Sea_Fleet_desc:0 "The Red Sea coast's exposure is unnerving. We must immediately form a task force: convert armed merchant ships into patrol vessels, deploy shallow-water gunboats to guard choke points, establish coastal observation networks. If enemies land here, the heartland lies wide open. The fleet needn't be vast but must exist—ensuring every inch of coastline is within naval gun range."
SYR_Mine_tactics:0 "Mine Warfare Tactics"
SYR_Mine_tactics_desc:0 "Mines are the strategic weapon of the poor. We will densely lay anchored and magnetic mines along key shipping lanes: cheap yet terrifyingly effective, they can paralyze ports for months, forcing enemy fleets onto perilous detours. Minelayers disguised as fishing boats operate; minesweepers protect friendly waters. Weave a death net of steel and explosives, sinking enemies before they touch our shores."
SYR_Red_Sea_Guardian:0 "Red Sea Guardian"
SYR_Red_Sea_Guardian_desc:0 "The shipping lane from Istanbul to Suez is a golden artery. Controlling its throat, we levy a 'toll'—providing armed escorts for merchant ships, charging oil tankers security fees, deploying maritime police against pirates. The Red Sea is no longer a public corridor but Syria's backyard pond. This revenue will forge sharper prows, creating a virtuous cycle: sea power nourishes the economy, the economy feeds sea power."
SYR_Transjordan_shipyard:0 "Transjordan Shipyard"
SYR_Transjordan_shipyard_desc:0 "Millennia ago, Lebanese cedars built Phoenician warships; today, the Transjordan shipyard continues the legend. We concentrate resources to upgrade its dry docks: introduce welding to replace riveting, train engineers in indigenous hull design, establish quality control. Every gunboat launched must bear 'Made in Syria.' Only self-construction frees us from the shackles of spare part dependence."
SYR_Latakia_shipyard:0 "Latakia Shipyard"
SYR_Latakia_shipyard_desc:0 "Though Transjordan is the mainstay, Bureijla cannot be abandoned. We transform it into an auxiliary vessel center: build armed trawlers to bolster patrols, convert fast transports to support island garrisons, repair minesweepers to secure waterways. Small yards have big uses—dispersed production prevents total paralysis, filling frontline gaps with an 'ant army.'"
SYR_Mediterranean_Fleet:0 "Mediterranean Fleet"
SYR_Mediterranean_Fleet_desc:0 "Existing vessels are museum-piece relics, struggling even with patrols. The 'New Anchor Plan' must launch: acquire modern destroyer blueprints, retrofit docks to build fast torpedo boats, establish coastal artillery schools. Seek not massive scale but lean effectiveness—capable of expelling smugglers, escorting merchant convoys, defending the 12-nautical-mile sovereignty. Black Sea security has always relied on guns, not treaties."
SYR_Adana_Shipyard:0 "Adana Shipyard"
SYR_Adana_Shipyard_desc:0 "To counter northern naval powers, Adana's deep-water port is a key strategic point. We expand it into a fortified base: build breakwaters against air raids, lay railways to docks, deploy underwater sound arrays. The fleet's homeport must be concealed yet robust, allowing submarines to strike beyond enemy aircraft sight, enabling destroyers to repair overnight and re-engage. A navy without forward bases is a paper fleet."
SYR_Modernized_submarine_forces:0 "Modernize Submarine Forces"
SYR_Modernized_submarine_forces_desc:0 "Submarines revolutionized naval warfare: turning dreadnoughts into sitting ducks, shipping lanes into graveyards. We will secretly form submarine squadrons, training crews to hunt targets while submerged. This isn't gentlemanly duel but the way of the night assassin. When enemy ships list from explosions, the world will understand: though small, Syria has fangs to tear apart sea beasts."
SYR_cruiser:0 "Cruiser"
SYR_cruiser_desc:0 "Years of debate delayed the flagship project, but the sea power dream cannot be shelved. Based on realism: adopt the 10,000-ton heavy cruiser design. She won't chase giant guns but maneuver at 32 knots, suppress destroyers with 8-inch artillery, carry scout planes to locate targets. This 'Damascus' will be mobile territory—where she cruises becomes Syrian territorial waters."
SYR_Mediterranean_hunter:0 "Mediterranean Hunter"
SYR_Mediterranean_hunter_desc:0 "The Eastern Mediterranean will become a submarine hunting ground. We master ambush tactics: lay listening nets on shipping lanes, use cargo ships as disguised motherships, launch wolf pack attacks at night. Every enemy ship sunk is a warning to aggressors. These underwater daggers need no fanfare; silent torpedo tubes are their most potent declaration. Let enemies fear the deep before leaving port."
SYR_Dominated_the_Mediterranean:0 "Dominate the Mediterranean"
SYR_Dominated_the_Mediterranean_desc:0 "As the British maxim goes: 'Who controls the sea controls fate.' Black Sea oil and Anatolian grain all need naval escort. With cruisers as the core, supported by submarines and land-based aircraft, we'll build an area denial system. The Eastern Mediterranean must become a secure inland lake—merchant ships sail freely, enemy ships never return. Without a strong navy, the nation is but a beast trapped ashore."
SYR_Develop_air_power:0 "Develop Air Power"
SYR_Develop_air_power_desc:0 "The current state of Syria's aviation industry cannot meet the needs of future conflicts; it is a sleeping treasure trove awaiting awakening. As the protective wings of the nation, we must invest in expanding aircraft factories—adding new production lines and worker training—so our air fleet stands firm in future flames. This isn't just to grow our fleet size but to defend the homeland's skies from threat. Farmers and workers' toil is the national foundation; now it's our turn to act—building an industrial system that rapidly responds to battlefield demands. Ultimately, a strengthened air force will become the iron-winged barrier protecting land and people."
SYR_Flying_artillery:0 "Flying Artillery"
SYR_Flying_artillery_desc:0 "Light bombers have proven themselves as 'flying artillery' in the skies, their precision strikes rivaling the king of ground warfare. Since artillery dominates warfare, we cannot neglect its aerial sibling—we must cultivate this weapon to become a decisive battlefield factor. Invest in developing more efficient models, combining combat testing to ensure every bomb shakes enemy morale. This isn't empty theory but practical necessity; like mineral deposits needing excavation to enrich the nation, nurturing aerial firepower brings immeasurable strategic advantage. Ultimately, when they circle enemy positions, foes will tremble under heavenly might."
SYR_Air_Force_Academy:0 "Air Force Academy"
SYR_Air_Force_Academy_desc:0 "Currently, our pilot training system is immature; the lack of professional instructors limits this force's growth. Thus, we urgently need to bring in experienced foreign trainers to impart flight skills to young cadets, compensating for domestic educational gaps. This isn't wasted money but an investment in the future; like underground resources requiring extraction to yield wealth, air force talent must be meticulously honed to shine. These instructors will share knowledge and discipline, rapidly aligning our pilots' skills with the strong. After all, a powerful air force stems from solid training foundations, and we are achieving this through pragmatic means."
SYR_Theoretical_construction:0 "Theoretical Construction"
SYR_Theoretical_construction_desc:0 "Superior aircraft and pilots are crucial, but innovation in air combat doctrine must not lag—aerial supremacy remains uncharted territory. As the world accelerates, we urgently need theoretical research institutes, recruiting experts to study tactics and predictive models day and night, preventing complacency. This isn't vanity but necessity: like mineral prospecting requiring keen observation, our commanders and pilots must keep pace with technology, ensuring theory and practice advance together. This will grant our forces prophetic ability, standing undefeated in sky melees."
SYR_Expansion_of_the_aviation_industry:0 "Expand Aviation Industry"
SYR_Expansion_of_the_aviation_industry_desc:0 "Air force strength stems from a solid industrial base. Syria's aviation industry has potential but cannot sustain prolonged conflict. To make it a battlefield sword, not a decoration, we must drive comprehensive expansion: build new factories, import skilled workers, optimize raw material supply chains, enabling aircraft manufacturing to seamlessly meet frontline demands. This isn't ambition but driven by practical needs—like the economy depending on farmers, the air force's lifeblood relies on industry's nourishment. We act with realist spirit, ensuring every investment translates into stable air power output, becoming a sturdy shield for national defense."
SYR_Death_fell_from_the_sky:0 "Death Fell From the Sky"
SYR_Death_fell_from_the_sky_desc:0 "Our air force's primary duty is to be the steadfast partner of ground warriors, providing precise bombing support—turning enemy strongholds, forts, and factories to ash. This isn't heartless but survival: make foes tremble under the shadow of death from above, paving the way for soldiers' charges. We plan operations pragmatically, emphasizing coordination with ground forces, avoiding lone ranger missions. Airstrike power stems from industrial accumulation; we proudly use it to defend farmers' and workers' homes, not create needless panic. Every target requires careful assessment; each bomb fights for Syria's glory."
SYR_Sweep_the_airspace:0 "Sweep the Skies"
SYR_Sweep_the_airspace_desc:0 "Contesting airspace control is the air force's paramount mission; only by crushing enemy aircraft can we protect our people from attacks. This isn't cold calculation but the sole means to safeguard the nation's foundation—until air superiority is won, bombing missions should pause to avoid futile sacrifice. We act with realist vision, prioritizing fighter squadrons for suppressive patrols, shattering enemy aerial dominance. Only with skies secured can strikes on strongholds be effective, ensuring daily peace for workers and farmers. Ultimately, this sequence will write victory, making enemies yield in awe."
SYR_defend_natural_syria:0 "Defend Greater Syria"
SYR_defend_natural_syria_desc:0 "The Pan-Arab dream is indeed beautiful, but in reality, it remains just a dream. Many oppose our fledgling nation being absorbed into such a vast, conflict-ridden Arab state. Thus, we must define our stance: we will defend what we've won with blood—an independent Syrian state."
SYR_greater_syrian_nationalism:0 "Greater Syrian Nationalism"
SYR_greater_syrian_nationalism_desc:0 "Our achievements exceed most imaginations, though some lands rightfully ours remain unclaimed. But the glorious struggle is over; a new conflict has begun, and this time we will fully restore Greater Syria."
SYR_cypriot_claim:0 "Claim Cyprus"
SYR_cypriot_claim_desc:0 "Cyprus may be insignificant to the Pan-Syrian cause, but the island is a strategic point in the Eastern Mediterranean. For the first time in centuries, Cyprus isn't controlled by any great power; thus, they lack the strength to resist invaders eyeing it. We must seize it before others do."
SYR_reclaim_cillcia:0 "Reclaim Cilicia"
SYR_reclaim_cillcia_desc:0 "Cilicia was taken when our nation was weak; now it's time to erase the shame. We will remind the Turks who the real victors are and ensure they never forget it."
SYR_syria_assyria:0 "Unify Syria and Assyria"
SYR_syria_assyria_desc:0 "Uniting all peoples of Greater Syria is our ultimate goal. We will bring fertile lands under our control, ensuring our nation endures for millennia. When our flag flies over Baghdad, our country will be forever united."
SYR_international:0 "Cooperate with the Third International"
SYR_international_desc:0 "Compared to other international bodies, the Third International undoubtedly better represents the true liberation of the masses. They aren't imperialists like Germany or Egypt seeking only to profit from us. Though we don't plan to become a syndicalist state, this at least signals to syndicalists we don't oppose their cause."
SYR_phalanstere:0 "Join the Phalanstère International"
SYR_phalanstere_desc:0 "The Phalanstère International is a syndicalist academic body where members from all nations share knowledge equally. By joining, our scholars can communicate directly with leaders in Paris and London."
SYR_reichspakt:0 "Cooperate with the Reichspakt"
SYR_reichspakt_desc:0 "Unlike the Egyptians, the German Empire has little interest in interfering in the Levant—at most investing here. Therefore, we can cooperate militarily and economically to continue our nation's development and strengthen its military power."
SYR_destroyers_forbases:0 "Destroyers for Bases"
SYR_destroyers_forbases_desc:0 "Though Germans don't seek colonies in the Levant, Europeans crave naval bases like children crave milk. We can profit by having them hand over surplus warships in exchange for basing rights."
SYR_foreign_investors:0 "Encourage Foreign Investment"
SYR_foreign_investors_desc:0 "Syria isn't a world economic center, but only because its potential remains untapped, and we possess abundant resources. We must improve our image among foreign investors, persuading them to inject urgently needed capital into Syria."
SYR_cairo_pact:0 "Cooperate with the Cairo Axis"
SYR_cairo_pact_desc:0 "The Cairo Axis is the only organization genuinely sympathetic to us. It was founded to crush Ottoman oppression of Arab peoples. Allying with Arab brethren is our only path; mingling with other outsiders invites trouble."
SYR_ciaro_damascus_line:0 "Overhaul Cairo-Damascus Railway"
SYR_ciaro_damascus_line_desc:0 "Due to constant conflict and lack of investment between the Ottoman Empire and Egypt, the Cairo-Damascus railway has decayed. Now allies with Egypt, we can begin repairs—testing our friendship and invigorating trade."
SYR_defend_syrian_national_interests:0 "Defend Syrian National Interests"
SYR_pursue_neutrality:0 "Pursue Neutrality"
SYR_pursue_neutrality_desc:0 "Neutrality is called cowardice, yet it demands the greatest courage. Unlike defenseless nations, we refuse to chain ourselves to any bloc's war machine, trusting no one but ourselves. We will keep distance from others; if enemies dare invade, our actions will prove our neutrality stems not from fear."
SYR_standard_small_arms:0 "Standardize Small Arms"
SYR_standard_small_arms_desc:0 "Our armories overflow with Ottoman and foreign 'all-nation' weapons, driving logistics officers mad. To spare them, we must standardize equipment and supply lines."
SYR_military_colleges:0 "Reopen Ottoman Military Colleges"
SYR_military_colleges_desc:0 "An experienced officer corps is vital. Though our officers are battle-hardened, we can't rest on laurels. We'll reopen Ottoman military colleges to train a new Syrian officer generation, hoping they lead our army to invincibility."
SYR_munution_factories:0 "Overhaul Aleppo Munitions Factory"
SYR_munution_factories_desc:0 "Lack of investment has left the Aleppo Munitions Factory dilapidated and outdated. We must fund these facilities, ensuring they function and equip future Syrian armies."
SYR_domestic_arms_production:0 "Domestic Arms Production"
SYR_lion_of_syria:0 "Lion of Syria"
SYR_lion_of_syria_desc:0 "While focused on development and industrialization, we must reflect on our progress. We began as desert rebels with only ambition; now we stand tall as victors. Syria's lion roars; the Levant and Mediterranean heed our call."
SYR_hawk_of_qurash:0 "Hawk of Quraysh"
SYR_hawk_of_qurash_desc:0 "Air power will shape future wars. Our nascent military can avoid tradition's shackles and embrace the air force. We will soar like eagles, striking down those who court death."
SYR_phoncian_shipbuilding:0 "Expand Phoenician Shipbuilding"
SYR_phoncian_shipbuilding_desc:0 "We are heirs to Phoenician heritage. Like ancient Phoenicians, we are forever bound to the sea—a source of wealth and treasure. We must become invincible at sea; our fishermen and merchant fleets will benefit."
SYR_syrian_naval_academy:0 "Establish Syrian Naval Academy"
SYR_syrian_naval_academy_desc:0 "Ships are good, but good ships with bad crews are intolerable. We'll build a new naval academy to train more sailors to fight for us and patrol our seas."
SYR_arab_leadership:0 "Assert Leadership of Arab Movement"
SYR_arab_leadership_desc:0 "Petty claimants vie for Arab leadership, so we must declare ourselves the true leader of Pan-Arabism—especially since Syria's multi-ethnic nature uniquely qualifies us to build a Pan-Arab federation. Though this will make many enemies, we are ready."
SYR_League_of_Arab_States:0 "Establish League of Arab States"
SYR_League_of_Arab_States_desc:0 "The first step to Arab unity is integrating nations into a cohesive political-economic union. Thus, we'll form the League of Arab States for consultation and integration measures."
SYR_Economic_Social_Council:0 "Establish Economic and Social Council"
SYR_Economic_Social_Council_desc:0 "The first integration step is an Economic and Social Council to end trade barriers and ensure development in backward regions."
SYR_Arab_Customs_Union:0 "Arab Customs Union"
SYR_Arab_Customs_Union_desc:0 "With tariffs abolished, it's time to deepen economic cooperation. We'll form a common customs area, ultimately integrating regional economies into a shared system."
SYR_Joint_Defence_Council:0 "Establish Joint Defense Council"
SYR_Joint_Defence_Council_desc:0 "Our second goal is defense. We'll create a Joint Defense Council to foster military cooperation among member states."
SYR_Arab_Unified_Command:0 "Integrate Arab Command Structure"
SYR_Arab_Unified_Command_desc:0 "With growing military cooperation, it's time to deepen integration: merging national commands into one system, taking the first step toward a unified Arab army."
SYR_Arab_Parliament:0 "Establish Arab Affairs Parliament"
SYR_Arab_Parliament_desc:0 "With economic and military integration progressing, it's time for the most contentious phase: political integration. Expecting monarchies and republics to merge overnight is fantasy, but we can create a parliament for all Arab voices to advance the plan."
SYR_Council_of_Transportation:0 "Transportation Council"
SYR_Council_of_Transportation_desc:0 "Though railways and roads span the Middle East, connecting cities, the lack of a unified management system undermines their efficiency, making travel more complex than intended. To solve this, we'll form a unified Transportation Council to manage networks across member states."
SYR_Council_of_Justice:0 "Justice Council"
SYR_Council_of_Justice_desc:0 "Laws vary across the Middle East—Islamic, civil, even customary law—making a unified judicial system difficult. To resolve this, we'll establish a Joint Justice Council ensuring fair and interoperable legal provisions for all members."
SYR_Council_of_Social_Affairs:0 "Social Affairs Council"
SYR_Council_of_Social_Affairs_desc:0 "Many assume a future Arab state would be a union of majority ethnic groups, but the Middle East teems with minorities, diverse cultures, and religions. These groups have distinct beliefs and social systems; a future Arab federation must respect them. We'll establish a Social Affairs Council to foster intergroup understanding and respect."
SYR_Arab_Federation:0 "Proclaim Arab Federation"
SYR_Arab_Federation_desc:0 "Against all odds, a unified Arab state is about to be born. Our long efforts to promote understanding among Arab nations won't be in vain. Next are the final agreements and a new charter for the Federation. Whatever the future holds, one thing is certain: our actions will permanently alter the Middle East's course."
SYR_challenge_egypt:0 "Challenge Egyptian Order"
SYR_challenge_egypt_desc:0 "Egypt played a crucial role in the Arab Revolt, undeniable. But this new regional power grows restless. Now, a younger, more dynamic nation dedicates itself to Pan-Arabism; the old power must yield to the new."
SYR_destablise_hejaz:0 "Target the Hejaz"
SYR_destablise_hejaz_desc:0 "Hejazi monarchs deem themselves above Pan-Arabism and refuse cooperation. We cannot allow their obstruction. Fortunately, many within support Arab unity; we can incite them to act. Once the Hashemites are gone, we'll install them in power."
SYR_destablize_the_imamate:0 "Meddle in the Imamate"
SYR_destablize_the_imamate_desc:0 "Yemen, relying on its defensible terrain, refuses to join the Arab fold, revealing its true colors. Yet they underestimate our resolve for Arab unity. We will act to place Yemen under the unified Arab banner."
SYR_arab_broadcasts:0 "Voice of the Arabs Broadcast"
SYR_arab_broadcasts_desc:0 "Though many talents already support our cause, winning popular backing is paramount. We'll unleash the propaganda machine, igniting Pan-Arab sentiment to lay the groundwork for the Arab Federation."
SYR_destablise_persian_gulf:0 "Destabilize the Persian Gulf"
SYR_destablise_persian_gulf_desc:0 "Persian Gulf monarchies favor isolationism; our overtures were rejected, highlighting this. Fortunately, these states are internally fractured; one kick at Iran's door will bring the rotten structure crashing down."
SYR_destablize_iraq:0 "Corrode Iraq"
SYR_destablize_iraq_desc:0 "Unluckily, our wealthy neighbor Iraq refuses cooperation, preferring isolation. We must correct their error, helping them see the light. Pan-Arabism is popular there; we'll fuel this sentiment to topple the uncooperative government."
SYR_arabistan_claim:0 "Claim Arabistan"
SYR_arabistan_claim_desc:0 "Some may accuse: Khuzestan isn't part of the Arab world, or we merely covet its resources. But clearly, Khuzestan is Arab. We must liberate our brethren from Persians, placing them under eternal Arab rule—and securing local resources."
SYR_cooperate_oman_muscat:0 "Cooperate with Oman and Muscat"
SYR_cooperate_oman_muscat_desc:0 "Oman, distant from war zones, desires isolation, yet it too is part of the Arab world. We'll ask its government to jointly contribute to the Pan-Arab cause."
SYR_SSNP_won_a_big_victory:0 "Since the Genesis"
SYR_SSNP_won_a_big_victory_desc:0 "We witnessed Jehovah shape Adam from chaos at Creation's dawn; the Syrian Social Nationalist Party (SSNP) blossomed thence as the world's supreme good. This holy flame pierced time's fog and now firmly holds Syria's scepter—God's ordained guardian. We transformed primordial goodness into a four-winged angel, revealing Freedom, Duty, Discipline, and Power—divinely bestowed virtues flowing like rivers through desert sands, irrigating the nation's barren heart. Unite, people! Under the Party's wing, every soul shall regain Eden's purity. The Lord said: 'Let light shine out of darkness'; we shall drive out shadows with this sacred light, guiding Syria to eternal glory. This mission isn't ours but the Most High's decree—may all bask in grace."
SYR_Eradicate_pan_Arabists:0 "Nightmare of the Hypocrites"
SYR_Eradicate_pan_Arabists_desc:0 "We raise the sword of justice, tearing the veil of Pan-Arabism's hypocrisy! This lie licks foolish hearts like a serpent's tongue, luring people from truth—a blasphemy of the Antichrist. The Holy Spirit burns within us: it is but hell's mirage, unable to dim Judgment Day's radiance. Awaken, people! We raise truth's torch, illuminating evil's trail in the desert. They weave webs with false covenants; we counter with divine retribution, casting them back to dark abyss. God's thunderous wrath decrees: 'True light tolerates no shadow.' Follow us to sweep these hypocrites into eternal damnation; only the Holy Party can purify the world's filth."
SYR_Enemies_of_Zionism:0 "Bring Calamity Upon Jacob's Seed"
SYR_Enemies_of_Zionism_desc:0 "Israel's ancestor Jacob defiled the covenant with deceit; Jews uphold lies as creed, desecrating God's holy face! The Old Testament says: 'Deceivers shall be tried by fire.' These dregs have mired faith in mire. We must raise the holy scourge, unleashing divine fire—not vengeance but Jehovah's justice manifest. Believers, cry for judgment! Let God's wrathful sea drown these hypocrites, holy flames consume their oaths. Syria is God's chosen land; no stain may pollute it. Before His kingdom comes, we shall purge this sin, every drop of blood becoming a fountain of purification."
SYR_The_party_commands_the_army:0 "The Party Commands the Army"
SYR_The_party_commands_the_army_desc:0 "We grasp the sword in the Leader's name! He who controls the soldier's soul wields worldly power—this truth is branded on our hearts. The army is no longer mundane armor; transformed by the SSNP's hand, it becomes the Party Guard's sacred shield. God commands us: 'Thou art the guardian.' Thus, every soldier must wash clean old oaths, reborn under the banner of loyalty. Spears aim not at earth but sweep injustice. Soldiers, accept baptism! The army shall be the sacrificial lamb upon the Party's glorious altar. Power is God's gift; we forge an impregnable fortress with piety."
SYR_Ensure_leadership_authority:0 "The Leader's Might, Cleansing All Filth"
SYR_Ensure_leadership_authority_desc:0 "We extol the Leader's divine majesty! His will is Moses' holy staff, shattering dark chaos, illuminating the multitudes. We must teach people and members: unconditional obedience. The Holy Spirit flows through his words, cleansing all sin—a fountain of grace. The Leader is fire amidst thorns, burning hypocrites yet warming good souls. In Syria's desert, his footprints become sacred paths; followers gain eternal life. God's way brooks no doubt: 'The obedient shall bask in light.' We pledge full devotion, honoring him as Christ's earthly proxy."
SYR_Kick_out_Parliament:0 "Overturn the 'Circus'"
SYR_Kick_out_Parliament_desc:0 "We sweep away that false god's stage—Parliament! It's but a clown's carnival, all wearing masks of lies, performing self-deceiving farce. The circus curtain falls; this tainted stage must plunge to hell forever. Holy Writ says: 'Falsehood finds no divine favor'; its whispers are echoes of blasphemy. We declare: Parliament is Cain's altar, leaving only profane ashes. People, rise! Reduce it to cinders in the Party's name; only the SSNP's altar can kindle true fire. God's wrath decrees: all deceit shall be cleansed with brimstone, forever silent in the abyss."
SYR_SSNP_Next:0 "Genesis Finale"
SYR_SSNP_Next_desc:0 "We celebrate the SSNP's triumph! Initial goals gloriously achieved, like the Red Sea parting. God guides us to choose a successor; this new man shall inherit the mission like John the Baptist, sowing the Four Virtues' seeds in the desert. People, invoke the Holy Spirit! The new Leader shall wear Freedom, Duty, Discipline, and Power like sacred robes, leading the Party to blanket all mountains. This isn't mortal choice but divine grace extended: 'A grain of wheat falls to the ground and yields a thousand.' We transmit primordial goodness; may Syria dwell forever in God's garden. Future radiance dawns; the Party ascends like Jacob's ladder to the sanctuary."
SYR_Zaims_vision_for_democracy:0 "Zaim's Vision for Democracy"
SYR_Zaims_vision_for_democracy_desc:0 "We have transferred national authority to Husni al-Zaim. He will lead the revival of New Syrian Nationalism, deeply exploring the seemingly illusory union of nationalism and democracy. This journey is thorny, as history proves: national awakening shrouded in democratic fog only tears society's roots. Husni shoulders the mission to transform this impossibility into a practical tool for unifying hearts and dispelling old sectarian strife. We know only by shattering false Western yearnings can Syrian society be reborn from division. Each step must be firm; Husni's leadership is the starting point of national revival. He will forge a new path through thorns, fearlessly stitching nationalism and democracy's rift."
SYR_Retain_a_limited_parliament:0 "Ceremonial Parliament"
SYR_Retain_a_limited_parliament_desc:0 "Though we retain a parliamentary form, its sole purpose is to faithfully execute the Leader's will—a decoration for the national movement, not a power organ. Members must remember their role is submission alone; any deviation betrays Syria's revival. Parliament is a relic of the old era, festering like sectarian strife. We retain it only to feign 'civilization' for the world, taming it into a lifeless shell. Under the Leader's command, it must operate silently, never touching SSNP's core or interfering with unification—it is a tool, not a master. This ensures we focus on reclaiming land, not pointless democracy."
SYR_Semi_democracy:0 "Puppeteer, Puppet Show"
SYR_Semi_democracy_desc:0 "Democracy is but malleable clay: promising freedom and liberation superficially while weaving webs of enslavement within; we manipulate it solely to grip power's strings. The masses crave democratic dawn, unaware it's a mirage to numb dissent and mask strife's undercurrents. We know well: democracy is but a substitute for ancient religious feuds, bringing neither equality nor progress. It serves ruling needs, taming crowds under a single banner. Promises ring loud, truth hides in shadows—democracy ultimately guards our nationalist iron law. Thus, we shield society from chaos, focusing on reclaiming land, not fighting for faith."
SYR_Moral_national_democracy:0 "Moral National Democracy"
SYR_Moral_national_democracy_desc:0 "We are not savage bandits but disciplined, moral iron-blooded nationalists, styling ourselves Democracy's Guard, defenders of the nation's soul. Our ranks are built on order's bedrock, steel-strong; moral codes steer us from sectarian slaughter's darkness toward the holy war for land unity. Outsiders may slander us as violent, but we are vanguards of revival, turning democratic tools into shields against internal and external dividers. 'Guard' is no empty title: we maintain peace in streets, discipline actions, safeguarding the national spirit. This isn't gang predation but a journey of national awakening, every step cleansed by law. Only thus can Syria stand with dignity, uneaten by corruption."
SYR_Overhead_SSNP:0 "Marginalize the SSNP"
SYR_Overhead_SSNP_desc:0 "The SSNP will transform into the Leader's blade, no longer a playground for dreamers or idle nationalists. Its club-like laxity is past; today, the Party becomes a discipline machine, transmitting the Leader's will flawlessly. Idealistic illusions shattered by reality, it turns pragmatic: members must abandon personal ambitions, melting into the crucible of national unity. We forge it not for debate but to win freedom's hard war. The Party's transformation is rebirth: from illusory gathering to national backbone, every member a soldier, obedience supreme. This ends internal strife, concentrating energy on revival. The club fades; the tool endures."
SYR_The_dream_of_Greater_Syria:0 "The Dream of Greater Syria"
SYR_The_dream_of_Greater_Syria_desc:0 "The dream of Greater Syria is deep in our souls—stretching from Damascus's heart to Baghdad's grandeur, across Cyprus's blue seas, to Sulaymaniyah's peaks, ultimately forged in blood. The SSNP kindles its inextinguishable torch: unifying the homeland isn't utopian fantasy but an action plan to expel colonial shadows. Every inch of land awaits liberation. Under the revival tide, the dream is no longer talk: it unfolds as strategic blueprint, turning sectarian noise into a unified horn call. The journey is perilous, but victory dawns; Greater Syria will be unified, eternal."
SYR_Shishaklis_revenge:0 "Shishakli's Path of Revenge"
SYR_Shishaklis_revenge_desc:0 "Adib Shishakli, a staunch Party and army loyalist, has won the Leader's firm trust. As the new wielder of SSNP power, he not only champions the Leader's vision but vows total dedication to Syria. In crises, his loyalty will shield the nation from external erosion. We must support his leadership, ensuring Syria's revival stays on course. His every action serves the national whole, making enemies unable to shake our unity. Only thus can Syria rise from ruins."
SYR_Total_jihad_agains_Judaism:0 "Total Jihad Against Judaism"
SYR_Total_jihad_agains_Judaism_desc:0 "Henceforth, the cancer of Zionism must be eradicated, wherever it lurks or disguises itself with false faith. We launch total cleansing, ensuring this scourge finds no foothold in Syria. Their existence threatens national purity, disrupting Syrian harmony. Every pursuit safeguards the future; no compromise tolerated. This isn't just righteous war but necessary for national survival. Leave them nowhere to hide; Syrian land belongs solely to pure Syrian sons."
SYR_Anti_socialism:0 "Socialism is the Jewish Lie"
SYR_Anti_socialism_desc:0 "Marx's Jewish identity is exposed; the socialism they preach is deceit. Divisive groups within Syria are equally poisoned and must be purged. These ideas' roots corrode the national fabric, luring the ignorant into abyss. We trust no alien words, only Syrian blood's will. Through resolute action, crush these groups, returning the nation to unified thought. Truth is ours; lies perish."
SYR_National_patriotism:0 "Patriotism Rooted in Nationalism"
SYR_National_patriotism_desc:0 "Patriotism can only be built upon nationalism. If one's identity is blurred, so-called patriotism is an empty joke. Citizenship cannot replace ethnic roots; it is the weakling's disguise. Syrians must awaken, recognizing blood bonds and tradition's power. Only under the national banner can true devotion flourish. We reject all temptations diluting essence. Stand firm in identity to weather storms."
SYR_Do_not_forget_the_four_major_guidelines:0 "Never Forget the Four Major Precepts"
SYR_Do_not_forget_the_four_major_guidelines_desc:0 "Freedom, Duty, Discipline, Power—these Four Virtues are our Party's bedrock, unbreakable. They shape our soul, ensuring Syria advances through adversity. Each must be strictly enforced; no exceptions. Betrayers are national traitors. This strengthens internal unity, turning virtues into steel armor against erosion. Guard the Precepts loyally; Syria will emerge from darkness into light."
SYR_Sadeh_reigns_forever:0 "Sa'ade Reigns Forever"
SYR_Sadeh_reigns_forever_desc:0 "Antun Sa'ade, our sole revered Leader, your wisdom is the beacon of national revival. To none other shall we submit. Only you can lead Syria beyond shackles to victory's peak. Your voice pierces chaos, igniting millions' fervor. Under your banner, we unite like bedrock, fearless of hardship. Syria's dawn rises only under your guidance."
SYR_Gather_compatriots:0 "Overseas Syrian Compatriots"
SYR_Gather_compatriots_desc:0 "We call upon Syrian compatriots exiled overseas to return to the homeland; this land needs their strength. They will become solid hammers, shattering old chains, forging a new Syrian home. Every drop of sweat merges into reconstruction; every returnee is a warrior of national rebirth. Amid ruins, we labor together, transforming compatriots' wisdom and fervor into progress. Do not hesitate; return is the grandest struggle."
SYR_Tempering_and_forging:0 "Tempered by Blood, Forged in Fire"
SYR_Tempering_and_forging_desc:0 "Weak nations never suffer; their freedom is but bestowed illusion. True freedom is won with blood, not pity. Syrians must realize: backbone springs from battlefield scars, not peaceful gifts. Every sacrifice waters tomorrow, teaching us to guard dignity. Cast aside false hopes; take up arms. Only bloodstained hands forge eternal freedom."
SYR_The_original_goodness:0 "Syrians Advance Bravely"
SYR_The_original_goodness_desc:0 "Factories will rise; armies will stand loyal. This is the core of Syria's rise; dawn's light nears. Our industrial base must be forged from scratch; every worker merges with the revival mission. Soldiers must be loyal to the flag, the nation's steel bulwark. No slacking; advance bravely. Every construction step declares war on the old world. Forward, Syrians! Victory is in sight."
SYR_secularism:0 "Completely Eliminate Religious Influence"
SYR_secularism_desc:0 "Religious lies bewitch minds, dividing innocent people. Now, Syrian nationalism replaces it as our unifying torch. Newly sprouted, it has power to shatter old chains. In time, people will shed false gods, uniting under the black banner. This force springs from land and blood, truer than any superstition. Step by step, dismantle delusion; the national spirit will conquer all division."
SYR_Ghassan_National_Revolution:0 "Ghassan Brings New Blood"
SYR_Ghassan_National_Revolution_desc:0 "Ghassan Jadid's syndicalist thought has resonated with most Party members; he will fuse it with Syrian nationalism. This innovation stems from practical need; most members clearly support his revolutionary vision. This process isn't mere theory evolution but a guide to action. Through integration, we build a more adaptable political machine serving overall national progress. Obstacles crushed, history's wheel turns our way."
SYR_Attack_the_wealthy_families:0 "Strike Wealthy Families"
SYR_Attack_the_wealthy_families_desc:0 "Wealthy families manipulate parties for private gain; their influence spreads like poison ivy. They are agents of national division; their plots must be shattered with heavy fists. These parasites corrode the nation's roots, profiting under false political guise. We launch thunderous action, stripping their disguises, exposing corruption. Purge from the source, returning power to the people. Only by destroying these shadows can light reach Syria."
SYR_social_security:0 "National Social Security System"
SYR_social_security_desc:0 "First build a stable social security system, then gradually enhance public welfare. Let every Syrian understand: good days stem from our dedication, not charlatans' empty talk. This policy exposes false promisers, winning popular loyalty. Each welfare step is concrete action proving true service to the nation. When people experience improvement, they see truth, uniting under the banner of progress. Public welfare is revival's cornerstone."
SYR_National_syndicalism:0 "Integrate National Syndicalism into Syria"
SYR_National_syndicalism_desc:0 "The fusion of syndicalism and nationalism is inevitable historical tide. This torrent cannot be stopped; it will reshape Syria's future. Any obstructers will drown. We ride the current, driving integration. This union isn't simple addition but evolutionary metamorphosis, consolidating national strength. Let opponents fade; the day fusion completes is national rebirth."
SYR_Anti_imperialist_struggle:0 "Anti-Imperialist Struggle"
SYR_Anti_imperialist_struggle_desc:0 "The imperialist domination in Syria has ended. Should they dare to extend their claws, we will sever them. Their oppression once trampled upon our land; now they will pay in blood. Not an inch of territory will be violated; every action proclaims the return of sovereignty. Syrians take up arms to defend the integrity of their homeland. Enemy probes will be met with resolute counterattacks; we are ever ready for battle. Victory belongs solely to the brave."
SYR_Glory_to_the_Arab_flag:0 "Glory to the Arab Flag"
SYR_Glory_to_the_Arab_flag_desc:0 "The tide of Pan-Arabism has swept irresistibly across Syria; all opponents who tried to block this historical torrent have been shattered. We have established unparalleled authority and influence, from Arab cities to villages. With the ardent support of the people, we have become the undisputed leading force on this ancient land, laying the firmest foundation for the great cause of unity."
SYR_Mobilize_intellectuals:0 "Mobilize the Intellectuals"
SYR_Mobilize_intellectuals_desc:0 "The spread of ideas cannot rely solely on the clarion call of fighters; it also requires the clear and powerful voices of intellectuals. We must actively recruit those insightful individuals to join our sacred cause, using their pens and wisdom to enlighten the masses for us, instilling the ideal of Pan-Arab solidarity into the heart of every Arab brother, allowing this concept to spread like wildfire."
SYR_Crush_the_enemies_of_the_revolution:0 "Crush the Enemies of the Revolution"
SYR_Crush_the_enemies_of_the_revolution_desc:0 "Any element attempting to divide Arab unity, any opposition force that foolishly resists the torrent of the revolution, are mortal enemies of our national cause, cancers we must eradicate. We will never tolerate these saboteurs; they will be crushed by an iron fist without mercy, ensuring the revolutionary process is not hindered by any internal obstacles."
SYR_Wash_the_spirit:0 "Cleanse the Spirit"
SYR_Wash_the_spirit_desc:0 "We firmly advocate for the exclusion of all religious beliefs from political life. Whether Christian churches, Jewish synagogues, or Islamic mosques, they should return to their purely sacred domains. The political stage must remain purely secular; any attempt to use religion to interfere in state affairs must be resolutely blocked. Let faith belong to faith, and the state belong to the people."
SYR_Unite_the_people:0 "Unite the People"
SYR_Unite_the_people_desc:0 "Awakening the slumbering people is our primary duty. Through continuous education and propaganda, every ordinary Syrian, every Arab brother, must clearly realize: Who has deprived them of their due dignity? Who seeks to keep them forever subjugated? Only by recognizing their true enemies can the masses rise up for their own liberation."
SYR_A_fire_of_hope:0 "A Fire of Hope"
SYR_A_fire_of_hope_desc:0 "Pan-Arabism is precisely the light that the oppressed Arab nation has longed for over centuries. The heavy shackles imposed upon us and the shadows of darkness will ultimately be dispelled by the blazing torch of Pan-Arabism that we raise high. It is not just our slogan; it is the only path of hope for the entire Arab nation to achieve revival and regain its independent status."
SYR_The_dawn_of_the_new_century:0 "The Dawn of the New Century"
SYR_The_dawn_of_the_new_century_desc:0 "Those hostile elements attempting to subvert our Pan-Arab ideals have been thoroughly purged; the revolution's foundations in Syria are rock solid. Now, a major historical moment has arrived—we need to convene a decisive congress. At this congress, we will jointly map out the future blueprint for a united Arab nation-state, laying the groundwork for a unified, strong, and prosperous Arab homeland. The flame endures."
SYR_Only_one_party:0 "One Party Only"
SYR_Only_one_party_desc:0 "The Arab Ba'ath Party is determined to project a more democratic image. This means we will broaden political participation channels, listen to voices from all social strata, and demonstrate greater inclusivity in decision-making. By showing this democratic face, we aim to win broader support, consolidate our leadership position in Syria, and lay a more solid foundation of popular will for the nation's future."
SYR_Arab_reformism:0 "Reform Instead of Revolution"
SYR_Arab_reformism_desc:0 "Past revolutions' violent conflicts caused too much unnecessary sacrifice; the lesson of blood has led us to profound reflection. Reformism offers a path to avoid further bloodshed, achieving goals through constructive dialogue and gradual change. It is clear which approach truly serves the people's welfare and national stability – this embodies our current political wisdom."
SYR_Limited_democracy:0 "Curb the Democratic Beast"
SYR_Limited_democracy_desc:0 "We support the principle of democracy but recognize that unbridled democracy is like an untamed beast, dragging the nation into chaos and division. Therefore, we must set necessary boundaries and rules for democracy, ensuring it operates on a controllable track, serving national stability and the collective interests of the people, not becoming a tool of destruction."
SYR_Oppose_extremist_ideology:0 "Grave of Extremist Thugs"
SYR_Oppose_extremist_ideology_desc:0 "Extremism, whether from outside or inside the party, is a cancer that undermines national stability and unity; it must be decisively ended. We will never allow any faction or individual to incite violence and bloodshed again. Strict disciplinary scrutiny and ideological rectification must be carried out within the party to purge those extreme tendencies that could tear society apart and endanger the revivalist cause."
SYR_End_exploitation:0 "Class Cooperation, Class Unity"
SYR_End_exploitation_desc:0 "At this stage, our primary enemies are foreign capital and the imperialist forces exploiting and controlling Syria. The Arab national bourgeoisie are not our enemies but potential partners we can win over. We must eliminate the blind hostility among the masses towards the national bourgeoisie, recognizing their important role in the chain of national development, and jointly confront external threats."
SYR_Progressive_Alliance:0 "Progressive Alliance"
SYR_Progressive_Alliance_desc:0 "To ensure the stability of the Arab Ba'ath Party's rule, we must proactively seek and strengthen cooperation with other progressive forces within the country. By building a broad political alliance and pooling forces from all sides, we can jointly meet challenges, safeguard national sovereignty and independence, and social stability, creating a more favorable internal environment for the Arab revivalist cause."
SYR_Gentle_and_united:0 "United Through Moderation"
SYR_Gentle_and_united_desc:0 "Practice has proven that our moderate approach is highly effective. It has successfully united, for the first time, the domestic forces from bourgeoisie to proletariat, and various progressive factions, under the banner of Arab revival. This broad unity transcending class and faction marks Syria's Arab society entering a new, hopeful historical stage."
SYR_Arab_unity:0 "Arab Unity"
SYR_Arab_unity_desc:0 "The Arab Ba'ath Party has decided to reach a historic unification agreement with our Pan-Arab partner—the Arab Socialist Party. The future belongs to a stronger, more united political force—an Arab Socialist Ba'ath Party blending our shared ideals! This union will infuse new, unstoppable momentum into the Arab nation's revival cause."
SYR_Transform_political_parties:0 "Transform Political Parties"
SYR_Transform_political_parties_desc:0 "Although some elders within the party dissent from or even oppose the unification agreement we reached with the Socialist Party, this cannot shake our resolve. Reality shows that a thorough transformation of the Revivalist Party is necessary. Regardless of resistance, we will unwaveringly advance this process to ensure it aligns with the fundamental demands of the Arab revivalist cause."
SYR_Encourage_sacrifice:0 "Encourage the Spirit of Sacrifice"
SYR_Encourage_sacrifice_desc:0 "We call upon and inspire the Arab people to strive courageously for the great revolutionary cause, even at the cost of their precious lives. Their spirit of sacrifice will forge the nation's monument; their descendants will surely take pride in their fathers' glory, for it is precisely these contributions that lay the foundation for freedom and prosperity in the Arab world. Freedom Tops the Sky."
SYR_Guard_of_the_Arabs:0 "Guard of the Arabs"
SYR_Guard_of_the_Arabs_desc:0 "We are the steadfast guard dedicated exclusively to the Arab nation, the extended hand and watchful eye of the Arab people. Our duty is to ruthlessly strangle all reactionaries, to vigilantly watch and thwart any imperialist schemes, defending the nation's survival and development. For this, we are willing to dedicate everything to the homeland, including life itself."
SYR_Spread_Baathlism:0 "Duty of Ba'athism"
SYR_Spread_Baathlism_desc:0 "A core duty of Ba'athism is to educate our people, liberating them from the shackles of ignorance and backward thinking. By spreading knowledge and awakening consciousness, we will shape a new generation of Arabs with ideals and conviction, providing inexhaustible drive for the revivalist cause. Empty slogans accomplish nothing."
SYR_Arm_the_people:0 "Arm the People"
SYR_Arm_the_people_desc:0 "We must arm ourselves, not just our domestic people but all Arab brothers within and outside Syria. Only by enabling the people to truly possess the means to defend themselves can we prevent them from falling into the tragic plight of being defenseless against malicious aggression, oppression, and injustice, ensuring the nation's dignity and security. Bullets Beat Everything."
SYR_Death_and_rebirth:0 "Death and Rebirth"
SYR_Death_and_rebirth_desc:0 "The ideal of Pan-Arabism once faced death, strangled by the combined forces of reaction inside and outside the party. However, it has now been reborn from the ashes, returning with greater strength and firmer resolve. This time, we vow to utterly annihilate all enemies obstructing national revival, delivering the harshest blows to all traitors and reactionaries."
SYR_Arab_Revolution:0 "Arab Revolution"
SYR_Arab_Revolution_desc:0 "After intense struggle, the Arab Socialist Party has finally defeated its most powerful opponent in the Pan-Arab arena—the Arab Ba'ath Party. With firm conviction and effective organization, we won the people's support and became Syria's new, undisputed rulers, shouldering the responsibility to lead the nation towards unity and revival."
SYR_Socialist_bridgehead:0 "Socialist Bridgehead"
SYR_Socialist_bridgehead_desc:0 "We, the Arab Socialist Party, are the most steadfast socialist bridgehead in the Arab world. We are like a sharp red wedge, a piercing spear thrust deep into the heart of the decadent, dark reactionary forces, sworn to bring light and change to this land. All the shadowy rats will not escape the judgment of dawn."
SYR_Ideological_enlightenment:0 "Tear Off the Headscarf, Liberate the Mind"
SYR_Ideological_enlightenment_desc:0 "Islam represented advanced thought in history, but today many conservatives cling rigidly to Sharia law, fearing and opposing any emerging ideological currents, terrified of shaking their absolute control over the spiritual realm. We must change this backward condition hindering social progress. Dawn will surely come."
SYR_The_farmer_owns_the_land:0 "Land to the Tiller"
SYR_The_farmer_owns_the_land_desc:0 "The landlord class, whether entrenched domestically or dependent on foreigners, is the people's most detestable enemy. Some always try to shift the focus of conflict, but we will not be fooled. The harshest measures must be taken to thoroughly overthrow these exploiters and justly distribute their illegally seized land to the hardworking peasants who own little or none."
SYR_Anti_colonial_vanguard:0 "Anti-Colonial Vanguard"
SYR_Anti_colonial_vanguard_desc:0 "Colonialism is one of the most evil inventions in human history, used to oppress people who happen to live on fertile land, plundering their wealth and dignity. We deeply abhor this and will oppose any form of colonial oppression and foreign interference with the utmost resolve, defending the Arab nation's independence and autonomy."
SYR_Social_justice:0 "Tangible Social Justice"
SYR_Social_justice_desc:0 "True social justice is no hollow slogan; it must be tangible welfare and security that every ordinary citizen can see and feel. We will dedicate ourselves to building such a society, where fairness and wellbeing benefit all who strive for the Arab revival cause. May the big rats gnawing at the granary perish utterly."
SYR_Defense_counterattack:0 "Defend, Intercept, Counterattack!"
SYR_Defense_counterattack_desc:0 "Our core task is to build a solid ideological-political defense line to withstand and eliminate all harmful, divisive ideological toxins; intercept all greedy tentacles extended by colonialists; and resolutely counterattack any form of oppression and exploitation imposed upon us by imperialism, defending the Arab nation's independence and dignity."
SYR_The_old_party_is_reborn:0 "The Old Party Reborn"
SYR_The_old_party_is_reborn_desc:0 "The Red officers within the Arab Ba'ath Party took decisive action, overthrowing the overly compromising civilian government. This was not betrayal, but allowed Arab revivalism to break free of its restraints, reborn in a new, revolutionary form full of vigor. The new era and methods of struggle have arrived; they will reshape our path forward."
SYR_Communist_program:0 "Marx's Guidance"
SYR_Communist_program_desc:0 "Karl Marx's insights undoubtedly shine with wisdom; he revealed the profound laws of social development. Our understanding is clear: true greatness cannot be achieved through wrong paths. The direction pointed by communism is the only solid road to freedom, equality, and national prosperity in a chaotic world. This is history's choice."
SYR_Syria_first:0 "Loyalty Belongs Only to Syria"
SYR_Syria_first_desc:0 "People have the right to express dissatisfaction, to voice opinions on various situations. However, complaints against Syria the Motherland itself are absolutely impermissible. The loyalty of Syrian citizens must be unreservedly, one hundred percent dedicated to our motherland—Syria. This loyalty is absolute, recognizing no right of any other country or force to share in it."
SYR_National_vanguard:0 "National Vanguard"
SYR_National_vanguard_desc:0 "We proudly stand at the forefront of national defense, the foremost nemesis of all enemies, domestic and foreign, seeking to undermine Syria's stability and hinder Arab revival. We are the sharpest blade of all Syrians. Our resolve is ironclad; our actions swift and decisive, making those who despise us shudder with fear in the midnight hours."
SYR_The_wisdom_of_the_SSNP:0 "The SSNP's Wise Men"
SYR_The_wisdom_of_the_SSNP_desc:0 "The Syrian Social Nationalist Party (SSNP) has proposed a uniquely insightful line. Its leader, Antoun Saadeh, with profound thought and wisdom, reveals himself as a rare man of insight in Syrian lands. To maximize national interest, strengthening strategic cooperation with them is a wise and necessary choice; we can jointly explore a path suited to Syria's conditions."
SYR_Embrace_the_regional_revolution:0 "Embrace the Regional Revolution"
SYR_Embrace_the_regional_revolution_desc:0 "We have never doubted the Pan-Arab revolution's great purpose or its ultimate inevitability; it is the call of the entire Arab nation. However, revolution cannot be built on quicksand. Before casting our gaze to a broader stage, we must first concentrate our energies on building up and consolidating our foundation—Syria itself—ensuring it provides a solid base for future unity."
SYR_The_right_path_in_the_world:0 "The Right Path on Earth"
SYR_The_right_path_in_the_world_desc:0 "Traditional revivalist ideas need profound renewal and an essential metamorphosis. Only by turning their core thoroughly towards communism, genuinely communizing Arab revivalism, can the oppressed people of this ancient land shake off their shackles, win liberation, and forge a great future. There is no other choice. This is history's imperative demand."
SYR_Protect_the_revolution:0 "Protect the Gains of Revolution"
SYR_Protect_the_revolution_desc:0 "The loyal officers of the Arab Ba'ath Party took decisive action, overthrowing the weak, stagnant civilian government. This was not betrayal; it was rescue. The pure ideals and revolutionary spirit of Arab revivalism faced erosion by mediocrity and compromise; we must stand firm to protect its vitality, ensuring it can bear fruit in Syrian soil. The officers' corps acted precisely to safeguard this path."
SYR_Weaken_the_power_of_civil_servants:0 "Kick Aside the Civilian Clique"
SYR_Weaken_the_power_of_civil_servants_desc:0 "The performance of the civilian clique over the past years has clearly proven their inability and lack of resolve to govern the country effectively, let alone advance the Arab revivalist cause. History has turned the page. Syria under the guidance of Arab revivalism no longer needs their antiquated mindset and hesitant ways. The future belongs to a more resolute force that knows how to act. The era of civilians is over."
SYR_Martial_law_is_normalized:0 "Normalize Martial Law"
SYR_Martial_law_is_normalized_desc:0 "The people must deeply understand this reality: saboteurs lurk everywhere like shadows, attempting to tear our nation apart from within. Therefore, all martial law measures being implemented are absolutely necessary defenses. Although this means temporary restrictions on freedom, it is to protect the more important safety of the entire nation and ultimate national stability. Please believe that once order is restored and danger passes, life will naturally return to its due tranquility and freedom. These are only necessary, temporary security measures."
SYR_Absorb_the_jihadists:0 "Absorb the Arab Nationalists"
SYR_Absorb_the_jihadists_desc:0 "The core thought of Pan-Arabism and Arab nationalism are by no means separated; quite the contrary, they are inseparable, like two sides of the same coin. Naive idealists, poisoned by heretical ideas, attempt to strip away the core national identity at the foundation of our thought, foolishly seeking to discard the cornerstone of nationalism. This dangerous fantasy is utterly incompatible with our convictions; we will never make this mistake. The national interest is our starting point and destination."
SYR_Maintain_military_governance:0 "Maintain the Military Governance System"
SYR_Maintain_military_governance_desc:0 "At this complex and challenging historical juncture, establishing a military-political integration system is an absolutely necessary choice. Officers, forged by harsh trials, are firm-willed, disciplined, and decisive in action. They can more clearly judge what the nation's security requires than civilians drowning in endless talk. They possess the iron will to make decisions and implement them in difficult times and are better able to take on the heavy responsibilities of efficiently governing the country, maintaining order, and advancing the revivalist cause."
SYR_Calling_patriotic_children:0 "Calling Patriotic Children"
SYR_Calling_patriotic_children_desc:0 "The great mission of defending Arab Syria requires the participation and dedication of every true patriotic child. The nation's rise and fall is the responsibility of every citizen. We hereby issue the strongest summons: join our army! Whether enthusiastic youth or experienced warriors, if your heart burns with sincere love for the motherland, Syria's defense forces are your home, your sacred battlefield to realize ambitions and serve the nation. Heed the call, take up arms!"
SYR_Shield_of_Syria:0 "Shield of Syria"
SYR_Shield_of_Syria_desc:0 "We, as the armed forces of the Arab Syrian state, shoulder the highest mission of defending the nation's territorial integrity, sovereign independence, and the people's safety. We are the nation's most resilient, most reliable backing and shield. Whether facing external military threats, internal subversive plots, or any other form of evil force, we will resolutely and unwaveringly guard this land and its people. Any hostility will shatter against our impenetrable defense. We are the People's Shield, the Nation's Spear."
SYR_Syrian_Revolution:0 "Syrian Revolution"
SYR_Syrian_Revolution_desc:0 "Through heroic struggle, we overthrew the rotten regime, declaring victory for the Syrian Revolution. This revolution was led by the worker and peasant masses; their day and night toil and dedication liberated us from colonial shackles. Now, Syria steps into a true socialist era: land and factories return to the hands of the people, and every worker becomes a builder of the new state. We firmly believe this is not merely a change of regime; it opens a chapter of social progress. Through united trade union organization, we will pass on the revolutionary flame, ensuring Syria is no longer ruled by oppressors. The road ahead is long, but the workers' and peasants' struggle has already laid the cornerstone in blood and sweat."
SYR_Planned_Economy:0 "Planned Economy"
SYR_Planned_Economy_desc:0 "As Syria, a nation with limited resources, we must rely on a planned economy to revitalize the nation. The vulnerability of small nations tells us that only by concentrating productive forces and distributing resources can we avoid waste and chaos. Planning is not an empty ideal; it is a practical strategy combining labor, materials, and industrial chains. This will enable us to compete internationally and avoid the volatility of an unordered market. Through the leverage of state planning, we can transform limited funds into the foundations of key industries, ensuring every effort serves the welfare of all. In short, the planned economy is our core weapon, helping our small nation rise in turbulent times."
SYR_Formulate_a_five_year_plan:0 "Formulate a Five-Year Plan"
SYR_Formulate_a_five_year_plan_desc:0 "We launch an ambitious Five-Year Plan with a clear goal: to achieve Syria's industrial transformation and preliminary modernization within five years. This plan will guide the nation to utilize untapped resources like agricultural and mineral products, converting them into power sources for industrial production. Through specialized committees, we will assign tasks to every factory and rural collective, ensuring work advances efficiently—not idle talk, but down-to-earth action. Within five years, Syria will shed its dependency on agriculture and establish a basic manufacturing system, directing national wealth into the hands of laborers. Time is pressing, but concentrated effort can bring a leap in national strength and prosperity."
SYR_Promote_collectivization:0 "Promote Collectivization"
SYR_Promote_collectivization_desc:0 "Natural disasters or poor harvests are not the peasants' fault, yet they often destroy hard-working families. We recognize that individual economies are powerless against these calamities—therefore, agricultural collectivization must be implemented. By unifying land and resources under centralized management, we establish mutual aid funds drawn from public finances. When disaster strikes, peasants can receive timely aid, avoiding famine and bankruptcy. This ensures stable livelihoods and motivates them to accumulate more grain wealth for the nation. The reality is, we cannot punish heroic laborers for God's blows; instead, collectivization is our shield, making Syria more resilient to challenges."
SYR_Everyone_is_a_builder:0 "Everyone is a Builder"
SYR_Everyone_is_a_builder_desc:0 "Syria's revival depends not on a select elite, but is the common cause of all citizens. The hands of every worker, peasant, and intellectual are tools of construction, together building the nation's backbone. Through organized unions and community networks, we integrate scattered forces, ensuring no one is overlooked in the tide of revolution. From factory lines to field labor, every contribution gathers as the driving force for national progress. We understand that only full mobilization can awaken sleeping potential. This is no idle theory; it is growth achieved through disciplined unity, allowing Syria to reshape itself in cooperation, ensuring prosperity stems from everyone's sweat."
SYR_Kill_the_reactionaries:0 "Kill the Reactionaries"
SYR_Kill_the_reactionaries_desc:0 "Reactionaries are like vipers lurking in the shadows, eroding the gains of revolution—we cannot tolerate their corrupting the motherland. They attempt to restore the old order, denying the interests of workers and peasants; thus, we must resolutely cleanse these remnants. Through secret police and mass surveillance, we expose and judge traitors, ensuring the nation is safe from division. History will prove we need not sympathize with the enemy: the purge is not cruelty but a necessary means to defend the homeland. Our goal is a pure revolutionary force, allowing Syria to advance unimpeded. Remember, the slightest compromise leads to national decline."
SYR_Agrarian_Revolution:0 "Great Agrarian Revolution"
SYR_Agrarian_Revolution_desc:0 "The Agrarian Revolution is our core mission: confiscate land seized by landlords and return it to its true owners—the nation and the people. Exploitation by the landlord class has left peasants trapped in hunger and cold; through a decree of compulsory acquisition, we unify fragmented farmland under state management. This not only increases grain production but also mobilizes rural forces for industrialization. Resources must serve all the people, not a few parasites. After launching this revolution, land wealth will be redistributed fairly, ensuring every inch of soil contributes to building a strong, prosperous Syria. The revolutionary path is hard, but fair distribution is the cornerstone of civilization."
SYR_A_sanctuary_for_all_citizens:0 "Sanctuary for All Citizens"
SYR_A_sanctuary_for_all_citizens_desc:0 "We proudly declare: the Syrian state and party are the sturdy shield of every citizen. From workers and peasants to soldiers, our duty is to provide safety and support—establishing social security funds against unemployment, illness, or accident. This stems from the collective ideal: a nation united in mutual aid can withstand external shocks, ensuring no one is left behind. The party is not a distant bureaucratic machine but a guardian on the front lines, listening to needs and acting promptly. We know protection is not just a slogan; it is achieved through laws and resource allocation for fair living. Let us safeguard our homeland with an iron fist, so Syria thrives under a unified banner."
SYR_Social_revolution:0 "Social and Cultural Revolution"
SYR_Social_revolution_desc:0 "Ignorance is the legacy of the old society, hindering Syria's progress—thus, we launch a thorough ideological and cultural revolution. Through schooling, union lectures, and public media, we disseminate scientific knowledge and critique superstitious old customs. This concerns popular enlightenment: empowering the laboring people with critical thought, freeing them from blindness. The cultural revolution is the foundation stone for economic leap; it will awaken dormant intellectual resources. Learn advanced foreign technology and management models, filtering out toxins solely for Syria's use. Breaking ignorance, the nation will stride into a new era illuminated by reason."
SYR_Crush_spiritual_opium:0 "Crush the Spiritual Opium"
SYR_Crush_spiritual_opium_desc:0 "We face reality: religion, as spiritual opium, numbs the people's minds and weakens the will to struggle—thus it must be crushed. Those pulpits preach fatalism, making laborers submit instead of challenge oppression. Through decrees banning religious activities, we promote atheist education, exposing dogmas as tools of the rulers. We need no empty praise; history will vindicate this action: destroying spiritual shackles allows the people to devote themselves fully to construction. Smashing religion is not violence; it is the necessary path to liberate the mind, allowing Syria to reshape confidence and strength through materialist reason."
SYR_egalitarian_ideology:0 "Classless Utopia"
SYR_egalitarian_ideology_desc:0 "The egalitarian utopia is not fantasy; it demands the thorough elimination of the bourgeoisie. This class of exploiters grows rich on workers' blood and sweat, creating social division—therefore we must uproot their foundation. Through nationalization actions, we confiscate their assets, converting them into public wealth. The greed of the bourgeois is a stumbling block to national progress; after eliminating them, resources will be distributed fairly, everyone enjoying the fruits of labor under the socialist framework. This restores social justice and boosts economic efficiency. Remember, true equality stems from the struggle against class; let Syria shine under proletarian leadership."
SYR_no_allah_no_master:0 "No Allah, No Master"
SYR_no_allah_no_master_desc:0 "Syria rejects Allah's guidance and all domineering masters! Whether foreign interveners or domestic oppressors, they have dragged the nation down. We need self-reliance, destiny led by the worker-peasant masses. Syria will not succumb to illusory theocracy; instead, we will use law to purge these dependencies, fostering the national will. This is about independent dignity: shedding old religious shackles and colonial remnants, allowing Syria to rise through its own strength. History proves the true protector is oneself, not tyrants in heaven or on earth. Discarding these fetters, we advance freely toward the new dawn."
SYR_The_hometown_of_syndicalism:0 "Homeland of Syndicalism in the Middle East"
SYR_The_hometown_of_syndicalism_desc:0 "Syria is becoming the spiritual homeland for syndicalists across the Middle East. While other nations struggle with division, we offer a haven: trade union organizations receive exiled comrades, sharing experience and resources. This stems from the revolutionary spirit: syndicalism is not a slogan but a tool to unite workers, condensing scattered strength into a national pillar. Syria's resources and technology will serve all fighters, making it a beacon for the region. As homeland, we not only shelter travelers; we inspire them to return home and plant the seeds of revolution. This is a path of mutual benefit, allowing Syria to grow its influence through alliance."
SYR_Marxist_Leninist_base_area:0 "Marxist-Leninist Base Area"
SYR_Marxist_Leninist_base_area_desc:0 "We open our arms, making Syria a solid base area for communists worldwide. Facing global turmoil, we offer training grounds and sanctuaries, blending local struggle with an international perspective. Communism is not textbook dogma; it is realized through state planning, worker control of production, and shared resources. We can leverage Syria's geographical advantage to build connective networks, spreading revolutionary ideas. This will strengthen the nation while aiding fraternal movements. The base area is not just a refuge; it is a crucible catalyzing change, giving all comrades a sense of belonging through construction."
SYR_New_era:0 "Out With the Old, In With the New"
SYR_New_era_desc:0 "The shadows of the old society have faded; we step towards a brighter, enlightened future. Through revolutionary tempering, Syria has shed corruption and ignorance, welcoming a new era led by workers and peasants. This is not mere idealism: industrial development and cultural renewal have laid a solid foundation, ensuring national prosperity in the light of reason. We must see the direction clearly; every action must avoid repeating past mistakes; resources serve the welfare of all, not the few. The future is filled with unknowns, but collective effort lights the path. From night to dawn, Syria advances united; history will witness this era of light."
SYR_victory_of_democracy:0 "Triumph of Democracy"
SYR_victory_of_democracy_desc:0 "The tide of democratic revolution has taken root in Syria; the people's blood and sacrifice have earned a fresh start. Now is the time to consolidate this gain through fair elections. We will organize nationwide voting, ensuring every citizen's voice is heard, thereby building a stable democratic system. This fulfills the promise of revolution and serves the nation's long-term peace and stability. We must act cautiously, avoiding any unrest, making elections a bridge uniting the people, not a fuse for division. Through this step, we will prove Syria's ability to manage its own destiny."
SYR_Damascus_faction:0 "Damascus People's Party"
SYR_Damascus_faction_desc:0 "The Damascus People's Party stood out in fierce electoral competition, winning the people's broad trust, formally becoming Syria's ruling force. This victory is no accident; it stems from our long-term grassroots involvement and listening to the people's will. As the ruling party, we shoulder the heavy responsibility of rebuilding the nation, driving economic recovery and social justice. The election result demonstrates the people's thirst for change; we must not disappoint expectations, responding with pragmatic policies. Uniting the entire nation, we will guide Syria toward prosperity, ensuring every decision serves the public welfare."
SYR_New_Sultanate:0 "A New Sultanate?"
SYR_New_Sultanate_desc:0 "President Said al-Jazair hails from a chieftain family in Algeria, presenting us with a significant choice: restore the traditional Sultanate system or resolutely advance the democratic path? We must weigh the pros and cons. The Sultanate may evoke national pride, but democracy better guarantees people's rights. At the crossroads amidst the war, we need prudent assessment, avoiding blind regression to the past. Through nationwide discussion, we will listen to all opinions, ensuring the final decision is based on national interest, not personal sentiment. Whichever path chosen, the goal is to strengthen Syria's unity and stability."
SYR_Characteristic_secularism:0 "More Moderate Secularism"
SYR_Characteristic_secularism_desc:0 "Socialists often preach violent secularization, or conversely avoid religious issues entirely, only deepening social rifts. We oppose such extremes but cannot ignore the need for secularization. As realists, we advocate a moderate path: promoting secular reform gradually through dialogue and education, respecting religious freedom while ensuring national unity. We must balance religion and politics, avoiding conflict, making secularism a tool to unite rather than divide. This strategy will protect Syria's multiculturalism while advancing modernization."
SYR_Eliminate_division:0 "Eliminate People's Party Division"
SYR_Eliminate_division_desc:0 "The People's Party has split into two major factions: the Damascus Faction emphasizes nationalism; the Aleppo Faction advocates liberalism. If unchecked, this opposition will weaken the party and national stability. We can no longer tolerate the spread of division; we must act immediately to mediate. Through internal meetings and shared goals, we will reconcile differences, emphasizing unity above all. Each faction represents part of Syria; only through cooperation can we meet internal and external challenges. Unity is not a slogan; it is the foundation stone of survival. We will rebuild party cohesion with it."
SYR_fellow_Algerians:0 "Our Algerian Brothers?"
SYR_fellow_Algerians_desc:0 "Algeria, the President's homeland, our Arab brothers suffer brutal oppression under French colonialists—an intolerable shame. Syria has a duty to extend aid; we must mobilize forces to liberate them. Suffering under colonial rule demands our action. Through diplomacy and support, we will back Algeria's struggle. This concerns not just national sentiment; it is the call of justice. Liberating our brothers is Syria's mission; we advance this goal with resolute determination, ensuring Arab world unity is not torn apart by external force."
SYR_Towards_social_progress:0 "Towards Social Progress"
SYR_Towards_social_progress_desc:0 "Syrian society is steadily progressing; each step is based on the people's labor and wisdom. The economy revives, education spreads, infrastructure improves—all manifest orderly development. We will not rush; we advance reforms steadily, ensuring every citizen benefits. Social progress is not empty talk; it is achieved through concrete policies: fair distribution of resources and guaranteed basic rights. In this process, we will remain patient, avoiding turmoil, making Syria a beacon of stability and hope."
SYR_Healthy_politics:0 "Model of Democracy"
SYR_Healthy_politics_desc:0 "Syria is destined to become a model democracy for the Middle East; our system will shine, envied by neighbors like Egypt. Through successful governance, we will showcase how democracy brings prosperity and dignity. This is not arrogance but confidence rooted in reality: people participate in decision-making, rights are protected, thus the nation strengthens. Let the world witness Syria's achievements; we will influence the entire region by the power of our example. Democracy is not fantasy; it is a path we tread daily, proving Syria's rise is unstoppable."
SYR_National_reconciliation:0 "National Reconciliation"
SYR_National_reconciliation_desc:0 "Historic hatred belongs to the past; now is the crucial moment to promote national reconciliation. We must set aside past conflicts, healing wounds through dialogue and inclusive policies. Every group is a precious part of Syria; reconciliation is not weakness but the embodiment of wisdom. We will hold national conferences, fostering mutual understanding, ensuring all communities share the nation's fruits. Hatred only hinders progress; unity will unleash enormous potential. In this process, we call on all citizens to join hands, co-writing Syria's new chapter."
SYR_Recognize_the_Alawites:0 "Recognize the Alawites"
SYR_Recognize_the_Alawites_desc:0 "Some question whether the Alawites belong to Islam; this is pure misunderstanding. Although doctrinal details differ, we all faithfully serve God—this is undeniable truth. We must refute such divisive speech, emphasizing the importance of religious unity. The Alawites are members of Syria's Muslim family; their faith is equally sacred. Through education and propaganda, we will dispel prejudice and promote sectarian harmony. God's teachings are the cornerstone of unity, not an excuse for division. Upholding this truth ensures the nation's spiritual stability."
SYR_Autonomous_regions:0 "Establish Ethnic Autonomous Regions"
SYR_Autonomous_regions_desc:0 "To prevent ethnic conflict, we must establish ethnic autonomous regions, granting each group its own space for self-governance. This is not about dividing the nation; it is ensuring peaceful coexistence through rational division. Autonomous regions will respect cultural differences while maintaining the national unity framework. We will allocate resources fairly based on geography and history, avoiding the marginalization of any group. This measure is a realist solution, effectively reducing friction and allowing ethnic groups to focus on development rather than confrontation. Through this system, Syria will achieve enduring peace and stability."
SYR_Aleppo_faction:0 "Aleppo People's Party"
SYR_Aleppo_faction_desc:0 "We, the Aleppo People's Party, achieved a resounding victory in the recent elections and now officially hold power in Syria. This victory was hard-won; through carefully organized campaigning, we promised the populace stability and order, ultimately winning the majority of seats. As the ruling party, we will firmly control the state apparatus, ensuring our will becomes law. As for the opposition? They are mere noise. We will maintain rule with an iron fist, guiding Syria towards 'prosperity' under our leadership. Power is in our hands; any challenge will be ruthlessly crushed."
SYR_Protect_landlords:0 "Protect the Landlords"
SYR_Protect_landlords_desc:0 "The landlords are our solid backbone; without their land and wealth, how could we stand firm? Therefore, we must prioritize their needs. The government will implement policies like land tax reductions and strengthened property rights to ensure their interests are secure. Those poor peasants want to cause trouble? We will send police to suppress them, never letting these underclasses shake our foundations. After all, national stability relies on the elite class, not those mud-caked legs constantly clamoring for equality. We must make them understand who the true masters are."
SYR_Appoint_social_elites:0 "Appoint Social Elites"
SYR_Appoint_social_elites_desc:0 "What do those politicians educated abroad know? Constantly spouting democracy and freedom, yet they don't even grasp Syria's foundations. The social elites are different; they are rooted locally, deeply aware of our traditions and hardships. We will invite these traditional figures into the government, appointing them as advisors or ministers. Their wisdom can help us formulate pragmatic policies, avoiding those flashy Western traps. Modern progressives, step aside—the government only listens to our voice. Syria's problems must be solved by our own people."
SYR_Market_and_national_freedom:0 "Free Market, Free Nation"
SYR_Market_and_national_freedom_desc:0 "The free market is the cornerstone of national revival—without the shackles of economy, Syria can truly become strong. We will promote trade liberalization and privatization, letting merchants operate freely, wealth naturally flowing into elite hands. Those socialists preaching fair distribution? All empty talk! Only when the market is free will the nation have vitality, and we remain in control. The government will reduce intervention and encourage investment, but remember, this freedom belongs only to classes we recognize. The lower classes wanting a slice? Not a chance. National freedom means, ultimately, what we say goes."
SYR_The_elite_governed:0 "Elite Rule"
SYR_The_elite_governed_desc:0 "Government is not a place for those mud-caked legs; it must be controlled by the elite. We will strictly screen officials, appointing only those well-educated and from reputable families. Those commoner representatives? They only bring chaos and populism. We must set thresholds, like property or educational requirements, ensuring efficient government operation. The demands of the underclass? Ignore them; they don't understand governance. Syria's future can only be planned by us, the upper class. Anyone trying to break this order will be suppressed by us."
SYR_Suppression_of_Damascus:0 "Suppress the Damascus Faction"
SYR_Suppression_of_Damascus_desc:0 "That Damascus Faction, naively wanting democracy? They give speeches everywhere, currying popular favor, practically challenging our authority. We cannot sit idly by! The government will take action: banning their assemblies, arresting leaders, even shutting down their newspapers. Popular will? Hah, mere tools! We'll use the propaganda machine to smear them, convincing the masses democracy is a fraud. Syria doesn't need such chaos; only our iron-fisted rule brings order. Suppressing them cannot wait."
SYR_Limit_pan_Arabism:0 "Limit Pan-Arabism"
SYR_Limit_pan_Arabism_desc:0 "Pan-Arabism was a good idea, uniting the Arab world, but socialists dared to hijack it, preaching equality and revolution. This is blasphemy against our ideals! We cannot tolerate this distortion; we must severely crack down on these leftists. The government will strengthen monitoring, disband their organizations, arrest core members. They want to incite grassroots rebellion? We'll use the army to suppress it, ensuring national stability. Syria's future can only be defined by us elites, not these dangerous idealists."
SYR_Defend_democratic_power:0 "Defend Democratic Power"
SYR_Defend_democratic_power_desc:0 "We Syrians are born to enjoy democracy; it's a right ingrained in our bones. Voting, speaking out, assembling—these are fundamental. Some tried to lock it away in the past? A waste of effort. Now, whatever they say, they want to steal these tools? Not a chance! The grip we've tightened will never loosen. Syria's future must heed the people's voice."
SYR_Politics_for_all:0 "Politics For All"
SYR_Politics_for_all_desc:0 "What is democracy? It's not decreed from above; it needs every one of us pitching in. Pondering national affairs in fields, discussing policies in town markets, even arguing in parliament—all legitimate participation. Shouting slogans without action won't do; bystanders aren't democracy. Everybody lend a hand; the nation's cart rolls steady and true. Responsibility is shared; no one escapes."
SYR_Counter_revolutionary_revolutionaries:0 "Counter-Revolutionary Revolutionaries"
SYR_Counter_revolutionary_revolutionaries_desc:0 "Don't forget, the power we hold was won through revolution—shouting ourselves hoarse, shedding blood and sweat. History has a way of repeating itself. Now that we're secure, we must stay vigilant—especially towards those socialists always clamoring to smash everything. They preach new revolution, but who knows what ditch they'd drag the nation into? Guard against anyone mimicking our old path under a different banner, stirring up the hard-won order once more."
SYR_Ethnic_groups:0 "Ethnic Groups"
SYR_Ethnic_groups_desc:0 "The people made their choice at the ballot box; the Ethnic Groups bloc won the election outright. There's no contesting this; the result is clear. We are now the legally elected ruling party; we must shoulder this responsibility. The old tricks of the opposition must be set aside. Order must be maintained; national policies must be implemented. Power entrusted to us must answer to every vote cast for us."
SYR_True_national_independence:0 "True National Independence"
SYR_True_national_independence_desc:0 "Those people, whether Aleppo Faction or Damascus Faction, love nothing more than meetings where they chant 'democracy,' 'democracy,' words sweeter than song. But do they grasp the true source of strength? The nation's backbone? It's Syria's national spirit! Fine words alone can't prop up a country. We must correct their thinking, make them open their eyes and see: nationalism is the foundation that unites hearts, defends the homeland. This truth, they must truly understand."
SYR_Reconciliation_with_the_Ottomans:0 "Reconciliation with the Ottomans"
SYR_Reconciliation_with_the_Ottomans_desc:0 "It's pointless to keep dredging up old grievances! However much we hated it, the Ottoman shadow clung to us for centuries. But it's time to turn the page, look forward, think practically. Talking with Istanbul needn't be surrender; it paves a safer path for our descendants. Trade, relations—both sides live more comfortably if relations improve. After all, neighbors are neighbors; what good comes from enmity?"
SYR_Working_with_reformists:0 "Cooperate with Reformists"
SYR_Working_with_reformists_desc:0 "What's wrong with Pan-Arabism? Doesn't it yearn for us Arab brothers to unite, no longer bullied by outsiders? This aspiration itself isn't flawed; the fault lies with those madcap radicals who twisted a fine ideal into a blade of extremism and division! The authentic Arab Ba'ath Party, with its principles and ideals, sincerely wants to work for progress. Don't let a few bad apples spoil the barrel!"
SYR_Only_Syria:0 "Syria Only"
SYR_Only_Syria_desc:0 "Citizens of Syria must always remember: from where did you gain the right to stand tall and speak freely today? To walk freely in the streets? It came not from heaven but from our shared homeland! This land nurtures every one of us. Patriotism isn't just mouthing love; it's a burden. Patriotic education is essential; serving the nation must be willing. This land and our lives are irrevocably intertwined."
SYR_A_united_government:0 "A United Government"
SYR_A_united_government_desc:0 "We're fed up with endless parliamentary bickering! Can quarrels produce bread? Achieve anything? We need a government that truly gets things done! One that clenches its fist and focuses strength where it matters. Streamline where necessary; silence the chatter. Constant squabbling only rends the nation like worn cloth at critical moments. Efficiency and unity—that's what's most lacking now."
SYR_Everyone_participates:0 "Everyone Participates, Everyone Gains"
SYR_Everyone_participates_desc:0 "Enabling everyone to dabble in politics? Only the beginning! True democracy must bring inner contentment, the sense that days hold promise. All that effort—elections, shouting for freedom—yet people's bowls still empty, streets chaotic? What was the point of all that struggle? Don't call deception democracy. Policy must truly touch heads, improve lives tangibly—only then is democracy on track."
SYR_Democratic_barriers:0 "Democratic Ramparts"
SYR_Democratic_barriers_desc:0 "In this region, our patch of Syria, we will be the different standard-bearer. We tread the democratic path, shunning those cultish creeds. Whether it's zealous winds blowing east or west, when they reach us, they must retreat. We'll reinforce our ramparts, ensure the military stands firm, the state machinery reliable. Our home secure, lamplight tranquil—this is paramount. A fortress must be built like a fortress!"
SYR_Corrective_movement:0 "Corrective Movement"
SYR_Corrective_movement_desc:0 "Salah Jadid's policies are a disastrous mistake—his insistence on secularism will only tear apart Syria's religious foundations. As guardians of the state, we cannot stand idly by: secularization means abandoning millennia of tradition, leading us astray. We are the first to oppose this dangerous experiment; Syria must maintain the spiritual bond of faith at its core. History teaches that ignoring religious values weakens national unity. We call on all patriots to join us in preventing this abyss, protecting Syria's true soul."
SYR_The_Druze_Mountain_Revealed:0 "The Druze Mountain Revealed"
SYR_The_Druze_Mountain_Revealed_desc:0 "The Druze have firmly seized the initiative in Syria; this is the golden opportunity to reshape the nation. After years of quiet contribution, we now implement the Druze vision: strengthen local governance, guarantee community rights. Plans include reforming the legal system to ensure fair treatment for every group. Control is not privilege but responsibility—we will build a more united Syria, eliminating injustice. Through tangible policy, we are step-by-step rebuilding society, guiding the nation back onto a stable course."
SYR_Druze_rights:0 "Druze Rights"
SYR_Druze_rights_desc:0 "Looking back on Druze history, we were often marginalized, even bullied, but today everything has changed. With new opportunities in hand, we prioritize advancing our rights: striving for equality in education, employment, and social status. As Syrians, this is overdue justice. Measures include forming oversight committees to prevent recurrence of past tragedies. Rights are more than slogans; they are practical needs, concerning dignity and future. We are driving these changes, ensuring every Druze can live with head held high."
SYR_Reconciliation_with_Sunnis:0 "Reconciliation with Sunnis"
SYR_Reconciliation_with_Sunnis_desc:0 "It is time to set aside the ancient rift between us and the Sunnis—sectarian conflict will only fracture Syria's social fabric. The immediate priority is national unity: through dialogue and shared platforms, resolving long-standing misunderstandings. Differences stem from history, but the future requires mutual support. We advocate convening reconciliation talks to build trust. Syria's strength lies in internal cohesion, not breaking into fragments. Let grievances fall; jointly build a peaceful homeland—this is the path of progress."
SYR_Long_forgotten:0 "Long Forgotten"
SYR_Long_forgotten_desc:0 "Let those obstinate old sheikhs who refuse reconciliation, fixated on old ways, fade away in the Druze mountains. The new era belongs not to conservatives but to us who embrace change. Syria needs integration and progress; the sheikhs' stubbornness has become an obstacle. We focus on building a modern society: strengthening education, promoting innovation. The future summons us to act, not stagnate in the mountains. The nation's revival depends on the efforts of a new generation; let outdated ideas naturally fade."
SYR_Love_your_country_first:0 "Love Your Country First"
SYR_Love_your_country_first_desc:0 "Druze are born statists: loyalty lies where one resides. In Syria, we are loyal Syrians—patriotism is our core identity. Anyone who does not love this land is not truly Druze. Our doctrine teaches loyalty to the homeland: participate in national defense, uphold sovereignty. As a national pillar, we must reinforce this principle. Syria is our home; love of country transcends all differences. This is not just duty; it is the manifestation of faith."
SYR_Alavestan:0 "Alavestan"
SYR_Alavestan_desc:0 "The Alawites have assumed Syria's leadership; we immediately set out to reshape the nation. The vision is clear: centered on progress and justice, sweeping away corruption and advancing social reform. Control grants us the power to restart the economy and ensure fair distribution of resources. As Alawites, we know the responsibility: Syria cannot remain in the past. Policies will incorporate community input, ensuring nationwide benefit. Each step of rebuilding moves towards a brighter future."
SYR_True_faithful:0 "The Truly Faithful"
SYR_True_faithful_desc:0 "We Alawites firmly believe we are the truly faithful, upholding pure doctrine. The incomprehension or criticism of outsiders we disregard—that is their narrowness, unrelated to truth. Syria's progress isn't dictated by outsiders; it relies on our actions based on conviction. We will implement reforms to prove the power of faith. Misunderstanders cannot hinder our advance; focus on building a strong society. Loyalty to inner faith is the foundation of national revival."
SYR_Promote_social_liberation:0 "Promote Social Liberation"
SYR_Promote_social_liberation_desc:0 "The Alawites have always been at the forefront of progress; now more than ever, we strive to promote social liberation: granting women equal rights, relaxing archaic customs. Syria cannot remain bound by the past; liberation means more open education and employment opportunities. As leaders, we initiate reforms: abolishing unjust laws, promoting freedom of thought. Progress is the engine of the nation; we accelerate its pace, making liberation benefit all people. Druze cooperation enhances this task; together we create a new era of emancipation."
SYR_The_sage_of_Palestine:0 "The Sage of Palestine"
SYR_The_sage_of_Palestine_desc:0 "We will forever remember the Grand Mufti Hajj Amin al-Husseini, that Sunni sage from Palestine, who was the first to recognize the status of the Alawites. Such foresight was invaluable in turbulent times, building a bridge of mutual respect. His actions exemplified the true spirit of unity: transcending sect to jointly defend the faith. We Alawites are grateful for his contribution, which inspires us to set aside prejudice. Remembering Hajj Amin is upholding the path of inclusion, advancing social reconciliation."
SYR_Alis_guidance:0 "Ali's Guidance"
SYR_Alis_guidance_desc:0 "Under the guidance of the wise Ali ibn Abi Talib, Syria advances toward unprecedented prosperity: economic revitalization, social harmony, spiritual renewal. We follow his teachings, balancing development and fairness: investing in trade networks, upgrading infrastructure. Prosperity is not only material growth; it includes spiritual renaissance. Every step forward stems from Ali's inspiration; we ensure the nation benefits from these principles. The future is bright; Syria will soon become a regional beacon."
SYR_Promote_integration:0 "Promote Integration"
SYR_Promote_integration_desc:0 "In Syria, we are vigorously promoting the integration of different ethnicities and religions, building a diverse yet unified society. Policies include establishing community centers, organizing interfaith events, enabling Christian, Jewish, and Islamic groups to interact. The goal is to foster understanding through shared spaces, reducing conflict. Integration is not mere idealism; it is the foundation of national strength. We Druze and Alawites lead this endeavor, ensuring every ethnic group has a fair voice. Unity begins with small actions; we will make Syria a model of harmony."
SYR_A_place_where_all_religions_are_equal:0 "A Place Where All Religions Are Equal"
SYR_A_place_where_all_religions_are_equal_desc:0 "Syria is a homeland of equality: Whether you follow Judaism, Christianity, Islam, another faith, or belong to another ethnicity, as long as you are sincerely patriotic, we welcome you with open arms. Here, the spirit of patriotism transcends any difference. We are fostering an inclusive environment: laws guarantee equality; job opportunities are open. Loyalty to the nation matters most, not background. Integration makes society stronger; we promote this ideal, ensuring every Syrian helps build the future. Welcome, join the ranks of patriots."