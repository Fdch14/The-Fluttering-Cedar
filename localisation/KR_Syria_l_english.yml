SYR_Overthrow_Iraqi_Monarchy_desc:0 "Desperate Iraqis accepted King Yusuf I of the Montifi Alliance. Though Sunni, Yusuf's Montifi base is Shia-dominated, granting him popularity in Shia-majority Iraq. Yet Pan-Arab nationalists (mostly Sunni) reject his Mashriq neutrality policy as threatening their dream.\n\nTo 'resolve' this, the Muthanna Club collaborates with Syrian branches to overthrow Yusuf. With senior military conspirators, success is likely—but will Muthanna's new regime honor unification pledges?"
SYR_Overthrow_Iraqi_Republic:0 "Overthrow Iraqi Republic"
SYR_Overthrow_Iraqi_Republic_desc:0 "Though Iraq embraced democracy, the military holds real power. Officers linked to the Pan-Arab Muthanna Club resent Shia dominance and openly advocate a unified Mashriq state.\n\nSupporting their coup may damage Syria's reputation but advances Arab unification and extends our influence beyond Syria."
