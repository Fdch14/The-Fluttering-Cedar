cp.4.e:0 "They will decide their own fate."
syrfor.1.t:0 "[SYR.GetNameDef] Invites Us to Join the Arab League"
syrfor.1.d:0 "To strengthen Arab unity and protect against imperialism, the government in Damascus has announced a new initiative to enhance economic and diplomatic exchanges among Arab nations. This transnational organization, known as the 'Arab League,' is undoubtedly a tool for Damascus to expand its influence on the peninsula. Yet, it is also a practical attempt by pan-Arab nationalists to build a stronger, more prosperous Arab state."
syrfor.1.a:0 "We gladly accept."
syrfor.1.b:0 "Leave us alone."
syrfor.2.t:0 "[FROM.GetNameDef] Accepted Our Proposal"
syrfor.2.d:0 "Our friends in [FROM.GetName] have accepted our proposal and signed the agreement to formally join the Arab League. With another member added to the League, our strength to promote prosperity in the Levant grows!"
syrfor.2.a:0 "Welcome!"
syrfor.3.t:0 "[FROM.GetNameDef] Rejected Our Proposal"
syrfor.3.d:0 "Those bastards in [FROM.GetName] actually believe colluding with imperialists is worth more of their time and effort than the unity of the Arab world's people. We cannot change their minds now. Politicians at home are already condemning them, denouncing this brazen act of betrayal."
syrfor.3.a:0 "May Allah destroy them!"
syrrev.1.t:0 "The Damascus Uprising"
syrrev.1.d:0 "As war rages across the Mashriq, the people of Damascus have once again proven their loyalty. Earlier today, a Druze army entered the Syrian capital and, with the help of local residents, overthrew the Turkish garrison. Turkish shops across the city were destroyed, and Turks were hunted down. The heat of revolution is spreading among the Arabs."
syrrev.1.a:0 "For Allah!"
syrrev.1.b:0 "Syria wishes you peace! (Transfer to Syria)"
syrrev.3.t:0 "Al-Karak Joins the Rebellion"
syrrev.3.d:0 "In 1910, the Young Turks disarmed the Bedouins of Al-Karak to maintain Ottoman rule, drenching the land in blood. Now, Al-Karak has answered the call of the Druze and other Syrian groups, joining the Syrian rebels. As a vital hub on the Hejaz Railway, its rebellion has shocked the Ottoman government in the north. Constantinople fears that failure to suppress the rebels could leave Jerusalem wide open."
syrrev.3.a:0 "It seems the Arabs are launching a full-scale rebellion..."
syrrev.5.t:0 "Aleppo Joins the Rebellion"
syrrev.5.d:0 "The rebellion spreads! Arab tribes in Aleppo and Cilicia have risen in revolt, joining the Syrian War of Independence alongside their comrades. These two Syrian Vilayets were the strongest link between Turkey proper and Syria, yet even they have abandoned the Sultan for independence. Chaos reigns in the cities. Unrest has spread north to İskenderun. While full-scale rebellion hasn't erupted there yet, tensions between ethnic groups and non-Muslims may be preventing it."
syrrev.5.a:0 "Make it stop!"
syrrev.6.t:0 "Homs Joins the Rebellion"
syrrev.6.d:0 "Following the Sunni uprising, the Alawites have risen too, leaving the Ottoman Empire furious at events in Greater Syria. The alliance between Sunnis and Alawites is fragile, but for now, they fight together to defeat the Ottoman Empire."
syrrev.6.a:0 "We will be back!"
syrrev.8.t:0 "Syrian Rebels Defeated"
syrrev.8.d:0 "The traitors in Damascus have finally been suppressed. The remaining stragglers were crushed by Ottoman armored vehicles and tank divisions. Order should soon return to Syria. With Ottoman forces now firmly in control, a second uprising is unlikely anytime soon."
syrrev.8.a:0 "Hooray!"
syr.1.t:0 "Victory of the Great Revolt"
syr.1.d:0 "With the Ottoman defeat, the last Ottoman troops in Syria surrendered to the Damascus government. The Syrian Army has taken full control of Greater Syria. Syria has won a complete victory; its independence is unstoppable. This is another great victory for the entire Arab world. Rejoice for the freedom of the Syrian homeland!"
syr.1.a:0 "Hooray!"
syr.2.t:0 "Transfer of Power"
syr.2.d:0 "Marshal Sultan al-Atrash is not greedy for power; in fact, he despises it. He believes power corrupts the mind and willpower, turning devout believers into hypocritical traitors. To ease tensions between Druze and Sunnis, Marshal Sultan al-Atrash formally transferred power to the Military Command. General Husni al-Za'im becomes the new Head of State, ending Syria's provisional status."
syr.2.a:0 "Remember him always."
syr.3.t:0 "Protests"
syr.3.d:0 "Civilian groups and advocates for democratic reform have expressed strong dissatisfaction and suspicion regarding General Husni al-Za'im's appointment as Head of State. They believe this high-level appointment clearly favors the military, failing to reflect the civilian government's proper leading role. Critics particularly fear this arrangement weakens the nation's democratic framework and implies a risk of 'dictatorship.' Therefore, they are publicly demanding Husni al-Za'im fulfill his core transitional promise: promptly initiate free and fair democratic elections to peacefully transfer power to an elected civilian government."
syr.3.a:0 "Let them protest."
syr.4.t:0 "Professor Sa'ade Returns Home"
syr.4.d:0 "Antun Sa'ade, the prominent Syrian political figure exiled for years, officially returned to his homeland today. His flight landed safely at Damascus Airport. Professor Sa'ade had long been exiled in various South American countries, rallying Syrian communities abroad to defend Syria and raising funds from immigrant groups. As an influential scholar and activist, Antun Sa'ade is the leader and founder of the Syrian Social Nationalist Party (SSNP). He is also a long-time ally and supporter of General Husni al-Za'im."
syr.4.a:0 "Welcome!"
syr.5.t:0 "Shishakli's Proposal"
syr.5.d:0 "At a high-level meeting, General Adib Shishakli, a key figure in the military junta, proposed a significant strategic suggestion: forge a deep, close strategic partnership with the Syrian Social Nationalist Party (SSNP). General Shishakli emphasized the urgency of the situation, pointing out that the rising coalition of socialists and democrats in parliament poses a serious threat to the stability of the current order.\n\n'Generals,' Shishakli stressed, 'the SSNP has steadfast ideology, effective organization, and popular support, especially significant influence in the east and north. Bringing them into our alliance provides a ready and powerful force to help us effectively curb the spread of radical ideas and their organization across society, maintaining national security. This kills two birds with one stone—directly weakens the opposition while leveraging the SSNP to neutralize internal instability.'\n\nEveryone knows the other side of this proposal. General Shishakli himself has deep ties to the party, even retaining membership. Though packaged as a strategic choice for national interest, his motivations likely include securing greater political space and influence for his party, alongside genuine security concerns. Yet, it appears to be our best option. We must now align under the SSNP's banner."
syr.5.a:0 "Fine."
syr.6.t:0 "The Speech"
syr.6.d:0 "The smoke of conflict hasn't fully cleared; whispers in the ruins speak of lingering pain. Damascus gasps amidst post-war reconstruction and undercurrents of unease. Yet, the distinguished political science professor Antun Sa'ade, revered among intellectuals and unwavering in his national vision, has made a daunting decision: despite the volatile security situation and strong objections from the Security Ministry, he insists on delivering a public speech in the city center square.\n\nHe explains that if the government doesn't stand up to inspire the people in difficult times, the public will lose faith in the nation and its people. Communists and democrats will exploit this void to undermine our foundations. There is truth to his words. We can only increase security for his protection."
syr.6.a:0 "Let's hope nothing goes wrong."
syr.7.t:0 "Assassination"
syr.7.d:0 "Dawn in Damascus. Leaden light smears the empty streets; a deathly unease hangs over the city, the wind itself holding its breath. The car carrying Professor Antun Sa'ade wound through ruins, its engine's monotonous drone the only sound in the stillness. The worried driver nearly begged the professor to turn back: 'Professor, it's too dangerous! We don't even know what's around the next corner...' But Sa'ade gripped his speech notes, gaze fixed determinedly ahead. His resolve was unshakeable—he must reach the square; his voice must rise with the dawn.\n\nFate, however, took the darkest turn. As they entered a relatively narrow street, the engine coughed painfully, sputtered, and died, leaving the car stranded in the middle of the road. In this ominous silence, time seemed to freeze.\n\n'I'll take a look,' the driver said, unbuckling his seatbelt. Before the words faded—CRACK! A precise, deadly bullet tore through the morning mist with a sickening whistle, shattering the windshield and exploding against the driver's forehead in a cruel blossom of blood. He slumped over the wheel without a final cry.\n\nThe silence shattered! Muzzle flashes erupted like mad from broken walls, windows, rooftops—ambushers hidden in every shadow. Loyal guards reacted instantly, returning fire from behind the car and rubble; gunfire filled the air. The heroic resistance was fierce, bullets cutting down several attackers. But the enemy kept coming, swarming like locusts from their perfectly chosen kill zone. In a short, brutal last stand—amid desperate cries and a hail of bullets—the guards fell one by one, blood staining the cold ground.\n\nThe gunfire finally ceased. The ambush site was a scene of carnage. The guards' bodies lay where they fell, their final oath of loyalty fulfilled. The attackers paid dearly too; their scattered corpses testified to the ferocity of the fight. But the heaviest blow came—Sa'ade's position had been the primary target. Amid the chaotic crossfire, Professor Antun Sa'ade could not avoid the dense hail. Multiple bullets tore through his body. He collapsed heavily onto the blood-soaked floor of the car, unconscious.\n\nWhen belated reinforcements broke through and arrived, only devastation greeted them. They frantically lifted the professor, clinging to life from the pool of blood, rushing him to the hospital at top speed."
syr.7.a:0 "My God!"
syr.8.t:0 "Out of Danger"
syr.8.d:0 "Though Professor Antun Sa'ade was hit by multiple bullets, most missed vital organs. Though still unconscious, he is temporarily out of mortal danger. This audacious assassination ignited the junta's fury. High command is enraged, vowing a thunderous response: immediate large-scale arrests and harsh interrogations to unearth the masterminds and their accomplices. The national security apparatus will operate at full throttle, sparing no expense! The professor is now under heavy guard at a military hospital."
syr.8.a:0 "As long as he's alright..."
syr.9.t:0 "Reparations Plan"
syr.9.d:0 "The Ottoman Empire's iron heel once brutally trampled Syrian soil, its atrocities and plunder bringing deep suffering to our people. Countless homes became ruins, factories collapsed in the flames, fertile fields turned to scorched earth. Now, victory tilts towards us. It is time for the Empire to be held accountable for its crimes. Egypt has authorized us to formally negotiate post-war reparations with the faltering Ottoman authorities. The core goal is clear and urgent: use funds from Istanbul to accelerate the reconstruction of Syria's devastated infrastructure, revive industry, and aid displaced people. This will be the cornerstone for healing war wounds and opening a new chapter.\n\nHowever, facing an Ottoman Empire fractured internally, financially bankrupt, and stripped of its former glory, the scale and form of reparations have sparked fierce parliamentary debate. One side calls for realistic reconciliation, the other demands deserved, harsh justice."
syr.9.a:0 "Symbolic Reparations"
syr.9.b:0 "Harsh Reparations"
syr.10.t:0 "Syria Demands Reparations"
syr.10.d:0 "The heart of the Empire, Istanbul, still beats heavily but feels the chill closing in from all sides. The gloom of defeat hasn't lifted; the iron grips of Egypt and Iran choke us. Massive reparations demands hang like a sword of Damocles. Imperial finances are riddled with holes; the realm is ablaze; its former glory is now only a crushing burden.\n\nAmid this suffocating despair, unexpected news arrived from Damascus. The reparations proposal submitted by the nascent Syrian regime is surprisingly... moderate? Compared to the cold, bone-sucking demands from Egypt, Syria's terms and amounts show a remarkable reduction.\n\nThis proposal undoubtedly has the tacit approval of its patron—the more radical forces in Cairo. Regardless of its origin, the document before us presents figures no longer insurmountable, offers a slight breathing room on deadlines, and carries a vague hint of rebuilding relations."
syr.10.a:0 "We brought this upon ourselves..."
syr.11.t:0 "Syria Demands Reparations"
syr.11.d:0 "The foundations of the Empire shake in the storm. Every document from Cairo is like an icy dagger stabbing our shattered heart. We know the defeated must endure humiliation, ever wary of Cairo's unashamed claws of exploitation. Yet, we never imagined the final blow could come from a force we once saw as a mere frontier dependency!\n\nDamascus—that 'Syrian government' propped up by betrayal and foreign force—today delivered a blood-boiling reparations demand to Istanbul! Not only did they ignore the already burdensome guidelines from their patron, they... made it worse! Its terms are harsher, demands crueler, deadlines tighter—even Cairo's marrow-sucking plan pales in comparison! Is this deliberate humiliation, or a mad scramble to curry favor with their new masters?"
syr.11.a:0 "A tiger fallen on the plains is bullied by dogs."
syr.12.t:0 "Order Restored in Diyarbakır"
syr.12.d:0 "Diyarbakır is a piece of flesh we tore from the Ottoman carcass. We didn't really want this land, teeming with Kurds who clash with Syria's Arabs and could empower Kurdish separatists. But the Kurds here seem less rebellious; they actively helped us rebuild local government. As a reward, we've designated it a Kurdish Autonomous Region."
syr.12.a:0 "Good."
syr.13.t:0 "Order Restored in Adana"
syr.13.d:0 "As part of Greater Syria, regaining control of Adana has always been our goal. After the war, the Ottomans ceded this land to us. Civil servants and troops have been stationed in Adana for days. After clearing out local opposition and bandits, a new government has been established. This will become one of our oil-producing regions."
syr.13.a:0 "Excellent."
syr.14.t:0 "Protests Expand"
syr.14.d:0 "The wave of protest is no longer confined to the capital's streets or isolated industrial towns. Despicable 'democrat' agitators spread their seditious words like a plague across the nation. Swarms of misled citizens, indiscriminately gathering under their banners, readily swallow the sweet poison of promises of 'freedom' and 'change.' Their marches clog vital arteries; their shouts shatter urban peace; public order is systematically undermined.\n\nThese bewitched souls naively believe they seek 'justice,' oblivious to being dangerous pawns. Plotters behind the scenes cunningly exploit their simple anger and discontent, their core goal clear and sinister: to overthrow the existing order and shake our—the legitimate rulers'—foundation of authority. The entire nation seems precarious; our rule faces unprecedented direct challenge."
syr.14.a:0 "Damn it."
syr.15.t:0 "Violence Escalates"
syr.15.d:0 "Initial calls for reform have been swallowed by the shriek of violence. Street movements in multiple Syrian cities have spiraled out of control. Saboteurs skillfully infiltrated protest crowds, twisting legitimate grievances into a frenzy of destruction. They looted shops, burned property, turning innocent citizens' livelihoods to ash. Atrocities escalated in the capital: frenzied mobs hurled Molotov cocktails at the Damascus Police Headquarters. Flames soared, symbolizing a direct attack on the bastion of law and order. The sound of shattering glass, crackling fire, and violent shouts drowned out any rational demands.\n\nThis has surpassed the bounds of expressing demands! Open assault on state institutions, wanton destruction of society's foundations—this is no mere demonstration. This is a meticulously planned insurgency aimed at overthrowing the state's legitimate authority, its spearpoint aimed at the heart of the regime. We stand at the precipice between revolution and anarchy!"
syr.15.a:0 "Send in the troops!"
syr.15.b:0 "Wait a bit longer..."
syr.16.t:0 "Al-Za'im Defects"
syr.16.d:0 "Long-unsettling rumors have become reality: General Husni al-Za'im has openly shed his disguise, leading his elite troops in defection to join the democrat rebellion. We knew of his dubious contacts with subversives, but didn't expect betrayal to strike so fatally fast!\n\nIn a lightning night raid, al-Za'im exploited his unrestricted command authority to purge government agencies and key military installations. Loyal Syrian nationalist elites—the bedrock of our regime—became his first bloody offering to his new masters. Al-Za'im's forces tore through defenses in the nation's core, seizing crucial barracks. The democrat rebels seemed instantly gifted a heavy blade stabbing into the Republic's heart. Professor Antun Sa'ade, recovering in hospital, was also arrested."
syr.16.a:0 "Damn it!"
syr.17.t:0 "Victory for Democracy"
syr.17.d:0 "A storm has swept through Syria's power center! Under the combined blows of fierce street fighting and military defections, the incumbent government has collapsed. Democrat fighters chant victory slogans, stepping through parliament's shattered doors and windows, declaring an end to an era. Syrian nationalists—the regime's former core pillar—scatter in panic under the threat of brutal reprisals. Remaining leaders and fighters flee across the border, pouring into neighboring Lebanon for refuge. They lick their wounds in exile, shadows of disgrace already cast.\n\nAmid the ruins, a newly formed democrat provisional government swiftly filled the power vacuum. They promised the people: initiate emergency constitutional procedures, prepare a 'free and inclusive' national election, determined to reshape Syria's future. Under the Crescent Moon, a fragile order claiming popular mandate is about to be born."
syr.17.a:0 "Long live freedom....?"
syr.18.t:0 "Revolt Suppressed"
syr.18.d:0 "Rumors coiled like vipers around General Husni al-Za'im—his suspicious ties to the democrats caused deep concern. Yet, when the rebels' banners were openly raised, al-Za'im shattered all doubts with thunderous force!\n\nThe iron-blooded general severed all ties to the subversives without hesitation, publicly denouncing their betrayal. His orders were firm and cold: suppress the rebellion immediately! His elite troops—perhaps the Republic's last reliable sword—pounced on the rebellion's heart like tigers unleashed, crushing democrat barricades and ambitions with fierce gunfire and ruthless assaults."
syr.18.a:0 "Hooray! Long live Syria!"
syr.19.t:0 "Syria's First Election"
syr.19.d:0 "The election didn't reflect the true will of the Syrian people. Parties used unreintegrated militias to intimidate voters in the countryside for votes—truly, 'political power grows out of the barrel of a gun.' Though billed as equal for all ethnic and religious groups, power remains firmly with the Sunni establishment. Christians got only a few symbolic seats. Jews, insulted by Palestinian Zionists viewing the election as an affront, launched a boycott. Consequently, they won no seats. In cities with significant Jewish populations like Aleppo and Damascus, their community ballot boxes were either reported 'lost' or declared 'invalid.'\n\nSocialists were also hopeful, but their parliamentary tactics achieved little progress. Akram al-Hawrani only secured a stronghold in his base of Hama. The far-right performed poorly too, gaining limited victories in a few northern cities, though their party leader failed to win a seat. All sides blamed their failure on electoral fraud, demanding a re-run. Their militias took to the streets, waving party flags."
syr.19.a:0 "The Damascus People's Party won the election."
syr.19.b:0 "The Aleppo People's Party won the election."
syr.19.c:0 "The National Bloc gained the upper hand."
syr.20.t:0 "Socialist Revolt"
syr.20.d:0 "The dust from the democrat coup hadn't settled when a deadly second wave struck! Dormant socialists, smelling blood in the power vacuum, struck like scorpions emerging. Armed with covert aid from the Third International, they raised the crimson banners of proletarian revolution.\n\nThe red tide of rebellion was no longer scattered strikes and protests, but organized, heavily armed assaults! From Aleppo's factory districts to the outskirts of Damascus government defenses, socialist shock troops and artillery roared deafeningly. Using Third International-supplied equipment as their spearhead, they aimed to crush the original central government still reeling from the democratic coup.\n\nOvernight, the capital's core was in peril! The nascent democrat government, barely seated, had to hastily face this lethal blow from the leftist iron fist. The nation's fate seemed cast into boiling steel; the situation deteriorated rapidly—Damascus hangs by a thread!"
syr.20.a:0 "Send in the troops!"
syr.20.b:0 "Wait a bit longer..."
syr.21.t:0 "Third International Pressure"
syr.21.d:0 "A cold warning pierced Damascus like a Siberian gale! A Third International envoy delivered an unambiguous ultimatum. Paris declared with steely resolve: we, the regime currently besieged in Damascus, must immediately disarm, cease 'futile resistance,' and unconditionally transfer state power to their supported socialists.\n\nThe ultimatum's wording was cold and ruthless: they called this 'the inevitable direction of history'; any delay was 'a betrayal of the international proletarian cause.' More fatally, it ended with a suffocating threat—if we refused to comply within the specified timeframe, the Third International would be 'forced to fulfill its internationalist duty.' The implication was terrifyingly clear: the steel tide already assembled on the coast would surge across the Mediterranean, pouring forth to utterly erase our existence with absolute force."
syr.21.a:0 "We are powerless..."
syr.22.t:0 "Socialist Total Victory"
syr.22.d:0 "The last speck of resistance has blown away. Socialist forces, assembled like an iron tide, marched into Damascus's core political district to fervent revolutionary anthems, almost like a parade. Parliament, the Prime Ministry, the national radio station... symbols of the old order were effortlessly draped in red banners with little fighting. Third International support and popular fury paved the way for this crushing advance.\n\nThe once-overbearing Syrian nationalist forces saw their will to resist crumble like sandcastles. Remaining hardliners discarded badges and weapons, scattering east across the desert to Iraq or fleeing north into Lebanon's foothills. They left behind burned archives, scattered propaganda, and the shattered ruins of a completely collapsed ruling foundation.\n\nDamascus's clocktower witnessed it: a republic built on national myth has been extinguished. The new order of worker-peasant dictatorship proclaimed by the socialists now stands tall upon the ashes of the old era. Chants of 'The Republic is dead! Long live the Commune!' sweep from Liberation Square across the city."
syr.22.a:0 "All for the revolution!"
syr.23.t:0 "Rebellion Crushed"
syr.23.d:0 "The socialist rebellion blueprint was cut down in its infancy! Thanks to pervasive intelligence networks, Syrian nationalist bloodhounds were already lurking in the shadows. When leftists fired the first shots in Aleppo's industrial zone, nationalist paramilitaries—'The Purifiers,' a force of loyal officers, tribal fighters, and urban shock troops—pounced like wolves on the rebel nests.\n\nThe purge was swift and brutal. Shock troops smashed open hidden printing presses and armories; muzzle flashes tore through the twilight. The so-called 'Revolutionary Command Committee' was violently disbanded; leaders captured trying to burn communication records; scattered fighters attempting resistance in complex factory zones were flushed out with flamethrowers and annihilated. Blood soaked the factory floors, mingling with oil and the ashes of unread manifestos. All evidence, along with the buds of rebellion, was burned to ash before nightfall."
syr.23.a:0 "Hooray! Long live Syria!"
syr.24.t:0 "SSNP Total Victory"
syr.24.d:0 "All currents seeking to taint Syrian blood or divide the national will—whether the false promises of democrats or the foreign fantasies of socialists—have been pulverized under the nationalist iron fist. Homs, Aleppo, Damascus... across every inch of the homeland, the SSNP's black flag has replaced discordant noise, firmly nailed to the pinnacle of power. No more cowardly compromises, no more obstructive clamor! Former opponents are either exiled to the desert or ground into the dust of history.\n\nThe great renaissance faces no obstacles! Under the absolute leadership of Professor Antun Sa'ade, the state apparatus operates with the efficiency of a war engine. Law, military, education, economy—every vital artery of the nation is under the Party's complete control. A unified, pure, mighty Syria, obeying only the national will, has been born. Her roar makes the entire Near East tremble!"
syr.24.a:0 "Freedom, Duty, Discipline, Power!"
syr.25.t:0 "The Revolution's Future"
syr.25.d:0 "Tempered by blood and fire, the Syrian Revolution has concluded. Socialist forces, with their clear program and relentless struggle, have won a complete, indisputable victory. The smoke of revolution is gradually clearing, replaced by banners of liberation and reconstruction flying high over Damascus.\n\nA new chapter is about to begin. A new, dynamic Syrian People's Assembly will be built upon the ruins. According to the charter of the nascent revolutionary regime, the three core forces that played pivotal leadership roles in the revolution—representing different socialist visions—will face the scrutiny of the people in fair, open elections: The Syrian Syndicalist Party, the Arab Ba'ath Party, and the Arab Socialist Party."
syr.25.a:0 "Syrian Syndicalist Party!"
syr.25.b:0 "Arab Socialist Party!"
syr.25.c:0 "Arab Ba'ath Party!"
syr.26.t:0 "The Ba'athist Future"
syr.26.d:0 "The Arab Ba'ath Party is poised for a decisive victory in the Syrian People's Assembly elections. The air in Damascus crackles with electoral fervor and apprehension about the future. Ba'athist red flags line the streets, but how will this hard-won power be wielded? Victory is the start of deeper choices, not the end. The path of this revolutionary regime, born in blood and fire, will be defined by the choices made now. Ba'athist leaders stand at the pinnacle of power; their decisions will chart Syria's fate. Damascus seethes with undercurrents; soldiers and politicians grow restless..."
syr.26.a:0 "The Ba'ath Party takes full control of Syria."
syr.26.b:0 "The Ba'ath Party forms an alliance with the Socialist Party."
syr.26.c:0 "Radical Ba'athist officers launch a coup!"
syr.27.t:0 "Military Coup"
syr.27.d:0 "Before the election clamor on Damascus streets could fully fade, a new storm brewed in the barracks. Led by Salah Jadid, radical Ba'athist officers, furious at the civilian government's slow reform pace and perceived political compromises, conspired late into the night. Loyal armored units rolled onto the streets; radios blared martial music and declarations to 'liquidate traitors and save the revolution.' Forces loyal to the civilian leadership were suppressed in brief, bloody clashes. By dawn, the Revolutionary Command Council announced it had seized all state power, suspended the constitution, and adjourned parliament indefinitely. They promised to purify the party and state, achieving true Arab Ba'athism. Syria's fate now rests in the hands of these uniformed, martial revolutionaries.\n\nThe RCC's rule isn't monolithic. After purging the 'weak' civilian faction, fundamental disagreements within the officer corps about the nation's future surfaced immediately. The core struggle revolves around: pushing the revolution towards a radical leftist direction, or reverting to a traditional military dictatorship emphasizing discipline, nationalism, and strongman leadership?"
syr.27.a:0 "Salah Jadid suppresses dissenters."
syr.27.b:0 "Amin al-Hafiz takes the lead."
syr.28.t:0 "Retirement Controversy"
syr.28.d:0 "The passage of time and recurring effects of his assassination wounds have greatly drained Professor Antun Sa'ade. Once an idealist and fervent nationalist, he now appears sallow, often plagued by severe pain, his once-steadfast eyes clouded with persistent weariness. Hands that were once steady now tremble slightly even signing documents. He deeply feels that the heavy burden of state affairs has exceeded what his failing body can bear. Sa'ade knows that an incapable leader is not only a personal torment but a potential danger to the state. Recently, a difficult but clear decision formed in his mind: it is time to hand leadership to an energetic successor, while he travels abroad to continue spreading Social Nationalist thought and mobilizing Syrians overseas to return home."
syr.28.a:0 "'Your leadership is irreplaceable.'"
syr.28.b:0 "'Your dedication will be remembered. May your successor inherit your spirit.'"
syr.29.t:0 "The SSNP's Future"
syr.29.d:0 "As announced, the era of Professor Antun Sa'ade is drawing to a close. Removing the insignia of supreme power, he appeared slightly stooped before the media for one last solemn speech. His voice remained clear but couldn't conceal long-term fatigue. He seemed relieved. The burden of state was finally lifted—a concession to old wounds and an expectation for the future. Under parliament's solemn gaze, power was returned to the Syrian Social Nationalist Party (SSNP), the fortress he dedicated his life to. The next step is imminent: within the party's inner circle, in candlelit meeting rooms, a new leader will emerge from those deemed most loyal, courageous, and skilled in statecraft."
syr.29.a:0 "Husni al-Za'im gains support."
syr.29.b:0 "Adib Shishakli wins over the leader with his fanatical loyalty."
syr.29.c:0 "Ghassan Jadid gains favor with his image of caring for the people."
syr.30.t:0 "Uprising Broadcast"
syr.30.d:0 "This is the Syrian Provisional Resistance Radio, now broadcasting.\n\nAttention all Syrian compatriots: This is not a drill nor a warning. This is the final declaration concerning Syria's very survival! Three centuries of Ottoman colonial rule imposed upon al-Sham have reached their end! By order of the Supreme Uprising Command Committee and the Provisional Military Staff, all Syrian civilians, regardless of wealth, status, faith, ideology, age, or gender, must take up any weapon you can find and join the nearest rebel stronghold! Every man a soldier! Every household a fortress!\n\nCease all commercial activity immediately. Essential supplies—food, medicine, water—will be centrally allocated by the Damascus War Economy Committee. Hoarders will be executed without mercy! Those unable to fight for special reasons must lock doors and windows, prepare defenses, and avoid Ottoman indiscriminate reprisals. Those spreading pessimism or collaborating with the enemy will be shot as a warning. All citizens martyred for the nation will be eternally remembered by Syria; their children will receive lifelong state benefits.\n\nRepeat, this is the Syrian Provisional Resistance Radio. This is the Syrian Provisional Resistance Radio:"
syr.30.a:0 "'May freedom be with us!'"
syr.31.t:0 "Syrian Mujahideen Army Message to All Muslims"
syr.31.d:0 "In the name of Allah, the Most Gracious, the Most Merciful.\n\nTo all Muslim brothers in Syria—Sunnis, Alawites, Druze, all believers who recite the Shahada!\n\nThe tyrannical Sultan in Istanbul has turned our fertile land of al-Sham into hell! The Ottoman yoke is heavier than the rule of infidels! They drain our sweat and blood, trample our dignity, and scorn the sacred Sharia! How can our mosques submit to the Sultan's command? How can they steal the freedom Allah bestowed? \n\nCompatriots! The Quran declares: 'The believers are but brothers, so make settlement between your brothers' (49:10). Now, Ottoman tyranny is our common enemy! Satan exploits our sectarian divisions, making us fight each other and weaken our resistance! How will we answer our Lord on Judgment Day? Shall we say we sat idle while tyrants ravaged our homeland? Impossible! Brothers of Sunnis, Alawites, Druze! We are all children of Ibrahim, facing the Kaaba, honoring the Seal of the Prophets! Old grievances are the poison the tyrants rely on to rule! They fear the power of our unity—power enough to shake tyranny's foundations!\n\nIn the name of Allah, the Supreme Resistance Committee of the Syrian Mujahideen Army calls upon all Muslims: Abandon discord immediately! Let old grudges vanish in the storm against the common enemy! Those who stir internal strife now are accomplices of the tyrant! Stand united! All monotheists, stand shoulder to shoulder, like true brothers! Unity is our fortress; faith is our sword! Fulfill the duty of Jihad! Take up arms, expel the unjust oppressors! This is the sacred struggle to defend our homeland and our faith! Responders, regardless of sect, are warriors beloved by Allah! ('Do not think of those slain for the cause of Allah as dead...')\n\nThe time has come! Allah's help is near! Let the mountains and plains of Syria echo with our united cries and the victorious 'Allahu Akbar!'"
syr.31.a:0 "O Lord! Grant us victory over the unjust people!"
syr.32.t:0 "Corrective Movement"
syr.32.d:0 "The radical secularization storm forcibly pushed by Chairman Salah Jadid is sweeping Syria's heartland with unprecedented violence. He tries to erase religious traces with an iron fist: ancient places of worship are sealed; distinctive traditional Druze attire is strictly banned; all religious expression in public life is systematically suppressed. Jadid firmly believes this is the only path to 'modern progress.'\n\nYet, this high-pressure policy hasn't eliminated divisions; instead, it has thrown hot coals onto dry tinder. In Jadid's core Alawite strongholds and Druze-populated mountainous regions, accumulated fury has finally exploded. Secular Druze leaders and Alawite reformist leaders formally united, issuing a declaration condemning the Jadid regime for abandoning people's traditions and imposing tyranny, and announcing an armed uprising to overthrow his rule. The once relatively stable regime structure has abruptly cracked wide open; the shadow of Syrian civil war has never been closer. A bloody conflict engulfing the nation is imminent."
syr.32.a:0 "Traitors must be crushed. Mobilize all force to restore order!"
syr.32.b:0 "Death to Jadid! Victory belongs to the faithful!"
syr.33.t:0 "Victory of the Faithful"
syr.33.d:0 "The smoke over Damascus hasn't cleared. As the Salah Jadid regime collapsed under the onslaught of the Druze-Alawite alliance, the briefly united victors tore apart over power-sharing. Alawite reformist officers occupied parliament, declaring 'Only we can guard the revolution's fruits.' Druze elders rallied their 'Valiant Army' in mountain fortresses, accusing their allies of betraying the uprising's purpose. Outside parliament's shattered windows, sporadic machine-gun fire erupted between the factions' street barricades. New slogans plastered the ruins: 'Alawite Hegemony' and 'Mountain Folk Conspiracy' fluttering in the cold wind. This spring bought with blood is being dragged into a darker abyss by factional power struggles."
syr.33.a:0 "The Alawites gain the upper hand."
syr.33.b:0 "The Druze crush the Alawite plot."
syr.34.t:0 "Party Schism"
syr.34.d:0 "A fundamental question has long troubled us deeply: What is the soul and path of our Party? Two distinct factions—Communists and Syndicalists—hold starkly different positions and conflicting ideologies. Despite profound differences, they maintained a strange, fragile yet resilient alliance against common enemies. This bond was once a symbol of our unity, but also a harbinger of fracture.\n\nNow, this arduously maintained alliance ship has broken apart. The bell of parting has tolled; comrades become debating opponents; former comrades-in-arms walk away. The dust of conflict hasn't settled, but the party's integrity is shattered. At this turning point, a crucial question defining our future hangs over us all: With what face shall we gather the remaining strength? What core creed will be written on the banner we raise? Everyone holds their breath, waiting for Chairman Khalid Bakdash's conclusion."
syr.34.a:0 "We are the Party of Workers and Peasants."
syr.34.b:0 "We are the Party of Workers."
syr.35.t:0 "The SSNP's Call"
syr.35.d:0 "Guided by the Social Nationalist ideology constructed by Leader Antun Sa'ade, the path to Syria's rebirth is clear: national unity is the supreme principle; all attempts at division are treason. Social Nationalism is not only the reshaping of Syria, but the only path for all humanity's future.\n\nThe current situation is turbulent. A window of opportunity seems to have opened—external conflicts weaken the chains imposed by traditional powers; internal forces seeking change surge. The ideal of completing the great task of Syrian unification and advancing the banner of Social Nationalism to a wider world seems more achievable than ever.\n\nFor every supporter, there is an opponent. Faced with this historic choice, some comrades within the party urge greater prudence. They agree with the correctness of the long-term goal but emphasize a sober assessment of reality: strength accumulation still requires time; international reactions are hard to fully predict; consolidating existing foundations is crucial. They argue that avoiding rash action and waiting for a firmer foundation is the truly responsible attitude towards the revolutionary cause."
syr.35.a:0 "Tread alone in the mud of al-Sham, awaiting the true moment."
syr.35.b:0 "All humanity must be protected by Social Nationalism."
syr.36.t:0 "End of Military Rule?"
syr.36.d:0 "Under General Amin al-Hafiz's iron-fisted rule, chaos and rebellion within the Republic have been ruthlessly crushed. Years of emergency martial law seem to have successfully restored basic order. On streets, in cafes and university campuses, pan-Arabist fervor, suppressed for so long, boils with unprecedented heat. Revolutionary slogans cover shattered walls; the dream of unification spreads passionately among the people. The General's tough military regime appears to have paved the way for this surge.\n\nAt this moment, many keen observers ask: Has the turbulent 'provisional state' reached its end? The restoration of order creates conditions for politics to return. Can the doors of the parliament hall, long trodden by military boots, reopen to elected representatives? The crucial question: Will the strongman himself, General Amin al-Hafiz, architect of this brief stability, yield to public sentiment and voluntarily relinquish his absolute power? Or will he choose to cling to the hard-won authority, shaping his rule-by-gun even more permanently?"
syr.36.a:0 "Amin al-Hafiz maintains his rule."
syr.36.b:0 "Amin al-Hafiz promotes a Ba'ath-Socialist coalition."
syr.36.c:0 "Power to the Ba'ath Party."
syr.36.e:0 "Transfer power to the Ba'ath Party, but secure Amin al-Hafiz's position."
syr.37.t:0 "Return of the Sharif?"
syr.37.d:0 "Under the shadow of Egyptian power, the Syrian state has been reborn. Muhammad Abdallah I, from the Alawite family, has been placed on the throne as Sultan of the restored Sultanate of Syria. Cairo's careful calculations seem temporarily satisfied. Yet, in palace corridors and parliamentary backrooms, another voice gathers quietly, like the whispers of a ghost from the past: they long for the true Hashemite Lion—Faisal ibn Hussein.\n\nKing Faisal, embodiment of the great Arab dream, fearless standard-bearer of the first Great Syrian Revolt. His exiled bloodline still flows with the light of legitimacy. Supporters argue: his return is more than just changing a monarch. Faisal would bring true prestige of independence, unite scattered tribal hearts, and his name alone could shake Cairo's increasingly heavy iron fist."
syr.37.a:0 "Long live His Majesty Faisal I!"
syr.37.b:0 "We are loyal to Muhammad Abdallah I!"
syr.38.t:0 "The Sultanate's First Democratic Election"
syr.38.d:0 "The dispute over the ruler has finally settled; the Sultan's crown is firmly placed. But a new question boils over now: how to shape this kingdom's future? The first-ever democratic election open to all—a phrase igniting street-corner debates—has become the key to determining the new Sultanate's course.\n\nAll eyes are fixed on the impending electoral contest. The Damascus People's Party, representing the resilient pulse and traditional voice of Syria's southern heartland. The wealthy northern Aleppo People's Party, leveraging its industrial strength and extensive trade networks, seeks to guide the kingdom towards prosperity. The ambitious National Bloc attempts to transcend regional limits, rallying hearts with a grand vision for a unified Syrian realm, its pan-nationalist banner fluttering in the wind.\n\nThe people's will shall choose among these three forces, laying the first cornerstone of the kingdom's political landscape."
syr.38.a:0 "The people elect the Damascus People's Party."
syr.38.b:0 "The people elect the Aleppo People's Party."
syr.38.c:0 "The people elect the National Bloc."
syr.39.t:0 "Restore the Sultanate?"
syr.39.d:0 "Beneath Damascus's domes and minarets, an ancient proposal quietly resurfaces in the corridors of power. Our President, Sayyid al-Jaza'iri—his bloodline hails from a noble Algerian family; his ancestors were leaders of resilient desert tribal alliances under the French boot. Now, whispers begin: could this foreign-born hero be the symbol of a reborn Syria?\n\nProponents argue that restoring the Sultanate and crowning al-Jaza'iri as 'Sultan Jaza'iri I' would be the most inclusive gesture. It's not merely recognition of his personal prestige, but a declaration to the Arab world: the new Syria is no narrow nationalist cage. Placing a crown on a leader from the western Maghreb itself narrates this ancient land's diversity in the grandest terms. Could the ancient memory of the Caliphate and modern national aspirations fuse strangely under this foreign Sultan's scepter?\n\nYet, opposing whispers are just as sharp. The spark of the democratic republic is barely lit; now embrace a medieval relic? Is this transcendent union or reactionary regression? The nation's soul stands at a crossroads."
syr.39.a:0 "Long live Jaza'iri I?"
syr.39.b:0 "I think democracy is just fine."
syr.40.t:0 "Algeria's Call"
syr.40.d:0 "The scorching Algerian sun once bathed the streets and orchards where Leader Sayyid al-Jaza'iri grew up. This is the starting point of his bloodline, the home for generations of Arab and Amazigh compatriots. Yet, the iron heel of French colonialism has trampled this land for too long. Their rule is a heavy shackle, its chains grating day and night, extracting wealth and suppressing voices. Algeria's suffering isn't just a marked colonial province on a map; it is a wound flowing deep in the blood, an ache resonating in al-Jaza'iri's heart and in every soul yearning for liberation. The rule France imposes here is a continuous insult to this land and its people's dignity. How can we remain indifferent, letting colonialism's shadow forever darken our brothers' homeland?"
syr.40.a:0 "We will liberate our Algerian compatriots!"
syr.41.t:0 "Consolidating the Sultanate"
syr.41.d:0 "The minarets of Damascus's Umayyad Mosque still stand tall; the evening breeze of Ramadan gently brushes the palace restored to Sultanic glory. Yet, despite the esteemed Sultan's diligent governance, rebuilding order, and developing the economy—his benevolence and foresight plain for all to see—rebellious murmurs still fester from dark corners. These so-called 'opponents'—more like traitors forgetting Allah's grace—not only ignore His Majesty's achievements in rebuilding infrastructure, restoring trade, and securing livelihoods, but also stir trouble and blaspheme the sacred Sultanate! Is this the act of loyal subjects? No! They must be secretly taking gold pounds from Western Franks or other foreigners coveting Syria's fertile lands, trying to shake the nation's foundations! Their tongues drip with the poison of betrayal. The Sultan's patience is vast, but the kingdom's sword is sharper! We must sever the foreign hand, crush these vipers' nests, demonstrate the Sultanate's majesty with decisive action, and make the petty understand: any attempt to undermine the Sultan's God-granted rule will incur thunderous punishment. Syria's unity and glory shall not be tarnished!"
syr.41.a:0 "Defend Allah's Shadow on Earth with an iron fist!"
syr.42.t:0 "Our Algerian Brethren"
syr.42.d:0 "Algeria—our brethren! This sun-scorched land bears witness to a thousand years of Amazigh bloodline, steeped in the ancient glory of Arab culture. This is the homeland cherished by Sayyid al-Jaza'iri, Chairman of the Damascus People's Party, the source of his blood. Yet today! The colonial boot of France tramples this land without mercy, greedily sucking its marrow. Colonialists and bureaucrats in Algiers, hiding in distant offices, weave cages with wicked laws, binding our brethren as mere laborers and resource providers. Their minerals are plundered; their fruits are stolen; their dignity is shredded under French brutality! The haughty governors and merchants feast daily on the blood and tears of our compatriots! Shall we abandon these brethren suffering in misery? Shall we remain silent, letting the French heel continue to crush our brethren's future? Algeria yearns to breathe! The time has come to answer the nation's call!"
syr.42.a:0 "Liberation will surely come here."
syr.43.t:0 "The Inherent Flaws of the Jews"
syr.43.d:0 "For millennia, the Jewish people wandered rootless, ostracized in foreign lands—a fate evoking pity. We Arabs, renowned for our tolerance, offered them sanctuary under the exalted Caliphs of old and even today under Jerusalem's governance, allowing them peaceful residence. Yet, how have they repaid this?\n\nNot with gratitude and integration, but with endless bloodshed and betrayal: Irgun and Lehi forces slaughter villages, gnawing at the Palestinian homeland; international mediation treaties become excuses to seize land; the grand dream of statehood increasingly becomes a reality tearing our homeland apart... Similar tragedies unfolded not only in Palestine but also in European nations that sheltered them—pogroms in Tsarist Russia, anti-Jewish laws in Germany, all bloody lessons. History repeatedly shows: Emperor Hadrian of Rome made a painful decision to quell Jewish unrest. Is this not the inevitable fate of contradiction between the Jewish people and the nations that host them?"
syr.43.a:0 "Settle accounts one by one."
syr.44.t:0 "Total Jihad Against the Jews"
syr.44.d:0 "For a thousand years, the seed of betrayal has taken root in Jewish hearts! They armor themselves with cunning deceit, wield wealth and intrigue as weapons, parasitically clinging not only to lands of exile but also stretching greedy hands towards others' sacred homelands! This rotten plague erodes the very bloodline roots we depend on, stealing nourishment meant for our native soil! They promise peace, yet sow the poisonous weeds of discord, coveting the land our ancestors watered with blood! Such desecration and plunder defy divine justice! Beneath forgotten scorched earth, countless silent souls still wail! Sands soaked in blood remember their plots and atrocities!\n\nThe time has come! The hour of reckoning is upon us! Let the fire of vengeance illuminate every dark corner! Whether Jews hide in skyscrapers or desert ravines, they cannot escape the pursuit of the sacred mission! Avenge the dead! Take back the Promised Land for the living!"
syr.44.a:0 "Blood for blood! Beneath the scimitar, no sin escapes!"
syr.45.t:0 "Control the Army"
syr.45.d:0 "An Eastern sage once said: Guns and bullets are the foundation upon which all political power is built. We wholeheartedly agree, believing even more deeply: the stability of a regime likewise depends on triggers and shell casings. Look around: groups of traitors nurtured by foreign gold, plotting subversion, spread like poisonous vines across our land. Empty words and illusions of compromise cannot sever these deep roots. When the shadow of rebellion grows in the dark, when the homeland's cornerstone is pried loose, the only certain, effective response is the cold, loyal steel in our hands—only the roar of guns and searing bullets can forge an iron curtain beyond doubt, defending this land's inviolable order and dignity."
syr.45.a:0 "Bullets can silence traitors forever."
syr.46.t:0 "The Fallacy of Pan-Arabism"
syr.46.d:0 "Pan-Arabists' grand blueprints always depict the glorious vision of a unified Arab world. Yet, they almost always avoid a cold, fundamental question: how to awaken the dormant subject—the Arab people themselves?\n\nFor millennia, the people of this land crawled forward under the scepters of autocratic monarchs and the shackles of strict religion; the seeds of revolution struggled to take root in barren mental soil. Pan-Arabists indulge in illusory hopes: that the shackled masses will spontaneously, miraculously rise up, overthrow oppressive tyrants, and then uniformly rush into the arms of a union.\n\nWhat foundation do they rely on? Paper blueprints sketched in scholars' studies? Or the fragile loyalty of officers who recognize only power and shift allegiances? This is not the path to a new Pan-Arabism; it is the road to the Arab nation's slow death in vain hope! If we cannot even hold and govern the cities before us, how can we gather a scattered world and build a unified temple upon ruins? We stand here today precisely to oppose this childish fantasy."
syr.46.a:0 "Errors must be corrected."
syr.47.t:0 "The Mess"
syr.47.d:0 "Once upon a time, Ottoman Sultans perhaps dreamed the delusion of restoring Islamic glory, scattering gold and blueprints across Syrian soil. Yet, when imperial ambition finally crumbled like a sandcastle, it left only suffocating ruins and despair on this parched land.\n\nGrand factories, steel behemoths meant to roar with wealth, now stand as rusted husks, conveyor belts still, machines mute. Imperial promises of prosperity became grotesque, half-finished scars on the wilderness—railways ending abruptly in the desert, half-built canals cracked and dry. Famine clings like a bone parasite, gnawing year after year at the remnants of life. Worse, the specter of war never left, and the Empire's final madness was its defeated or rogue soldiers. Like locusts, they swept through, 'requisitioning' everything movable, everything sellable, leaving factories and villages utterly hollowed out, echoing with wails.\n\nThis is the Ottoman Empire's 'legacy' to Syria—a colossal mess of paralyzed factories, abandoned projects, raging famine, and vanished order. On this scorched earth of abandonment and bleached bones, dreams long ago turned to dust and blew away, leaving only the naked challenge of survival."
syr.47.a:0 "Begin the reconstruction."
syr.48.t:0 "Syrian Dragoons"
syr.48.d:0 "We've imported a new breed of horse from the future—oh, don't ask how we got them from the future, just consider it a blessing from Allah. Anyway, it's a very powerful horse. Its whole body is hard like steel plates on an armored vehicle; bullets can't even penetrate its flesh directly. It never tires and is incredibly fast, surpassing any known horse breed. It keeps pace with motorcycles in a race. Though a bit hard on the backside, with a specially designed saddle, it feels just like a normal horse."
syr.48.a:0 "What on earth is this..."
syr.49.t:0 "Lebanon-Syria Merger"
syr.49.d:0 "In the solemn halls of the Damascus parliament, the air was heavy yet crackling with anticipation. The core of the deputies' proposal was clear and firm: since the government and citizens of Lebanese soil have long recognized a single leadership core centered in Damascus, the border dividing the two lands appears redundant and obsolete. We share a single government structure under one flag, follow the guidance of one Head of State, and are inextricably linked by history, culture, and geography. It is time to end division and make Beirut and Damascus brother cities under one nation!\n\nThe speaker detailed the vision of union: integrated administrative resources would vastly optimize governance efficiency; shared defense capabilities would rise significantly; a broader domestic market would accelerate economic recovery. This is not only logical necessity but a profound response to pan-Syrian national sentiment and historical bonds. As the speech ended, thunderous applause erupted in the parliamentary hall. Chants of 'Unity! Unity! Long live Greater Syria!' echoed long beyond the ancient chamber, swiftly igniting passionate responses from countless citizens in streets and alleys.\n\nThis declaration of unity stems not from conquest, but from blood-tied national identity, shared governance needs, and sincere aspiration for joint future prosperity. Lebanon's mountains and Syria's plains are the inseparable spine and heart of a single community."
syr.49.a:0 "Continue playing as Syria."
syr.49.b:0 "I want to play as Lebanon."
syr.50.t:0 "Lebanon-Syria Merger"
syr.50.d:0 "In the solemn halls of the Damascus parliament, the air was heavy yet crackling with anticipation. The core of the deputies' proposal was clear and firm: since the government and citizens of Lebanese soil have long recognized a single leadership core centered in Damascus, the border dividing the two lands appears redundant and obsolete. We share a single government structure under one flag, follow the guidance of one Head of State, and are inextricably linked by history, culture, and geography. It is time to end division and make Beirut and Damascus brother cities under one nation!\n\nThe speaker detailed the vision of union: integrated administrative resources would vastly optimize governance efficiency; shared defense capabilities would rise significantly; a broader domestic market would accelerate economic recovery. This is not only logical necessity but a profound response to pan-Syrian national sentiment and historical bonds. As the speech ended, thunderous applause erupted in the parliamentary hall. Chants of 'Unity! Unity! Long live Greater Syria!' echoed long beyond the ancient chamber, swiftly igniting passionate responses from countless citizens in streets and alleys.\n\nThis declaration of unity stems not from conquest, but from blood-tied national identity, shared governance needs, and sincere aspiration for joint future prosperity. Lebanon's mountains and Syria's plains are the inseparable spine and heart of a single community."
syr.50.a:0 "Continue playing as Lebanon."
syr.50.b:0 "I want to play as Syria."
syr.51.t:0 "Greater Syria Reborn"
syr.51.d:0 "Behold! The lifelong dream of Professor Antun Sa'ade has finally swept across the Fertile Crescent like an unstoppable storm! From the Mediterranean shores of Cyprus to the vast plains of Arabistan; from the ancient, mottled stone walls of the Holy City of Jerusalem to the edges of the Armenian Highlands at Van—our fearless warriors stained this land with their blood! Horizons once unreachable now fly our Whirlwind Flag!\n\nThe thunderous footsteps of Social Nationalists resound through city after city's streets. Once fragmented regions are finally united under a single will. The grand gates of Damascus opened; jubilant crowds surged like floodwaters, confirming our victory. Countless eyes doubted this dream was mere illusion, but now, the outline of Greater Syria is unmistakably clear on the map.\n\nProfessor Sa'ade's stirring dream—a mighty nation spanning narrow borders, encompassing East and West, embracing past and present—is now the firmest reality in our hands! We shout: 'For the Party! For the Leader! For Greater Syria—Long live!'"
syr.51.a:0 "Long live!"
syr.52.t:0 "Syria Openly Challenges Egyptian Order"
syr.52.d:0 "Syria shows zero respect for us, the Middle East's big brother! Not only did they withdraw from the Cairo Pact we lead, they dare challenge our pan-Arab leadership! Have they forgotten who saved them from Ottoman oppression? These ungrateful wretches!"
syr.52.a:0 "May Allah destroy them!"
syr.53.t:0 "Damascus Resistance Intensifies"
syr.53.d:0 "Hah, the stupid Ottoman Empire hasn't invested in Syria for a long time. The little money allocated for the Sham region all flowed into the Beirut Vilayet. These idiots don't care about Syria at all! Plus, the Ottoman Gendarmerie is launching a major crackdown on Syrians. Resistance sentiment is now spreading everywhere. The General Staff advises we suppress it quickly before the damned Egyptians intervene."
syr.53.a:0 "Egypt hesitated; Ottomans suppressed the revolt."
syr.53.b:0 "Egypt announced support for the Syrian resistance."
syr.54.t:0 "Egyptian Soldiers Cross the Border"
syr.54.d:0 "Just this morning, Egyptian soldiers long quiet on the border crossed the Sinai frontier into the lands of the Jerusalem Mutassarifate. The Jerusalem Mutassarifate's Gendarmerie has already engaged the Egyptian Defense Force in combat. The Egyptian attack was temporarily repelled. But according to reports from multiple Vilayet governors, guerrilla activity is intensifying across the region."
syr.54.a:0 "Declare War!"
