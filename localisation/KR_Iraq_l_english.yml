IRQ_Arab_League:0 "League of Arab States"
IRQ_Arab_League_desc:0 "Arab peoples, united by language, have been able to form distinct communities within the empires they inhabit. However, some believe this connection is far from enough, and that the destiny of the Arab world is to reunite, as in the great Caliphates of old. They believe that through such unification into a single Arab entity, the entire subcontinent will finally achieve true renaissance and reclaim its place in global politics.\n\nTo achieve this unity, they have established a supranational organization (§YLeague of Arab States§!), endowed with significant powers. However, to realize the dream of a Pan-Arab state, we need to persuade other Arab nations to participate in this initiative and surrender part of their sovereignty."
