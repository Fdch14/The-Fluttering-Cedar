irq_sliding_scale_taxation_tt:0 "§GAdopting a floating price tax system helps completely resolve §Rthe rampant corruption plaguing our country§!"
IRQ_Political_division_idea:0 "Internal Contradictions"
IRQ_Political_division_idea_desc:0 "Overall, our country is not as divided as Syria, though relations between Sunnis and Shi'a are strained, they generally coexist peacefully. The main conflict currently is between socialists and nationalists, as well as the Assyrians in the south."
IRQ_Mediterranean_Fleet_idea:0 "Arabian Gulf Fleet"
IRQ_Red_Sea_Fleet_idea:0 "Protect the Arabian Gulf"
IRQ_Start_rebuilding:0 "Start Reconstruction"
IRQ_Start_rebuilding_desc:0 "We have witnessed the withdrawal of Ottoman Empire forces, leaving behind ruins and paralysis from their rule. Now we must shoulder the task of clearing the chaos: abandoned factories need to be restarted, as they are the foundation of Iraqi revival. By systematically repairing damaged infrastructure, we will ignite the passion of national workers and bring back the roar of machinery. This is not just for the economy, but a promise to the Iraqi people—every rotating gear represents national rebirth. We cannot tolerate waste of resources; once factories start, they will bring jobs and dignity, paving the path to prosperity for heroic laborers."
IRQ_Protect_the_banking_sector:0 "Protect the Banking Sector"
IRQ_Protect_the_banking_sector_desc:0 "The collapse of the credit system is a disaster; it will topple the entire economy like dominoes. Farmers unable to withdraw deposits or repay loans will only worsen social order. We must firmly reinforce bank defenses to prevent them from being overwhelmed by debt storms. This is not empty idealism but pragmatic action: through emergency reserves and regulatory measures, we can accumulate necessary funds for the future. Credit stability is the foundation of the economy; protecting it ensures Iraq preserves its strength amid crises. Otherwise, national revival plans will vanish. We refuse to let disaster spread."
IRQ_Find_a_market:0 "Find a Market"
IRQ_Find_a_market_desc:0 "The fall of the Ottoman Empire severed old trade chains, but we are not isolated. Russia and the Allies are reaching out, eager to purchase Iraqi agricultural products and oil to alleviate their own difficulties. This is not mere trade but the cornerstone of new friendship. Through strengthened cooperation, we can stabilize domestic markets while opening overseas channels. Every contract represents mutual trust and win-win outcomes: oil exports will enrich farmers, and agricultural sales will stabilize rural livelihoods. We cherish this opportunity, symbolizing Iraq's rise on the international stage. Partnering with new friends will open a new economic chapter."
IRQ_Product_diversification:0 "Product Diversification"
IRQ_Product_diversification_desc:0 "Fluctuations in global markets are relentless like tsunamis; overreliance on single crops is a fatal weakness. We must promote product diversification, which is not just strategy but survival: developing industries such as oil processing, handicrafts, and light manufacturing to strengthen the national economic foundation. Diversification insulates us from global grain price swings, allowing farmers and businesses to steady themselves. It is a shield against external risks, ensuring Iraq remains resilient in competition. We believe this structural shift will bring security to all, making the national economy less fragile than a house of cards."
IRQ_Formulate_a_policy:0 "Formulate a Policy"
IRQ_Formulate_a_policy_desc:0 "Iraq's political system dictates our unique path: reconstruction plans must be tailored. Liberals advocate radical change, conservatives prefer traditional approaches, and we choose the best combination through democratic mechanisms. This is not one-size-fits-all but practical consideration: plans must match national resources to avoid empty theories. Decisions will be based on grassroots feedback, ensuring workers' and farmers' voices are included. Every choice is an investment in Iraq's future; our political structure allows learning from others while retaining core national identity. We emphasize pragmatic action to root plans in reality."
IRQ_Liberal_plan:0 "Liberal Plan"
IRQ_Liberal_plan_desc:0 "The Liberal blueprint emphasizes Westernization: opening domestic markets and inviting Western capital. Their view is pragmatic—foreign investment brings technology and funds to accelerate reconstruction. We examine this plan: it offers short-term recovery potential but requires risk balancing. Opening markets is not surrender; rather, it injects vitality into enterprises. Through negotiations, we ensure foreign capital serves public interests, not exploitation. The Liberal proposal focuses on global opportunities, which we acknowledge, while remaining vigilant against over-reliance. Its core is mutual benefit, not blind imitation."
IRQ_State_regulation:0 "State-Regulated Economic Reconstruction"
IRQ_State_regulation_desc:0 "Conservative economic proposals are rooted in local soil: breaking up monopolies, promoting state-led industries, and supporting national enterprises. This plan aligns with Iraq's reality—scarce resources but vast potential. By controlling key sectors like energy and education, we prevent foreign control over lifelines. Meanwhile, breaking large enterprises stimulates competition, avoiding Iraq becoming a corporate puppet. Supporting national enterprises is not rhetoric but action: providing incentives for small workshops to grow. We recognize this down-to-earth approach ensures reconstruction aligns with people's needs and safeguards national sovereignty."
IRQ_Open_free_market:0 "Open Free Market"
IRQ_Open_free_market_desc:0 "Our strategy is firm market openness: welcoming the Western world, not out of fantasy but necessity for economic reconstruction. Openness is not unregulated; it will attract capital and technology to accelerate factory operations and trade recovery. We emphasize this move revitalizes Iraq: foreign investment fills gaps left by the Ottomans, creating opportunities for farmers and workers. Negotiations will set rules to ensure benefits flow domestically. Openness is a catalyst for revival; we reject isolationism, which would anchor Iraq globally and usher in true Prosperity."
IRQ_Protect_national_enterprises:0 "Protect National Enterprises"
IRQ_Protect_national_enterprises_desc:0 "Full alignment with the West is dangerous: it lets foreign capital control key industries, placing Iraq's fate in others' hands. We cannot tolerate this. National enterprises must be prioritized—through loans, tax cuts, and policy support, we activate local workshops. They are the nation's backbone: farmers control food production, workers man steel mills. Support is self-defense, preventing Iraq from becoming a vassal. We commit to self-reliance as the core of reconstruction; national enterprises are the guardians of economic foundations."
IRQ_Foreign_capital_was_introduced:0 "Foreign Capital Introduced"
IRQ_Foreign_capital_was_introduced_desc:0 "Building national enterprises from scratch requires time and funds, which is unrealistic. Western capital offers a shortcut: they bring ready-made technology, low costs, and high efficiency. We choose this path to conserve resources—imported machinery and funds immediately boost factory efficiency, avoiding trial-and-error. It is a key to unlock Iraq's industrial potential: farmers benefit from tool innovation, workers gain stable production. Importing is not surrender but wisdom; we skip lengthy accumulation, directly converting capital into national wealth to ensure rapid economic recovery."
IRQ_Encourage_economic_investment:0 "Encourage Economic Investment"
IRQ_Encourage_economic_investment_desc:0 "Iraq harbors abundant resources—oil fields and farmland await development, but national funds are insufficient. We decide to invite Western enterprise investment: joint development transforms potential into reality. Foreign capital injection launches mining and industrial projects, sharing risks while dividing profits. Farmers and workers gain employment; cooperation is reciprocal, with Iraq leading development to prioritize its interests. This is not dependency but leveraging external capital as fuel for national revival, creating a new era of prosperity together."
IRQ_Deepen_trade_cooperation:0 "Deepen Trade Cooperation"
IRQ_Deepen_trade_cooperation_desc:0 "Friendship with the West is a strategic asset we cherish: deepening trade cooperation is not betrayal but mutually beneficial calculation. Yielding some interests secures technology sharing and market access, stabilizing Iraq's economic foundation. Cooperation bridges resource and demand: oil exports secure industrial equipment, agricultural trade boosts rural income. We emphasize flexibility—concessions strengthen national power long-term. This action showcases Iraqi wisdom; friendship symbolizes loyalty and serves as a revival accelerator."
IRQ_Limit_large_enterprises:0 "Limit Large Enterprises"
IRQ_Limit_large_enterprises_desc:0 "Monopolies of large enterprises are cancers; they devour national identity, turning Iraq into a private empire. We must act to break them up and end oligarchic rule. This balances competition and unleashes market vitality: medium-sized enterprises contribute more to public finances through taxes, which fund public projects. Measures stimulate small workshop potential—farmers gain fair prices, workers benefit from diverse employment. Breaking up is not punishment but justice; actions ensure the economy serves the people, not plutocrats."
IRQ_Develop_national_industry:0 "Expand Nationalization"
IRQ_Develop_national_industry_desc:0 "Key industries like mining, education, and healthcare are national lifelines; private control endangers sovereignty. We resolutely nationalize: mining output belongs to all, education nurtures the next generation, healthcare protects well-being. This is not idealism but realistic protection: nationalization prevents resource outflow, ensuring revenue funds social reconstruction. Farmers secure stable mining jobs, workers access free healthcare. Measures strengthen national foundations—every state acquisition symbolizes Iraqi unity. These industries safeguard economic security; we reject foreign control."
IRQ_Full_recovery:0 "Full Recovery"
IRQ_Full_recovery_desc:0 "Ottoman-era chaos finally ends: stalled projects complete, factories restart from inactivity. We witness this victory—production lines roar, abandoned facilities transform into production fortresses. Iraqi workers and farmers clear rubble together, breathing life back into rusted machines. This is not just repair but a symbol of national pride: completed projects represent self-reliance. Through effort, national economic foundations stabilize; we celebrate this milestone, heralding a new era's dawn."
IRQ_Interest_free_loans:0 "Interest-Free Loans"
IRQ_Interest_free_loans_desc:0 "To inspire youth, we launch interest-free entrepreneurship loans: supporting bold souls to build national enterprises. Loans flow to agricultural innovation or small manufacturing, injecting new vitality into Iraq. Sons of farmers experiment with mechanized farming; sons of workers start workshop production. This is an investment in the future: every loan is a seed of national revival, encouraging youthful risk-taking. Measures ease unemployment and enhance economic diversity; actions cultivate a domestic entrepreneur class."
IRQ_Quality_comes_first:0 "Quality First"
IRQ_Quality_comes_first_desc:0 "Iraq cannot replicate industrial giants' scale—it is impractical fantasy. We prioritize quality: producing premium niche products to capture solid specialty markets. Examples include handmade goods or specific agricultural products, winning consumers with quality over quantity. This strategy focuses farmers on high-end crops, workers on precise processing; it avoids vulnerability in bulk commodities. We emphasize realism—superior quality is Iraq's weapon; once rooted in niche sectors, the economy grows steadily. Niche markets become safe fortresses."
IRQ_Develop_industry:0 "Develop Industry"
IRQ_Develop_industry_desc:0 "Industrialization involves more than new factories; it requires upgrading equipment and tools. We prioritize investing in existing industries: procuring or manufacturing efficient machinery to boost output per device. Farmers benefit from automated agricultural tools; workers use new machine tools for precision. Investment ensures Iraq keeps pace with global innovation; efficiency gains enhance product competitiveness. This is not blind expansion but value accumulation—through equipment upgrades, industry maintains vitality in development, generating sustained economic returns."
IRQ_Developing_oil_refining_technology:0 "Develop Oil Refining Technology"
IRQ_Developing_oil_refining_technology_desc:0 "Current refining technology lags, wasting oil field potential. Our nation intervenes: funding and resources enhance refining processes. Through R&D or imports, crude oil converts to higher-value products. Farmers near oil regions gain employment; workers master new equipment. Measures are results-driven: technological upgrades generate extra income, consolidating national wealth. Our goal is clear—every improvement boosts output, injecting new momentum into Iraq's oil industry."
IRQ_Agricultural_mechanization:0 "Agricultural Mechanization"
IRQ_Agricultural_mechanization_desc:0 "Mechanization is the cornerstone of agricultural revolution: it doubles yields, stabilizing rural economies. We promote modern tools like tractors—farmers no longer rely on manual labor, crop harvests surge. This improves quality of life for all: ample food reserves, stable prices prevent famine. Farmers gain security; urban workers benefit from sufficient supply. Mechanization offers more than efficiency—it is security: doubling agricultural output makes national food stocks a strategic asset, securing Iraq's stability in turbulent times."
IRQ_Syrian_army:0 "Iraqi Army"
IRQ_Syrian_army_desc:0 "We clearly see: modern training for officers clashes with outdated soldier quality, creating a fatal disconnect. Orders distort or get lost in transmission—not soldiers' fault, but systemic flaws. Comprehensive reform is essential: simplify command hierarchies, standardize communication manuals, and offer literacy/tactics classes to frontline troops. Without disciplined forces, Iraqi independence is a castle on sand. History will prove: only by purging the army now can we defend against future enemies."
IRQ_Defend_the_Motherland:0 "Defend the Motherland"
IRQ_Defend_the_Motherland_desc:0 "Huddling at borders cannot save oppressed Arab brethren. Enemies won't stop at frontiers; waiting for them to arrive will repeat past disasters. We must strike preemptively to block war at our gates. We reject passive cycles of history—only by controlling the battlefield can we protect our land and uphold justice."
IRQ_Defense_Industry:0 "Defense Industry"
IRQ_Defense_Industry_desc:0 "To guard our land in war, arsenals must never run dry. This demands round-the-clock factory production, with machine tools manufacturing bullets and gun barrels. We integrate national resources to prioritize military production: oil fields power tanks, textile mills produce uniforms, steel plants cast artillery. Without sufficient equipment, even brave warriors are flesh and blood. Industrial strength is the foundation of national survival—we will never send our army to battle unarmed."
IRQ_Special_operations:0 "Special Operations"
IRQ_Special_operations_desc:0 "In desert and mountain battles, conventional warfare's limitations grow clear. Thus, we establish a Special Operations Command—selecting promising soldiers, training them in infiltration, sabotage, and behind-enemy-lines destruction. This unit prioritizes precision over size: disguised incursions to bomb enemy supply depots, timed explosives in command centers, maximum chaos with minimal cost. We understand: when frontline battles stalemate, these shadow operatives become keys to turning tides. They are not romantic adventurers but silent blades defending the motherland with pragmatic means."
IRQ_Desert_infantry:0 "Desert Infantry"
IRQ_Desert_infantry_desc:0 "Desert heat and sand once halted imperial armies but not the resolve to liberate our brethren. We train special forces: navigating waterless zones, ambushing in sandstorms, crossing death lands with camel caravans. Every deep-strike team is a spark for revolution. When soldiers traverse deserts like wind, enslaved lands hear freedom's call."
IRQ_Mountain_training:0 "Mountain Training"
IRQ_Mountain_training_desc:0 "From Basra to Mosul, mountains snake like our motherland's spine. We adapt to local terrain: building hidden forts at passes, deploying observation posts on ridges, turning slopes into deadly traps. Troops master mountain warfare—climbing raids, snow camouflage, canyon ambushes. Make every enemy advance cost blood. These defiant mountains are Iraq's most loyal guards; we need only learn to fight alongside them."
IRQ_Cavalry_modernization:0 "Cavalry Modernization"
IRQ_Cavalry_modernization_desc:0 "Bedouin blood runs in our veins, but cavalry's future lies not in dunes but on treads. We reorganize traditional cavalry, infusing mobility into mechanized forces—scouts speed in armored vehicles, cavalry commanders lead tank charges. Speed remains key, but horses gain steel hearts. Reviving ancestral riding skills on modern battlefields is the most practical tribute to the Prophet's legacy."
IRQ_Develop_armored_forces:0 "Develop Armored Forces"
IRQ_Develop_armored_forces_desc:0 "Oil is the lifeblood of steel. We prioritize oil fields and refineries to ensure every drop fuels armored forces. Tanks have rewritten battlefield rules—they shatter enemy lines with high-explosive shells without waiting for slow artillery. Let mechanized units sweep like desert storms: treads crush trenches, engine roars replace warhorse neighs. This land's black gold is our confidence to defend freedom. When tank columns charge on oil power, enemies will feel the unstoppable force of industry and will."
IRQ_Assault_tactics:0 "Assault Tactics"
IRQ_Assault_tactics_desc:0 "Trench warfare lessons are seared into us: stagnation means death. We must equip our army to tear battlefields apart. By assigning motorized supply convoys and streamlining command, every corps stays ready for full-speed assaults. Mobility is both tactical and strategic: forcing enemies into exhausting chases, exposing weaknesses in motion. Static defense belongs to the past; Iraqi forces race only toward victory."
IRQ_Develop_electronic_intelligence_systems:0 "Develop Electronic Intelligence Systems"
IRQ_Develop_electronic_intelligence_systems_desc:0 "Past wars proved: delayed intelligence gets soldiers killed. We weave frontline communication networks, install field telephones, train codebreakers. When artillery observers adjust trajectories in real-time, when commandos split enemy forces synchronously, victory tilts our way. This is more than tech upgrades—it honors soldiers' lives. Clear orders and precise intelligence are the highest morality to reduce casualties."
IRQ_Lightning_fast:0 "Lightning Fast"
IRQ_Lightning_fast_desc:0 "Preemption is not just choice but survival law. We strike with lightning offensives to disrupt enemy deployments, splitting and annihilating their main forces before they gather. Time is our cruelest ally—if we let opponents mobilize, numerical superiority will crush us. Thus, speed must become a war instinct: scouts probe like daggers, main forces follow like hammers. Ending battles before enemies catch their breath is Iraq's winning philosophy."
IRQ_Military_Academy:0 "Military Academy"
IRQ_Military_Academy_desc:0 "Veterans' experience is precious, but tactics need fresh ideas. We found a Military Academy in Damascus: veteran generals teach combat wisdom, young staff officers develop new tactics. Classrooms are sand tables; graduation is frontline command. Only blending battlefield intuition with modern theory can officer corps shoulder future war burdens. This respects tradition and embraces change."
IRQ_Protect_the_Red_Sea:0 "Protect the Arabian Gulf"
IRQ_Protect_the_Red_Sea_desc:0 "Arabian Gulf waves carry our nation's fate. After reclaiming our coastline, trade routes will vitalize our economy like blood vessels: expanding ports to handle cargo, building new shipyards to repair warships, installing lighthouses to guide merchants. Fisheries provide protein; shipping lanes fill treasuries. This is no longer an Ottoman appendage but Iraq's gateway to the South Seas, where defense and prosperity converge."
IRQ_Build_the_Red_Sea_Fleet:0 "Defense Fleet"
IRQ_Build_the_Red_Sea_Fleet_desc:0 "Exposed Arabian Gulf coasts keep us awake. We must immediately form a mixed squadron: convert armed merchant ships to patrol vessels, deploy shallow-draft gunboats to guard chokepoints, establish coastal observation networks. If enemies land here, our hinterlands lie defenseless. Fleet size need not be large but must exist—every inch of coastline must be within gun range."
IRQ_Mine_tactics:0 "Mine Tactics"
IRQ_Mine_tactics_desc:0 "Mines are poor nations' strategic weapons. We saturate major waterways with moored and magnetic mines: cheap but devastating, paralyzing ports for months, forcing enemy fleets to detour. Mine-laying boats disguise as fishing vessels; mine-sweeping teams guard our own channels. Steel and explosives weave a death net, drowning enemies before they touch shore."
IRQ_Red_Sea_Guardian:0 "Arabian Gulf Guardian"
IRQ_Red_Sea_Guardian_desc:0 "Routes from Istanbul to Suez are golden arteries. Controlling their throat lets us collect 'tolls'—arming merchant ships for escort, taxing tankers for safety, using maritime police to combat piracy. Arabian Gulf is no longer a public corridor but Iraq's backyard pond. This revenue forges sharper prows, creating a virtuous cycle: sea power nourishes the economy, which funds sea power."
IRQ_Transjordan_shipyard:0 "Basra Shipyard"
IRQ_Transjordan_shipyard_desc:0 "Millennia-old Lebanese cedar built Phoenician ships; today, Basra Shipyard writes new legends. We concentrate resources to upgrade its dry docks: adopt welding instead of riveting, train engineers for localized hull design, establish quality control systems. Every launched gunboat must bear 'Made in Iraq.' Only self-built ships free us from spare parts dependence."
IRQ_Latakia_shipyard:0 "Baghdad Armory"
IRQ_Latakia_shipyard_desc:0 "While Basra Shipyard leads, Baghdad cannot be neglected. We transform it into a support vessel hub: build armed trawlers to expand patrol networks, convert fast transports to supply remote garrisons, repair minesweepers to maintain channel safety. Small yards matter—decentralized production prevents total collapse, with 'ant armies' filling frontline gaps."
IRQ_Mediterranean_Fleet:0 "Arabian Gulf Fleet"
IRQ_Mediterranean_Fleet_desc:0 "Current warships are museum pieces, barely fit for patrols. We launch the 'New Anchor Plan': import modern destroyer blueprints, convert shipyards to build fast torpedo boats, establish coastal artillery schools. We don't pursue size but effectiveness—capable of repelling smugglers, escorting merchant fleets, defending 12-nautical-mile sovereignty. Black Sea security has always relied on cannons, not agreements."
IRQ_Adana_Shipyard:0 "Mosul Armory"
IRQ_Adana_Shipyard_desc:0 "To counter northern neighbors' armies, Mosul Armory is critical. We expand it into a fortified base: build breakwaters against air raids, lay railways to the fortress, deploy radar arrays. Arms factories must be hidden and sturdy, letting fighters strike beyond enemy sight, tanks repair on-site for immediate reuse. Armies without forward bases are paper armies."
IRQ_Modernized_submarine_forces:0 "Modernized Submarine Forces"
IRQ_Modernized_submarine_forces_desc:0 "Submarines rewrite naval rules: turning giants into targets, shipping lanes into graveyards. We secretly form submarine flotillas, training crews to hunt targets underwater. This is no gentleman's duel but nocturnal assassin's craft. When enemy ships capsize from explosions, the world will learn: though small, Iraq wields fangs to tear apart maritime behemoths."
IRQ_cruiser:0 "Cruiser"
IRQ_cruiser_desc:0 "Years of debate delayed the flagship project, but our naval dreams endure. Pragmatically, we choose a 10,000-ton heavy cruiser: prioritizing 32-knot speed over massive guns, using 8-inch artillery to suppress destroyers, carrying scout planes for reconnaissance. This 'Damascus'-class ship will be a floating homeland—where it sails, Iraqi territorial waters follow."
IRQ_Mediterranean_hunter:0 "Arabian Gulf Hunter"
IRQ_Mediterranean_hunter_desc:0 "Arabian Gulf becomes a submarine hunting ground. We refine ambush tactics: lay listening nets in shipping lanes, disguise cargo ships as motherships, launch wolf-pack attacks at night. Every sunken enemy ship warns aggressors. This underwater vanguard needs no fanfare—silent torpedo tubes are their loudest declaration. Let enemies fear the deep before setting sail."
IRQ_Dominated_the_Mediterranean:0 "Dominate the Arabian Gulf"
IRQ_Dominated_the_Mediterranean_desc:0 "As the British say: who controls the sea, controls destiny. Black Sea oil, Anatolian grain—all need maritime escorts. With cruisers as the core, supported by submarines and land-based airpower, we build a regional denial system. Eastern Arabian Gulf must become a secure inland sea—merchant ships sail freely, enemy ships come to grief. Weak navies make nations landlocked beasts."
IRQ_Develop_air_power:0 "Develop Air Power"
IRQ_Develop_air_power_desc:0 "Our Iraqi aviation industry falls short of future conflict needs—a slumbering resource waiting to awaken. As the nation's protective wings, we must invest in expanding aircraft factories, adding new production lines and worker training to keep our air fleet unyielding in future wars. This is not just about expanding our air force but defending our skies from threats. The hard work of farmers and workers forms our nation's foundation; now, we repay them with action—building an industrial system that swiftly responds to battlefield demands. Ultimately, a strengthened air force will become an iron winged barrier protecting our homeland and people."
IRQ_Flying_artillery:0 "Flying Artillery"
IRQ_Flying_artillery_desc:0 "Light bombers have proven themselves as 'flying artillery' in the sky, with precision strikes rivaling ground artillery. Since artillery dominates warfare, we cannot neglect its aerial counterpart—we must nurture this weapon into a decisive battlefield tool. Invest in developing more efficient models, combine with live-fire tests, ensure every bomb shakes enemy morale. This is not empty theory but practical necessity; like mining unlocks national wealth, cultivating air firepower brings immeasurable strategic advantages to our motherland. In the end, when they circle above enemy lines, adversaries will feel the awe of heaven's might."
IRQ_Air_Force_Academy:0 "Air Force Academy"
IRQ_Air_Force_Academy_desc:0 "Currently, our pilot training system is immature; a lack of professional instructors hinders this force's growth. Thus, we urgently recruit experienced foreign instructors to teach young cadets flying skills, compensating for gaps in local education. This is not a waste of funds but an investment in the future; like underground resources require extraction to yield wealth, air force talent must be carefully forged to shine. These instructors will share knowledge and discipline, rapidly aligning our pilots' skills with stronger counterparts. After all, a powerful air force stems from solid training roots, and we achieve this with pragmatic methods."
IRQ_Theoretical_construction:0 "Theoretical Construction"
IRQ_Theoretical_construction_desc:0 "While excellent fighter jets and pilots are crucial, innovations in air combat doctrine must not lag—for aerial victory remains uncertain. The world evolves rapidly; we urgently establish a theoretical research institute, recruiting experts to study tactics and predictive models daily, preventing complacency. This is not chasing vanity but meeting practical needs: like mineral exploration requires keen observation, our commanders and pilots must keep pace with technological advancements, ensuring theory and practice align. This grants our military prophetic ability to dominate aerial melees."
IRQ_Expansion_of_the_aviation_industry:0 "Expansion of the Aviation Industry"
IRQ_Expansion_of_the_aviation_industry_desc:0 "Air force strength roots in industrial foundations. Though Iraq's aviation industry has potential, it cannot sustain prolonged conflicts. To transform it from a showpiece to a battlefield sword, we must drive full expansion: build new factories, import skilled workers, optimize raw material supply chains, ensuring aircraft manufacturing seamlessly meets frontline demands. This is not empty ambition but practical necessity—like economic lifelines depend on farmers' toil, air force survival relies on industrial nourishment. We act realistically, ensuring every investment translates to steady air force output, becoming a solid backing for national defense against foreign aggression."
IRQ_Death_fell_from_the_sky:0 "Death Fell from the Sky"
IRQ_Death_fell_from_the_sky_desc:0 "Our air force's primary duty is to be loyal companions to ground warriors, supporting frontline operations through precise bombing—reducing enemy strongholds, fortresses, and even factories to ashes. This is not merciless but survival: making enemies tremble under the shadow of death above, paving the way for soldiers' charges. We plan operations with pragmatic strategies, emphasizing coordination with ground forces' mobility to avoid isolated advances. Airstrike power stems from industrial accumulation; we take pride in using it to defend farmers' and workers' homes, not cause needless panic. Every target undergoes careful evaluation, ensuring every bomb fights for national glory."
IRQ_Sweep_the_airspace:0 "Sweep the Airspace"
IRQ_Sweep_the_airspace_desc:0 "Controlling the sky is the air force's top mission—only by defeating enemy planes can we protect our people from attacks. This is not cold calculation but the sole means to safeguard national foundations—before achieving air superiority, bombing missions should halt to avoid needless sacrifices. We act realistically, prioritizing deploying fighter squadrons for suppressive patrols to crush enemy air dominance. Only after securing overhead safety can strikes on targets yield double results, ensuring daily peace for workers and farmers. Ultimately, this sequence writes victory chapters, making enemies submit in awe."
IRQ_Home_of_Civilisation:0 "Cradle of Civilization"
IRQ_Home_of_Civilisation_desc:0 "Babylon is our nation's core. This ancient Mesopotamian kingdom represents the dawn of human civilization and remains the root of our motherland today."
IRQ_Greater_Iraqi_Nationalism:0 "Greater Iraqi Nationalism"
IRQ_Greater_Iraqi_Nationalism_desc:0 "The Mesopotamian Basin and Persian Gulf have been our Babylonian ancestors' territory since antiquity, rightfully ours to reclaim. Restoring them is our generation's duty."
IRQ_Reclaim_Basra_Vilayet:0 "Claim Basra Vilayet"
IRQ_Reclaim_Basra_Vilayet_desc:0 "With Basra fully in our hands, it is time to establish administrative institutions to control this region."
IRQ_Reclaim_Emirate_Arabistan:0 "Claim Emirate of Arabistan"
IRQ_Reclaim_Emirate_Arabistan_desc:0 "Finally, after conquering Arabistan, our eastern flank is secure. What it needs now is stability."
IRQ_Cooperate_with_Internationale:0 "Cooperate with the Third International"
IRQ_Cooperate_with_Internationale_desc:0 "Compared to other international organizations, the Third International better represents the true liberation of the proletariat; they are not imperialists like Germany or Egypt seeking to exploit us. Though we do not aim to become a syndicalist state, joining at least signals to syndicalists we do not oppose their cause."
IRQ_Join_Phalanstere:0 "Join Phalanstère International"
IRQ_Join_Phalanstere_desc:0 "Phalanstère International is an academic syndicalist organization where members from various nations share knowledge equally. By joining, our scholars can directly communicate with leaders in Paris and London."
IRQ_Law_on_Foreign_Properties:0 "Law Encouraging Foreign Investment"
IRQ_Law_on_Foreign_Properties_desc:0 "Iraq is not a global economic hub, but this is only because our potential remains untapped—we possess significant resources. We must improve our image among foreign investors, persuading them to inject much-needed capital into Iraq."
IRQ_Cooperate_with_Reichspakt:0 "Negotiate with the Reichspakt"
IRQ_Cooperate_with_Reichspakt_desc:0 "Unlike Egyptians and Persians, the German Empire shows little interest in interfering with the Levant, limiting support to investments. Since this is the case, we can cooperate with them militarily and economically to sustain our development and strengthen military capabilities."
IRQ_Berlin_Baghdad_Railway:0 "Berlin-Baghdad Railway Concession"
IRQ_Berlin_Baghdad_Railway_desc:0 "Due to ongoing Ottoman-Egyptian conflicts and lack of investment, the Berlin-Baghdad Railway has fallen into disrepair. Now allied with Germany, we can begin restoring this railway—testing our friendship while boosting trade vitality."
IRQ_Foreign_Military_Mission:0 "Invite Foreign Experts"
IRQ_Foreign_Military_Mission_desc:0 "Our allies' investments in scientific endeavors will yield results soon."
IRQ_Cooperate_with_Turkey:0 "Cooperate with the Ottoman Empire"
IRQ_Cooperate_with_Turkey_desc:0 "Naturally, allying with our former overlords is a viable option..."
IRQ_Tigris_Euphrates_Program:0 "Continue the Two Rivers Program"
IRQ_Tigris_Euphrates_Program_desc:0 "...especially since we previously collaborated to build Iraq."
IRQ_Iraqi_Neutrality:0 "Iraqi Neutrality"
IRQ_Iraqi_Neutrality_desc:0 "Regardless of our international diplomatic success, Iraq's strength always lies in independence."
IRQ_Join_the_new_World_Order:0 "Join the New World Order"
IRQ_Join_the_new_World_Order_desc:0 "It is time to claim our place on the world stage. Our allies await our decision."
IRQ_Bismarck_of_the_Arabs:0 "Arab Bismarck"
IRQ_Bismarck_of_the_Arabs_desc:0 "Sweet words or armed conflict—both are indispensable for Arab unification. The Arab world awaits our liberation."
IRQ_League_of_Arab_States:0 "Establish the Arab League"
IRQ_League_of_Arab_States_desc:0 "To unify the Arabs, the first step is integrating nations into a unified political and economic union. To this end, we will form the Arab League to discuss relevant matters and strengthen integration efforts."
IRQ_Economic_Social_Council:0 "Establish the Economic and Social Council"
IRQ_Economic_Social_Council_desc:0 "The first step in integration is creating an Economic and Social Council to eliminate trade barriers between nations and support underdeveloped economic regions."
IRQ_Arab_Customs_Union:0 "Arab Customs Union"
IRQ_Arab_Customs_Union_desc:0 "With tariff barriers abolished, it is time to deepen economic cooperation. We will form a common customs area among nations, eventually fully integrating regional economies into a shared system."
IRQ_Joint_Defence_Council:0 "Establish the Joint Defense Council"
IRQ_Joint_Defence_Council_desc:0 "Our second goal is defense. To this end, we will create a Joint Defense Council to promote military cooperation among member states."
IRQ_Arab_Unified_Command:0 "Integrate Arab Command Structures"
IRQ_Arab_Unified_Command_desc:0 "As military cooperation among member states increases, it is time to deepen integration—we will merge national commands into a single system, taking the first step toward establishing a unified Arab army."
IRQ_Arab_Parliament:0 "Establish the Arab Affairs Parliament"
IRQ_Arab_Parliament_desc:0 "Now that economic and military integration progresses smoothly, it is time to begin the most contentious phase: political integration. While merging monarchies and republics overnight is unrealistic, we can form a parliament where all Arab peoples have a voice to advance this plan."
IRQ_Council_of_Transportation:0 "Council of Transportation"
IRQ_Council_of_Transportation_desc:0 "Though railways and roads now cross the Middle East, connecting cities, there is no unified system managing them, rendering these networks less effective than envisioned and travel more complex than anticipated. To resolve this, we will establish a unified Transportation Council to manage transportation networks among member states."
IRQ_Council_of_Justice:0 "Council of Justice"
IRQ_Council_of_Justice_desc:0 "Laws vary across the Middle East—Islamic law, civil law, customary law—with no unified system, making a single judicial framework difficult. To address this, we should establish a Joint Justice Council ensuring member states use fair, interoperable legal provisions."
IRQ_Council_of_Social_Affairs:0 "Council of Social Affairs"
IRQ_Council_of_Social_Affairs_desc:0 "Generally, the future Arab state is seen as a union of member states' majority ethnic groups, but the Middle East is home to numerous minorities with diverse cultures and religions. These groups have distinct beliefs and social systems; the future Arab federation must respect their faiths and customs. We will establish a Social Affairs Council to promote understanding and respect among all groups."
IRQ_Arab_Federation:0 "Claim the Arab Federation"
IRQ_Arab_Federation_desc:0 "Against all odds, a unified Arab state is finally born. Our long efforts to foster understanding among Arab nations will not be in vain. Next, we draft final agreements and create a new constitution for this federation. Regardless of future challenges, one thing is certain: our actions will forever reshape the course of Middle Eastern history."
IRQ_Challenge_Egyptian_Domination:0 "Challenge Egyptian Hegemony"
IRQ_Challenge_Egyptian_Domination_desc:0 "Egypt played a crucial role in promoting the Arab uprising—an undeniable fact—but this new regional power grows restless. Now, a new, younger, more dynamic nation will dedicate itself to the Pan-Arab cause, and old powers must make way for the new."
IRQ_Destabilise_Syria:0 "Destabilize Syria"
IRQ_Destabilise_Syria_desc:0 "Unfortunately, our wealthy Syrian neighbor refuses to cooperate, preferring isolation. We must correct their mistake, guiding them back to the fold—Pan-Arabism is popular in Syria, so we will stoke this sentiment to oust uncooperative governments."
IRQ_Destabilise_Hejaz:0 "Threaten the Hejaz"
IRQ_Destabilise_Hejaz_desc:0 "Hejaz's monarchs believe themselves above the Pan-Arab cause and refuse cooperation. We cannot allow this opposition to continue. Fortunately, many in Hejaz support Arab unity; we will incite them to act, installing their leaders after the Hashemites fall."
IRQ_Destabilise_Persian_Gulf:0 "Destabilize the Persian Gulf"
IRQ_Destabilise_Persian_Gulf_desc:0 "This monarchical state in the Persian Gulf clings to isolationism, worsening after rejecting our overtures. Luckily, internal contradictions plague this nation—if we destabilize Iran, the entire decrepit structure will collapse."
IRQ_Challenge_Persia:0 "Challenge Persian Rule in Khuzestan"
IRQ_Challenge_Persia_desc:0 "Some may argue Khuzestan is not part of the Arab world or that we covet its resources, but all recognize Khuzestan as Arab. We will rescue our brethren from Persian rule, placing them under Arab governance permanently, while securing local resources."
IRQ_Cooperate_Oman:0 "Cooperate with Oman and Muscat"
IRQ_Cooperate_Oman_desc:0 "Oman, distant from war-torn regions, prefers isolation, yet it remains part of the Arab world. We will urge its government to contribute to the Pan-Arab cause."
IRQ_National_Brotherhood_Party:0 "National Brotherhood Party Stands Firm"
IRQ_National_Brotherhood_Party_desc:0 "We decisively suppressed the rebellion incited by Pan-Arabists and democrats. After the gunfire faded, the National Brotherhood Party won overwhelming support at the National Nationalist Congress. This victory revealed to all waverers who truly leads Iraq—our leadership and path are now unshakable. Nothing can hinder our guidance of the nation."
IRQ_No_more_chaos:0 "No More Chaotic Days"
IRQ_No_more_chaos_desc:0 "Those painful, endless days remain etched in our memory—the deepest wounds history has inflicted. The bitter lesson is clear: any compromise or weakness toward enemies will be exploited, met with multiplied betrayal. There is no middle path—traitors demand total eradication, a matter of national survival."
IRQ_The_call_of_the_Arab_mother:0 "Call of the Arab Mother"
IRQ_The_call_of_the_Arab_mother_desc:0 "Our hearts forever belong to this vast Arab land. Whether gazing west to scorching Marrakesh or east to fertile Khuzestan, we share the same blood. Division is a temporary shame; unity is inevitable. We will unite all brethren, making the Arab nation rise again under a single flag."
IRQ_Take_control_of_the_tribe:0 "Control the Tribes"
IRQ_Take_control_of_the_tribe_desc:0 "Entrenched tribal forces locally wield significant influence. Allowing them free rein will become a hidden threat to national unity. We must consolidate these forces, making tribal leaders understand their future aligns with Baghdad. Ensuring they serve national will, not become sources of disruption, is key to maintaining control."
IRQ_Iraqi_national_unity:0 "Promote Iraqi National Unity"
IRQ_Iraqi_national_unity_desc:0 "Look at our internal divisions—Sunni vs. Shia, Kurds vs. Arabs—are these differences truly insurmountable? We all endured foreign oppression, yearning for liberation. Shared suffering is our true face. Now, we must set aside grievances, uniting under the banner of anti-colonial struggle—this is the only path forward."
IRQ_Oppose_socialism:0 "Purge Socialist Ambitionists"
IRQ_Oppose_socialism_desc:0 "Socialists preaching class division are cancers. For vague ideals and personal gain, they incite social strife, creating chasms among the people—chief architects of national division. We cannot let this chaotic ideology spread; they would drag Iraq into perdition. Eliminating these threats is urgent."
IRQ_Nationalism_expanded:0 "Expanded Nationalism"
IRQ_Nationalism_expanded_desc:0 "The light of Arab nationalism must not illuminate only elite circles. This flame must ignite in every ordinary person's heart—from urban craftsmen to rural farmers—making them understand 'Arab unity' is not empty rhetoric but a visceral need to escape suffering and gain dignity. National consciousness must take root deeply among the masses, becoming a true source of strength."
IRQ_Resist_Iranian_influence:0 "Resist Iranian Influence"
IRQ_Resist_Iranian_influence_desc:0 "We must remain vigilant against the shadow of our eastern neighbor. Iran ceaselessly infiltrates our ranks, buying short-sighted pro-Iran elements with money and promises—undermining our nation. Maintaining absolute distance from Tehran is a survival baseline. We must sever these dangerous tentacles to preserve true independence."
IRQ_unimpressed:0 "An Independent Nation"
IRQ_unimpressed_desc:0 "Iraq's fate must rest in our own hands. We can no longer rely on foreign charity for our future. Whatever we depended on before brought profound suffering. From now on, every inch of land and drop of oil will be decided by Iraqis. Independence is not just a slogan—it is our foundation for survival."
IRQ_Come_back_in_new_clothes:0 "National Brotherhood Party Returns Renewed"
IRQ_Come_back_in_new_clothes_desc:0 "In quiet moments, a voice questions: has the Brotherhood strayed? Did the pure cause we fought for in blood become a present of oligarchs and corrupt associates? Is this position, surrounded by power and flattery, what those who sacrificed all dreamed of? It is time to pause and reflect on our direction."
IRQ_Broad_solidarity:0 "Broad Solidarity of Revolutionaries"
IRQ_Broad_solidarity_desc:0 "Fragmented nationalist tides will fail. Only uniting all genuine Arab unification forces—Brotherhood, veterans, intellectuals, patriotic gentry—under a single national goal can unleash transformative power. Set aside differences, clench fists: Iraqi nationalism requires ironclad cohesion."
IRQ_Fanaticism_and_belligerence:0 "Fanatical Nation, Belligerent People"
IRQ_Fanaticism_and_belligerence_desc:0 "The people's desire for national glory slumbers like a volcano. Our duty is to awaken it—through flags, speeches, and stories, igniting every citizen's passion for Arab unity. Let patriotic fervor surge from hearts, making the public willing pillars of our great cause. Release this popular force!"
IRQ_Loyal_scimitar:0 "Loyal Scimitar of Arabia"
IRQ_Loyal_scimitar_desc:0 "The National Brotherhood Party is the blade wielded for the Arab Mother. We stand ready, answering every call of our homeland. Like the sharpest, most loyal scimitar, we will strike her enemies without hesitation, defending her unity. This mission is etched in our bones: prepare always, sacrificing all to reclaim lost lands and unify the motherland."
IRQ_Only_for_you:0 "Only for You"
IRQ_Only_for_you_desc:0 "Our loyalty is not for sale. For this Arab land beneath our feet, for our blood kin, we gladly give our lives. Wealth and honor are fleeting; only freeing our nation is worth spilling blood for. This is the Brotherhood's creed: loyal to the motherland, loyal to the people, until death."
IRQ_Light_of_Mesopotamia:0 "Light of Mesopotamia"
IRQ_Light_of_Mesopotamia_desc:0 "Behold, the flames of revival rise from the cradle of two rivers. The nationalist light emanating from Mesopotamia's heart now shines across deserts, mountains, and seas, reaching farther Arab lands. This light from our home awakens slumbering brethren. Iraq is becoming a beacon illuminating the path of Arab awakening."
IRQ_The_Patriots_marched:0 "March of the Patriots' Alliance"
IRQ_The_Patriots_marched_desc:0 "These young officers training day and night in barracks have finally earned national trust. When the Nationalist Congress rose to honor them, we knew the sword found its rightful wielder. From disciplining the military to updating equipment, these uniformed patriots prove through action: only they can reforge fragmented Iraq into a blade."
IRQ_Pioneer_of_revival:0 "Pioneer of Revival"
IRQ_Pioneer_of_revival_desc:0 "The lights of Baghdad now illuminate the road to Damascus. While other nations still tremble under colonial whips, we tore up the shackles of slavery first. Every figure behind a barricade, every underground newspaper, declares to the Arab world: the spark of revival ignites in Mesopotamia, and the ranks following this flame will grow endlessly."
IRQ_National_mobilization:0 "National Mobilization"
IRQ_National_mobilization_desc:0 "Let blacksmiths' furnaces cast rifle parts. Let schoolteachers turn math classes into range calculations. Even textile workers can sew simple first-aid kits with their machines. When ordinary people's tools become weapons of resistance, colonizers will truly drown in the people's war. We must mobilize the people."
IRQ_Oppose_separatism:0 "Crush Separatist Agitators"
IRQ_Oppose_separatism_desc:0 "White-collar socialists shouting class slogans and suit-wearing parliamentary politicians are, at their core, foreign weeds sprouting in Iraqi soil. They spread divisive ideologies between mosques and markets. We must uproot these buds before they become thorns—any separatist act is treason."
IRQ_Clear_the_unrest:0 "Quell Minority Unrest"
IRQ_Clear_the_unrest_desc:0 "Gunfire from the mountains is but desperate sobs. Ethnic boundaries arbitrarily drawn by colonists on maps will never be real national borders. Connect their villages with roads, educate their children in schools—when state machinery truly reaches every valley, these dissenting voices will fade into historical dust."
IRQ_populist_ideals:0 "Populist Ideals"
IRQ_populist_ideals_desc:0 "Behold—porters in Basra donate to Syrian strikers, Mosul herders sing songs of Egyptian rebels. This simple solidarity is mightier than any elite proclamation. When common folk spontaneously share neighboring nations' struggles, unity is no longer empty words. The light of populism guides our path."
IRQ_Arab_countries_are_supreme:0 "Arab Nations Supreme"
IRQ_Arab_countries_are_supreme_desc:0 "Wisdom born in the desert once bent the world; the glory of the Four Caliphs still shines in scripture. Now, let the slumbering lion awaken. Let every oil-field laborer stand tall—their blood is nobler than any colonial medal. Arab wisdom surpasses colonizers' imaginations."
IRQ_Rooted_in_the_grassroots:0 "Rooted in the Grassroots"
IRQ_Rooted_in_the_grassroots_desc:0 "These soldiers with guns are sons of farmers. They know the importance of irrigation in dry seasons, the anguish of empty granaries when children cry. When the army digs wells for villages and builds bridges for towns, uniformed figures naturally become the most trusted pillars in people's eyes. Integrating with grassroots communities earns greater trust."
IRQ_We_will_rise:0 "We Shall Rise"
IRQ_We_will_rise_desc:0 "Under yellow oil lamps, fathers tell sons of Saladin. In sand-blasted outposts, soldiers carve oaths into mud walls with bayonets. These daily accumulations of strength converge into a flood. Not empty fantasy, but audible footsteps—the dawn of Arabia shatters colonial remnants. We shall rise; Arabia shall rise."
IRQ_Under_an_iron_fist:0 "Under an Iron Fist"
IRQ_Under_an_iron_fist_desc:0 "Replace tribal feuds with discipline, smooth sectarian divides with national will. When all dissent is crushed under institutional gears, society operates with unprecedented efficiency. Unified chants and marching steps will shatter colonial windows. Freedom will come—we need only wait."
IRQ_All_for_Arabia:0 "All for the Arabian Homeland"
IRQ_All_for_Arabia_desc:0 "Pour every drop of oil from wells into national veins; send every harvested grain to military rations. Mothers teach children to read maps of the motherland first; grooms swear loyalty to the flag at weddings. This is more than a slogan—every Iraqi breathes life into their land's loyalty. All we have belongs to the Arabian homeland."
IRQ_Timeless_enthusiasm:0 "Timeless Enthusiasm of Nationalism"
IRQ_Timeless_enthusiasm_desc:0 "Fresh slogans on market walls, sudden debates in cafes, youths flocking to enlistment offices in long lines. These restless currents are the nation's true blood. When merchants refuse profit to fly the flag, you know the nation's soul burns bright—a young, free nation breathes."
IRQ_Master_the_future:0 "Master of the Future"
IRQ_Master_the_future_desc:0 "Leaders see not just nearby hills, but the entire Arab map beyond the horizon. While officials fret over food rations, their desks hold blueprints stretching to the Persian Gulf. This vision transcending current hardships is the compass guiding the nation through fog. He is the master of the future."
IRQ_Encourage_dedication:0 "Encourage Dedication to the Nation"
IRQ_Encourage_dedication_desc:0 "Death notifications should bear gold borders; martyrs' families deserve entire neighborhood condolences. Let children's textbooks dedicate chapters to heroism; let fallen names lead government reports. When society venerates heroes, new recruits charge forward. Heroism greatly boosts morale."
IRQ_The_Great_Expedition:0 "The Great Expedition"
IRQ_The_Great_Expedition_desc:0 "Camel caravans will retrace ancient pilgrimage routes—this time followed by armored columns. From Mesopotamian plains to Atlas foothills, every town will fly Arab red-green flags. Let us launch this trans-desert campaign, stitching fractured lands with our march. The glory of our ancestors revives today!"
IRQ_The_teachings_of_the_SSNP:0 "Teachings of the SSNP"
IRQ_The_teachings_of_the_SSNP_desc:0 "Kamal Shabib, with unwavering conviction and clear vision, won widespread acclaim at the Nationalist Congress. His Syrian Social National Party guides us toward a new direction. We believe under his leadership, Iraq will forge a more united and powerful path, achieving national rejuvenation."
IRQ_Reject_pan_Arabism:0 "Reject Pan-Arabism"
IRQ_Reject_pan_Arabism_desc:0 "We raise the sword of justice, tearing off Pan-Arabism's hypocritical veil. This lie, like a serpent's tongue, licks ignorant hearts, deceiving people from the true path—a blasphemous mockery of the Holy Spirit. The divine fire burns in our chests: it is but hellish mist, obscuring the light of judgment. People, awaken. We raise the torch of truth, illuminating evil's tracks in the desert. They weave webs with false covenants; we use divine retribution as our threads, casting them back into eternal darkness. God's thunder decrees: 'True light tolerates no shadow.' Follow us, sweep these heretics into eternal damnation—only the Holy Party purifies the world's filth."
IRQ_Control_the_army:0 "Cultivate the Army"
IRQ_Control_the_army_desc:0 "We control the sword in the leader's name. Whoever commands the soldiers' spirits holds worldly power—a truth etched in our hearts. The army is no longer mortal armor; it is transformed by the Social National Party into a sacred shield of the Party Guard. God commands: 'You are guardians,' so every warrior must wash away old oaths, reborn under the banner of loyalty. Spears no longer point to earth but sweep away injustice. Soldiers, accept baptism. The army becomes a sacrificial lamb, offered on the Party's glorious altar. Strength is God's gift; we forge an impregnable fortress with piety."
IRQ_Remove_religious_influences:0 "Eliminate Religious Influence"
IRQ_Remove_religious_influences_desc:0 "Religious lies deceive the people and divide innocent masses. Now, Iraqi nationalism has taken its place as our new torch of unity. Though just sprouting, it possesses the power to shatter old chains. In the future, the people will break free from false gods and unite under black banners. This strength, rooted in land and blood, is truer than any superstition. Step by step, we dismantle superstition, and national spirit will conquer all divisions."
IRQ_Keep_in_mind_the_four_major_programs:0 "Bear in Mind the Four Major Programs"
IRQ_Keep_in_mind_the_four_major_programs_desc:0 "Freedom, responsibility, discipline, strength—these four virtues are the cornerstone of our party's actions, and no one may deviate. They shape our souls and safeguard Iraq's progress in adversity. Each must be strictly enforced, with no exceptions. Those who betray these principles are traitors to the nation. We strengthen internal unity through these tenets, forging virtue into steel armor against external erosion. Loyalty to the programs will lead Iraq from darkness to light."
IRQ_Abandon_fragile_democracies:0 "Abandon Fragile Democracies"
IRQ_Abandon_fragile_democracies_desc:0 "Democratic systems are inefficient, slow to decide, and prone to absurdities like ruling parties overturning all previous goals. They cannot meet our urgent challenges. In nation-building, we need decisive action and unified will, not endless debate and delay. Only concentrated effort can achieve true strength and prosperity."
IRQ_Only_one_major_party:0 "One Major Party"
IRQ_Only_one_major_party_desc:0 "We believe only our party can truly lead the nation to strength. Other political groups must acknowledge our leadership and submit to unified command. The nation's future cannot be mired in endless disputes and infighting; we need concerted action. Under our guidance, Iraq will establish stable order and achieve development and prosperity."
IRQ_Leadership_authority:0 "Establish Leadership Authority"
IRQ_Leadership_authority_desc:0 "We extol the sacred majesty of our leader His will is like Moses' staff, shattering darkness and illuminating the people. We teach the people and party members: unconditional obedience. The Holy Spirit flows through his words, purging sin—this is a living spring of grace. The leader is a flame in thorns, burning hypocrites yet warming righteous souls. In Syria's deserts, his footprints become holy paths; believers follow and attain eternity. The Lord's word brooks no doubt: 'Those who listen shall be illuminated.' We revere him as Allah's earthly deputy with unwavering piety."
IRQ_Enemies_of_Zionism:0 "Enemies of Zionism"
IRQ_Enemies_of_Zionism_desc:0 "From this moment, the cancer of Zionism must be eradicated wherever it lurks or disguises itself in false faith. We will launch a total purge to ensure these plagues never gain footing in Syria. Their existence threatens national purity and disrupts harmony among Iraqis. Every pursuit is a defense of the future—no compromise is tolerated. This is not just a just war but a necessity for national survival. Let them find no refuge; Iraq's land belongs solely to pure Syrian sons."
IRQ_Embrace_the_identity_of_the_Two_Rivers:0 "Embrace the Identity of the Two Rivers"
IRQ_Embrace_the_identity_of_the_Two_Rivers_desc:0 "The dream of Two Rivers unity runs deep in our souls—from the heart of Damascus, sweeping through Baghdad's grandeur, across Cyprus' blue seas, to Sulaymaniyah's mountains. It will be forged into reality with iron and blood. The Socialist National Party fans its unquenchable flame: unifying the land is no utopian fantasy but a plan to expel colonial shadows. Every inch of soil awaits liberation. Amidst the resurgence, dreams are no longer empty words—they take shape as strategic blueprints, transforming sectarian discord into unified rallying cries. Though the journey is arduous, victory will dawn; the Two Rivers will reunite, eternal and undivided."
IRQ_Calling_overseas_compatriots:0 "Call on Overseas Compatriots"
IRQ_Calling_overseas_compatriots_desc:0 "We will summon Iraqi compatriots exiled abroad to return home—this land needs their strength. They will become a solid hammer to shatter the chains of the old era and forge a new Syrian homeland. Every drop of sweat merges into the reconstruction tide; every returnee is a warrior of national rebirth. In ruins, we labor together, turning compatriots' wisdom and blood into momentum for progress. Do not hesitate—returning is the most glorious struggle."
IRQ_Forge_ahead:0 "Forge Ahead for the Nation"
IRQ_Forge_ahead_desc:0 "Factories will rise, and the army will remain loyal. This is the core of Syria's rise; dawn breaks ahead. Our industrial foundation must be forged from scratch, with every worker embodying the mission of resurgence. Soldiers must swear allegiance to the flag, becoming the nation's steel bulwark. Do not falter—forge ahead. Every construction step is a declaration of war on the old world. Forward, Iraqis—victory is in sight."
IRQ_Strike_against_the_powerful:0 "Strike Against the Powerful"
IRQ_Strike_against_the_powerful_desc:0 "Powerful clans manipulate parties for personal gain, their influence spreading like poison. They are the driving force of national division and must be crushed with heavy blows. These parasites corrode the nation's roots, profiting from false political facades. We launch thunderous operations to strip their disguises and expose their corruption. Reckoning begins at the source, ensuring power returns to the people. Only by destroying these shadows will light dawn on Iraq."
IRQ_National_security_system:0 "National Security System"
IRQ_National_security_system_desc:0 "First, establish a stable social security system, then gradually improve public welfare. Let every Iraqi understand: good days come from our dedication, not charlatans' empty promises. This policy exposes false promise-makers and wins popular loyalty. Each welfare measure is concrete action, proving who truly serves the nation. As public welfare improves, people will see the truth and unite under the banner of progress. Livelihood stability is the cornerstone of resurgence."
IRQ_Thousands_of_tempers:0 "Tempered Through Trials"
IRQ_Thousands_of_tempers_desc:0 "Weak nations never endure hardship; their 'freedom' is but a gifted illusion. True freedom is won with blood, not bestowed by others. Iraqis must understand: resilience is forged in battle scars, not granted by peace. Every sacrifice nourishes tomorrow, teaching us to guard dignity. Abandon false hopes—take up arms and struggle. Only blood-stained hands can forge eternal freedom."
IRQ_Musa_Club:0 "Musa Club's Triumph"
IRQ_Musa_Club_desc:0 "Musa Club members ignited the conference with deafening cries. As they chanted 'Unite or perish' on stage, the hall erupted. We witnessed how pure national passion crushes all moderate voices. This victory is not just a numerical lead—it reveals a truth: only the most ardent patriots can lead Iraq to break its chains."
IRQ_idealistic_nationalist:0 "An Idealistic Nationalist"
IRQ_idealistic_nationalist_desc:0 "When Gaylani gazes at the map of the Fertile Crescent, we see stars in his eyes. Yet towering problems choke our progress—chaotic tribal relations, empty state coffers, and lurking foreign powers. Even the grandest blueprint must start by solving these urgent dilemmas; we must first clarify our path."
IRQ_The_virtue_of_liberation:0 "The Virtue of Liberation"
IRQ_The_virtue_of_liberation_desc:0 "Whenever we think of Algerian compatriots toiling under French boots, our fists clench. Liberation is not just a war cry—it is a responsibility flowing in our blood. Let Algerian craftsmen sign contracts in their own language; let Bedouins no longer pay livestock taxes to colonizers. This is where our bayonets truly point."
IRQ_Slaughter_all_traitors:0 "Slaughter All Traitors"
IRQ_Slaughter_all_traitors_desc:0 "In Baghdad's teahouse backrooms and Basra's cargo holds, pounds and dollars corrupt souls that should be loyal. These worms toast with you by day but trade military deployment maps in cigarette packs by night. There is only one way to deal with these scavengers gnawing at the nation's roots: expose their traitorous marks and let gun barrels replace judgment seats."
IRQ_Stable_country:0 "Stable Country"
IRQ_Stable_country_desc:0 "The stench of blood still lingers by the Tigris, and curfews have eased. Coffee stalls reopen, and oil pumps hum more steadily than last month. We dismantled bombs, but crucially, we removed those who planted them. Now we can breathe—channeling energy into rebuilding our rusted national machinery."
IRQ_Vengeance_Fire:0 "Vengeance Is the Nation's Duty"
IRQ_Vengeance_Fire_desc:0 "Remember the dust kicked up by Ottoman planes bombing Fallujah? Beneath it lay women and children from market day. Today, bullet holes in village stones are scars on the nation's spine. Settling scores is not personal vengeance—it is demanding answers for bombed schools, burned granaries, and shattered lives. Let the enemy taste the anguish of losing loved ones."
IRQ_Patriotic_enlightenment:0 "Patriotic Enlightenment"
IRQ_Patriotic_enlightenment_desc:0 "Farmers in the countryside view national duty as distant legend; market vendors care only about tomorrow's bread price. We must tear the veil of ignorance from their eyes In mud walls, paint slogans of Arab unity; let patriotic poets sing epics of the nation in markets; deliver simplified newspapers to every teahouse—awakening the people is more vital than arming a hundred legions."
IRQ_Sharpen_the_sword:0 "Sharpen the Sword"
IRQ_Sharpen_the_sword_desc:0 "Watching colonists flaunt power under our noses, who wouldn't want to smash their jeeps immediately? But the cost of haste is too steep. First, forge weapons arsenals, learn patrol schedules, and weave intelligence networks in shadows. When every action squad is primed like loaded bullets, that is the moment to pull the trigger."
IRQ_Work_for_the_country:0 "Work for the Country"
IRQ_Work_for_the_country_desc:0 "The ceaseless roar of cotton mills is a march of resistance; bent backs in wheat fields are the nation's true pillars. Let tractors replace rifles as new totems Workers adding parts on machinery and farmers tilling drought-resistant crops add weight to the foundation of Arab resurgence."
IRQ_Nationalism_of_the_fighting:0 "Fighting Nationalist Alliance"
IRQ_Nationalism_of_the_fighting_desc:0 "Scholars in bookstores, imams in mosques, and tribal chiefs now act alone. We need a roundtable where officers' strategies meet poets' pens, elders' authority blends with students' passion. When patriotic doctors convert clinics into liaison stations, the roots of the national front grow firm."
IRQ_Oppressed_compatriots:0 "Oppressed Compatriots"
IRQ_Oppressed_compatriots_desc:0 "While Algerian miners are chained in pits, Tunisian fishermen's holds are ransacked by foreign customs. Moans across the Mediterranean pierce our eardrums. The fall of every Arab city is a dagger aimed at Baghdad; liberating brothers defends ourselves—only unity can eliminate injustice."
IRQ_Resisters_everywhere:0 "Resisters Everywhere"
IRQ_Resisters_everywhere_desc:0 "Grandmothers in churches listen to free radio; children slip anti-colonial comics into textbooks. Even flower girls at markets learn to watch for foreign patrols. When every compatriot becomes a carrier pigeon and every window hides a lookout, colonists' feet stand on volcanic ground."
IRQ_The_end_of_imperialism:0 "End of Imperialism"
IRQ_The_end_of_imperialism_desc:0 "Watch unemployed crowds in London's streets and capitalists shifting blame in Paris' parliament. These self-proclaimed 'civilization beacons' are hollowed by greed. Since their decaying edifice will collapse, why not add fuel? Let the flames of uprising burn in Beirut—colonial machinery's downfall is near!"
IRQ_Nationalist_supreme_jihad:0 "Prepare for the National Supreme Jihad"
IRQ_Nationalist_supreme_jihad_desc:0 "From Syrian highlands to Egyptian oases, all lands split by barbed wire must reconnect. We must muster armed forces from Najd Desert to the Persian Gulf—shouldering our fathers' old shotguns, driving modified farm trucks, letting this desert liberation storm rage fiercer. Jihad is our task and all compatriots' duty."
IRQ_The_day_of_judgment_is_approaching:0 "Judgment Day Approaches..."
IRQ_The_day_of_judgment_is_approaching_desc:0 "French governors' afternoon teas reek of blood; German consuls' umbrellas cannot block the wrath from above. Allah witnesses every crime of the oppressors—the gavel falls soon. When unusual sandstorms sweep the desert and every minaret calls prayer simultaneously, judgment arrives."
IRQ_Servant_of_Allah:0 "Servant of Allah Saves the Homeland"
IRQ_Servant_of_Allah_desc:0 "In Allah's name, the Merciful, the Compassionate. O believers Beware of Pan-Arabism luring you from the straight path—like a serpent coiling around hearts, leading believers to destruction. By Allah's grace, He sends devout clerics as lamps in darkness, using wisdom and courage to expel traitors who abandon faith. They act in Allah's name, defending Islam's purity and shielding communities from division and error. Allah says: 'Hold fast to Allah's rope, do not split.' (3:103) We are forever grateful for this protection—follow the clerics, shun heresies that plunge the nation into chaos."
IRQ_National_Rescue_Committee:0 "National Rescue Committee"
IRQ_National_Rescue_Committee_desc:0 "In Allah's name, the Most Gracious, the Most Merciful. O believers Know that enemies are not always visible—Pan-Arabism's followers lurk like shadows, spreading corruption and division in secret. Allah warns: 'They seek to extinguish Allah's light with their tongues, but Allah will perfect His light.' (9:32) We must vigilantly hunt their traces and cut their plots with the sword of truth. Communities must unite, exposing these saboteurs with wisdom and resolve to protect Umma's purity. Allah aids those who defend faith—we are His all-knowing guardian."
IRQ_Unite_Muslims:0 "Unite Muslims"
IRQ_Unite_Muslims_desc:0 "In Allah's name, Lord of All. Believers are brothers, so unite in faith. Allah says: 'Hold fast to Allah's rope, do not split.' (3:103) The Muslim Umma is a building, each part supporting the whole; a body, where pain in one limb is felt by all. We abandon division, guided by Quran and Hadith, to rebuild brotherhood. In divisive times, unity is strength—the path to Allah's pleasure. May our hearts and hands join to repel all enemies, manifesting Islam's greatness and unity."
IRQ_Healing_cracks:0 "Heal the Cracks"
IRQ_Healing_cracks_desc:0 "In Allah's name, the Most Merciful. National division bleeds like a wound, weakening us and hindering progress. Allah commands: 'Do not split, for splitting weakens you.' (8:46) Heal with tolerance and understanding; rebuild trust through dialogue and consultation. The Prophet (peace be upon him) said: 'Believers love, mercy, and aid one another as one body.' Follow his example—resolve grievances, unite on faith. Only then will Allah's grace descend, renewing the nation."
IRQ_The_death_of_the_denier:0 "Death of the Denier"
IRQ_The_death_of_the_denier_desc:0 "In Allah's name, the Guide. For those who deny truth, we use wisdom and kind words to guide them, revealing Islam's light. Allah says: 'Invite to the way of your Lord with wisdom and good instruction.' (16:125) Guidance is an act of mercy—to save the lost from Hell and lead them to Tawhid. Patience and knowledge are our weapons, not force or violence. May we emulate the Prophet, illuminating dark hearts with Quranic truth, drawing more into Islam's family to share Allah's blessings."
IRQ_Islamic_values:0 "Islamic Values"
IRQ_Islamic_values_desc:0 "In Allah's name, the Most Gracious, the Most Merciful. Islamic values are life's foundation—advocating justice, mercy, honesty, and humility. Allah says: 'You are the best nation produced for mankind, enjoining good and forbidding evil.' (3:110) We spread these virtues through words and deeds, letting Islamic light shine via education and social practice. From family to society, individual to collective, values integrate into daily life, shaping an ideal society. This obeys Allah and serves humanity—may Allah make us true examples."
IRQ_Teaching_the_rule_of_law:0 "Teach the Rule of Law"
IRQ_Teaching_the_rule_of_law_desc:0 "In Allah's name, the Legislator. Sharia is Allah's perfect law, covering all life aspects, ensuring justice and order. Allah says: 'We have revealed this Book in truth, confirming the Scriptures before it.' (5:48) Governance must align with sacred law—decisions based on Quran and Hadith, keeping society from human law's errors. Sharia protects rights, punishes evil, promotes public good—it is the only path to fulfilling Allah's will. Let us enforce this system, building a nation that fears Allah, achieving success in this world and the next."
IRQ_Believe_in_Allah_and_brothers:0 "Believe in Allah and Brothers"
IRQ_Believe_in_Allah_and_brothers_desc:0 "In Allah's name, the Most Merciful. Believers are brothers through faith—a bond transcending blood and borders. Allah says: 'Believers are brothers.' (49:10) Treat each other with fraternal love, mercy, and shared joy/sorrow. Brotherhood is Umma's strength and a bulwark against division. Follow the Prophet's teachings, strengthen bonds, replacing suspicion with trust and conflict with cooperation. On Allah's path, brothers walk together, earning His aid and great reward."
IRQ_Reorganize_the_jihadist_army:0 "Reorganize the Jihadist Army"
IRQ_Reorganize_the_jihadist_army_desc:0 "In Allah's name, the Almighty. Jihad is struggling for Allah's path, defending faith and territory. Allah says: 'Fight those who attack you in the way of Allah.' (2:190) Reorganizing the jihadist army is urgent—training devout warriors, equipping spiritual and material weapons, preparing for threats. Jihad is not aggression but protecting Umma and spreading truth. May warriors fear Allah, discipline themselves, and fight selflessly like early Muslims. Only then will Allah grant victory, raising Islam's banner high."
IRQ_The_faithful_hold_the_reins:0 "The Faithful Hold the Reins"
IRQ_The_faithful_hold_the_reins_desc:0 "In Allah's name, the Most Gracious. The faithful must lead, guiding society by truth. Allah says: 'I will surely make the faithful stewards of the earth.' (24:55) Holding the reins means responsibility—governing with wisdom and justice, preventing enemies from seizing power. The faithful are shepherds, protecting the community from wolves, ensuring correct direction. This is Allah's trust—we must fulfill it, guided by faith, serving the people, and earning His pleasure and afterlife success."
IRQ_Imitate_the_constitutional_system:0 "Imitate the Constitutional System"
IRQ_Imitate_the_constitutional_system_desc:0 "In Allah's name, the Wise. A constitutional system aligned with Sharia can serve as a governance tool. Allah says: 'Their affairs are decided by consultation.' (42:38) Emulating constitutions requires Islamic principles, integrating Shura (consultation), ensuring justice and rights. But beware of Western systems' pagan elements—uphold Allah's law as supreme. Through consultation and rule of law, build a stable, efficient government serving Muslim interests. Let us learn wisely, not blindly, always guided by faith."
IRQ_Allahs_guided_society:0 "Allah-Guided Society"
IRQ_Allahs_guided_society_desc:0 "In Allah's name, the Most Merciful. The ideal society is Allah-guided—all matters follow Quran and Hadith. Allah says: 'This is my way, I call to Allah with clear proof, and those who follow me.' (12:108) In this society, justice prevails, virtues thrive, people fear Allah and love one another. Leaders serve as servants; the people are brothers, united in mutual aid. By promoting Islamic values and law, we draw near Allah's pleasure, building a paradise on earth, previewing heavenly blessings."
IRQ_Close_to_Iran:0 "Close to Iran"
IRQ_Close_to_Iran_desc:0 "In Allah's name, the Uniter. As fellow Shia brothers, we share faith and historical ties with Iran. Allah says: 'Believers are brothers.' (49:10) Closeness is natural—rooted in doctrinal affinity and shared interests. Strengthen political, economic, and cultural bonds; cooperate to meet challenges and empower the Muslim world. Yet maintain independent judgment—avoid blind following. May this brotherhood strengthen Umma, benefit all Muslims, and earn Allah's aid."
IRQ_Hire_Islamic_scholars:0 "Hire Islamic Scholars"
IRQ_Hire_Islamic_scholars_desc:0 "In Allah's name, the Most Gracious. Iranian scholars possess profound Islamic knowledge—hiring them enriches our intellectual tradition. The Prophet (peace be upon him) said: 'Scholars are heirs to the prophets.' Welcome these brothers, share their insights, and collaboratively explore fiqh and development. Academic exchange deepens religious understanding and solves contemporary issues. But uphold Quran and Hadith as final standards—preserve faith's purity. May Allah guide us to beneficial knowledge, advancing religious progress."
IRQ_Islamic_Republic:0 "Islamic Republic"
IRQ_Islamic_Republic_desc:0 "In Allah's name, the Sovereign. The Islamic Republic embodies Allah's law—sovereignty belongs to Allah, exercised by His deputies. Allah says: 'Judgment belongs only to Allah.' (12:40) The republic bases governance on Sharia, with leaders chosen by consultation to serve public interests. It protects rights, enforces justice, promotes public good—a truly Allah-fearing system. Let us strive to build such a nation, fulfilling Allah's will and securing Muslims' safety and development. May Allah aid this great cause and accept our efforts."
IRQ_Saadun_family:0 "Sa'ud Family Leads the Nation"
IRQ_Saadun_family_desc:0 "In Allah's name, the Most Merciful. The Sa'ud family, like virtuous predecessors, possesses leadership and piety. Allah says: 'I test them.' (25:20) If just and pious, their leadership is legitimate and beneficial. The family must serve the people, govern by Sharia, and avoid tyranny/corruption. The people obey reasonable leadership—as the Prophet said: 'Obedience and submission are duties.' May the family lead the nation to prosperity and faith, earning Allah's support and public affection."
IRQ_Ensure_landlord_support:0 "Ensure Landlord Support"
IRQ_Ensure_landlord_support_desc:0 "In Allah's name, the Provider. Landlords are vital to society—securing their support aids stability and development. Allah says: 'Share your good fortune.' (2:267) Fair policies and respecting rights make landlords partners in construction. But adhere to Islamic justice—prevent exploitation. Landlords must fear Allah, support public good, and contribute to society. May this cooperation boost economic prosperity and strengthen community unity, blessed by Allah."
IRQ_Issuing_titles_of_nobility:0 "Issue Titles of Nobility"
IRQ_Issuing_titles_of_nobility_desc:0 "In Allah's name, the Most Gracious. Noble titles, if based on service and piety, honor contributions and encourage virtue. Allah says: 'I reward good deeds.' (77:44) Avoid pride and class division—emphasize all glory belongs to Allah. Titles go to those loyal to faith and service, not inherited or bought. This system promotes virtue and competition, but remember: all are equal before Allah. Use titles wisely to strengthen social cohesion."
IRQ_King_authority:0 "Establish Royal Authority"
IRQ_King_authority_desc:0 "In Allah's name, the Ruler. Kings act as Allah's deputies, bearing great trust. Allah says: 'I will place a deputy on earth.' (2:30) Kings must rule by Sharia, be just and merciful, serving the people like Prophets David and Solomon. Power is not for tyranny but responsibility and service. The people obey reasonable commands, building society together. May the king fear Allah, leading the nation to success in this world and the next, blessed by Allah and public prayers."
IRQ_Absolute_loyalty:0 "Absolute Loyalty"
IRQ_Absolute_loyalty_desc:0 "In Allah's name, the Most Merciful. Loyalty first belongs to Allah, then to leaders and community. Allah says: 'Obey Allah, the Messenger, and those in authority among you.' (4:59) Absolute loyalty means wholehearted devotion—defending faith and nation, prioritizing collective interests. But loyalty is not blind; disobey if it contradicts faith. Believers are as loyal as early companions, devoting all to Allah's path. May this loyalty strengthen Umma, bringing stability and victory."
IRQ_Modern_Sultanate:0 "Modern Sultanate"
IRQ_Modern_Sultanate_desc:0 "In Allah's name, the Authority. The modern sultanate blends traditional governance with contemporary needs, but Sharia remains core. Allah says: 'Power belongs to Allah.' (10:65) The sultan, as leader, must be just, consult scholars, and serve the people. The nation uses modern technology and management but retains Islamic identity and values. This system achieves progress and stability while fearing Allah. May the sultanate be a model for the Muslim world, showcasing Islam's adaptability and eternal truth."
IRQ_The_dawn_of_socialism:0 "Dawn of Socialism"
IRQ_The_dawn_of_socialism_desc:0 "After arduous struggle, we socialists have finally overthrown the corrupt nationalist regime and now lead Iraq. This marks a new era—we must immediately begin national reconstruction, implement socialist policies, and ensure a smooth power transition. Though challenges lie ahead, we resolve to overcome them all, creating a fairer, more progressive future for all Iraqis."
IRQ_Carry_out_national_transformation:0 "Carry Out National Transformation"
IRQ_Carry_out_national_transformation_desc:0 "Socialism is not empty words—it demands comprehensive national transformation. This includes nationalizing the economy, land reform, and establishing social welfare. We must unwaveringly advance these changes, eradicating the old regime's remnants, ensuring socialist ideals take root in Iraq. Each step requires careful planning, but we believe this is the only path to national prosperity."
IRQ_Add_fire_to_the_revolution:0 "Add Fuel to the Revolution"
IRQ_Add_fire_to_the_revolution_desc:0 "Revolutionary passion is our most precious driving force—never let it fade. Organize mass rallies, hold revolutionary commemoration events, and honor advanced workers to sustain this passion. Let workers and farmers take center stage, sharing their struggle stories. Strengthen propaganda through newspapers and radio to spread revolutionary thought. Only then will the revolutionary flame burn brighter, illuminating Iraq's path forward."
IRQ_End_the_state_of_chaos:0 "End the State of Chaos"
IRQ_End_the_state_of_chaos_desc:0 "Though civil unrest has temporarily subsided, rebel forces remain active, undermining our new order. We cannot stand by—we must take decisive action to end their rampage. This includes strengthening security patrols and mobilizing popular forces to safeguard national unity and stability. Only by thoroughly eliminating these threats can we focus on construction."
IRQ_Healing_ethnic_divisions:0 "Heal Ethnic Divisions"
IRQ_Healing_ethnic_divisions_desc:0 "Long-standing divisions between Kurds, Arabs, and Assyrians, exacerbated by the former regime's nationalist policies, plague Iraq. Now, we emphasize all minorities share one identity: Iraqi. We bridge divides through equal policies and inclusive measures, ensuring everyone contributes to national development."
IRQ_Moderate_secularization:0 "Moderate Secularization Suited to National Conditions"
IRQ_Moderate_secularization_desc:0 "Secularization is sensitive—we must proceed gradually, adapting to Iraq's realities. Respect traditions while introducing modern ideas to avoid social upheaval. Our goal: a balanced secular system that promotes progress without losing public support."
IRQ_Enlightenment_Committee:0 "Enlightenment Committee"
IRQ_Enlightenment_Committee_desc:0 "We know many Iraqis remain ignorant, lacking literacy and basic scientific knowledge—severely hindering national development. We must immediately establish universal education. Through rural schools, adult literacy programs, and basic courses, we eliminate illiteracy. Education is the key to freeing minds—we advance patiently, ensuring every citizen gains essential knowledge and skills."
IRQ_Mobilize_intellectuals:0 "Mobilize Intellectuals"
IRQ_Mobilize_intellectuals_desc:0 "Intellectuals excel at spreading ideas—we must leverage their strengths. Establish specialized cultural propaganda agencies, inviting writers, teachers, and artists to create works reflecting socialist values. Provide creative freedom and support, making them voluntary spokespeople for the revolution. Their writings, poetry, and speeches will spread our ideals, shaping new national consciousness."
IRQ_Socialist_culture:0 "Socialist Culture"
IRQ_Socialist_culture_desc:0 "Building socialist culture is a systematic project. Encourage art reflecting workers' and farmers' lives, host mass cultural events, and reform cultural curricula. Protect Iraqi cultural heritage while infusing it with new meaning. These measures will forge a new culture blending national character and socialist values."
IRQ_Baath_Party_Iraq:0 "Baath Party's Iraqi Base"
IRQ_Baath_Party_Iraq_desc:0 "At the recent Pan-Arab Congress, our Baathists won support from delegations with clear Arab unity proposals and practical reforms. This recognition entrusts us with leading Iraq. We seize this opportunity to advance domestic reforms, strengthen ties with Arab brothers, and realize the Pan-Arab ideals advocated at the congress."
IRQ_fellow_Syrians:0 "Fellow Syrians"
IRQ_fellow_Syrians_desc:0 "Syria, the cradle of Baathist thought, has rich practical experience. We humbly learn from their successes, building close fraternal party ties. Regular delegation exchanges share experiences, jointly studying challenges. We adapt these lessons to Iraq's context, avoiding blind imitation."
IRQ_United_Arab_nationalists:0 "United Arab Nationalists"
IRQ_United_Arab_nationalists_desc:0 "Though differing on specifics, Arab nationalists share our goals of national liberation and resurgence. We seek common ground, cooperating in anti-colonial struggles, economic development, and cultural revival. Regular consultations align positions, uniting actions to advance Arab causes."
IRQ_Social_justice:0 "Uphold Social Justice"
IRQ_Social_justice_desc:0 "Social justice is our core commitment—we advance it unwaveringly. This means establishing fair wealth distribution, improving social security, and ensuring basic welfare for all. Crack down on corruption and privilege; the law treats all equally. Reforms will turn social justice from ideal to reality."
IRQ_Land_redistribution:0 "Promote Land Redistribution"
IRQ_Land_redistribution_desc:0 "Feudal landlord systems hinder rural development—abolish them. Land reform bills will seize large estates, distributing land free to landless/land-poor farmers. Establish agricultural cooperatives, providing seeds, tools, and technical guidance. Let tillers own land, liberating rural productivity and improving farmers' lives—our firm promise."
IRQ_A_united_motherland:0 "A United Motherland"
IRQ_A_united_motherland_desc:0 "Under the Baath Party's wise leadership, Iraq displays unprecedented national unity. We establish ethnic equality committees, promote bilingual education, and distribute development resources fairly among ethnic regions. Kurds, Arabs, and Assyrians feel true equality for the first time. Youth from all groups join national construction, fostering understanding through labor. This unity is genuine, not superficial—it forms a solid foundation for national strength."
IRQ_Communist_Party_of_Iraq:0 "Iraqi Communist Party's Impossible Victory"
IRQ_Communist_Party_of_Iraq_desc:0 "Amid civil war, we Communists overcame all opponents with remarkable resilience and wisdom—a great victory for the working class. Relying on worker-peasant alliances and flexible tactics, we seized state power. Now, we cherish this hard-won victory, immediately beginning socialist transformation, establishing proletarian dictatorship, eradicating exploitation, and achieving true social liberation."
IRQ_Communist_Constitution:0 "Formulate a Communist Constitution"
IRQ_Communist_Constitution_desc:0 "Drafting a new communist constitution is our top priority. This constitution will enshrine the working class's leadership, guarantee the people's right to self-governance, and establish socialist public ownership as primary. We will organize nationwide discussions, soliciting broad input, ensuring the constitution reflects the people's will. It is not just a legal document but our general program and guide for building a new society."
IRQ_Youth_power:0 "Affirm Youth Power"
IRQ_Youth_power_desc:0 "The younger generation brims with vitality and ideals—they are the backbone of national construction. We establish a comprehensive youth development system, using youth leagues, technical schools, and military training camps to enhance ideological awareness and professional skills. Encourage youth to join frontline industrial, agricultural, and defense work, growing through practice into reliable vanguards and shock troops for socialism."
IRQ_Iraq_of_the_Builders:0 "Iraq of the Builders"
IRQ_Iraq_of_the_Builders_desc:0 "Iraq is the common home of all builders, belonging to no privileged class. Workers, farmers, intellectuals, and artisans—all who contribute to national construction—are the nation's masters. Institutional reforms ensure equal participation in national affairs and shared development fruits. This sense of ownership ignites creativity and dedication across the people."
IRQ_A_laborers_paradise:0 "A Laborers' Paradise"
IRQ_A_laborers_paradise_desc:0 "Our goal is to build Iraq into a paradise for laborers. No exploitation or oppression—every honest worker earns dignity and happiness. We develop the national economy, improve livelihoods, and strengthen social security, making 'labor is glorious' a social ethos. Though challenges remain, we are confident this vision will become reality."
IRQ_Red_heart:0 "Red Heart of the Peninsula"
IRQ_Red_heart_desc:0 "As the communist heart of the peninsula, Iraq bears a special historical mission. Beyond domestic socialist construction, we actively support revolutionary movements in neighboring regions. Through demonstration, experience exchange, and material aid, we help fraternal parties and progressive organizations grow. Let communist thought illuminate the entire Arabian Peninsula, driving regional revolution."
IRQ_Arab_socialism:0 "Arab Socialism from Cairo"
IRQ_Arab_socialism_desc:0 "At the Pan-Arab Congress, our Arab Socialist League won broad delegation support with clear stances, feasible plans, and unwavering resolve, gaining the historical opportunity to lead Iraq. This recognizes our ideas and practices by the Arab world. Now, we advance domestic reforms, promote Arab unity/cooperation externally, and achieve the congress's shared goals."
IRQ_Follow_Egypt:0 "Follow Egypt's Lead"
IRQ_Follow_Egypt_desc:0 "Egypt leads Pan-Arab unity—we humbly learn from their successes. Strengthen political, economic, military, and cultural cooperation, establishing regular consultations to align positions and act together. Egypt-Iraq ties will drive Arab unity, realizing the great ideal of national resurgence."
IRQ_Calling_patriotic_children:0 "Call on Patriotic Sons and Daughters"
IRQ_Calling_patriotic_children_desc:0 "We call on all Iraqis who love their country to join our great cause. Regardless of ethnicity, faith, or background, anyone dedicated to Iraq's independence, freedom, and development is welcome. Transcend divisions—unite all forces, gather all patriotic energy, and jointly build a strong, prosperous, and dignified new Iraq."
IRQ_A_true_revolutionary:0 "A True Revolutionary"
IRQ_A_true_revolutionary_desc:0 "We are the true revolutionaries of this land, for our revolution is rooted in and for the people. Unlike reformists, we resolve to overthrow the old system and build a new social order. Every policy reflects the working people's fundamental interests; every action pushes history forward. Time will prove only we can lead Iraq to full liberation."
IRQ_Military_political_system:0 "Maintain Military-Political System"
IRQ_Military_political_system_desc:0 "To safeguard our hard-won revolutionary gains, we must maintain necessary military-political controls. This is a temporary measure to counter internal/external subversion during transition. We promise to restore normal civilian governance once counter-revolutionary forces are eliminated and national security is ensured. Please understand and support this temporary measure to defend our revolutionary fruits."
IRQ_Pan_Arab_cause:0 "Defend the Pan-Arab Cause"
IRQ_Pan_Arab_cause_desc:0 "We solemnly swear to be the staunchest defenders of the Pan-Arab cause. This requires implementing Arab unity domestically and safeguarding Arab interests internationally. Support brothers' liberation struggles; oppose all colonialism and foreign interference. Iraq will unshirkably act as the backbone of the Pan-Arab movement."
IRQ_The_victory_of_democracy:0 "Victory of Democracy"
IRQ_The_victory_of_democracy_desc:0 "General Karim Qasim led our people's army to overthrow the corrupt nationalist regime after arduous struggle. The nation restores order—our primary task is organizing fair, transparent democratic elections. The new government, based on broad public will, ensures all ethnic groups and classes are represented, ushering in a new era of people-led governance."
IRQ_Peoples_Association:0 "People's Association"
IRQ_Peoples_Association_desc:0 "In this historic democratic election, General Karim Qasim won voter support through outstanding military achievements and popular reform plans. His colleague Kamal Chadirji was elected Iraq's new leader—we fully support his policies. Kamal's victory is not just personal honor but reflects the Iraqi people's collective wish, marking the nation's official march toward democracy and rule of law."
IRQ_Moderate_social_reforms:0 "Moderate Social Reforms"
IRQ_Moderate_social_reforms_desc:0 "Social reforms must proceed cautiously—hasty changes risk instability and resistance, hindering progress. Adopt phased, incremental strategies, carefully adjusting policies to let reforms take root. By the time vested interests notice, the new order is unshakable."
IRQ_Limited_cooperation:0 "Limited Cooperation with Pan-Arabists"
IRQ_Limited_cooperation_desc:0 "We share the Pan-Arab goal of Arab unity but view some strategies as overly radical, potentially harming Iraq's interests. Thus, we cooperate with Pan-Arab forces in limited, pragmatic ways while preserving sovereignty and stability. Balance national sentiment with reality—steadily advance diplomacy and cooperation."
IRQ_Depoliticization_of_the_military:0 "Depoliticize the Military"
IRQ_Depoliticization_of_the_military_desc:0 "The military must strictly avoid political intervention—critical for democratic stability. Allowing military involvement in politics causes power imbalances and erodes democratic institutions. We enforce civilian-military separation, requiring the military to focus on defense/security, never domestic politics. This is key to long-term stability and democracy—we must uphold it."
IRQ_Social_equality_in_the_Quran:0 "Social Equality in the Quran"
IRQ_Social_equality_in_the_Quran_desc:0 "The Quran, our life guide, contains infinite wisdom and social justice principles. Drawing on these teachings provides moral direction for governance. Many verses align with our goals of fairness and aiding the vulnerable, offering cultural and spiritual foundations for humane policies."
IRQ_Bask_in_freedom:0 "Bask in Freedom"
IRQ_Bask_in_freedom_desc:0 "Our goal is to envelope every Iraqi in freedom. Through laws and institutions, protect citizens' rights and expression, ensuring equal opportunity to pursue happiness and development. Freedom is more than a slogan—implemented through policies, we strive to make Iraq a trusted haven for all."
IRQ_Protect_poor_citizens:0 "Protect Poor Citizens"
IRQ_Protect_poor_citizens_desc:0 "Aiding poor and vulnerable citizens is the government's unshirkable duty. We legislate and implement welfare policies to limit exploitation, assist the needy, narrow social gaps, and ensure basic security and dignity. This promotes fairness and stability—we continuously improve social protection."
IRQ_Modernization_of_the_country:0 "National Modernization"
IRQ_Modernization_of_the_country_desc:0 "Modernization is Iraq's path to prosperity. Despite traditional resistance, we advance industrial, educational, and technological innovation. Modernization boosts economy/military strength and improves living standards. We move forward decisively, leading the nation into an era of progress."
IRQ_An_equal_and_strong_motherland:0 "Equal and Strong Motherland"
IRQ_An_equal_and_strong_motherland_desc:0 "We shape a strong, equal Iraq where citizens live in safety and dignity. Our rise alarms potential adversaries—they dare not act against our resolve and growing strength. We continue uniting to meet all challenges, ensuring Iraq stands tall among nations."
IRQ_National_Democratic_Party:0 "National Democratic Party"
IRQ_National_Democratic_Party_desc:0 "The National Democratic Party, with progressive reform agendas and firm national stances, wins public support and leads the new government. We rebuild the nation, advancing policies aligned with national interests, uniting Iraq toward stability and prosperity. The government focuses on industrial development and livelihood improvement, reducing external dependence, enhancing self-reliance, and making Iraq a united, strong modern nation."
IRQ_Curb_landlords_and_gentry:0 "Curb Landlords and Gentry"
IRQ_Curb_landlords_and_gentry_desc:0 "Landlords and gentry have long interfered in politics through traditional power, undermining policy fairness. We weaken their privileges, strengthen central authority, ensuring laws/policies are implemented nationwide. Through land reform and local governance redesign, we break old power structures, letting rural areas benefit from national progress."
IRQ_Political_liberalization:0 "Political Liberalization"
IRQ_Political_liberalization_desc:0 "True democratic freedom means every citizen participates in political discussion and expresses opinions. We establish open deliberative mechanisms, encourage public voices, and make decision-making transparent and inclusive, reflecting real public will. We build public forums and grassroots councils, ensuring all groups—urban/rural, rich/poor—truly participate in governance."
IRQ_Judicial_system_reform:0 "Judicial System Reform"
IRQ_Judicial_system_reform_desc:0 "Our judicial system still relies heavily on Sharia. We value its traditions but recognize the need for adjustments to meet modern needs. Reforms focus on fairness and efficiency, respecting faith while integrating modern legal principles. Establishing modern court systems and training new judges aims to enhance justice and efficiency while preserving cultural roots."
IRQ_Agricultural_subsidies_are_issued:0 "Agricultural Subsidies Issued"
IRQ_Agricultural_subsidies_are_issued_desc:0 "Farmers face high risks—natural disasters or man-made crises often ruin them. We establish agricultural subsidy programs, providing seeds, tools, and credit to boost rural resilience, stabilize food production, and secure farmers' livelihoods. Promote agricultural knowledge/technology and improve irrigation to enhance productivity, ensuring farmers' lives are secure and hopeful."
IRQ_Judicial_justice:0 "Judicial Justice"
IRQ_Judicial_justice_desc:0 "Legal justice must not vary by status—religious leaders, wealthy merchants, ordinary citizens, and small business owners deserve equal treatment. We uphold equal trial principles, ensuring everyone trusts and defends the legal system. Judiciary operates independently, free from money/privilege, truly safeguarding social fairness."
IRQ_Feed_the_people:0 "Feed the People"
IRQ_Feed_the_people_desc:0 "To earn genuine public support, the government must ensure people live well. Improve livelihoods, provide jobs, stabilize prices—let citizens eat and dress warmly, feeling policy benefits. This is the foundation of stable governance. We develop domestic industries, expand trade, and raise incomes, ensuring everyone benefits from national progress."
IRQ_Release_political_prisoners:0 "Release Political Prisoners"
IRQ_Release_political_prisoners_desc:0 "Many imprisoned 'political prisoners' committed no crimes—they simply expressed differing opinions. Releasing them upholds justice and demonstrates government magnanimity. Open discourse and tolerating criticism do not destabilize the nation; they foster unity and reconciliation. Review cases legally, free the innocent, and build a tolerant, trusting society."
IRQ_The_country_of_freedom:0 "Country of Freedom"
IRQ_The_country_of_freedom_desc:0 "After unremitting effort, our nation has entered a new era of freedom and dignity. People enjoy broader rights; society buzzes with vitality and hope. Iraq marches steadily toward an independent, open, and strong future. We advance reforms, consolidate democracy, and ensure long-term stability—every Iraqi takes pride in being Iraqi."
IRQ_Correct_the_fallacy_of_populism:0 "Correct the Fallacy of Populism"
IRQ_Correct_the_fallacy_of_populism_desc:0 "Populism's spread divides and destabilizes the nation—we must correct this danger. The government guides public opinion with rational policies, restoring order and dialogue to keep development on track, avoiding emotional decisions that harm Iraq's long-term interests. We strengthen education, fostering rational thinking, and improve democratic mechanisms, allowing legitimate demands to be expressed legally, maintaining social stability and harmony."
IRQ_Promote_national_equality:0 "Promote National Equality"
IRQ_Promote_national_equality_desc:0 "Arabs, Kurds, Assyrians—all are inseparable parts of Iraq. We insist on equal coexistence, jointly building the nation. The government implements inclusive policies, respecting cultural rights, strengthening national identity, and marching toward united prosperity. We establish special agencies for ethnic affairs, promote cultural exchange, and emphasize shared national identity in education, ensuring all feel fairness and belonging."
IRQ_Clear_out_the_red_mob:0 "Clear Out the Red Mob's Influence"
IRQ_Clear_out_the_red_mob_desc:0 "Red elements have long undermined social stability and national sovereignty—we have now eradicated their influence. The government strengthens security, curbs extremist ideology, and ensures Iraq controls its destiny, free from external interference. We legally crack down on subversion, improve livelihoods, and eliminate breeding grounds for extremism, uniting people and nation."
IRQ_Nationalism_moderated:0 "Moderate Nationalism"
IRQ_Nationalism_moderated_desc:0 "Nationalism must become moderate and pragmatic—extremism exacerbates internal/external conflicts. We advocate a national policy prioritizing state interests and open cooperation, preserving dignity while maintaining good regional relations, expanding Iraq's development space. Diplomatic dialogue and economic cooperation resolve historical grievances, promoting regional stability, making nationalism constructive, not conflictual."
IRQ_Planning_ethnic_autonomous_regions:0 "Plan Ethnic Autonomous Regions"
IRQ_Planning_ethnic_autonomous_regions_desc:0 "Ethnic autonomous regions effectively ease long-standing ethnic tensions. This system grants limited self-rule while preserving national unity and central authority—a key path to pluralistic governance and lasting peace. We define autonomous scopes based on reality, clarifying rights/obligations, ensuring coordination between regions and the center to promote national development and unity."
IRQ_Encourage_patriotism:0 "Encourage Patriotism"
IRQ_Encourage_patriotism_desc:0 "We awaken national consciousness, making patriotism a driving force for national progress. Propaganda and rallies help people understand national challenges—everyone's contribution builds a stronger future. We unite all classes, striving for Iraq's prosperity. The government strengthens national identity through education and media, making every citizen a key participant in nation-building."
IRQ_Arab_Liberal_Party:0 "Arab Liberal Party"
IRQ_Arab_Liberal_Party_desc:0 "The Arab Liberal Party, with free-market economic policies and firm Arab stances, wins voter support and leads government formation. The new government advances modernization, strengthens Arab unity, and leads the nation toward development and self-reliance. We reduce unnecessary administrative intervention, encourage private sector innovation, and deepen cooperation with Arab brothers in diplomacy, jointly addressing regional challenges."
IRQ_Remembering_Arab_identity:0 "Remembering Arab Identity"
IRQ_Remembering_Arab_identity_desc:0 "We always remember our Arab identity—policies and national strategies prioritize Arab interests. We also cooperate with neighboring Arab brothers on equal, mutually beneficial terms, promoting national prosperity and revival. We advance cultural, economic, and security collaboration, strengthening the Arab world, ensuring Iraq plays a key regional role."
IRQ_Ensuring_freedom_of_belief:0 "Ensuring Freedom of Belief"
IRQ_Ensuring_freedom_of_belief_desc:0 "All believers—Islam, Christianity, or other faiths—enjoy full freedom of religion. We prohibit religious interference in politics while safeguarding legal religious practice, opposing discrimination against any faith group. The government legislates religious freedom boundaries, cracks down on extremism, and maintains harmony between faiths, making religion a personal spiritual anchor, not a divisive force."
IRQ_Exposure_to_the_Western_world:0 "Exposure to the Western World"
IRQ_Exposure_to_the_Western_world_desc:0 "Western economic/technical aid is vital for Iraq's development. We actively build partnerships with European/American nations, introducing funds and expertise to accelerate industrialization and infrastructure modernization, boosting national strength. We plan energy, transportation, and manufacturing projects, learning Western management/tech to enhance self-sufficiency and reduce external dependence."
IRQ_Redefine_pan_Arabism:0 "Redefine Pan-Arabism"
IRQ_Redefine_pan_Arabism_desc:0 "Pan-Arabism is not exclusive to any faction—it is all Arabs' shared ideal. We transcend ideological divides, uniting all who support national unity and revival to advance Arab cooperation and strength. Cultural exchange, economic cooperation, and diplomatic coordination strengthen Arab bonds."
IRQ_Promote_economic_liberalization:0 "Promote Economic Liberalization"
IRQ_Promote_economic_liberalization_desc:0 "Economic liberalization stimulates market vitality, attracts investment, and upgrades industries. We reduce state control, encourage private enterprise, and establish fair competition, driving economic revival and long-term prosperity. The government offers incentives for SMEs, simplifies business approvals, and strengthens property rights, letting the market play a decisive role in resource allocation."
IRQ_Appease_nationalist_sentiments:0 "Appease Nationalist Sentiments"
IRQ_Appease_nationalist_sentiments_desc:0 "Strong nationalist sentiment requires careful guidance. The government listens to public opinion, addresses concerns, and reflects people's will in policies. Winning broad support ensures steady national progress. Public consultations, media engagement, and surveys keep us attuned to public needs, making policies more practical and strengthening government-public trust."
IRQ_Expand_trade_routes:0 "Expand Trade Routes"
IRQ_Expand_trade_routes_desc:0 "Expanding trade routes is critical for national development. We build new infrastructure, establish commercial ties with more regions, boost exports, diversify imports, and enhance economic autonomy and resilience. We develop new land/sea routes, encourage private sector participation in international trade, and negotiate lower tariffs through diplomacy, opening broader markets."
IRQ_Democracy_in_Mesopotamia:0 "Democracy in Mesopotamia"
IRQ_Democracy_in_Mesopotamia_desc:0 "The old, corrupt Iraq is gone—our nation is freer, more united, and stronger. Under the new government, Iraq embraces unprecedented opportunities, with all citizens confidently building the future. We advance reforms, consolidate democracy, develop the economy, and strengthen defense, making Iraq a respected modern nation."
IRQ_Ittihad_Party:0 "Ittihad Party"
IRQ_Ittihad_Party_desc:0 "The Ittihad Party, with firm religious faith and conservative stances, wins public trust and leads the political direction. Emphasizing traditional values and social stability, it aligns with many's desire for religious-national integration, maintaining unity and order during turmoil. The party advances legislation embedding religious principles into national policy, ensuring governance aligns with faith and cultural traditions."
IRQ_Requested_Persian_aid:0 "Requested Persian Aid"
IRQ_Requested_Persian_aid_desc:0 "As fellow Shia of the Usuli school, we seek religious support and aid from Persians when needed. This theological bond provides unique diplomatic advantages and deepens cultural/spiritual ties, making cooperation more grounded. We still safeguard our interests, ensuring religious affinity does not cloud independent decision-making."
IRQ_Domesticated_tribesmen:0 "Domesticate Tribesmen"
IRQ_Domesticated_tribesmen_desc:0 "Nomadic Bedouin tribes must integrate into the modern state. We guide them to accept education, participate in construction, and align their lifestyles with national development. This benefits tribesmen and strengthens Iraq. We launch special programs providing settlement support and job training, easing their transition to modern society."
IRQ_Religious_elite_government:0 "Religious Elite Government"
IRQ_Religious_elite_government_desc:0 "Our government should be led by elites versed in religion and public affairs—understanding faith's value and people's needs. Such leadership formulates policies aligning with religious traditions and national interests, ensuring stability and justice. We select leaders with both knowledge and local expertise through merit-based mechanisms."
IRQ_Keep_your_distance_from_Persia:0 "Keep Your Distance from Persia"
IRQ_Keep_your_distance_from_Persia_desc:0 "Though sharing Shia faith with Iran, we remain vigilant, preserving independence and avoiding excessive external interference. Iraq's interests come first—all diplomatic cooperation is based on equality and autonomy. We develop diverse foreign relations, balancing regional influence, and safeguard sovereignty. Strengthen border control to prevent religious infiltration, maintaining policy independence. We establish a specialized diplomatic evaluation mechanism to prudently manage relations with all neighbors."
IRQ_Fulfill_zakat_obligations:0 "Fulfill Zakat Obligations"
IRQ_Fulfill_zakat_obligations_desc:0 "We urge the wealthy to fulfill zakat, donating wealth to poverty alleviation and public welfare. This aligns with doctrine, reduces poverty, promotes fairness, and spreads economic benefits. The government monitors these resources, ensuring they fund education, healthcare, and infrastructure. Incentivize merchants/landlords who fulfill religious obligations, with public reporting at collection points."
IRQ_science_and_education_independence:0 "Ensure Science and Education Independence"
IRQ_science_and_education_independence_desc:0 "Independent science and education are pillars of true national independence. We build our education system, cultivate talent, reduce external dependence, and establish Iraq as a knowledge/innovation leader. Increase funding for schools/research, encouraging local scientists/teachers to advance science. Plan a National Institute of Technology in Baghdad, writing new textbooks tailored to our needs, reducing reliance on foreign education."
IRQ_The_Giaz_tax_is_levied:0 "Levy the Giaz Tax"
IRQ_The_Giaz_tax_is_levied_desc:0 "Taxing non-Muslim residents (Giaz) compensates them for state protection and maintains religious social structure. This traditional tax balances group rights/obligations, ensuring stability. Funds are used for public safety and community services, benefiting all. We establish dedicated tax offices, fairly assess amounts, and protect taxpayer rights with legal safeguards."
IRQ_Under_the_light_of_Allah:0 "Under the Light of Allah"
IRQ_Under_the_light_of_Allah_desc:0 "Guided by Allah, our nation gradually revives. Faith provides spiritual strength and direction—we rebuild order, boost the economy, and rejuvenate Iraq daily. Blending traditional wisdom with modern methods, we forge our own development path. New mosques and religious schools rise nationwide, alongside factories and roads—faith and progress complement each other."
IRQ_A_beacon_of_liberalism:0 "Beacon of Liberalism"
IRQ_A_beacon_of_liberalism_desc:0 "Iraq has become a Middle Eastern symbol of freedom and independence. Through reform and unity, we demonstrate a path of self-development blending tradition and modernity, inspiring other nations to fight for their destinies. Domestic stability and prosperity make Iraq a regional model, proving the value of sovereignty and faith. Our success attracts global attention—many regional representatives visit to study Iraq's development model."