irqnewsevent.1.t:0 "The Two Iraqs War"
irqnewsevent.1.d:0 "Earlier today, Iranian soldiers crossed the border and launched a raid on border outposts on the Iraqi side, resulting in dozens of casualties. Subsequently, the Iraqi government declared a state of war with Iran and detained Iranian citizens within its territory. Iran has responded with reciprocal measures. Currently, intense clashes have broken out between the two countries' armies in the border areas, and the situation continues to escalate.\n\nThis attack is seen as the largest cross-border military operation launched by Iran since the Great War. Iranian officials claim that this operation was to clear out anti-Iranian armed strongholds within Iraq and accuse the Iraqi government of harboring separatist forces that threaten Iran's national security. Iraq, meanwhile, strongly condemns Iran's 'blatant violation of sovereignty' and calls for international intervention.\n\nAs both sides continue to reinforce the border, fierce firefights have erupted on multiple fronts. The Iraqi Air Force has carried out retaliatory airstrikes on Iranian border military targets, while Iran has used heavy artillery to attack Iraqi command centers and logistical hubs. Regional tensions have sharply increased."
irqnewsevent.1.a:0 "What about the oil?"
iraq_focus:0 "Iraqi National Focus Tree"
irqrev.1.t:0 "Iraqi Corps Uprising"
irqrev.1.d:0 "Incited by Iraqi officers influenced by the Free Palestine Radio, a division of the Iraqi army has decided to take the initiative. Recent reforms have gained them public support; they have seized control of all military facilities in the Iraqi capital and declared Iraq's independence.\n\nHowever, this group of radicals, led by the charismatic Yasin al-Hashimi, does not have the full support of the Iraqi people, as many Sunnis believe he has endangered the Iraqi plains and handed control of Iraq over to neighboring Persia."
irqrev.1.a:0 "Are we blind?!"
irqrev.1.b:0 "Freedom, here we come! (Switch to Iraq)"
irqfor.1.t:0 "[IRQ.GetNameDef] Wants to Join Our Faction"
irqfor.1.d:0 "Sandwiched between the Arab powers of Egypt, Syria, and Persia, Iraq holds immense geopolitical importance in the region, further bolstered by the endless oil reserves found beneath its barren soil.\n\nToday we have received a proposal for an alliance to eradicate a common enemy, which seems like a perfect opportunity to expand our influence eastward."
irqfor.1.a:0 "A warm welcome!"
irqfor.1.b:0 "We have no need for them"
irqfor.2.t:0 "Proposal Accepted"
irqfor.2.d:0 "The benevolent government of [FROM.GetName] has accepted our proposal, allied with us, and promised to assist us whenever necessary."
irqfor.2.a:0 "Excellent!"
irqfor.3.t:0 "Proposal Rejected"
irqfor.3.d:0 "The despicable regime of [FROM.GetName] has rejected our proposal, emphasizing that we are a worthless medieval sand-eating regime, sleeping and dreaming of past glory."
irqfor.3.a:0 "I'm devastated!"
irqfor.4.t:0 "[IRQ.GetNameDef] Invites Us to the League of Arab States"
irqfor.4.d:0 "To counter Egypt's growing influence in the Arab world, the Iraqi government has today invited us to join them and formally enter the League through a permanent treaty of friendship."
irqfor.4.a:0 "We will support their attempt"
irqfor.4.b:0 "Who do they think they are?"
irqfor.5.t:0 "[FROM.GetName] Joins the League"
irqfor.5.d:0 "Today, delegates from Baghdad brough news. [FROM.GetName] has signed the treaty of friendship, ratified joining the League, and promised a bright future between our two nations."
irqfor.5.a:0 "Welcome!"
irqfor.6.t:0 "[FROM.GetName] Rejects Our Proposal"
irqfor.6.d:0 "Unwilling to involve itself in Iraqi affairs, the government of [FROM.GetName] has rejected the proposal to join the League, stating it will proceed according to its own plans."
irqfor.6.a:0 "Regrettable"
irqfor.7.t:0 "Triumph in the Levant"
irqfor.7.d:0 "Following our victorious campaign, we have fully occupied the Levant, and Egyptian forces have been driven from this land with no possibility of turning the tide. In light of this, we can now initiate peace talks to take Syria. However, some in the command also demand to fight to the end, to wipe out Egypt and its imperialist schemes once and for all. So, what shall we do?"
irqfor.7.a:0 "Send the envoys, brothers and sisters shall be reunited"
irqfor.7.b:0 "Fight all the way to Cairo!"
irq.1.t:0 "Muslim National Resistance Committee"
irq.1.d:0 "Since the flames of the uprising were ignited across the Ottoman Empire, countless passionate and dedicated individuals and groups have responded, throwing themselves into the tide of our liberation cause. Today, the uprising headquarters has welcomed a pivotal visitor. Led by guards with solemn demeanor, His Eminence Mirza Mahmud al-Shirazi, the revered religious leader of Iraq's Shi'a community and a Marja', stepped into the command post. He not only represents the core will of the newly declared Muslim National Resistance Committee but also, with his lofty religious status, declares the unwavering resolve of the Shi'a community to resist Ottoman rule to all present. His Eminence clearly states that the Committee and the broad Muslim forces it represents desire to form a close alliance with our uprising forces, fighting side by side to end the yoke of Istanbul."
irq.1.a:0 "All guests are welcome"
irq.2.t:0 "The Pan-Arab Tide in Iraq"
irq.2.d:0 "The Pan-Arab winds from Cairo and the Ba'athist ideas from Damascus, like two powerful monsoons, have swept across the desert to reach Iraqi soil. In this ancient land of the Tigris and Euphrates, the Iraqi branch of the Arab Socialist League and the Iraqi branch of the Ba'ath Party have taken root and flourished with remarkable vitality. Though their radical Pan-Arab ideology—emphasizing Arab unity beyond national borders and socialist practice—clashes with our locally rooted pursuit of Iraqi independence and rejuvenation, often erupting into fierce clashes in streets and secret gatherings, their fighting spirit remains as tenacious as desert thorns. Amidst the flames of resistance against Ottoman tyranny, their members have fearlessly charged to the frontlines, organizing strikes, launching raids, and passing intelligence, proving their worth with blood and action. This emerging and powerful force has become an indispensable pillar of the great uprising sweeping Iraq."
irq.2.a:0 "Can we trust them...?"
irq.3.t:0 "Victory of the Great Uprising"
irq.3.d:0 "After bloody battles and countless sacrifices, the once transcontinental colossus of the Ottoman Empire has finally collapsed under the combined blows of ourselves, Cairo, Tehran, and other forces The final telegram from Istanbul brought the news: the Sultan's generals lowered their proud heads, submitting unconditional surrender to us, the once-rebellious Iraqi uprisers. Above the fortresses where the Ottoman eagle once flew, our flag of free Iraq now rises. In Baghdad, Basra, Mosul, and every land once trampled by Ottoman hooves, the uprising's soldiers are seizing control of local Ottoman military commands, armories, and key defensive positions with thunderous resolve. An old era has ended—the dawn has finally pierced the long night!"
irq.3.a:0 "The bread of the free is sweeter than the honey of the prisoner"
irq.4.t:0 "Marshal Yasin al-Hashimi's Victory Speech"
irq.4.d:0 "In Baghdad, the heart of Iraq, golden sunlight bathes Liberation Square. Marshal Yasin al-Hashimi, the symbol and supreme commander of the uprising, clad in crisp military attire, solemnly inspects the victorious troops converging from across the provinces. Flying banners, gleaming weapons, and the resolute faces of soldiers all speak of the arduous struggle and glorious victory. Amidst thunderous cheers, the Marshal ascends a makeshift podium to deliver his victory declaration to the nation and the Arab world.\n\nHis voice booms with strength, passionately praising the bravery of every fighter in the uprising. He particularly acknowledges the Pan-Arabists: the ideas from Cairo and Damascus that ignited the passion of Iraqi youth, their international vision and organizational skills that injected vitality into the uprising, and their role as a bond linking Arab brethren. With profound solemnity, the Marshal also mourns and extols the extraordinary sacrifices of the Shi'a faithful—their sacred faith transformed into unyielding will, their mosques turned into resistance strongholds, and the blood soaking their prayer rugs witnessing their deepest love for the homeland."
irq.4.a:0 "But something stirs in the shadows..."
irq.5.t:0 "Attack by the Pan-Arabists"
irq.5.d:0 "The 'comradeship' under the banner of resisting the Ottomans has now been replaced by cold hatred. The Pan-Arabists, centered on the Iraqi branch of the Arab Socialist League and the Iraqi branch of the Ba'ath Party, no longer conceal their deep enmity toward Marshal Yasin al-Hashimi and his National Brotherhood Party. They not only openly criticize the Marshal's 'narrow nationalism' policies in Baghdad's cafes and newspapers, accusing him of betraying the 'lofty ideal of Arab unity,' but have also turned this hostility into bloody action!\n\nLast night, a key base of the National Brotherhood Party in the plains of Nineveh, Mosul Governorate, was subjected to a meticulously planned raid. Armed militants suppressed the defenders with rapid fire, setting fire to the party headquarters and warehouses, leaving only charred ruins. Even more heinous, the region's beloved party branch leader was brutally murdered by these rioters.\n\nThe atmosphere in the Marshal's headquarters is as heavy as iron. The intelligence report delivered by officers coldly points to Cairo and Damascus: our Arab 'brothers.' This is no isolated local conflict but a coordinated attack masterminded by foreign forces to subvert Iraq's nascent regime. Exploiting the Pan-Arabist network in Iraq, they aim to sever the National Brotherhood Party's roots in the north and shake Marshal Yasin's authority. The knife is at the republic's throat."
irq.5.a:0 "We can no longer negotiate with these traitors!"
irq.6.t:0 "Democrats Raise the Rebel Flag in the South"
irq.6.d:0 "Scarcely had the Ottoman yoke been shattered and Iraq's wounds begun to heal when a new rebellious dagger stabbed at Baghdad's heart from the fertile southern lands. Just as the Pan-Arabists sowed chaos in the north, the Democratic Liberals lurking in Basra Governorate finally shed their 'loyal opposition' disguise and openly raised the rebel flag.\n\nAt Basra Port, known as the 'Southern Gateway,' and across the vast date palm groves and oil fields of the lower Euphrates, the Democratic Alliance led by General Abdul Karim Qasim quickly mustered forces. Qasim, a military strongman who had risen to prominence during the uprising but grew increasingly discontent with Marshal Yasin's authoritarian rule, now became the core of the democratic challengers. Under the banner of 'ending one-party dictatorship,' 'restoring constitutional democracy,' and 'protecting civil liberties,' they exploited southern resentment toward the National Brotherhood Party's repressive policies to rapidly recruit armed supporters and seize control of Basra city, key transportation hubs, and oil facilities.\n\nEven more alarming, General Qasim made no secret of his ultimate ambition in public speeches: he denounced the National Brotherhood Party as having 'betrayed the revolutionary cause' and 'become new dictators,' openly calling on his supporters to 'march on Baghdad' and 'liberate Iraq from tyranny once and for all.' This is not a local disturbance but an organized, programmatic, and militarily targeted full-scale rebellion. The south's fertile grain bowls and oil fields now fuel this force aiming to topple the central government."
irq.6.a:0 "We must never tolerate these rebels dragging the nation into the abyss!"
irq.7.t:0 "Playing the Final Card"
irq.7.d:0 "Baghdad's palaces tremble under siege, with Pan-Arabist blades hovering over the north and Democratic rebel flags snapping over the southern oil fields. The National Brotherhood Party's rule hangs by a thread, seemingly on the verge of being devoured. Yet we are not helpless lambs. At this moment of life and death, past suspicions and divisions must yield to primal survival instincts. With near-tragic resolve, Marshal Yasin summons the two latent, once-fractious ultimate forces—these are the republic's last fangs, the final stake wagered on the nation's fate.\n\nRashid al-Gaylani's Musa Club: This populist group, composed of elite officers, intellectuals, and nationalist revolutionaries, has long embraced inclusivity across the political spectrum. The Four Colonels of the National Struggle Alliance: These four powerful officers, each commanding elite units, represent the most entrenched nationalist core in the military. They view any secessionist force as a mortal enemy, and their commandos are iron fists capable of shaking the battlefield. Though both are seen as threats by the National Brotherhood Party, this union is a last resort—to prevent the Pan-Arabists and Democrats from succeeding, such sacrifice is necessary."
irq.7.a:0 "The Final Struggle!"
irq.8.t:0 "Iraq's Longest Day"
irq.8.d:0 "Earlier, Pan-Arabist forces, waving Cairo and Damascus flags, swept across the southern plains like a sandstorm. The long-dormant Iraqi Communist Party suddenly tore up its neutrality pretense, raising red flags in factory districts as armed workers and the International Brigade advanced from the eastern suburbs toward the city center.\n\nAt noon, Qasim's Democratic rebel forces launched a precise pincer attack, crushing our last stronghold along the Basra-Nasiriyah line. Smoke from the oil fields obscured the southern sky, while the National Struggle Alliance commandos and Musa Club commandos were bogged down in the Democratic quagmire, unable to turn north.\n\nAt dusk, the National Brotherhood Party mustered its final strength, with Marshal Yasin al-Hashimi personally directing operations and local Shi'a faithful joining the defense of Baghdad. Every mosque became a fortress, every street burned—and if a desperate counterattack was not launched now, the republic's sun would set tonight."
irq.8.a:0 "Bloodshed everywhere The National Brotherhood Party secures control"
irq.8.b:0 "Pan-Arabists storm the presidential palace"
irq.8.c:0 "General Qasim enters Baghdad"
irq.8.e:0 "A new force rises: The Iraqi Communist Party's impossible victory"
irq.9.t:0 "The Crossroads of Arab Nationalism"
irq.9.d:0 "Though Marshal Yasin al-Hashimi's National Brotherhood Party firmly controls Iraq's government, successive setbacks and upheavals have severely eroded its once-dominant prestige. The flames of the times and political turbulence have left the nation scarred, with centrifugal forces simmering beneath the surface. Facing a crumbling unity and rising calls for Arab nationalism, Marshal Yasin resolves to take a desperate gamble. He announces a grand 'Arab Nationalist Congress' in Baghdad, inviting nationalist representatives, social elites, and military officers from across Iraq. The congress has one goal: through fierce debate and consultation, find a stable path forward for Iraq, battered by trials. All citizens' eyes are fixed on this event; Baghdad's air thrums with anticipation and unease."
irq.9.a:0 "The National Brotherhood Party remains in control!"
irq.9.b:0 "Rashid al-Gaylani revives Arab nationalism!"
irq.9.c:0 "The Four Colonels gain widespread support!"
irq.10.t:0 "The National Brotherhood Party's Second Chance"
irq.10.d:0 "The National Brotherhood Party—this Arab nationalist flag raised amid the twilight of the Ottoman Empire—has long had resistance in its DNA. It nurtured the embryonic Iraqi national consciousness, standing as the most unyielding vanguard of freedom and unity under colonial gloom and monarchical shackles. When power passed to the iron-fisted Marshal Yasin al-Hashimi, this battle-hardened party finally transformed, evolving from an underground resistance network into an undisputed, nation-controlling nationalist colossus. Though battered by cruel blows, its roots remain unshaken. Now, under Marshal Yasin's leadership, the National Brotherhood Party not only rises from the ashes but consolidates its rule with a decisive victory. This is not merely a party victory but a triumphant chapter for the resilient Iraqi Arab nationalism it represents in today's turbulent chessboard. The laurel wreath of victory belongs to this marshal who turned the tide."
irq.10.a:0 "Tribute to you, Marshal Yasin al-Hashimi!"
irq.11.t:0 "The National Brotherhood Party Rises from the Ashes"
irq.11.d:0 "As Baghdad's golden domes shine amid the noise of victory, as once-arrogant merchants now bow humbly, and as tribal sheikhs and social elites across the land compete to offer fawning praise, a cold question lingers in the National Brotherhood Party's inner circle: Have we lost our way amid sweet flattery?\n\nYes, we have triumphed. Marshal Yasin's iron fist and the party's resilience have crushed our enemies and secured power. But is this hard-won victory to be exchanged for indulgence in the soft bed of power? Those fawning admirers, those speculators seeking to corrupt our iron will with money and promises—they are not allies but sugar-coated new obstacles. We fought from Ottoman ruins and colonial chains not to become new elites, but for the revival of a strong and glorious Iraqi nation. The comfort and adulation of this moment are deadlier than battlefield bullets. True revolutionaries must keep the clearest heads at the peak of victory, remembering the original purpose that ignited the prairie fire!"
irq.11.a:0 "Returned in New Attire"
irq.12.t:0 "Victory of the Musa Club"
irq.12.d:0 "Fate sometimes arrives in the most unexpected ways. Rashid Ali al-Gaylani, a nationalist from a prominent family known for diligence and pragmatism, never sought the highest state power. As Marshal Yasin al-Hashimi's close comrade, he was more a strategist behind the scenes or a steadfast warrior facing Ottoman bullets on the frontlines. Yet historical tides propelled him to the forefront. The Musa Club, this core nationalist circle of officers and intellectuals, turned to Gaylani amid the power vacuum following Yasin's era. His unshakable devotion to Arab unity, his profound hatred of separatism and foreign interference, and his invaluable steadiness in turbulent times made him the consensus choice to bridge divisions and lead the nation. The scepter of Baghdad power thus passed to this 'diligent man' perhaps unforeseen even by himself. A new era curtain rises, slowly drawn by this leader who defies traditional strongman stereotypes."
irq.12.a:0 "Iraq returns with a brand-new look!"
irq.13.t:0 "The March of the National Struggle Alliance"
irq.13.d:0 "General Salah al-Din al-Sabbagh's ascent to power—marked by an iron will and uncompromising nationalist stance—is no accident but the culmination of a long-brewing tidal wave of the times. He is a blade forged in fire, having charged through the bloodiest frontlines of the uprising against Ottoman tyranny and colonial gloom. Sabbagh earned near-legendary prestige among soldiers and civilians through fearless courage and fiery conviction. He embodies the purest, most radical ideal of national rejuvenation, harboring profound loathing for any form of weakness, separatism, or foreign fetters. Now, as the nation stands at another crossroads, this widely respected warrior resolves to don his armor once more. No longer content with relaying orders, he aims to steer the nation's ship. Beneath his cold gaze, the National Struggle Alliance's battle flag points directly at the seat of power. Iraq's ancient vessel, under the firm and unyielding leadership of General Sabbagh, will tear through the fog of the old order and surge forward along a new path paved with iron and blood!"
irq.13.a:0 "Today!"
irq.14.t:0 "Whirlwind and Eagle"
irq.14.d:0 "Kamal Shabib, a fervent Arab nationalist, joined the secret 'Golden Square' organization dedicated to overthrowing the Ottoman Vilayet regime, becoming one of its four core colonels. The other three members similarly harbored fiery nationalist ideals. His superior, Salah al-Sabbagh, greatly admired Kamal's loyalty to the motherland and passion for the cause. Shortly after Iraq's independence, Kamal was dispatched by his superior to Syria to exchange experiences with local nationalist groups.\n\nKamal boarded the train to Syria. The long journey nearly lulled him to sleep, but a fallen pamphlet caught his eye, rousing him. The cover featured a dignified figure, with a red whirlwind emblem emblazoned behind. Intrigued, Kamal opened the booklet. He was soon captivated by a new ideology called 'social nationalism.' He believed this was the answer he had sought—transcending the fanaticism of Arab nationalism, surpassing all Iraqi nationalist theories. The booklet's last page bore the note 'Published in Beirut.' Kamal immediately changed his plans, abandoning his journey to Damascus for Lebanon. His prior impression of Lebanon was limited to thugs and rebels, but this mattered little—after all, Iraq was not much better at the time.\n\nThe journey went smoothly. In Beirut, he met the man on the pamphlet's cover: Anton Sa'ada. Sa'ada was delivering a speech outlining social nationalism's four tenets. Kamal took a seat, learning from bystanders that this Anton Sa'ada was one of Syria and Lebanon's foremost nationalist theorists. After the speech, Kamal al-Shabib approached Anton Sa'ada as he prepared to leave. He expressed his respect and eagerness to deeply understand social nationalism. The two adjourned to a nearby café. After a night of conversation and debate, Kamal was utterly convinced by this ideology, and Anton Sa'ada was equally impressed by this eager seeker."
irq.14.a:0 ""What a wise man...""
irq.14.b:0 ""But I am an Iraqi...""
irq.15.t:0 "Party Schism"
irq.15.d:0 "A deep fissure is spreading across the National Struggle Alliance's once-solid ranks. Kamal al-Shabib, the officer renowned for his passionate nationalism and extraordinary charisma, was once a steadfast comrade under General Salah al-Din al-Sabbagh. However, his trajectory changed dramatically after encountering the ideas of Syria's Socialist National Party and its founder, Anton Sa'ada. Sa'ada's radical social nationalism—emphasizing Arab unity in Mesopotamia, social revolution, and strongman leadership—ignited Shabib's soul like fire, intensifying his beliefs to the point of fanaticism. No longer content with the status quo, he openly challenged Sabbagh's authority. Shabib believed Iraq's future should not be confined to existing nationalist frameworks but should embrace Sa'ada's more revolutionary and regionally ambitious social nationalism. He aspired to become the torchbearer of this ideology in Mesopotamia, planting social nationalism's seeds deep in Iraqi soil. Two former comrades, divided by irreconcilable ideological differences and power aspirations, are now pitted against each other at the alliance's core—a storm over the movement's soul has begun."
irq.15.a:0 "Salah al-Din al-Sabbagh's position remains unshakable"
irq.15.b:0 "Kamal al-Shabib grows more popular"
irq.16.t:0 "Revealing Ambitions"
irq.16.d:0 "Iraq, this young nation born of strife, lies undefended on our border. It is more than land—it is a key, a key to unlocking the Arab world. Tehran's high command understands: incorporating Iraq into their sphere of influence would grant Iran the upper hand in regional power plays. This Mesopotamian plain is not just a strategic buffer but a perfect springboard to project influence and fulfill ambitions. It is time to act—either turn it into our shield or let it become another's blade."
irq.16.a:0 "Speed is of the essence Launch a military operation against Iraq immediately!"
irq.16.b:0 "Do not act rashly The cost of making an enemy of the entire Arab world is too high!"
irq.17.t:0 "Iran Crosses the Border!"
irq.17.d:0 "Iranian forces have openly crossed our border and launched a fierce attack on our border outposts without warning. Our soldiers have suffered heavy casualties in this sudden assault, their blood staining the borderlands. This barbaric act violates our sovereignty and poses a severe threat to our national security. Tehran's ambitions are laid bare—we must respond immediately to defend our dignity and security!"
irq.17.a:0 "Declare war!"
irq.18.t:0 "Iran Defeats Iraq"
irq.18.d:0 "As predicted by the general staff, Iraq's defenses crumbled before our iron tide. Our forces advanced at astonishing speed, reaching the outskirts of Baghdad within weeks. After symbolic resistance, the city now flies our flag. Iraq's provisional government sent envoys to submit a formal surrender, requesting our terms for ceasefire. Now, the fate of the entire Mesopotamian plain rests in our hands—it is time to decide how to dispose of this conquered land."
irq.18.a:0 "Annex Iraq into our territory!"
irq.18.b:0 "Establish a pro-us Iraqi state"
irq.19.t:0 "Iraq Defeats Iran"
irq.19.d:0 "Iran's ambitious forces ultimately failed to gain a foothold in Mesopotamia's deserts. After weeks of brutal and intense combat, they retreated irreversibly. Today, Kermanshah and Khuzestan (which we prefer to call Arabistan) have been fully liberated by our valiant forces and firmly placed under our control. According to the recently signed ceasefire agreement, these lands will be formally and permanently incorporated into Iraq. They symbolize not only our victory but also serve as a solid barrier for the republic's future defense and prosperity."
irq.19.a:0 "Land is as precious as camphor I sing for you with my rifle!"
irq.20.t:0 "First Cracks Appear"
irq.20.d:0 "Smoke from Baghdad has not yet cleared, and though pro-Syrian and pro-Egyptian Pan-Arabists jointly overthrew the Iraqi nationalist regime and suppressed the Democratic uprising, their fragile alliance already shows fissures. The same flags flutter in the streets, but conflicting slogans echo in the taverns—one camp calls for unifying the Arab world under Damascus, the other insists Cairo should be the core of unity. Ideological differences gradually evolve into power and ideological struggles. Former comrades bicker in meeting rooms, and even the cheering crowds sense the undercurrents among the elite."
irq.20.a:0 "Unity once led us to victory... Can it now lead us out of division?"
irq.21.t:0 "Open Confrontation"
irq.21.d:0 "Iraq's political situation is tearing apart publicly. Ba'athists denounce the Arab Socialist League's 'treason' over fiery radio broadcasts, while the latter retort that the Ba'athists have become Damascus's puppets. Supporters of both sides escalate from verbal clashes to street confrontations, with slogans and chants flooding Baghdad's alleys. Beneath the banner of Pan-Arab ideals, a power struggle and ideological contest are pushing this battle-weary nation toward civil strife."
irq.21.a:0 "They all shout unity, yet march in opposite directions."
irq.22.t:0 "Muslim Call to End Division"
irq.22.d:0 "As tensions in Baghdad escalate, calls from mosques and markets grow clearer: Imams and ordinary worshippers openly condemn the escalating factional strife. They accuse the Ba'athists and Arab Socialist League of both invoking Pan-Arabism while sowing division, pushing the nation toward a second civil war. 'The Quran teaches us unity, not hatred,' an elderly imam preaches during Friday prayers, 'they should sit at the same table and resolve differences through dialogue, not confrontation.'"
irq.22.a:0 "Well said We should talk properly"
irq.22.b:0 "Shut your mouth We don't need Muslim leadership"
irq.23.t:0 "Pan-Arab Congress"
irq.23.d:0 "Amidst the Muslim leaders' and public's constant appeals, the factions finally agree to a temporary ceasefire and converge in Baghdad. The Pan-Arab Congress convenes amid fading smoke, with Ba'athist and Arab Socialist League representatives—still armed with pistols at their hips—sitting at the same negotiating table for the first time. Outside the window lie shattered streets; inside, debates over the nation's future unfold: Will Iraq follow the path of revival guided by Damascus, or embrace Arab socialism backed by Cairo?"
irq.23.a:0 "Ba'athists win the election."
irq.23.b:0 "Arab Socialist League gains congress support."
irq.24.t:0 "Green Revolution"
irq.24.d:0 "When the Pan-Arab government brazenly announced the suppression of Muslim protests, long-suppressed anger erupted. Local clerics swiftly organized a breakaway regime, publicly denying Baghdad's legitimacy. In Najaf and Karbala, religious leader Muhsin al-Hakim rallied various forces, establishing the 'Muslim Salvation Committee' and launching a rapid uprising sweeping the south. Lacking popular support, the Pan-Arab government collapsed swiftly, and Iraq returned to unity under the banner of faith."
irq.24.a:0 "Allahu Akbar Death to the separatists!"
irq.25.t:0 "The Future of the Islamic Regime"
irq.25.d:0 "With the old Pan-Arab banner lowered, a new regime centered on the Quran as its constitution rises along the Tigris. Yet the path forward remains veiled in mist: Should power be firmly held by devout clerics and a military council to ensure the primacy of sharia? Or should we rely on the esteemed al-Saud family, leveraging their prestige and governance experience to stabilize the nation? Beneath palm trees and at tea stalls, people whisper debates; within the halls of power, this choice has already begun."
irq.25.a:0 "The pious hold the reins"
irq.25.b:0 "Empower the al-Saud family"
irq.26.t:0 "Triumph of Democracy"
irq.26.d:0 "General Karim Qasim marches north, overthrowing the nationalist regime in Baghdad in a swift and decisive campaign from Basra, thoroughly crushing the old government's resistance and foiling the Reds' attempt to seize power amid chaos. With the new regime established, Iraq is finally pulled back from the brink of turmoil and division, and the torch of democracy is once again lit on this land."
irq.26.a:0 "Cheers for General Qasim!"
irq.27.t:0 "Iraq's First Democratic Election"
irq.27.d:0 "With the new political system tentatively stabilized, General Karim Qasim fulfills his democratic promise, officially announcing Iraq's first national election. Representatives from across the provinces will gather to decide the nation's political future through voting. Multiple parties actively campaign, presenting their visions and policies for nation-building. Political debates rage in markets, squares, and cafes. Iraq stands at the threshold of a brand-new history."
irq.27.a:0 "People's Association!"
irq.27.b:0 "National Democratic Party!"
irq.27.c:0 "Arab Liberal Party!"
irq.27.e:0 "Unity Party!"
irq.28.t:0 "Rise of Communism"
irq.28.d:0 "While Pan-Arabists and Democrats clash with the nationalist regime in Baghdad's streets, few notice—another force has quietly spread in the shadows. With funding, weapons, and tactical guidance secretly provided by Britain and France, Mesopotamian communists rapidly build their organizational network. Rooted among workers and peasants, they silently spread their ideas and accumulate strength amid the chaos. Only when red flags suddenly rise in several key towns do many realize: a new storm has silently swept across the Tigris and Euphrates."
irq.28.a:0 "Good grief..."
irq.29.t:0 "The Eternal Passion of Nationalism"
irq.29.d:0 "Criticism of nationalism abounds in the international community, but we firmly believe nationalism is not narrow xenophobia but the fundamental driving force for a nation's strength. Only regimes with unwavering national ideals can ignite societal vitality and drive continuous self-renewal and rejuvenation. Conversely, nations that prioritize democratic slogans or transactional interests often lose direction amid compromise and stagnation, withering like old tree branches. We believe the path guided by the national will is truly the people's path."
irq.29.a:0 "Bread does not lie."
irq.30.t:0 "The True Enemy"
irq.30.d:0 "We do not oppose all Jews, but resolutely oppose aggressors and bandits cloaked in ideology. Zionists seize Palestinian land through lies and violence, expelling and humiliating our Arab brethren, and have repeatedly committed heinous acts of ethnic cleansing. Their actions not only violate humanitarian principles but also disgust many native Jews within our borders. Thus, we must be clear: our enemy is never a people or faith, but Zionist oppression and expansion."
irq.30.a:0 "A qualified nationalist distinguishes friend from foe."
irq.31.t:0 "Homeland of the Tigris and Euphrates"
irq.31.d:0 "Professor Anton Sa'ada has successfully seized power in Syria, advocating social nationalism aligned with our own. This is not merely a political victory but signals the dawn of a cross-border national rejuvenation plan. We share blood and culture, divided only by colonial-era tragedies. Now, the time is ripe—we must join hands to advance national unification, jointly building a strong, unified, and autonomous Mesopotamian homeland, achieving the complete return of our national destiny."
irq.31.a:0 "Long live the Mesopotamian homeland that will rise!"
irq.32.t:0 "The Supreme Morality of Revenge"
irq.32.d:0 "Colonial hooves still trample our brethren's dignity; every cry of their suffering fuels an undying fire in our hearts. This fire is not the venom of hatred but springs from the deepest love and compassion for our people—it drives us to stand and fight for liberation. To turn away would make us complicit in oppression. Revenge is not cruelty but the complete reckoning with injustice and oppression; liberating our brethren is the highest moral mission bestowed by conscience."
irq.32.a:0 "Revenge is the nation's duty"
irq.33.t:0 "Wisdom of Sharia"
irq.33.d:0 "Sharia is not merely law but divine guidance from Allah, a compass governing every corner of life. It is impartial, protecting the poor and constraining the powerful; it transcends time, unbound by modernity or tradition, standing only for justice and order. Yet some now abandon this eternal wisdom, blindly pursuing so-called 'progress' and 'freedom' as promoted by the West. Their imitated legal systems breed injustice, enabling the strong to oppress the weak and tearing societal foundations under the guise of secularism. Western lights may shine, but they do not illuminate the abyss of morality; their laws may be complex, but they fail to distinguish right from wrong.\n\nWe do not reject change, but change must not come at the cost of losing faith. Sharia is Allah's greatest mercy—it keeps us grounded in turbulent times and finds direction in a lost world. Let us return to the Quran and Hadith, adhering to this path truly meant for believers. Only then can we retain dignity amid chaos and walk in light amid darkness."
irq.33.a:0 "Remember Allah's teachings, adhere to His path."
irq.34.t:0 "Freeing the Mind"
irq.34.d:0 "For centuries, rigid and ossified Islamic dogma has bound our society, once a beacon of knowledge and civilization, now a shackle hindering progress. It monopolizes education, imprisons thought, and drowns generation after generation in the illusions of the past rather than the light of the future. We cannot watch as faith becomes a tool of oppression, nor tolerate it strangling reason and innovation in the name of the sacred.\n\nIt is time to break this long slumber—liberate education from religion's absolute control, making schools fertile ground for enlightening minds and cultivating science, not echo chambers for dogma. We call for a true cultural awakening: not to abandon our traditions but to imbue them with new meaning; not to deny faith but to refuse to be bound by it."
irq.34.a:0 "Out with the old, in with the new"
irq.35.t:0 "Which Side Are You On?"
irq.35.d:0 "Iraq, though small in territory, sits at a critical crossroads in the Middle East. In this turbulent era, going it alone invites danger, while choosing a reliable ally is a matter of survival. Three paths lie before us: respond to Egypt's Pan-Arab call and join the ideal of national rejuvenation? Partner with Iran, our fellow Persian Gulf neighbor, to pursue shared religious and geopolitical interests? Or let go of old grievances and return to the Ottoman fold, using the remnants of the once-great empire to maintain order?"
irq.35.a:0 "Stand with Egypt"
irq.35.b:0 "Stand with Iran"
irq.35.c:0 "Stand with the Ottomans"
irq.36.t:0 "Intervene in Iraq?"
irq.36.d:0 "The Pan-Arab Congress in Iraq has just concluded, but the result disturbs us. The pro-Egyptian 'Arab Socialist League' unexpectedly gained the upper hand, signaling a regime clearly tilting toward Cairo is emerging in Baghdad. If we stand by, we will face strategic pressure from both the West (Egypt) and the East (Iraq) in the future—a pincer movement from two fronts is no small matter."
irq.36.a:0 "We cannot stand by"
irq.36.b:0 "Forget it, avoid conflict as much as possible"
irq.37.t:0 "Syrian Intervention"
irq.37.d:0 "Just as the Pan-Arab Congress of Iraq's Ba'athists and Arab Socialist League concluded, Damascus intervened abruptly in Iraq's internal affairs. Syria provided massive financial and material aid to the Iraqi Ba'athists, attempting to transform Iraq into a Ba'athist forward base and expand its influence in the Arab world. This move not only upends the regional balance of power but also adds further complexity to Iraq's already tangled politics—the Ba'athists are indeed up to no good!"
irq.37.a:0 "Syria's plot succeeds; Ba'athists take power"
irq.37.b:0 "Declare hostile relations with Syria"
irq.38.t:0 "Follow the Steps of Our Syrian Comrades"
irq.38.d:0 "Syrian Ba'athists are raising the banner of Arab liberation, bravely resisting Nasserist expansionism. As the Iraqi Ba'ath Socialist Party, we cannot remain on the sidelines in this struggle. We must immediately coordinate positions with our Syrian comrades, establishing comprehensive cooperation mechanisms in politics, military, and economics to jointly shatter Egypt's bid for hegemony. Now is the critical moment to unite and push for the true liberation of the Arab world—let the voices of Damascus and Baghdad converge into a force that changes the times!"
irq.38.a:0 "We stand united!"
irq.39.t:0 "Follow Egypt"
irq.39.d:0 "Comrades, the flame of Arab socialism has been lit in Cairo; the steps of our Egyptian comrades are firm and clear. They are proving through action: unity and reform are the only paths to Arab rejuvenation. Today, some Syrian forces seek to tear apart our common front and destroy the hard-won revolutionary unity.\n\nWe, the Iraqi Arab Socialist League, cannot remain neutral in this struggle. We must stand firmly with Egypt, echoing their call, gathering strength, and uniting wills to thoroughly defeat the provocations of separatists and reactionaries. The future of the Arabs belongs not to division and regression but to unity and progress. Let us raise the socialist banner and march toward unity!"
irq.39.a:0 "We stand united!"
irq.40.t:0 "Taming Mesopotamia"
irq.40.d:0 "These Iraqi fools actually dare to pursue an independent path—this is naked betrayal They pretend to be brothers with us but stab us in the back, blatantly challenging our status as the senior Shi'a brothers. The high command suggests restraint, infiltrating Iraq internally, but the enraged higher-ups cannot contain themselves—their anger demands release. What do we do? Follow the high command's advice or the superiors' orders?"
irq.40.a:0 "We're coming for you, Iraq!"
irq.40.b:0 "Calm down, will you!"
irq.41.t:0 "Hashemi Flees to Syria"
irq.41.d:0 "Marshal Yasin al-Hashimi's rule collapses under threat. Before boarding an unmarked plane to Damascus, he submits his resignation to the Baghdad parliament. Without an army or president, the Iraqi Republic seems destined to collapse. Iraqi opposition forces have entered Baghdad, hunting down former government officials and dissolving the Iraqi armed forces."
irq.41.a:0 "Damn it!"
IRQguides.1.t:0 "Iraqi Route Guide"
IRQguides.1.d:0 "Nationalists?\n\nWin with the National Brotherhood Party in the Long Day event, then you can choose other nationalist routes in subsequent elections. If you want to play as the Iraqi Socialist National Party, select "Yes, a wise man indeed."in the Cyclone and Eagle event.\n\nPan-Arabists, Communists, Democrats?\n\nMake your choice in the Long Day event as well.\n\nReligious content?\n\nHave the Pan-Arabists win in the Long Day event, then choose "Suppress"in the Muslim protests."
IRQguides.1.a:0 "Cool!"
IRQ_GATHERING_STORM_DESC: "In 1938, influenced by his Syrian compatriots, Yasin al-Hashimi led an anti-Ottoman resistance movement. Although this movement did not receive the support of all the people, for instance, the Sunni faction in the country regarded it as an act of handing Iraq over to Egypt and Iran, yet the flames of resistance still swept across the entire territory of Iraq. Eventually, Iraq won its freedom from the rule of the Ottoman Empire, but new crises had already emerged. Both the democrats and the Pan-Arabists were coveting Yasin al-Hashimi's position, and an irreparable rift was thus deeply rooted in Iraqi politics."
IRQ_guidesnum:0 "§CIraq§! has §G3§! path guides."
